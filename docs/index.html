ricans Say AI Romance Can Count as Cheating appeared first on AI News ."}, {"title": "最低賃金1177円　過去2番目の引き上げ　介護経営の圧迫懸念　業界は報酬増を要請", "url": "https://www.joint-kaigo.com/articles/48529/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-04 12:09", "description": "全国47都道府県で今年度の最低賃金の改定額が出揃った。【Joint編集部】 厚生労働省は3日、都道府県ごとの答申状況を取りまとめて公表。最低賃金の全国平均は、昨年度から56円引き上げられて1177円となった。 この引き上 […]", "content": "2026年9月4日\n最低賃金1177円 過去2番目の引き上げ 介護経営の圧迫懸念 業界は報酬増を要請\n全国47都道府県で今年度の最低賃金の改定額が出揃った。【Joint編集部】\n厚生労働省は3日、都道府県ごとの答申状況を取りまとめて公表。最低賃金の全国平均は、昨年度から56円引き上げられて1177円となった。\nこの引き上げ幅は、1978年度に目安制度が始まってから過去2番目の高水準となる。\n都道府県別の最高額は東京都の1280円、最低額は宮崎県の1085円。改定額の引き上げ幅は、最も大きい県で65円となっている。\nこうした最低賃金の引き上げは、介護事業者の人件費の増大に直結する。来年度の介護報酬改定をめぐる議論にも影響を与えそうだ。\n8月末に開催された審議会（社会保障審議会・介護給付費分科会）でも、委員から「毎年の最低賃金の引き上げは経営の大きな圧迫要素」「他産業の賃上げや最低賃金の引き上げを上回る改定を」など、政府に十分な対応を求める声が上がった。\nこれから年末にかけて、業界は各サービスの基本報酬の引き上げ、処遇改善加算の拡充などの働きかけをさらに強めていく構えだ。", "summary": "2026年9月4日\n最低賃金1177円 過去2番目の引き上げ 介護経営の圧迫懸念 業界は報酬増を要請\n全国47都道府県で今年度の最低賃金の改定額が出揃った。最低賃金の全国平均は、昨年度から56円引き上げられて1177円となった。改定額の引き上げ幅は、最も大きい県で65円となっている。こうした最低賃金の引き上げは、介護事業者の人件費の増大に直結する。", "categories": ["介護保険・制度", "施設運営・経営"], "is_new": false}, {"title": "学生と障害者がアートワークショップ　福祉の魅力伝える〈征峯会・茨城〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/series06/45897", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-04 10:00", "description": "茨城県筑西市の障害者支援施設「ピアしらとり」（社会福祉法人征峯会、渡辺和成理事長）は８月１８日、利用者とインターンシップの学生が自由に絵を描きながら関わり合う「アートワークショップ」を開いた。単なる施設見学にとどまらず、一緒に体験してもらうことで、若い世代に福祉の魅力や地域共生の理念を伝える取り組みだ。 参加したのは利用者２８人と大学生５人、高校生１人。大きな３枚の白布（縦１メートル、横３メートル）に筆、はけ、ローラーなどを使って絵の具で思い思いに表現する。テーマはなく、海が好きな利用者は魚を描いたり、別の利用者はハートを描いたり、約４０分間、生き生きとした表情で取り組んだ。描き上がったアートは色が塗り重ねられ、唯一無二のデザインになった。 アートはコミュニケーションの手段で、利用者とより近くで触れ合った大学生は「利用者がアクティブに動いていて素敵だと思った」「利用者それぞれ特性が違う。距離やコミュニケーションの取り方が難しい」と話した。 その後、学生は描かれたアートを見ながら、感じたことや気に入ったデザインなどについて自由に話し合った。「対話型アート」という手法で、監修する福祉デザイ", "content": "学生と障害者がアートワークショップ 福祉の魅力伝える〈征峯会・茨城〉\n2026年09月04日 福祉新聞編集部茨城県筑西市の障害者支援施設「ピアしらとり」（社会福祉法人征峯会、渡辺和成理事長）は８月１８日、利用者とインターンシップの学生が自由に絵を描きながら関わり合う「アートワークショップ」を開いた。単なる施設見学にとどまらず、一緒に体験してもらうことで、若い世代に福祉の魅力や地域共生の理念を伝える取り組みだ。\n参加したのは利用者２８人と大学生５人、高校生１人。大きな３枚の白布（縦１メートル、横３メートル）に筆、はけ、ローラーなどを使って絵の具で思い思いに表現する。テーマはなく、海が好きな利用者は魚を描いたり、別の利用者はハートを描いたり、約４０分間、生き生きとした表情で取り組んだ。描き上がったアートは色が塗り重ねられ、唯一無二のデザインになった。\nアートはコミュニケーションの手段で、利用者とより近くで触れ合った大学生は「利用者がアクティブに動いていて素敵だと思った」「利用者それぞれ特性が違う。距離やコミュニケーションの取り方が難しい」と話した。\nその後、学生は描かれたアートを見ながら、感じたことや気に入ったデザインなどについて自由に話し合った。「対話型アート」という手法で、監修する福祉デザインユニット「ＮＯＤＯ」の仲西亮平代表は「一緒に取り組むうちに、利用者が前のめりになるなど変わってきたと思う。そうした少しの変化を見逃さずにどう応じていくか」とアドバイスした。\n征峯会は利用者の個性を生かすため、６年ほど前からアート活動に力を入れている。渡辺理事長は「利用者が好きなことに集中し、落ち着きにつながっている。制作したアートが企業で使われたり、コンテストで選ばれたりすると利用者の自信にもなる」と言う。採用面からは「アートに興味を持ってもらい、人材確保につながれば」としている。", "summary": "テーマはなく、海が好きな利用者は魚を描いたり、別の利用者はハートを描いたり、約４０分間、生き生きとした表情で取り組んだ。アートはコミュニケーションの手段で、利用者とより近くで触れ合った大学生は「利用者がアクティブに動いていて素敵だと思った」「利用者それぞれ特性が違う。征峯会は利用者の個性を生かすため、６年ほど前からアート活動に力を入れている。渡辺理事長は「利用者が好きなことに集中し、落ち着きにつながっている。", "categories": ["施設運営・経営", "福祉・社会保障"], "is_new": false}, {"title": "OneRail uses Nvidia AI for real-time last-mile delivery optimisation", "url": "https://www.artificialintelligence-news.com/news/ai-last-mile-delivery-optimisation/", "source": "AI News", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-04 01:07", "description": "OneRail has launched an AI-powered delivery platform that uses Nvidia technology to help retailers, wholesalers, and distributors decide how individual orders should be delivered. Called OmniSTAR, the system evaluates options including owned fleets, couriers, parcel carriers, and other delivery modes, then selects the lowest-cost option that meets the required service level, according to OneRail. The […] The post OneRail uses Nvidia AI for real-time last-mile delivery optimisation appeared first", "content": "OneRail has launched an AI-powered delivery platform that uses Nvidia technology to help retailers, wholesalers, and distributors decide how individual orders should be delivered. Called OmniSTAR, the system evaluates options including owned fleets, couriers, parcel carriers, and other delivery modes, then selects the lowest-cost option that meets the required service level, according to OneRail. The […] The post OneRail uses Nvidia AI for real-time last-mile delivery optimisation appeared first", "summary": "OneRail has launched an AI-powered delivery platform that uses Nvidia technology to help retailers, wholesalers, and distributors decide how individual orders should be delivered. Called OmniSTAR, the system evaluates options including owned fleets, couriers, parcel carriers, and other delivery modes, then selects the lowest-cost option that meets the required service level, according to OneRail. The […] The post OneRail uses Nvidia AI for real-time last-mile delivery optimisation appeared first", "categories": ["業務改善・介護テック"], "is_new": false, "title_ja": "OneRail uses Nvidia AI for real-time last-mile delivery optimisation", "summary_ja": "OneRail has launched an AI-powered delivery platform that uses Nvidia technology to help retailers, wholesalers, and distributors decide how individual orders should be delivered. Called OmniSTAR, the system evaluates options including owned fleets, couriers, parcel carriers, and other delivery modes, then selects the lowest-cost option that meets the required service level, according to OneRail. The […] The post OneRail uses Nvidia AI for real-time last-mile delivery optimisation appeared first"}, {"title": "NVIDIA to acquire Hugging Face for $12.93B", "url": "https://www.artificialintelligence-news.com/news/nvidia-to-acquire-hugging-face-for-12-93b/", "source": "AI News", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-04 00:50", "description": "NVIDIA has agreed to acquire Hugging Face for $12.93 billion to scale the open-source model repository’s platform and infrastructure. The transaction targets platform growth and infrastructure investment, aiming to expand AI access for enterprise developers, software engineers, and research institutions globally. Built over the past decade by Clem Delangue, Julien Chaumond, Thomas Wolf, and their […] The post NVIDIA to acquire Hugging Face for $12.93B appeared first on AI News .", "content": "NVIDIA has agreed to acquire Hugging Face for $12.93 billion to scale the open-source model repository’s platform and infrastructure. The transaction targets platform growth and infrastructure investment, aiming to expand AI access for enterprise developers, software engineers, and research institutions globally. Built over the past decade by Clem Delangue, Julien Chaumond, Thomas Wolf, and their […] The post NVIDIA to acquire Hugging Face for $12.93B appeared first on AI News .", "summary": "NVIDIA has agreed to acquire Hugging Face for $12.93 billion to scale the open-source model repository’s platform and infrastructure. The transaction targets platform growth and infrastructure investment, aiming to expand AI access for enterprise developers, software engineers, and research institutions globally. Built over the past decade by Clem Delangue, Julien Chaumond, Thomas Wolf, and their […] The post NVIDIA to acquire Hugging Face for $12.93B appeared first on AI News .", "categories": ["業務改善・介護テック"], "is_new": false, "title_ja": "NVIDIA to acquire Hugging Face for $12.93B", "summary_ja": "NVIDIA has agreed to acquire Hugging Face for $12.93 billion to scale the open-source model repository’s platform and infrastructure. The transaction targets platform growth and infrastructure investment, aiming to expand AI access for enterprise developers, software engineers, and research institutions globally. Built over the past decade by Clem Delangue, Julien Chaumond, Thomas Wolf, and their […] The post NVIDIA to acquire Hugging Face for $12.93B appeared first on AI News ."}, {"title": "【介護報酬改定】LIFE関連加算、テコ入れへ具体策を検討　厚労省　審議会では改善要請や不満の声も", "url": "https://www.joint-kaigo.com/articles/48516/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-03 20:41", "description": "厚生労働省は来年度の介護報酬改定に向けて、LIFE（科学的介護情報システム）関連加算のテコ入れの検討を本格化する。【Joint編集部】 3日に開催された審議会（社会保障審議会・介護給付費分科会）で、データ提出やアウトカム […]", "content": "2026年9月3日\n【介護報酬改定】LIFE関連加算、テコ入れへ具体策を検討 厚労省 審議会では改善要請や不満の声も\n厚生労働省は来年度の介護報酬改定に向けて、LIFE（科学的介護情報システム）関連加算のテコ入れの検討を本格化する。【Joint編集部】\n3日に開催された審議会（社会保障審議会・介護給付費分科会）で、データ提出やアウトカム評価などのあり方を論点として提示した。これを受けた委員からは、今のLIFE関連加算への不満や課題提起、改善要請が相次いだ。\n厚労省のデータによると、昨年4月時点でLIFEを利用しているのは施設系サービスでおよそ7割、通所系・居住系サービスでおよそ5割となっている。\n厚労省は現在、LIFE関連加算を2階層の構造に整理する案を軸に検討を進めている。\n1階層目が科学的介護推進体制加算で、2階層目がその他のLIFE関連加算。土台となる1階層目の取得を2階層目の取得の前提とする構想で、データの重複入力の解消などにもつながるとみられている。\nただ、この日の会合では委員から厳しい声が上がった。\n「現場の入力負担が限界に達している」「操作性や応答速度の改善が実感できない」\nこうした指摘のほか、\n● ケアの質の改善につながる実用的なフィードバックになっているか\n● 利用者負担が発生するにもかかわらず、利用者・家族には加算の意義や内容が理解できない\nといった意見も出た。\n厚労省はこうした現場の声を踏まえ、これから具体策を詰める段階に入る。来年度の介護報酬改定に向けて、年内に施策の大枠を固める方針だ。", "summary": "2026年9月3日\n【介護報酬改定】LIFE関連加算、テコ入れへ具体策を検討 厚労省 審議会では改善要請や不満の声も\n厚生労働省は来年度の介護報酬改定に向けて、LIFE（科学的介護情報システム）関連加算のテコ入れの検討を本格化する。厚労省のデータによると、昨年4月時点でLIFEを利用しているのは施設系サービスでおよそ7割、通所系・居住系サービスでおよそ5割となっている。厚労省は現在、LIFE関連加算を2階層の構造に整理する案を軸に検討を進めている。1階層目が科学的介護推進体制加算で、2階層目がその他のLIFE関連加算。", "categories": ["介護保険・制度", "施設運営・経営"], "is_new": false}, {"title": "WHILLが最軽量の新モデル発表　折りたたみで介護保険レンタルにも対応可", "url": "https://www.joint-kaigo.com/articles/48509/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-03 13:48", "description": "WHILL株式会社は3日、電動車いすの新モデル「WHILL Model C Lite」の販売を始めたと発表した。【Joint編集部】 カーボン素材を採用し、WHILLの製品史上で最軽量を実現した折りたたみ式の新製品となる […]", "content": "2026年9月3日\nWHILLが最軽量の新モデル発表 折りたたみで介護保険レンタルにも対応可\nWHILL株式会社は3日、電動車いすの新モデル「WHILL Model C Lite」の販売を始めたと発表した。【Joint編集部】\nカーボン素材を採用し、WHILLの製品史上で最軽量を実現した折りたたみ式の新製品となる。\n本体重量はバッテリーを除き18.6kg。片手のワンタッチ操作で簡単に折りたためるため、車への収納や持ち運びが一段と容易になった。\nフラッグシップモデルゆずりの「オムニホイール」も搭載しており、段差の乗り越えや悪路での走破性、狭い場所での小回りといった高い走行性能は維持している。\nオンラインストアや実店舗での販売に加え、一定の条件下で介護保険制度のレンタルにも対応可能。WHILLは「誰もが自分らしく挑戦し、人生を謳歌できるシームレスな移動社会の実現を後押ししていく」としている。", "summary": "2026年9月3日\nWHILLが最軽量の新モデル発表 折りたたみで介護保険レンタルにも対応可\nWHILL株式会社は3日、電動車いすの新モデル「WHILL Model C Lite」の販売を始めたと発表した。【Joint編集部】\nカーボン素材を採用し、WHILLの製品史上で最軽量を実現した折りたたみ式の新製品となる。フラッグシップモデルゆずりの「オムニホイール」も搭載しており、段差の乗り越えや悪路での走破性、狭い場所での小回りといった高い走行性能は維持している。オンラインストアや実店舗での販売に加え、一定の条件下で介護保険制度のレンタルにも対応可能。", "categories": ["介護保険・制度", "人材育成・HR"], "is_new": false}, {"title": "【千葉豪雨】介護施設に残した無残な爪痕　深刻な経営への打撃と影響の長期化", "url": "https://www.joint-kaigo.com/articles/48408/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-03 12:00", "description": "8月13日に千葉県を襲った記録的な豪雨。大きな被害を受けた医療法人社団敬徳会の介護老人保健施設へ伺って話を聞いた。 いまだ深い爪痕が残る現場で分かったのは、想像を超えた被害の深刻さだ。施設経営への影響が長期に及ぶ懸念も強 […]", "content": "8月13日に千葉県を襲った記録的な豪雨。大きな被害を受けた医療法人社団敬徳会の介護老人保健施設へ伺って話を聞いた。\nいまだ深い爪痕が残る現場で分かったのは、想像を超えた被害の深刻さだ。施設経営への影響が長期に及ぶ懸念も強い。\n現場の担当者は下を向いておらず、再起に向けて力強く奔走している。ただし、「現実的に最も厳しいのはやはり資金面」と切実な胸中も明かした。【Joint編集部】\n惨劇は瞬く間に起きた。局地的な大雨で一気に水かさが増し、1階の水位は最大80センチほどに到達。全館停電に加え、通信設備の浸水で電話も不通となった。\n濁流が引いた後は一面泥まみれに。利用者の居室は2階以上だったため、不幸中の幸いで人的被害だけは免れた。ただし、1階の事務所や入浴設備、厨房設備、リハビリ関連設備などが壊滅的な打撃を受けた。\n駐車場に停めていた送迎用などの車両は、16台すべてが廃車に。複数の職員の自家用車も被害を受けた。多数のパソコンや電話、ネット関連機器などの通信設備も浸水で壊れ、機能不全に陥っている。\n変わり果てた施設の姿。事務長を務める高坂忍さんは、「まさか自分たちの施設が、という思い。前日までは普通に運営していた。この目で惨状を見た時は、本当に復旧できるのかと途方に暮れた」と当時を振り返る。\n日々の食事を支える厨房のダメージも甚大だ。\n多くの調理機器が濁流にのまれて故障し、3台あった大型の炊飯器は2台が使用不能となった。大型の冷凍・冷蔵庫も水に浮いて転倒するなど、惨たんたる状況に陥った。\n食器洗い機や乾燥機には、モーター部分にまで泥が入り込んだ。下水のような悪臭がなかなか取れず、設備の刷新は不可避だという。多くの食器も水に浸かったため、衛生面から現在も使い捨てのプラスチック容器などで食事を提供している。\nまた、倉庫に置いていたおむつなど衛生用品の備品類も汚水を吸い、根こそぎ廃棄処分となった。\n入浴設備は給水ポンプやボイラーが水没して破損。発災以降、入所者は浴槽を使った入浴を一切行えていない。現在は清拭やドライシャンプーでしのぐ厳しい対応が続く。近隣施設の協力を得て、少人数のピストン輸送によるシャワー浴の機会を作る計画を練るなど、職員が懸命に手探りの支援にあたっている。\n同様に、機能訓練の設備も大きな被害を受けた。関連機器の過半数が水没し、内部に泥が侵入して稼働が停止。これらを用いた専門的なリハビリは休止を余儀なくされ、居室フロアでの歩行訓練などで機能の低下を防ぐのが精一杯だ。\nフロア間の移動に欠かせないエレベーターも浸水した。底部ピットに泥水が溜まり、2ヵ所でまったく動かせない状況になったという。\n稼働が止まった数日間は、職員が利用者を背負って階段を昇り降りするほかなかった。その後、溜まった泥水を抜くなど業者による迅速な復旧措置が奏功。業者の点検・安全確認を経て、老健の建屋では稼働を再開させることができた。\n一方、併設する複合施設のエレベーターは現在も完全に停止したままだ。2階に入るデイサービスなどは利用者がフロアへ移動する手段が絶たれ、他の設備の被害も相まって休業に追い込まれている。\n重くのしかかるのは影響の長期化だ。壁や壁紙、床材が水を吸って変形したり剥がれたりするなど、建物は細部に多くのダメージを受けた。今後、時間の経過とともに劣化が進行すれば修繕が必要となる見通しで、そのたびに経費がかかってくる。\n安全面・衛生面も含めて必ず回復できるものの、不安の払拭や信頼の回復、風評被害といった面で懸念も拭えないという。\n事業の正常化への道のりは前途多難と言うほかない。併設するデイサービス・デイケアはすべて完全に停止中で、再開の見通しは不透明なままだ。数ヵ月間の休業は確実な情勢で、「なんとか11月末には復旧の目途を立てたい」と必死の青写真を描く。\n車両を失った訪問看護の運営も不安定化した。事業の停止・縮小が長引けば、その間に利用者が他の事業所へ移ってしまう恐れもある。終わらない復旧作業のかたわらで、職員がケアマネジャーや利用者・家族に再建への熱意、プロセスなどを説明しているが、やはり一定の影響は避けられそうもない。\n職員の疲弊も心配される。高坂事務長に思いを聞くと、「我々が前を向いて、必ず完全に復旧させると皆を引っ張っていくしかない」と力強く語り、逆境に屈しないポジティブな姿勢を決して崩さなかった。その一方で、次のように本音をこぼした。\n「もちろん心配がないわけではない。行政による支援などもあるが、最も切実なのはやはり最終的に資金面ということになる」", "summary": "ただし、1階の事務所や入浴設備、厨房設備、リハビリ関連設備などが壊滅的な打撃を受けた。同様に、機能訓練の設備も大きな被害を受けた。底部ピットに泥水が溜まり、2ヵ所でまったく動かせない状況になったという。稼働が止まった数日間は、職員が利用者を背負って階段を昇り降りするほかなかった。", "categories": ["施設運営・経営", "医療・健康"], "is_new": false}, {"title": "外国人職員の育成部会立ち上げ　研修共通化、精神面ケアも〈春風会・静岡〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/series05/45894", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-03 10:00", "description": "静岡県沼津市の社会福祉法人春風会（石川三義理事長）は、法人創立５０周年を迎えた昨年度、「外国人職員育成部会」を立ち上げた。外国人職員向けの教育・研修体系を法人内で統一するほか、情報交換会の開催による心理面の支援、各施設への育成担当職員の配置などを通じ、支援の質向上を目指す。 同法人では７月現在、外国人職員３９人が勤務している。内訳は、ＥＰＡ（経済連携協定）介護福祉士候補者が１４人、特定技能が１２人、既に介護福祉士資格を取得している職員（ＥＰＡ、留学生）が６人、日本人と結婚し、永住資格を取得した職員が７人。国籍はインドネシア１９人、フィリピン５人、ミャンマー８人など計９カ国に上る。 このうち、こども園などで働く永住資格者５人を除く３４人が、６カ所の特別養護老人ホームに配属されている。同法人の介護職員は常勤・非常勤合わせて約４００人で、外国人職員が約８％を占める。 部会は、川口和義特養ぬくもりの里施設長を部会長とする９人で構成。現在、外国人職員向けの教育・研修体系の統一を進めている。 背景には、将来の介護人材不足を懸念し、２０１２年に初めてＥＰＡで外国人職員を採用して以降、教育方針を配属先", "content": "外国人職員の育成部会立ち上げ 研修共通化、精神面ケアも〈春風会・静岡〉\n2026年09月03日 福祉新聞編集部静岡県沼津市の社会福祉法人春風会（石川三義理事長）は、法人創立５０周年を迎えた昨年度、「外国人職員育成部会」を立ち上げた。外国人職員向けの教育・研修体系を法人内で統一するほか、情報交換会の開催による心理面の支援、各施設への育成担当職員の配置などを通じ、支援の質向上を目指す。\n同法人では７月現在、外国人職員３９人が勤務している。内訳は、ＥＰＡ（経済連携協定）介護福祉士候補者が１４人、特定技能が１２人、既に介護福祉士資格を取得している職員（ＥＰＡ、留学生）が６人、日本人と結婚し、永住資格を取得した職員が７人。国籍はインドネシア１９人、フィリピン５人、ミャンマー８人など計９カ国に上る。\nこのうち、こども園などで働く永住資格者５人を除く３４人が、６カ所の特別養護老人ホームに配属されている。同法人の介護職員は常勤・非常勤合わせて約４００人で、外国人職員が約８％を占める。\n部会は、川口和義特養ぬくもりの里施設長を部会長とする９人で構成。現在、外国人職員向けの教育・研修体系の統一を進めている。\n背景には、将来の介護人材不足を懸念し、２０１２年に初めてＥＰＡで外国人職員を採用して以降、教育方針を配属先の施設に任せてきたことに加え、コロナ禍以降、特定技能の職員の採用も始めたことがある。\nＥＰＡの場合、訪日前と訪日後にそれぞれ６カ月間の日本語研修が行われる。一方、特定技能には同様の研修がないため、配属時点の日本語能力の差が課題となっていた。\n部会では、採用から半年後、１年後などの節目ごとに習得すべき内容や到達目標を定めた共通の研修体系を整え、施設ごとの育成内容のばらつきを抑える方針だ。\n生活支援技術や法人理念、利用者の人権への配慮などを盛り込んだ法人独自の春風会ケアマニュアルを基に、外国人職員にも分かりやすいものを作成する予定だ。\n現場で孤立しないよう各施設に育成担当職員を配置して相談体制を充実させるほか、施設を越えた交流・情報交換会を開き、心理面の支援にも取り組んでいる。\n介護の経験母国に\n特定技能で来日したアニサさんは、母国インドネシアで日本語学校の教員を務めていた。介護の実務経験を積んだ後は帰国する予定で、「介護現場で得た経験を、日本で介護福祉士を目指すインドネシア人に伝えたい」と語った。\nＥＰＡ介護福祉士候補者として一度来日したものの、資格を取得できずに帰国し、その後、特定技能で再来日したフィリピン出身のティンさんは、「利用者を支援し、『ありがとう』と言われるのがうれしい。日本で長く働くためにも頑張りたい」と意気込んだ。\n同法人では、新卒採用計画に対し、目標人数を確保できない年が続いている。今後もＥＰＡや特定技能による外国人材の受け入れが欠かせない状況が続く見通しだ。\n石川理事長は「外国人職員は単なる労働力ではない。地域社会を支える担い手であり、コミュニティーの仲間でもある。安心して地域で働き続けられるよう支援していきたい」と話した。\nデータ＝静岡県で働く外国人介護人材は、２４年度で１６８２人。４年前と比較して約３倍に増加した。在留資格別にみると、特定技能が最も多く７４６人で、次が技能実習で４０２人など。", "summary": "同法人では７月現在、外国人職員３９人が勤務している。同法人の介護職員は常勤・非常勤合わせて約４００人で、外国人職員が約８％を占める。現在、外国人職員向けの教育・研修体系の統一を進めている。石川理事長は「外国人職員は単なる労働力ではない。", "categories": ["人材育成・HR", "福祉・社会保障"], "is_new": false}, {"title": "カスハラで介護サービス拒否、ルール明確化が俎上に　厚労省が報酬改定へ論点提示　審議会では慎重論も", "url": "https://www.joint-kaigo.com/articles/48478/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-02 17:27", "description": "厚生労働省は来年度の介護報酬改定に向けて、介護従事者を利用者・家族のカスタマーハラスメントから守る施策の強化を検討する。【Joint編集部】 焦点の一つが、カスハラを理由としたサービス提供の拒否のあり方だ。 例えば訪問介 […]", "content": "2026年9月2日\nカスハラで介護サービス拒否、ルール明確化が俎上に 厚労省が報酬改定へ論点提示 審議会では慎重論も\n厚生労働省は来年度の介護報酬改定に向けて、介護従事者を利用者・家族のカスタマーハラスメントから守る施策の強化を検討する。【Joint編集部】\n焦点の一つが、カスハラを理由としたサービス提供の拒否のあり方だ。\n例えば訪問介護や居宅介護支援。現行の運営基準では、事業所は「正当な理由」なくサービスの提供を拒んではならないと規定されている。この「正当な理由」の解釈が必ずしも明確でないことが、事業所や保険者が判断を迷う要因の一つになっている。\n厚労省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）で、こうした運営基準の見直しの是非を論点として提示。利用者に必要なサービスを継続的に提供することの重要性も考慮しつつ、カスハラに直面した事業所が、状況に応じてより柔軟に対応できる方策を俎上に載せる考えを示した。\n在宅サービスなどの現場で、介護従事者がカスハラを受けるケースが増えていることが背景にある。\n会合の中では、現場の関係者らで構成する委員の意見が分かれた。\n「職員の命と安全を守るため、サービス提供を拒否できる『正当な理由』を国として分かりやすく明確に示すべき」「組織的に毅然とした対応がとれるよう、制度によって現場を守る必要がある」\nルールの明確化や厳格な措置を求める声が上がった一方で、「認知症の周辺症状による言動を、安易にカスハラと同列に扱うべきではない」「サービスの提供を拒否された利用者はどこへいけばいいのか」「代替サービスの確保を含め、拒否後にどうするかを明確にしてほしい」など、より慎重な対応を呼びかける委員もいた。\n今後、厚労省はこうした意見も踏まえてさらに議論を深め、年内にも施策の方向性を固める方針だ。", "summary": "2026年9月2日\nカスハラで介護サービス拒否、ルール明確化が俎上に 厚労省が報酬改定へ論点提示 審議会では慎重論も\n厚生労働省は来年度の介護報酬改定に向けて、介護従事者を利用者・家族のカスタマーハラスメントから守る施策の強化を検討する。【Joint編集部】\n焦点の一つが、カスハラを理由としたサービス提供の拒否のあり方だ。現行の運営基準では、事業所は「正当な理由」なくサービスの提供を拒んではならないと規定されている。在宅サービスなどの現場で、介護従事者がカスハラを受けるケースが増えていることが背景にある。", "categories": ["介護保険・制度", "施設運営・経営"], "is_new": false}, {"title": "事前復興としての福祉〈コラム一草一味〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/issoichimi/45891", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-02 10:00", "description": "社会福祉法人佛子園 理事長 雄谷良成 今回の熊本地震に接し、能登半島地震から２年８カ月を迎えた今だからこそ、改めて実感することがある。当然ながら、災害は時間とともにフェーズが移り変わる。 発災直後の救急救命期は、１人でも多くの命を救うことが最優先となる。ＤＭＡＴ（災害派遣医療チーム）やＤＷＡＴ（災害派遣福祉チーム）をはじめとする専門チームが、専門性を発揮することは欠かせない。こうした体制は着実に整えられてきている感がある。災害救助法で福祉的支援が救助に位置付けられた意義も、まさにここにある。 一方、災害は応急対応で終わるものではない。能登では今、仮設住宅の統廃合が始まり、そこでようやく築かれた人間関係が再び分かれようとしている。元の集落でも、住宅の倒壊や転出によって人が抜け、日常を支えてきた近所付き合いや地域活動そのものが難しくなっている。住まいだけではなく、関係性そのものが失われていく。仮設に残る人の中には、自力での生活再建が難しい人も少なくない。再度の引っ越し、生活環境の変化、人間関係の再構築は大きなストレスとなり、孤立や心身の衰え、さらには災害関連死にもつながっていく。 東日本大", "content": "事前復興としての福祉〈コラム一草一味〉\n2026年09月02日 福祉新聞編集部社会福祉法人佛子園 理事長 雄谷良成\n今回の熊本地震に接し、能登半島地震から２年８カ月を迎えた今だからこそ、改めて実感することがある。当然ながら、災害は時間とともにフェーズが移り変わる。\n発災直後の救急救命期は、１人でも多くの命を救うことが最優先となる。ＤＭＡＴ（災害派遣医療チーム）やＤＷＡＴ（災害派遣福祉チーム）をはじめとする専門チームが、専門性を発揮することは欠かせない。こうした体制は着実に整えられてきている感がある。災害救助法で福祉的支援が救助に位置付けられた意義も、まさにここにある。\n一方、災害は応急対応で終わるものではない。能登では今、仮設住宅の統廃合が始まり、そこでようやく築かれた人間関係が再び分かれようとしている。元の集落でも、住宅の倒壊や転出によって人が抜け、日常を支えてきた近所付き合いや地域活動そのものが難しくなっている。住まいだけではなく、関係性そのものが失われていく。仮設に残る人の中には、自力での生活再建が難しい人も少なくない。再度の引っ越し、生活環境の変化、人間関係の再構築は大きなストレスとなり、孤立や心身の衰え、さらには災害関連死にもつながっていく。\n東日本大震災では仮設住宅の撤去まで８年を要した。熊本も時間の経過とともに、いずれ同じような課題に向き合うことになるだろう。\nその時に求められるのは、人を孤立させず、人と人とのつながりを支え、地域の復興力を育てていく福祉の専門性である。社会福祉法改正で「福祉の中に防災」が位置付けられた意味もそこにある。福祉は応急支援だけでなく、復旧、復興、そして平時の地域づくりまで切れ目なく伴走することが期待されている。\n事前復興とは、道路や堤防などの整備だけを指すものではない。平時から地域のつながりを育み、災害が起きても人を孤立させず、復興を通して地域をよりしなやかで持続可能なものへ育てていくことではないか。その役割は、住民と日常を重ねてきた地域の福祉関係者だからこそ果たせるものがあるように思う。", "summary": "一方、災害は応急対応で終わるものではない。住まいだけではなく、関係性そのものが失われていく。その時に求められるのは、人を孤立させず、人と人とのつながりを支え、地域の復興力を育てていく福祉の専門性である。社会福祉法改正で「福祉の中に防災」が位置付けられた意味もそこにある。", "categories": ["福祉・社会保障", "医療・健康"], "is_new": false}, {"title": "居宅介護支援の処遇改善加算、初月の算定率は76.0%　訪問看護は7割弱＝厚労省", "url": "https://www.joint-kaigo.com/articles/48394/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-01 16:26", "description": "厚生労働省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）に、今年度の介護報酬改定で拡充した処遇改善加算の最新の取得状況を報告した。【Joint編集部】 今年度から新しく対象に加えられた居宅介護支援の算定率は […]", "content": "厚生労働省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）に、今年度の介護報酬改定で拡充した処遇改善加算の最新の取得状況を報告した。【Joint編集部】\n今年度から新しく対象に加えられた居宅介護支援の算定率は、今年6月時点で76.0%だった。\nこのほか、同じく処遇改善加算が新設された各サービスの算定率は、\n● 介護予防支援＝76.9%\n● 訪問看護＝67.6%\n● 訪問リハビリテーション＝59.8%\nとなっている。\n※ 処遇改善加算のサービスごとの算定率、最新のデータはこちらから\nこの日の会合では委員から、人材の確保・定着が課題となっているケアマネジャーや看護師らの一層の賃上げを訴える声があがった。\nまた、物価や他産業の動向に合わせて賃上げを機動的に行える仕組みの整備、複雑化する算定要件の簡素化などを求める意見も出た。", "summary": "厚生労働省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）に、今年度の介護報酬改定で拡充した処遇改善加算の最新の取得状況を報告した。【Joint編集部】\n今年度から新しく対象に加えられた居宅介護支援の算定率は、今年6月時点で76.0%だった。このほか、同じく処遇改善加算が新設された各サービスの算定率は、\n● 介護予防支援＝76.9%\n● 訪問看護＝67.6%\n● 訪問リハビリテーション＝59.8%\nとなっている。※ 処遇改善加算のサービスごとの算定率、最新のデータはこちらから\nこの日の会合では委員から、人材の確保・定着が課題となっているケアマネジャーや看護師らの一層の賃上げを訴える声があがった。", "categories": ["介護保険・制度", "人材育成・HR"], "is_new": false}, {"title": "認知症市民公開講座 映画「父と僕の終わらない歌」上映会 - city.tsurugashima.lg.jp", "url": "https://news.google.com/rss/articles/CBMiswFBVV95cUxQdzlVVzgxWm1xMDJkQThjcWJLQm1kcVR0aW9SYm1hTHdyN3ZBY1daS0dDRGZuNDdLUVFvcVlG e": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-01 11:54", "description": "政府は8月31日、「介護職員の働きやすい職場環境づくり」の今年度の表彰式を首相官邸で開催した。【Joint編集部】 介護現場の生産性向上、職員の処遇改善や負担軽減、サービスの質の向上などに優れた事業所を称え、その一層の推 […]", "content": "2026年9月1日\n働きやすい職場づくりの総理大臣表彰に居宅介護支援 高市首相、生産性向上の「評価を検討」\n政府は8月31日、「介護職員の働きやすい職場環境づくり」の今年度の表彰式を首相官邸で開催した。【Joint編集部】\n介護現場の生産性向上、職員の処遇改善や負担軽減、サービスの質の向上などに優れた事業所を称え、その一層の推進につなげる取り組みだ。\n今年度は、最高賞の内閣総理大臣表彰に、茨城県の居宅介護支援「おはなリハケアマネステーション」が選ばれた。この事業所は、音声入力システムの全面導入やRPA（PC作業の自動化）の運用など、デスクワークを効率化する先進的な取り組みが高く評価された。\nまた、今年度の厚生労働大臣表彰優良賞は以下の5事業所が受賞した。\n● みと東部特別養護老人ホーム（茨城県／特養）\n● 特別養護老人ホーム極楽苑（愛知県／特養）\n● 介護老人保健施設わさだケアセンター（大分県／老健）\n● ささづ苑デイサービスセンター（富山県／通所介護）\n● もてなし日和ゆのえん（群馬県／通所介護）\n高市早苗首相は表彰式で、「これからも皆様のご活躍に多くの国民がお頼りすることになる。引き続き、厚生労働大臣と力を合わせて支援していく」と挨拶した。\nあわせて、来年度の介護報酬改定に向けて、介護テクノロジーなどの実証、導入、伴走を支援していくと説明。「（生産性向上の）取り組みの適切な評価と介護従事者の処遇改善、これをあわせて検討していく」と明言した。", "summary": "2026年9月1日\n働きやすい職場づくりの総理大臣表彰に居宅介護支援 高市首相、生産性向上の「評価を検討」\n政府は8月31日、「介護職員の働きやすい職場環境づくり」の今年度の表彰式を首相官邸で開催した。また、今年度の厚生労働大臣表彰優良賞は以下の5事業所が受賞した。あわせて、来年度の介護報酬改定に向けて、介護テクノロジーなどの実証、導入、伴走を支援していくと説明。「（生産性向上の）取り組みの適切な評価と介護従事者の処遇改善、これをあわせて検討していく」と明言した。", "categories": ["福祉・社会保障", "介護保険・制度"], "is_new": false}, {"title": "成年後見人の郵便物送付先変更がLINEで手続き可能に〈神奈川・座間市〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/series05/45888", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-01 10:00", "description": "成年後見人が被後見人宛ての郵便物の送付先を変更する手続きが大きな負担になっていることを受け、神奈川県座間市は今夏、市公式ＬＩＮＥを活用したオンライン申請を開始した。 これまで市役所の各課で必要書類に記入する必要があったが、自宅にいながら２４時間いつでも手続きができるようになった。 成年後見人が被後見人宛ての郵便物の送付先を変更する場合、これまでは市役所で国民健康保険や介護保険、市税、水道などに関する郵便物を所管する各課を回り何度も同じ情報を記入していたため、多くの時間がかかっていた。 ８月３日からＬＩＮＥを通じたオンライン申請が始まったことで、市役所に赴く必要がなくなり、同じ情報を何度も記入する手間もなくなった。受け付けた情報は市地域福祉課が一元管理し、担当課に共有する。 オンライン申請が苦手な成年後見人は、同課窓口への届け出で手続きを済ませることができる。市によると、成年後見人の送付先変更手続きのオンライン申請化は県内初となる。 福祉新聞Web", "content": "成年後見人の郵便物送付先変更がLINEで手続き可能に〈神奈川・座間市〉\n2026年09月01日 福祉新聞編集部成年後見人が被後見人宛ての郵便物の送付先を変更する手続きが大きな負担になっていることを受け、神奈川県座間市は今夏、市公式ＬＩＮＥを活用したオンライン申請を開始した。\nこれまで市役所の各課で必要書類に記入する必要があったが、自宅にいながら２４時間いつでも手続きができるようになった。\n成年後見人が被後見人宛ての郵便物の送付先を変更する場合、これまでは市役所で国民健康保険や介護保険、市税、水道などに関する郵便物を所管する各課を回り何度も同じ情報を記入していたため、多くの時間がかかっていた。\n８月３日からＬＩＮＥを通じたオンライン申請が始まったことで、市役所に赴く必要がなくなり、同じ情報を何度も記入する手間もなくなった。受け付けた情報は市地域福祉課が一元管理し、担当課に共有する。\nオンライン申請が苦手な成年後見人は、同課窓口への届け出で手続きを済ませることができる。市によると、成年後見人の送付先変更手続きのオンライン申請化は県内初となる。", "summary": "成年後見人の郵便物送付先変更がLINEで手続き可能に〈神奈川・座間市〉\n2026年09月01日 福祉新聞編集部成年後見人が被後見人宛ての郵便物の送付先を変更する手続きが大きな負担になっていることを受け、神奈川県座間市は今夏、市公式ＬＩＮＥを活用したオンライン申請を開始した。成年後見人が被後見人宛ての郵便物の送付先を変更する場合、これまでは市役所で国民健康保険や介護保険、市税、水道などに関する郵便物を所管する各課を回り何度も同じ情報を記入していたため、多くの時間がかかっていた。オンライン申請が苦手な成年後見人は、同課窓口への届け出で手続きを済ませることができる。市によると、成年後見人の送付先変更手続きのオンライン申請化は県内初となる。", "categories": ["福祉・社会保障", "介護保険・制度"], "is_new": false}, {"title": "介護施設の夜間の人員配置、さらなる基準緩和を俎上に　厚労省　見守り機器活用で検討", "url": "https://www.joint-kaigo.com/articles/48355/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-31 12:07", "description": "厚生労働省は来年度の介護報酬改定に向けて、見守り機器を十分に活用している介護施設などの夜間の人員配置基準をさらに緩和することを俎上に載せる。【Joint編集部】 28日に開いた審議会（社会保障審議会・介護給付費分科会）で […]", "content": "2026年8月31日\n介護施設の夜間の人員配置、さらなる基準緩和を俎上に 厚労省 見守り機器活用で検討\n厚生労働省は来年度の介護報酬改定に向けて、見守り機器を十分に活用している介護施設などの夜間の人員配置基準をさらに緩和することを俎上に載せる。【Joint編集部】\n28日に開いた審議会（社会保障審議会・介護給付費分科会）で、介護テクノロジーの活用の推進、夜間に見守り機器を活用している現場への対応などを論点として提示。サービスの質の担保を前提として、人員配置基準をさらに緩和できないか検討していく考えを示した。\n人手不足の深刻化や介護テクノロジーの進化などを踏まえ、質が高く持続可能なサービス提供体制の構築につなげる狙いがある。\n厚労省はこの日の審議会で、介護テクノロジーによる生産性向上の成果を把握するための実証事業の結果を報告。見守り機器を十分に活用している介護施設では、夜間の巡回・移動や直接介護といった業務に要する時間が縮減されたと説明した。\n意見交換の中では、委員からサービスの質の担保を前提とした人員配置基準の一層の緩和に理解を示す声が上がった。一方で、既存職員の負担増やサービスの質の低下などを懸念する慎重論も出た。\n厚労省は年内にも施策の方向性を固める。来年度改定ではどこまで踏み込んだ手を打つのか ーー 。これが今後の焦点となりそうだ。", "summary": "2026年8月31日\n介護施設の夜間の人員配置、さらなる基準緩和を俎上に 厚労省 見守り機器活用で検討\n厚生労働省は来年度の介護報酬改定に向けて、見守り機器を十分に活用している介護施設などの夜間の人員配置基準をさらに緩和することを俎上に載せる。【Joint編集部】\n28日に開いた審議会（社会保障審議会・介護給付費分科会）で、介護テクノロジーの活用の推進、夜間に見守り機器を活用している現場への対応などを論点として提示。サービスの質の担保を前提として、人員配置基準をさらに緩和できないか検討していく考えを示した。見守り機器を十分に活用している介護施設では、夜間の巡回・移動や直接介護といった業務に要する時間が縮減されたと説明した。", "categories": ["業務改善・介護テック", "介護保険・制度"], "is_new": false}, {"title": "厚労省の概算要求、36兆5803億円　福祉にもAI投資 - 福祉新聞Web", "url": "https://fukushishimbun.com/fukushiippan/45886", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-31 10:00", "description": "厚生労働省は８月２６日、２０２７年度予算の概算要求を公表した。一般会計総額は２６年度当初予算比４・４％（１兆５３７０億円）増の３６兆５８０３億円。高市早苗首相肝煎りの「『強く豊かな日本』投資枠」として１兆３３７億円を計上しＡＩ（人工知能）活用を含む医療、介護、障害福祉のテクノロジー導入（２８３億円）を盛り込んだ。増額幅が１兆円を超えるのは異例。「投資」がキーワードの予算編成となった。 介護、福祉の人手不足を解消するため、ＡＩを活用することで業務の効率化を図る。経済成長につながる「投資」という側面を強く意識した。厚労省の職員の定員も３７４人の純増を要求し、人材にも投資した。 相談業務もＡＩ活用 ＡＩの導入先は見守り機器、介護記録ソフト、インカム（業務用通信機器）を想定する。その導入を担う人材の養成費用も補助する。これらに地域全体で取り組むことも促す。自殺対策や生活保護における相談業務でもＡＩ活用に予算を充てる。 介護、障害福祉の人材確保にも投資枠として１３８億円を計上した。改正社会福祉法による都道府県ごとの「福祉人材確保の協議会」設置を後押しする。介護福祉士の修学資金貸付、介護福祉士養成", "content": "厚労省の概算要求、36兆5803億円 福祉にもAI投資\n2026年08月31日 福祉新聞編集部厚生労働省は８月２６日、２０２７年度予算の概算要求を公表した。一般会計総額は２６年度当初予算比４・４％（１兆５３７０億円）増の３６兆５８０３億円。高市早苗首相肝煎りの「『強く豊かな日本』投資枠」として１兆３３７億円を計上しＡＩ（人工知能）活用を含む医療、介護、障害福祉のテクノロジー導入（２８３億円）を盛り込んだ。増額幅が１兆円を超えるのは異例。「投資」がキーワードの予算編成となった。\n介護、福祉の人手不足を解消するため、ＡＩを活用することで業務の効率化を図る。経済成長につながる「投資」という側面を強く意識した。厚労省の職員の定員も３７４人の純増を要求し、人材にも投資した。\n相談業務もＡＩ活用\nＡＩの導入先は見守り機器、介護記録ソフト、インカム（業務用通信機器）を想定する。その導入を担う人材の養成費用も補助する。これらに地域全体で取り組むことも促す。自殺対策や生活保護における相談業務でもＡＩ活用に予算を充てる。\n介護、障害福祉の人材確保にも投資枠として１３８億円を計上した。改正社会福祉法による都道府県ごとの「福祉人材確保の協議会」設置を後押しする。介護福祉士の修学資金貸付、介護福祉士養成施設での介護ロボット導入も支える。\n福祉施設整備費２倍\n４０年を見据えたインフラの構築も進める。障害者支援施設、生活保護法関連施設、女性自立支援施設の整備費は、今年度比２倍の８３億円を計上。災害時に要配慮者を受け入れる障害者支援施設などに対しては、改築や修繕に必要な予算１０５億円を計上した。\n高齢化などによる自然増は３４００億円で、内訳は医療が２０００億円、障害福祉が１５５０億円。逆に、生活保護は受給者の減少を見込んだ。\n税制改正要望には家事支援やベビーシッターを含む認可外保育施設の利用を促す措置を盛り込んだ。子育てや介護をしながら働く人を増やしたい考えだが、中身は不明だ。", "summary": "介護、障害福祉の人材確保にも投資枠として１３８億円を計上した。介護福祉士の修学資金貸付、介護福祉士養成施設での介護ロボット導入も支える。障害者支援施設、生活保護法関連施設、女性自立支援施設の整備費は、今年度比２倍の８３億円を計上。高齢化などによる自然増は３４００億円で、内訳は医療が２０００億円、障害福祉が１５５０億円。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "〈熊本地震〉応援職員の受け入れを後押し　厚労省が人件費の公費負担に関する通知 - 福祉新聞Web", "url": "https://fukushishimbun.com/fukushiippan/45884", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-30 10:00", "description": "厚生労働省と、こども家庭庁は８月１３日、熊本地震で被災した福祉施設への職員派遣に関する通知を出した。被災した福祉施設を自治体が福祉避難所として扱うことで、全国から応援職員を受け入れた際の人件費が公費負担となることなどを説明している。 被災施設への職員の派遣は、全国社会福祉協議会が運営する全国災害福祉支援センターが窓口を担っている。被災した福祉施設が直接支援を要請すると、センターが日程などを調整した上でマッチングする。現在、全国から約４６０人が登録している。 通知は被災地の福祉施設が、避難を希望する人を受け入れる体制を整えていれば、熊本県または市町村の判断で福祉避難所として扱える方針を示した。 現在、避難者を受け入れていなくても、福祉避難所に指定されれば、派遣職員の人件費などは災害救助費から支出される。そのため、職員派遣を受け入れても被災した福祉施設の負担はゼロになる。 このほか、壊れた冷房器具に代わる機器を緊急調達した費用や、避難所で使う物資の費用なども災害救助費の対象になるという。 大災害が発生した際の福祉施設に対する職員派遣の仕組みは、２０１６年の熊本地震から本格的に始まった。ただ", "content": "〈熊本地震〉応援職員の受け入れを後押し 厚労省が人件費の公費負担に関する通知\n2026年08月30日 福祉新聞編集部厚生労働省と、こども家庭庁は８月１３日、熊本地震で被災した福祉施設への職員派遣に関する通知を出した。被災した福祉施設を自治体が福祉避難所として扱うことで、全国から応援職員を受け入れた際の人件費が公費負担となることなどを説明している。\n被災施設への職員の派遣は、全国社会福祉協議会が運営する全国災害福祉支援センターが窓口を担っている。被災した福祉施設が直接支援を要請すると、センターが日程などを調整した上でマッチングする。現在、全国から約４６０人が登録している。\n通知は被災地の福祉施設が、避難を希望する人を受け入れる体制を整えていれば、熊本県または市町村の判断で福祉避難所として扱える方針を示した。\n現在、避難者を受け入れていなくても、福祉避難所に指定されれば、派遣職員の人件費などは災害救助費から支出される。そのため、職員派遣を受け入れても被災した福祉施設の負担はゼロになる。\nこのほか、壊れた冷房器具に代わる機器を緊急調達した費用や、避難所で使う物資の費用なども災害救助費の対象になるという。\n大災害が発生した際の福祉施設に対する職員派遣の仕組みは、２０１６年の熊本地震から本格的に始まった。ただ、派遣に必要な人件費負担は、被災施設と派遣元の福祉施設が話し合いで決める必要があるため、支援要請をためらう福祉施設も少なくなかった。今回の熊本地震においても申請後に取りやめるケースが相次いでいたという。", "summary": "被災した福祉施設を自治体が福祉避難所として扱うことで、全国から応援職員を受け入れた際の人件費が公費負担となることなどを説明している。被災施設への職員の派遣は、全国社会福祉協議会が運営する全国災害福祉支援センターが窓口を担っている。被災した福祉施設が直接支援を要請すると、センターが日程などを調整した上でマッチングする。そのため、職員派遣を受け入れても被災した福祉施設の負担はゼロになる。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}];
const CAT_META  = {"介護保険・制度": {"color": "#2563EB", "icon": "📋"}, "医療・健康": {"color": "#DC2626", "icon": "🏥"}, "福祉・社会保障": {"color": "#059669", "icon": "🤝"}, "施設運営・経営": {"color": "#D97706", "icon": "🏢"}, "人材育成・HR": {"color": "#7C3AED", "icon": "👥"}, "業務改善・介護テック": {"color": "#0891B2", "icon": "💡"}, "組織・心理": {"color": "#EA580C", "icon": "🧠"}, "海外エイジテック": {"color": "#0D9488", "icon": "🔬"}, "AIツール・生産性": {"color": "#6D28D9", "icon": "⚡"}, "メンタル・哲学": {"color": "#BE185D", "icon": "🌿"}};
const DEFAULT_CLR = '#6b7280';

// ── State ────────────────────────────────────────────────────────
let state = { period:'all', cat:'all', lang:'all', sort:'date', search:'', newOnly:false };

// ── Utils ────────────────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseDate(s) {
  if (!s) return new Date(0);
  return new Date(s.replace(' ','T') + (s.length===10?'T00:00:00+09:00':'+09:00'));
}

function ageBucket(d) {
  const h = (Date.now() - parseDate(d)) / 3.6e6;
  if (h < 48) return 'new';
  if (h < 168) return 'week';
  return 'old';
}

function ageBadgeHtml(dateStr) {
  const d = parseDate(dateStr);
  const h = (Date.now() - d) / 3.6e6;
  let label, cls;
  if (h < 24)       { label='今日';            cls='age-new';  }
  else if (h < 48)  { label='昨日';            cls='age-new';  }
  else if (h < 168) { label=Math.floor(h/24)+'日前'; cls='age-week'; }
  else              { label=d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'}); cls='age-old'; }
  return `<span class="age-badge ${cls}">${label}</span>`;
}

function catBadgesHtml(cats) {
  return (cats||[]).map(c => {
    const m = CAT_META[c] || {color:DEFAULT_CLR,icon:'📰'};
    const clr = m.color;
    return `<span class="cat-badge" style="background:${clr}18;color:${clr};border:1px solid ${clr}35">` +
           `${m.icon} ${esc(c)}</span>`;
  }).join('');
}

// ── Card builder ─────────────────────────────────────────────────
function buildCard(a) {
  const displaySummary = (a.lang==='en' && a.summary_ja) ? a.summary_ja : (a.summary||'');
  const displayTitle   = (a.lang==='en' && a.title_ja)   ? a.title_ja   : (a.title||'');
  const isEn = a.lang === 'en';

  const langBadge  = isEn
    ? '<span class="lang-badge lang-en">EN</span>'
    : '<span class="lang-badge lang-ja">JP</span>';
  const transBadge = isEn ? '<span class="trans-badge">🌐 翻訳</span>' : '';
  const newBadge   = a.is_new ? '<span class="is-new-badge">NEW</span>' : '';

  const summaryBlock = displaySummary.trim().length > 30
    ? `<p class="card-summary">${esc(displaySummary)}</p>`
    : `<p class="card-summary-empty">要約を取得できませんでした</p>`;

  const publishedDate = (a.published||'').slice(0,10);

  return `<article class="article-card"
  data-cats="${esc(JSON.stringify(a.categories||[]))}"
  data-lang="${a.lang||'ja'}"
  data-date="${a.published||''}"
  data-isnew="${a.is_new ? '1' : '0'}"
  data-source="${esc(a.source||'')}"
  data-search="${esc(((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase())}">

  <div class="card-band">
    <div class="card-cats">${catBadgesHtml(a.categories)}</div>
    <div class="card-meta">
      ${newBadge}
      ${ageBadgeHtml(a.published)}
      ${transBadge}
      ${langBadge}
    </div>
  </div>

  <div class="card-body">
    ${summaryBlock}
  </div>

  <div class="card-footer">
    <div class="card-footer-left">
      <div class="card-source">
        <span>${esc(a.source)}</span>
        <span class="card-source-dot">·</span>
        <span>${publishedDate}</span>
      </div>
      <a class="card-title" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        ${esc(displayTitle)}
      </a>
    </div>
    <a class="read-btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="記事を読む">
      記事を読む
      <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </a>
  </div>
</article>`;
}

// ── Filter ───────────────────────────────────────────────────────
function filterArticles() {
  const now = Date.now();
  return ARTICLES.filter(a => {
    if (state.newOnly && !a.is_new) return false;
    if (state.period !== 'all') {
      const h = (now - parseDate(a.published)) / 3.6e6;
      if (state.period==='today' && h>48)  return false;
      if (state.period==='week'  && h>168) return false;
      if (state.period==='month' && h>720) return false;
    }
    if (state.cat  !== 'all' && !(a.categories||[]).includes(state.cat)) return false;
    if (state.lang !== 'all' && a.lang !== state.lang) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = ((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (state.sort==='date') return parseDate(b.published)-parseDate(a.published);
    const ca=(a.categories||[''])[0]||'', cb=(b.categories||[''])[0]||'';
    return ca!==cb ? ca.localeCompare(cb,'ja') : parseDate(b.published)-parseDate(a.published);
  });
}

// ── Section header ───────────────────────────────────────────────
function sectionHeader(catName, count) {
  const m = CAT_META[catName] || {color:DEFAULT_CLR, icon:'📰'};
  return `<div class="section-header">
    <span class="section-icon">${m.icon}</span>
    <span class="section-name" style="color:${m.color}">${esc(catName)}</span>
    <span class="section-count">${count}件</span>
  </div>`;
}

// ── Render ───────────────────────────────────────────────────────
function render() {
  const filtered = filterArticles();
  const container = document.getElementById('articlesContainer');
  const empty = document.getElementById('emptyState');
  document.getElementById('visibleCount').textContent = filtered.length;

  if (!filtered.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    renderSidebar(filtered);
    return;
  }
  empty.style.display = 'none';

  if (state.sort==='cat' && state.cat==='all') {
    const groups = {};
    const ORDER = Object.keys(CAT_META);
    filtered.forEach(a => {
      const c = (a.categories||[])[0] || '未分類';
      (groups[c]=groups[c]||[]).push(a);
    });
    let html='';
    ORDER.forEach(c => {
      if (groups[c]?.length) html += sectionHeader(c,groups[c].length)+groups[c].map(buildCard).join('');
    });
    if (groups['未分類']?.length) html += sectionHeader('未分類',groups['未分類'].length)+groups['未分類'].map(buildCard).join('');
    container.innerHTML = html;
  } else {
    container.innerHTML = filtered.map(buildCard).join('');
  }

  renderSidebar(filtered);
}

// ── Sidebar render ───────────────────────────────────────────────
function renderSidebar(filtered) {
  const catCounts={}, srcCounts={};
  filtered.forEach(a => {
    (a.categories||[]).forEach(c=>{ catCounts[c]=(catCounts[c]||0)+1; });
    srcCounts[a.source]=(srcCounts[a.source]||0)+1;
  });

  // Categories
  const sidebarCats = document.getElementById('sidebarCats');
  let html = `<button class="sidebar-item ${state.cat==='all'?'active':''}" data-scat="all">
    <span class="sidebar-item-label">すべて</span>
    <span class="sidebar-count">${filtered.length}</span>
  </button>`;
  Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).forEach(([cat,cnt]) => {
    const m = CAT_META[cat]||{icon:'📰'};
    html += `<button class="sidebar-item ${state.cat===cat?'active':''}" data-scat="${esc(cat)}">
      <span class="sidebar-item-label">${m.icon} ${esc(cat)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarCats.innerHTML = html;

  // Sources
  const sidebarSrc = document.getElementById('sidebarSources');
  let srcHtml='';
  Object.entries(srcCounts).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([src,cnt]) => {
    srcHtml += `<button class="sidebar-item" data-ssrc="${esc(src)}">
      <span class="sidebar-item-label" style="font-size:.8rem">${esc(src)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarSrc.innerHTML = srcHtml;

  // Sidebar category click
  sidebarCats.querySelectorAll('[data-scat]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.scat;
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      const chip = document.querySelector(`.cat-chip[data-cat="${CSS.escape(btn.dataset.scat)}"]`);
      if (chip) chip.classList.add('active'); else {
        const allChip = document.querySelector('.cat-chip[data-cat="all"]');
        if (allChip) allChip.classList.add('active');
      }
      render();
    });
  });
}

// ── Init ─────────────────────────────────────────────────────────
function init() {
  // Stats
  const newCnt = ARTICLES.filter(a=>a.is_new).length;
  document.getElementById('statTotal').textContent = ARTICLES.length;
  document.getElementById('statJa').textContent    = ARTICLES.filter(a=>a.lang==='ja').length;
  document.getElementById('statEn').textContent    = ARTICLES.filter(a=>a.lang==='en').length;
  document.getElementById('statNew').textContent   = newCnt;

  // Build category chips
  const wrap = document.getElementById('catChips');
  Object.entries(CAT_META).forEach(([name, m]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.dataset.cat = name;
    btn.textContent = m.icon + ' ' + name;
    wrap.appendChild(btn);
  });

  // Period tabs
  document.querySelectorAll('.period-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.period = btn.dataset.period;
      render();
    });
  });

  // Category chips
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.cat-chip');
    if (!btn) return;
    document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    render();
  });

  // New-only toggle
  const newToggle = document.getElementById('newToggle');
  newToggle.addEventListener('click', () => {
    state.newOnly = !state.newOnly;
    newToggle.classList.toggle('active', state.newOnly);
    newToggle.setAttribute('aria-pressed', String(state.newOnly));
    render();
  });

  // Controls
  document.getElementById('langFilter').addEventListener('change', e=>{ state.lang=e.target.value; render(); });
  document.getElementById('sortBy').addEventListener('change',     e=>{ state.sort=e.target.value; render(); });
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value.trim(); render(); });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
