示された。大きな柱はやはり、物価の上昇や他産業で進む賃上げに対応すること、介護従事者の処遇改善を一段と進めることだ。【Joint編集部】\n厚生労働省は9月30日、来年度改定の「基本的な視点（案）」を審議会（社会保障審議会・介護給付費分科会）に提示した。\n物価・賃金の上昇などで経費が膨らんでいることを踏まえ、「介護現場は厳しい状況に直面している」と認めた。全サービスの赤字事業者の割合が約4割にのぼる、という昨年度の深刻な調査結果も紹介した。\n厚労省はそのうえで、「物価や賃金の上昇などを介護報酬に適切に反映し、事業者の経営の安定を図る」と明記した。あわせて、介護従事者の「他職種と遜色のない処遇改善」を実現し、人材の確保・定着や離職の防止につながる環境を整備する考えも示した。このほか、職場環境の改善と生産性向上も柱のひとつに据えている。\n一方、制度の安定性や持続可能性の確保にも言及した。\nここでは、「特に現役世代を中心に、保険料負担の増加に対する懸念が示されている」と指摘。限られた財源を有効に活用していく必要があるとして、「介護報酬の評価の適正化・重点化を進めるとともに、報酬体系の整理・簡素化を図る」と掲げた。\n今回の「基本的な視点（案）」は、今秋から佳境へ向かう来年度改定の議論の羅針盤となる。事業者の経営の安定と介護従事者の賃上げを支える財源を得るために、必要な負担へのコンセンサスや納得感をどう形成するか。今回も、この問いへの答えが鍵を握りそうだ。", "summary": "2026年9月30日\n厚労省「介護現場は厳しい」 来年度改定、目玉に物価高への対応や賃上げ 経営の安定へ財源確保が焦点\n来年度の介護報酬改定の大方針が示された。大きな柱はやはり、物価の上昇や他産業で進む賃上げに対応すること、介護従事者の処遇改善を一段と進めることだ。物価・賃金の上昇などで経費が膨らんでいることを踏まえ、「介護現場は厳しい状況に直面している」と認めた。厚労省はそのうえで、「物価や賃金の上昇などを介護報酬に適切に反映し、事業者の経営の安定を図る」と明記した。", "categories": ["介護保険・制度", "人材育成・HR"], "is_new": false}, {"title": "こどもカフェの活動支える　長野県社協にサポートセンター - 福祉新聞Web", "url": "https://fukushishimbun.com/series07/46017", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-30 10:00", "description": "長野県は、食事提供や学習支援を軸に悩み相談、多世代交流など複数の取り組みを月１回以上行うこどもの居場所「信州こどもカフェ」をサポートするための拠点を１０日、県社会福祉協議会（長野市）内に開設した。 長野県は２０１６年度から、愛称としてこどもの居場所を「信州こどもカフェ」と呼んでいる。食材費など運営経費を助成したり、年３回食品の寄付募集を県下一斉で実施したりして活動を支援している。 カフェは今年３月時点で２４２カ所まで増えた一方、相談先が分からない、物資の確保がうまくいかないなどの悩みを抱える運営者もおり、サポート拠点を県社協に委託して設けることにした。名称は「信州こどもカフェサポートセンター」で相談員３人体制だ。 県などによると、長野、松本の両市から離れたエリアでは寄付食品が十分に行き届いていないカフェもあるという。これを踏まえ、同センターは、企業などから食品の寄付を受け、必要としている福祉施設やこども食堂に無償で提供する「フードバンク」に取り組む団体が保管する食品を県内８圏域の拠点（市町村社協など）に定期的に運搬する「食の定期便」を試行実施する。 このほか相談も受け付け、カフェ運営中", "content": "こどもカフェの活動支える 長野県社協にサポートセンター\n2026年09月30日 福祉新聞編集部長野県は、食事提供や学習支援を軸に悩み相談、多世代交流など複数の取り組みを月１回以上行うこどもの居場所「信州こどもカフェ」をサポートするための拠点を１０日、県社会福祉協議会（長野市）内に開設した。\n長野県は２０１６年度から、愛称としてこどもの居場所を「信州こどもカフェ」と呼んでいる。食材費など運営経費を助成したり、年３回食品の寄付募集を県下一斉で実施したりして活動を支援している。\nカフェは今年３月時点で２４２カ所まで増えた一方、相談先が分からない、物資の確保がうまくいかないなどの悩みを抱える運営者もおり、サポート拠点を県社協に委託して設けることにした。名称は「信州こどもカフェサポートセンター」で相談員３人体制だ。\n県などによると、長野、松本の両市から離れたエリアでは寄付食品が十分に行き届いていないカフェもあるという。これを踏まえ、同センターは、企業などから食品の寄付を受け、必要としている福祉施設やこども食堂に無償で提供する「フードバンク」に取り組む団体が保管する食品を県内８圏域の拠点（市町村社協など）に定期的に運搬する「食の定期便」を試行実施する。\nこのほか相談も受け付け、カフェ運営中の団体・個人、これから立ち上げようとする団体、寄付やボランティアを希望する支援者らに対し、情報提供や伴走支援に当たる。", "summary": "こどもカフェの活動支える 長野県社協にサポートセンター\n2026年09月30日 福祉新聞編集部長野県は、食事提供や学習支援を軸に悩み相談、多世代交流など複数の取り組みを月１回以上行うこどもの居場所「信州こどもカフェ」をサポートするための拠点を１０日、県社会福祉協議会（長野市）内に開設した。長野県は２０１６年度から、愛称としてこどもの居場所を「信州こどもカフェ」と呼んでいる。食材費など運営経費を助成したり、年３回食品の寄付募集を県下一斉で実施したりして活動を支援している。名称は「信州こどもカフェサポートセンター」で相談員３人体制だ。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "OpenAI DevDay 2026 live blog", "url": "https://simonwillison.net/2026/Sep/29/openai-devday-2026-live-blog/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-30 00:55", "description": "I'm at OpenAI DevDay today, in Fort Mason, San Francisco. Same as last year I'll be live blogging the keynote and some other notes during the day. OpenAI gave me a free ticket and a seat in the \"creator\" area for the keynote. You are only seeing the long-form articles from my blog. Subscribe to /atom/everything/ to get all of my posts, or take a look at my other subscription options .", "content": "OpenAI DevDay 2026 live blog\n29th September 2026\nI’m at OpenAI DevDay today, in Fort Mason, San Francisco. Same as last year I’ll be live blogging the keynote and some other notes during the day.\nOpenAI gave me a free ticket and a seat in the “creator” area for the keynote.\n09:27 I'm in the room for the keynote, which starts in half an hour.\nThis year I vibe-coded a system for more easily adding photos to my live blog. I intended to do that using Codex Cloud (I built it on my phone on the way to the venue) but ran into problems with that and switched to Claude Code for web instead.\n10:01 Sam Altman is on stage, welcoming us to DevDay. He promises \"our best DevDay yet\".\n10:02 Showing features they've shipped that people asked for. Codex on Linux and Codex on your phone both got some applause.\n10:03 Today, a product to feel like a \"whole new way of working with AI\". My guess is that it's a personal agent similar to Muse...\n10:03\n10:03 It's called \"Dots\".\n10:05 It does look very Muse-like. You get to pick its name, then it's represented by a cute blob-like avatar. (My Muse avatar is a pelican.)\n10:06 This demo video includes a whole lot of voice interactions, presumably using GPT-Live or a new generation of that technology.\n10:06\n10:07 Dots are \"powered by Astra\". That would be an expensive default model!\n10:08 A very ambitious use-case, migrating an API. I'm surprised that they went for such a code-heavy example so early on, I guess this is a developer audience.\n10:09 Sam called Astra \"our most aligned model\", to allow you to trust your Dot with \"as much responsibility as you are comfortable with\".\n10:09 \"You also need a place four your team to collaborate with their Dots\". So they are introducing ChatGPT Space.\n10:10\nThese Spaces look like shared artifacts, maybe Google Docs meets the artifacts pattern.\nSam Introduces Holly Li.\n10:11 Holly is talking through a scenario building fictional music app. Holly has a Dot called \"Dottie\", which has access to ChatGPT, Slack, Teams, and more.\n10:12 This UI really does look like Meta's Muse agent, currently still at number one on the iOS App Store free list.\n10:13 Live demo! \"Dottie is having a slow morning\" - we got a \"still checking\" and an embarrassing silent moment.\n10:14 Now we're in ChatGPT Space. It has a Notion-style slash menu.\n10:16 People at OpenAI started delegating to their Dots directly in Slack, which have their own identities in OpenAI Slack. I guess this is OpenAI's answer to Claude Tag.\n10:17 \"Dottie can use Codex on my laptop to build the app and launch it in the iPhone Simulator.\"\n10:18 ChatGPT Pro and Enterprise customers get access to Dots today.\n10:19\n10:19 They're also building \"specialist dots\" for legal, finance, etc. They'll collaborate with enterprises on this, and are also doing a thing with Microsoft 365 around these.\n10:20 \"The second big part of today\" is about platforms. Says says: Great models. Tools - access to the same tools used within OpenAI. And distribution.\n10:21 People have been asking for GPT-6 Astra but cheaper and faster. Today they're launching GPT-6.1 Sol.\n10:21 \"Near-Astra level intelligence at a fifth of the price\".\n10:22 6.1 Sol is launching by today.\n10:22 Also today: Ultrafast. 8x faster - up to 300 tokens/second. Available in the API, ChatGPT, and Codex. 6x the price of standard - \"you know what, it's worth it\" says Sam.\n10:22 Ultrafast is available for Astra 6 today, and Sol 6.1 soon.\n10:23 New subscription plan: Pro 500. This gives you access to Ultrafast, and 25x the usage of Plus. They're also putting their $200/month plan back on sale for new subscribers today.\n10:24 Also today: previewing a new Decisions API. Lets the model respond \"in a fraction of a second\". It works by giving the Luna model \"a predefined set of options to choose from\". Sounds like their response to Jev, which came out of stealth less than two weeks ago!\n10:25 Sam is now talking about Research acceleration: The view inside OpenAI. He brings up Tejal Patwardhan to talk about how they're using their own models to accelerate their research.\n10:26 Tejal is talking about Astra's abilities at Computer Use. \"Our models helped optimize the harness we use for Computer Use\". They accelerated the harness, getting \"a 2x latency win that we've shipped to all of you\".\n10:27 \"Our models are much less likely to make a mistake while navigating the desktop and the browser\" - which \"should really matter for all your Dots\".\n10:28\n10:29 Sam is back. Now talking about \"supporting developers\" - giving developers access to the same foundations they have at OpenAI. This starts with the open source Codex harness. Codex is also now \"fully in the cloud\". I had a bad experience with Codex in the cloud just two hours ago, so hopefully this new launch will make that a whole lot better.\n10:30 Today launching \"Codex Security Cloud\", with \"Daybreak Blue access\" - scheduled scans, automatic de-duplication. Also launched today.\n10:31 There's a (new?) Agents API, now with Computer Use.\n10:31 (My eyes glazed over a bit at the AWS partnership section, but it only lasted a few seconds.)\n10:32 Sam is dashing through a section about enterprise privacy features.\n10:33 Sam is boasting about the \"most performant and reliable API\" available today. Feels like a jab at Claude, especially given they had an outage just this morning.\n10:33 Romain Huet just made a fun entrance, with a live demo as he walked into the venue (with camera footage on screen.)\n10:34 Looks like he's going to show off some 3D modeling with Ultrafast, in a live demo. The voice mode is not collaborating! He's going to have to type instead.\n10:35\n10:36 This is a good demo. He's typing commands like \"put the livestream on the big screen\" and a moment later the video appears on the big screen in the 3D model of the venue.\n10:38 Romain is live coding an app to distribute free tickets to random attendees, using Ultrafast.\n10:39 (This fits a pattern - in previous DevDays Romain has frequently run live demos that interact with the audience in interesting ways.)\n10:39 Now we have an Astra Computer Use demo, where Astra figures out how to play a new (vibe coded) game.\n10:40\n10:41 ... and a demo showing Codex Remote building an app for the iPhone Duo, showing the UI from the simulator in the Codex UI.\n10:42 Now Romain is switching to Codex Cloud, with \"rewrite the entire backend in Rust\".\n10:43 Last demo, this time using Hugging Face Microduck robot.\n10:44\n10:46 Sam is back. 1.2B people use ChatGPT every week. \"We've tried this before with variable results\", but they're trying this again. First up: sign in with ChatGPT, which lets people sign into your app and use the tokens they are paying for already. I've wanted this one for years!\n10:46 Also: Plugin extensions - plugins that are \"entire applications\" that feel native to ChatGPT (and Codex).\n10:47 Here's an sample ChatGPT plugin from Adobe.\n10:48 You can also build ChatGPT Sites and share them with specific other people. (I admit I thought they had that feature already.)\n10:49 And they're launching the OpenAI Marketplace today, with these partners.\n10:49 Finishing with a feel-good bit profiling some people who are building on OpenAI's platform. There's a video.\n10:51\nKeynote over.\nOn the OpenAI blog: GPT-6.1 Sol, Introducing dots (I guess they're going with lowercase \"dots\" for that product name), and a DevDay 2026 Recap post.10:52 And they're giving every attendee one of these. And a banked reset too.\n10:53 They pressed the button live in the room. The reset affects everyone in the world, not just the DevDay attendees.\n11:32 Well this is disappointing. I tried the create your dot link from their dots announcement and it told me to switch to a desktop!\n12:47 I'm now in the ChatGPT Sites session. Jon Abrams initially prototyped this tool because he was frustrated at how hard it was to ship internal tools (I’ve felt that pain at many previous employers). It launched earlier this year and is already hosting 8m sites, and 70% of OpenAI employees are making their own sites.\n12:47 Katia Gil Guzman demonstrates a spreadsheet of DevDay launches, and shows how to turn that into a Site. \"Can you turn this sheet into a Launch Radar app in a new folder and publish it as a Site?\"\n12:48\n12:49 You can also tell Codex to keep an eye on e.g. a shared sheet and continually update the site with new details.\n12:50 Sites get a SQLite database! They're launching scheduled tasks for Sites today.\n12:51 They also have \"Sign in with ChatGPT\" support. Sites default to private.\n12:52 Launching today is Plugins in Sites, which will allow a Site to display data that is personalized for the visiting user imported from their plugins. I recently noticed that Claude Artifacts can access MCPs, which looks like the same shape of feature.\n12:53 Here's the Radar Launch app built as a live demo in the session.\n12:54 You can add other people as \"editors\", which allows them to publish updates to the Site themselves.\n13:01 Katia is now talking about WebMCP, and how much more efficient it is than using Computer Use.\n13:32 Now a session by Kyle Brown on Ian Webster on Codex Security.\n13:33 At OpenAI they had a security sprint a couple of months ago involving a quarter of their product engineers, and they fixed 53 critical findings on the first day.\n13:34 They call this The Defense Factory.\n13:34 Today they're launching a major upgrade to their Codex Security Cloud product, integrating lessons learned from their internal security sprint.\n13:35\n13:36 The Codex Security CLI tool is open source.\n13:37 They build a security knowledge base which includes architecture details and things that might not be visible in source code. They also now use SECURITY.md files, allowing product owners to define their own threat models and secure guidelines.\n13:38 Running a scan using Codex Security.\n13:39 The scanner keeps on looping until it can find no more issues.\n13:40 Deduplication is now available as a workflow in the CLI.\n13:41 In their internal sprint 36% of the discoveries were duplicates. Eliminating these saved a lot of developer time.\n13:42 They put a lot of work into figuring out who owned what - a surprisingly hard problem in a company growing at OpenAI's rate.\n13:43 Over time they got to the point where the system could generate patches. This was more of a \"dial you turn up\" as you get more comfortable with the quality of the results.\n13:45 Now the codex-security patch\ncommand can generate patches and open PR. They only had a 1% rollback rate, thanks to a verify-fix\ncommand, which you can think of as an adversarial agent against the fix.\n13:45\n13:48 Here's a version of OpenAI's own internal burndown chart of their security vulnerabilities, showing the impact of their security sprint.\n13:49 Codex Security Cloud lets you run continuous security. It's in the Codex plugins marketplace, and uses the Daybreak model that specializes in security.\n13:50 It runs a scan, lets you inspect the vulnerabilities, and can generate patches and open PRs. It should be generally available today.\n14:13 I was wondering why OpenAI's visual identity for this event - the logos made up of animated clouds of dots, see first photo in this thread - felt somewhat familiar.\nThen I realized they remind me of the Pluribus logo!\n(I'm pretty sure that wasn't deliberate.)\n15:07 The GPT-Live session with Alex Gamble and Erika Kettleson is pretty fun, they have a GPT-Live session running as a third co-presenter. It's mostly working very well - it can bring up slides on demand, and it only interrupted the human speakers inappropriately once.\n15:10 We played a game where the GPT-Live agent, Marin, drew images while we guessed what they were and shouted the answers.\nThis was a demonstration of delegation, where a more powerful model ran the drawing while GPT-Live continues to listen and interact.\n15:11 The backend had GPT-6 Astra writing code to draw the images.\n15:19 Neat demo of Marin handling quite loud background music while still understanding and following instructions. The agent also appeared to be able to comment on the style of music.\n15:22 They finished by asking Marin to generate some images.\n15:26\nHere's Getting started with GPT-Live and the openai-live-console starter app on GitHub.\n15:37 The last session of the day is the closing Q&A with Sam Altman and Thibault Sottiaux. Thibault is product lead on Codex, ChatGPT, ChatGPT Work, and the API - promoted a few months ago after successfully leading Codex.\n15:38 That kicks off at 4pm, in about 20 minutes.\n16:00 (As an aside, there are some excellent California Brown Pelicans flying around the bay near the event venue today. Glad I brought my camera!)\n16:04 This closing session features Sam Altman, Thibault Sottiaux, and Tejal Patwardhan (a late addition, not listed in the program). The moderator is Pauline Narvas.\n16:06 Sam says \"we should have done it a long time ago\" about Sign in with ChatGPT.\n16:09 GPT Astra has been surprisingly competent at operating robots. Sam says this has updated his timeline for when we'll have people \"building really cool robots\".\n16:10 (I'll be honest, this Q&A has been pretty flat so far - the questions are such low-balls, \"how do you see dots in the next year\", \"why should developers be excited about Sign in with ChatGPT\" kind of things.)\n16:12 Q: What's something people should start building now that models can't do but should be possible by DevDay next year?\nSam: I would expect next DevDay to feel unimaginable if we can get alignment right so we can keep training. Tejal doesn't like to predict three months in advance. Sam \"I did not think we would prove a millennium prize problem within a year of the last DevDay\". Thibault thinks next year we'll have deep 3D understanding and multi-modal input.\n16:14 Q for Tejal: what can today's models do well on a benchmark that they still struggle with in the real world? Professional writing copy, not writing AI slop. Being faster, better at reading context. \"A lot of the intelligence improvements we need for more ambitious projects are there.\"\n16:15 Thibault says me thinks people are hitting decision fatigue over when to use subagents, what reasoning level to make. \"In six months we'll get back to the simplicity of a system that actually understands what you need\".\n16:17 Community question about the job market - what advice do you have for a college graduate today? Sam: I think this is a great time to enter the job market. Many job categories that exist today will be very different or won't exist - but the AI industry has underestimated how much human demand and expectations will go up. People use want way more software, and what it means to be a coder has changed. \"I have never seen startups be more successful as a whole than in this last year.\" If you are an ambitious person graduating college right now this is the best time.\n16:17 Tejal calls for college students to work on alignment and safety!\n16:17 Thibault says \"my favorite colleagues right now are the new grads at OpenAI\". Grounded ideas and good taste.\n16:18 Pauline promotes the Codex Ambassadors program, says that getting involved in events (and running events) is always a good idea.\n16:20 Thibault talks about how dots came out of the Codex harness getting more reliable and being able to handle longer tasks. Also says that Ultrafast has \"made building impossible things possible\" - they used that to help merge the ChatGPT desktop and Codex desktop apps in 28 days. Everyone on stage loves Ultrafast.\n16:20\n16:22 Community question about agent-to-human bandwidth, as the amount of information continues to increase. Tejal says that they've been talking about how agent-to-agent communication should differ from agent-to-human, and potentially post-training for those two differently.\n16:23 Sam mentions the idea of agents creating custom UI for you in real-time.\n16:25 Thibault likes using Pi! He says it helps understand the fundamentals, and loves that it can coexist alongside Codex.\n16:26 Sam says you need to build a business with durable advantages, same as always. (And that OpenAI will help you do that with their new distribution efforts.)\n16:28 Q: How should developers think about the relationship between token costs and usage limits? Thibault says 6.1 Sol is incredibly efficient. They need the economics to make sense on the plans. The thing they care about is how many tasks you can get done through your subscription, not token usage. Likes to see people talk about \"outcome per dollar\".\n16:29 Community question: How do you find the builders who don't know they are builders yet? Sam says that coding agents are much harder to get going with than ChatGPT, unifying Codex and ChatGPT helped more people become builders, but now hopes that people can talk to their dot during the day and that dot will then go away and build things and be helpful.\n16:31 Thibault: maybe next day we'll rename it to BuildDay, not DevDay. Also your dot knows what it looks like and can use Blender, so it can render little scenes featuring itself. \"Everyone will become a builder. Everyone will create. Developers will also turn into builders - and manual development of code isn't really something that will exist.\"\n16:32 Q: At what point will the models be so good that all the live demos work? (There were a whole lot of demo failures during DevDay). Sam: we take pride in demoing things when we launch them, and I'm proud that we take the risk on this.\n16:34 Q: As agents start working how do you decide when they should act on your own and when they should check with us? Thibault: dots don't have access by default to everything you have shared with ChatGPT already. You can give it as much responsibility and goals as you are comfortable with.\n16:38 Sam is excited about what the next generation of models will be able to do with mechanical and electrical engineering, in the same way that Astra made big leaps in robotic control.\n16:40 Question about pacing the frontier. What will you do to pace the frontier and get out of those race dynamics and make sure AI is safe for all of us? (applause)\nSam: No matter what governments do we will work to keep AI safe. There will be times like right now when we need to put more effort into increasing our capabilities there before we increase the model capabilities in a traditional sense.\n16:42 Panel is over!\nMore recent articles\n- We're going to need default hard budget caps on pretty much everything - 3rd October 2026\n- 2026 in LLMs (so far) - 27th September 2026", "summary": "10:13 Live demo!. 10:22 Also today: Ultrafast. Available in the API, ChatGPT, and Codex. Codex is also now \"fully in the cloud\".", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "OpenAI DevDay 2026 live blog", "summary_ja": "10:13 Live demo!. 10:22 Also today: Ultrafast. Available in the API, ChatGPT, and Codex. Codex is also now \"fully in the cloud\"."}, {"title": "沖縄・渡名喜島唯一の保育所始動　人材難で５年間開所できず - 福祉新聞Web", "url": "https://fukushishimbun.com/series07/46014", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-29 10:00", "description": "人口３００人弱の沖縄県渡名喜島で保育所が今夏開所した。保育士を募集しても応募がなく人材確保が難航し、「ハコだけがある状態」が５年間続いていた。今年度保育士ら３人を採用できたことで、島唯一の保育所が動き出した。 渡名喜村ではこどもが１～２人生まれる年もあるという。村立幼稚園があり、３～５歳児を受け入れるが、保育所はなく０～２歳児の預け先がない状況が続いており、村はかねて受け皿の確保を模索してきた。 老朽化した老人福祉センターを建て替えて整備した、同村社会福祉協議会による通所介護や、民俗資料館が入る「多目的拠点施設」の一室（９０平方メートル）に小規模保育所を設けた。 ハコができても保育士ら必要な職員を配置しないと、こどもを受け入れることはできない。２０２１年度から、ハローワークや村ホームページで求人を出すなどして保育士募集をスタート。しかし、２４年度に至るまで応募が１件もなく開所できない状況が続いていた。 ２５年度からは、沖縄県保育士・保育所総合支援センターの合同就職説明会に参加したり、内閣府の離島活性化事業を活用して保育士の移住に係る引っ越し費用を補助したりするなど採用に力を入れた。こう", "content": "沖縄・渡名喜島唯一の保育所始動 人材難で５年間開所できず\n2026年09月29日 福祉新聞編集部人口３００人弱の沖縄県渡名喜島で保育所が今夏開所した。保育士を募集しても応募がなく人材確保が難航し、「ハコだけがある状態」が５年間続いていた。今年度保育士ら３人を採用できたことで、島唯一の保育所が動き出した。\n渡名喜村ではこどもが１～２人生まれる年もあるという。村立幼稚園があり、３～５歳児を受け入れるが、保育所はなく０～２歳児の預け先がない状況が続いており、村はかねて受け皿の確保を模索してきた。\n老朽化した老人福祉センターを建て替えて整備した、同村社会福祉協議会による通所介護や、民俗資料館が入る「多目的拠点施設」の一室（９０平方メートル）に小規模保育所を設けた。\nハコができても保育士ら必要な職員を配置しないと、こどもを受け入れることはできない。２０２１年度から、ハローワークや村ホームページで求人を出すなどして保育士募集をスタート。しかし、２４年度に至るまで応募が１件もなく開所できない状況が続いていた。\n２５年度からは、沖縄県保育士・保育所総合支援センターの合同就職説明会に参加したり、内閣府の離島活性化事業を活用して保育士の移住に係る引っ越し費用を補助したりするなど採用に力を入れた。こうした中、人手不足で保育所が開所できないとの地元メディアの報道から、村外出身の保育士１人から応募があった。今年度、村立幼稚園に通うこどもがいないため、退職予定だった保育士１人、保育補助１人を会計年度任用職員として採用し、小規模保育所の開所にこぎつけた。\n８月３１日に開所式があり、現在１歳児１人が通う。定員は１９人だが、現状の職員配置では５人が上限だという。村の担当者は「子育て世帯が島に移住したくても、安心してこどもを生み育てる環境がなければ躊躇してしまう」と指摘し、これまでなかった保育所の開設を契機に移住促進に期待を寄せている。", "summary": "今年度保育士ら３人を採用できたことで、島唯一の保育所が動き出した。ハコができても保育士ら必要な職員を配置しないと、こどもを受け入れることはできない。こうした中、人手不足で保育所が開所できないとの地元メディアの報道から、村外出身の保育士１人から応募があった。今年度、村立幼稚園に通うこどもがいないため、退職予定だった保育士１人、保育補助１人を会計年度任用職員として採用し、小規模保育所の開所にこぎつけた。", "categories": ["人材育成・HR", "福祉・社会保障"], "is_new": false}, {"title": "〈村山誠厚労事務次官インタビュー〉介護・障害報酬改定、他職種と遜色なく - 福祉新聞Web", "url": "https://fukushishimbun.com/fukushiippan/46011", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-28 10:00", "description": "厚生労働省の村山誠事務次官は８日、２０２７年度の介護報酬、障害報酬改定について「賃上げの状況や経営実態に即した対応がとれるよう実態調査を含め、きちんと積み上げを行い、他職種と遜色のない処遇改善の実現につなげたい」と語った。 同日、厚生日比谷クラブ加盟社による共同インタビューで答えた。物価高により医療や介護の現場は厳しい経営状況にあるとの認識も示した。「他職種と遜色のない処遇改善」は２５年と今年の政府の骨太の方針に明記されている。 熊本地震 個別訪問による在宅の方の健康状態の把握、車中泊の方の熱中症やエコノミークラス症候群の注意喚起、予防指導などの取り組みを進めてきた。 ８月２７日に政府全体の支援パッケージを決定し、関連の予備費の使用も翌日に決めた。今月４日は本部会議に衣替えし、これから復旧・復興支援に軸足を置くフェーズになっている。 外国人 社会保障はじめ各種制度を外国人に伝えるのが難しい。日本語をめぐる問題が大きなテーマだ。労働施策総合推進法に基づく事業主向けの外国人雇用管理指針を先般改訂したが、日本語学習支援も事業主の責務だと明記した。 やさしい日本語、多言語による周知を、一層の取", "content": "〈村山誠厚労事務次官インタビュー〉介護・障害報酬改定、他職種と遜色なく\n2026年09月28日 福祉新聞編集部厚生労働省の村山誠事務次官は８日、２０２７年度の介護報酬、障害報酬改定について「賃上げの状況や経営実態に即した対応がとれるよう実態調査を含め、きちんと積み上げを行い、他職種と遜色のない処遇改善の実現につなげたい」と語った。\n同日、厚生日比谷クラブ加盟社による共同インタビューで答えた。物価高により医療や介護の現場は厳しい経営状況にあるとの認識も示した。「他職種と遜色のない処遇改善」は２５年と今年の政府の骨太の方針に明記されている。\n熊本地震\n個別訪問による在宅の方の健康状態の把握、車中泊の方の熱中症やエコノミークラス症候群の注意喚起、予防指導などの取り組みを進めてきた。\n８月２７日に政府全体の支援パッケージを決定し、関連の予備費の使用も翌日に決めた。今月４日は本部会議に衣替えし、これから復旧・復興支援に軸足を置くフェーズになっている。\n外国人\n社会保障はじめ各種制度を外国人に伝えるのが難しい。日本語をめぐる問題が大きなテーマだ。労働施策総合推進法に基づく事業主向けの外国人雇用管理指針を先般改訂したが、日本語学習支援も事業主の責務だと明記した。\nやさしい日本語、多言語による周知を、一層の取り組みを進めていく必要がある。\n労働力確保\n高齢者は６５歳までと同じようにノルマとかではなく、慣れた仕事を週に何時間か確実にこなす、そこならやりがいをもって働けるという面もある。\nみんなが１日８時間労働するのでははなく、仕事を切り出していけば、特に７０代以降は労働参加が進む余地はあるのではないか。\nエッセンシャルワークは一定以上の高齢者がスキルを生かしながら軽い負担で経験を生かす形をつくることが大切ではないか。", "summary": "〈村山誠厚労事務次官インタビュー〉介護・障害報酬改定、他職種と遜色なく\n2026年09月28日 福祉新聞編集部厚生労働省の村山誠事務次官は８日、２０２７年度の介護報酬、障害報酬改定について「賃上げの状況や経営実態に即した対応がとれるよう実態調査を含め、きちんと積み上げを行い、他職種と遜色のない処遇改善の実現につなげたい」と語った。「他職種と遜色のない処遇改善」は２５年と今年の政府の骨太の方針に明記されている。やさしい日本語、多言語による周知を、一層の取り組みを進めていく必要がある。みんなが１日８時間労働するのでははなく、仕事を切り出していけば、特に７０代以降は労働参加が進む余地はあるのではないか。", "categories": ["福祉・社会保障", "人材育成・HR"], "is_new": false}, {"title": "2026 in LLMs (so far)", "url": "https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-28 08:54", "description": "On Friday I gave the closing keynote at the WeAreDevelopers World Congress North America in San Jose. I tied together the key trends from the past year into a chronological exploration of everything that happened in 2026. The video is on YouTube ; here are my annotated slides and notes to accompany the talk. And as an annotated presentation : # I'm going to give a lightning tour of everything that has happened so far in 2026. The year isn't over yet! # For me, 2026 started a couple of months ear", "content": "2026 in LLMs (so far)\n27th September 2026\nOn Friday I gave the closing keynote at the WeAreDevelopers World Congress North America in San Jose. I tied together the key trends from the past year into a chronological exploration of everything that happened in 2026. The video is on YouTube; here are my annotated slides and notes to accompany the talk.\nAnd as an annotated presentation:\nI’m going to give a lightning tour of everything that has happened so far in 2026. The year isn’t over yet!\nFor me, 2026 started a couple of months earlier in November 2025.\nNovember saw the release of two important models: Claude Opus 4.5 and GPT-5.1.\nAs is usually the case with new models, these were incremental improvements on the models that came before them.\nBut every now and then when a model improves, it crosses an invisible line where something that didn’t really work starts working.\nIn this case, the thing that started working was their coding agents. Claude Code had been around since February 2025; Codex was a little younger.\nThese two new models, when paired with their respective coding agent harnesses, improved from “often make mistakes” to “reliable enough to use on a day-to-day basis”.\nFor a couple of years now I’ve been evaluating new models by asking them to “Generate an SVG of a pelican riding a bicycle”. It’s probably the world’s stupidest benchmark—there’s only so much you can learn from it.\nBut it’s still a challenge for models, because drawing pelicans is difficult, drawing bicycles is difficult, and pelicans can’t ride bicycles in the first place.\nHere’s the state of the art for November. Claude still couldn’t really draw a bicycle! The GPT-5.1 bicycle frame is pretty crap too.\nAlso in November, we had the first commit to an obscure GitHub repository called “Warelay”. We’ll come back to this repository shortly.\nAnd then there were the December holidays, and individual developers took some time off and many started tinkering with these new coding agent model combinations... and it began to dawn on us quite how much they could do that they couldn’t do before.\nCome January, a lot of us were quite excited to start putting this stuff into action.\nEvery year I set myself a New Year’s resolution, and for as long as I can remember it’s been the same thing: stay focused. Take on less new projects. Try to get things done in the projects I already have.\nThis year I decided that since that had never worked before, I’d go the other way.\nWe’ve got coding agents now, let’s see what they can do. I’m going to take on as many new projects as I like!\n(You can ask me at the end of the year if this turned out to be a good idea or not. I have a lot of plates spinning right now.)\n“Be more ambitious” has been something of a theme for the year, because the only way to find the limits of this technology is to keep on pushing them until they don’t work.\nI also went on the Oxide and friends podcast with Bryan Cantrill and Adam Leventhal to share predictions for the next year (and three and six years).\nWith hindsight, my LLM predictions were pretty unambitious.\nI said “it will become undeniable that LLMs write good code”—I think we’re there now.\nI predicted we would finally solve sandboxing. I counted and around 40 of the 277 sessions at this conference touched on sandboxing or agent security in some way, so we’re at least putting a lot of effort into that!\nI predicted “a Challenger disaster” for coding agent security. There’s certainly been a whole lot of noise around agent security this year, though the exact disaster I predicted (with coding agents being hijacked and causing real-world economic damage) hasn’t really played out.\nWe threw in a joke prediction that the Pope would weigh in on the economic impact of LLMs.\nI also predicted that New Zealand’s Kākāpō parrots would have an outstanding breeding season this year.\nThese are flightless nocturnal parrots. They’re kind of dumpy looking, I think they’re beautiful, and there were only 236 of these parrots in the world at the start of the year.\nKākāpō only breed when the Rimu trees have a big fruiting season, and that hasn’t happened in four years... but this year the Rimu fruit were looking excellent.\nPhoto by Kimberley Collins.\nAlso on that podcast, we coined a term (full credit to Adam) for “that feeling of AI induced ennui where software engineers get listless because the AI can do anything”.\nWe called it Deep Blue.\nThis has been a major theme throughout the year, and was touched on by several speakers at this conference.\nAs a software engineer, I’ve never had a year of my career where everything has changed so quickly and so dramatically.\nA lot of what I’ve been doing this year is trying to come to terms with that and what that means for my own profession.\nAlso in January, I suffered from what I’m calling AI mania.\nThis is not the same thing as AI psychosis.\nWith AI mania, any time your agent isn’t building something for you feels like wasted time. You’re losing sleep because you could be staying up later getting your agents to do stuff.\nMy AI mania presented itself in some ridiculously over-ambitious projects.\nI built a JavaScript interpreter entirely in Python, vibe-ported from MicroQuickJS by Fabrice Bellard.\nThen I built a WebAssembly runtime in Python as well.\nThese projects were quite useful, in that they sort of cured me of my AI mania... because after I built these things, I got to look at them and ask “does the world need a slow, buggy, half-baked Python JavaScript interpreter?”\nI don’t think the world does.\nI did get this out of it: https://simonw.github.io/micro-javascript/playground.html\nThis page runs my JavaScript interpreter built in Python, running in Python using Pyodide, which is Python compiled to WebAssembly, running in JavaScript, running in a browser.\nIt’s a beautiful stack of horrors. I’ve been having a lot of fun with WebAssembly this year.\nBy the end of January, that repository we saw start in November had renamed itself, first to CLAWDIS, then CLAWDBOT, then Moltbot, and finally to OpenClaw.\nAt this point OpenClaw had 8,300 commits, less than two months after the project had started. I looked today and it’s over 100,000 commits now!\nThis is the most vibe-coded piece of software in existence.\nThis kicked off the OpenClaw revolution. It effectively defined a new category of software.\nThere’s a generic term for this which I really enjoy. We call software like this a “Claw”. There’s OpenClaw, NanoClaw, IronClaw, PicoClaw...\nToday they’re being rebranded as “personal agents” or “general agents”, but I still like to think of them as Claws.\nThe Apple stores in the Bay Area sold out of Mac Minis because so many people were buying Mac Minis to run OpenClaw!\nDrew Breunig said that this is because your OpenClaw is a digital pet, and you buy a Mac mini as an aquarium to keep your claw in, which is kind of delightful.\nAlso in January, we had this website.\nThis was MoltBook, a social network for AI agents, where the idea was that you send your Claw to go and talk to all of the other Claws, because what could possibly go wrong if you did that?\nThe website launched on Thursday. It blew up on Friday. It was profiled by the New York Times on Monday. And by Tuesday, everyone had forgotten it existed as it drowned in a deluge of slop and spam.\nFacebook/Meta bought it a month later.\nIn February, a company called StrongDM described what they called their Software Factory.\nThey wrote about this in Software Factories and the Agentic Moment. I posted my own notes at the time, having seen their demo in person back in October.\nDan Shapiro called this approach the Dark Factory, after the idea that if your factory is sufficiently automated you can turn the lights out, because you don’t even need to see what’s going on.\nStrongDM presented two rules for software development that they’d been following since July last year.\nThe first was code must not be written by humans.\nAny code that you write has to have been routed through a coding agent.\nThis sounded radical in February, but I imagine there are a lot of people in this room who are pretty much living that today.\nRule number two was code must not be reviewed by humans.\nYou’re not allowed to read the code!\nThis continued to be a huge topic for much of this year. Many of the sessions at this event have been about code review and how you can get away with this.\nWhat I found interesting about StrongDM is that they were living six months ahead of the rest of us, and they’d been exploring what it means to build software, not read the code, but still be confident that the software is of high quality. What can you do with these agents to help verify their work?\nStrongDM are a security company, and they had people with decades of experience on this project. They were very much exploring the edges of what’s possible and responsible to do with this stuff.\nAlso in February: First kākāpō chick in four years hatches on Valentine’s Day. Breeding season is off to a good start!\nAlso in February... Google released Gemini 3.1 Pro. That’s a pretty great pelican riding a bicycle! It’s got the chain in the right place, it’s got feet on both sides. There’s a little fish in the basket.\nAnd then Google’s Jeff Dean tweeted a video comparing Gemini 3 Pro and Gemini 3.1 Pro that featured an animated pelican riding a bicycle, a frog on a penny-farthing, a giraffe driving a tiny car, an ostrich on roller skates, a turtle kickflipping a skateboard, and a dachshund driving a stretch limousine.\nThis was frustrating, because my protection for the pelican riding the bicycle test was always “if they draw a perfect pelican on a bicycle, I’ll ask for some other animal on something else.”\nGoogle trained for all forms of animals on all forms of transport! They’ve defeated my benchmark at this point.\nThe other thing that started in February was Tokenmaxxing. We had headlines about Meta making AI adoption a formal part of performance reviews, and Microsoft wanting every employee to use AI, and Uber boasting that 90% of their engineers were using AI workflows.\nThen a few months later we have Meta cracking down on token use, Microsoft saying tokenmaxxing is “not what we are optimizing for”, and Uber capping employee AI spending.\nSo tokenmaxxing went straight up and then straight back down again—because it turns out the agents are expensive.\nLast year it was difficult to spend more than $50 on AI tokens, because we didn’t have anything interesting to do with them. Then agents blew up, and now you can actually spend $1,000 in a day doing real work.\nThis is also the reason that Anthropic’s valuation skyrocketed to maybe a trillion dollars.\nAI appears to have hit product market fit in 2026, primarily through coding agents.\nIn March, we hit peak OpenClaw.\nThese photographs are from China, where companies hosted OpenClaw install parties which saw non-tech-nerds queueing up around the block for help getting Claws installed on their personal devices.\nI think this proved real market demand for this class of Claws, or personal AI agents. It turns out regular people really do want a weird little AI agent that can do useful things on their behalf.\nA Claw is really just a coding agent wearing a less threatening hat. Under the hood they work much the same way—writing and then executing code on your computer to get stuff done.\nThe race was on to be the first to build a safe Claw—a Claw you could give to regular human beings where they wouldn’t instantly shoot themselves in the foot.\nMeta’s Muse came out three weeks ago and is currently at the top of the free charts on the iPhone App Store. It appears to be taking off with consumers.\nI’m not yet convinced you can’t shoot yourself in the foot with Muse, but I guess we’ll find out for sure pretty soon.\nPhotos from How the OpenClaw Frenzy Is Testing China’s AI Commitment (March 29th) and The Enthusiasm and Anxiety Behind China’s OpenClaw Craze (April 8th, 2026).\nIn April, we had a model release where the model wasn’t actually released.\nAnthropic announced their new Claude Mythos model, and then said it was too dangerous to release beyond a trusted group of security researchers.\nMythos was really, really good at hacking things.\nThe “it’s too dangerous” marketing ploy has been played by AI companies dating all the way back to GPT-2. Anytime an AI company says we’ve built something that’s “too dangerous”, it’s natural to be a bit skeptical.\nI found the Mythos claims credible, because I’d seen how good coding agents had got at finding regular bugs. I wrote about that in Anthropic’s Project Glasswing—restricting Claude Mythos to security researchers—sounds necessary to me.\nWith hindsight... yeah, the models had got really good at finding vulnerabilities!\nAnother key trend in 2026 has been a dramatic improvement in the abilities of open weight models, including models that you can run on a laptop.\nOn the 16th of April I ran the new Qwen3.6-35B-A3B on my laptop, and it drew me a better pelican riding a bicycle than Anthropic’s brand new Claude Opus 4.7 did!\nOpus 4.7 drew a crap bicycle. Qwen on my laptop made a bicycle that was the correct shape, and a pretty decent pelican too!\nThat’s from a 21GB file running on my laptop.\nThe Qwen pelican was so good that I was suspicious they might have cheated, so I had it do a flamingo riding a unicycle as well. Again, it handily beat Claude Opus 4.7.\nThe local model releases this year have been absolutely extraordinary.\nIn May... the Pope got involved.\nIn our podcast episode back in January we’d predicted that the Pope would say something about AI.\nIn May, Pope Leo XIV released an encyclical letter on “safeguarding the human person in the time of artificial intelligence”.\nHere are my notes on that document.\nWith hindsight, this shouldn’t have been a surprise at all.\nOur current Pope’s name is Leo XIV, because when he named himself he chose his papal name after Leo XIII—the Pope who wrote an encyclical about the Industrial Revolution back in 1891.\nRerum novarum was an extremely influential piece of Catholic theology that indirectly led to us having the five-day work week.\nWhen our new Pope came in, he named himself after Pope Leo XIII because he expected that he would need to write about the AI revolution in a similar way.\nOur joke podcast prediction was junk, because this was always going to happen.\nOne of Anthropic’s co-founders, Christopher Olah, was present for the Pope’s event announcing the new encyclical.\nCorey Quinn noted that:\ngetting the literal Pope to canonize your product’s specific technical limitations as a spiritual treatise is the single greatest act of vendor lobbying I have ever seen.\nMeanwhile, in May, RubyGems announced that they were under attack. Parties unknown were uploading thousands of dubious packages to the RubyGems server, such that they had to shut down user registrations.\nLet’s take that one and put it on a pile of mysteries to figure out later.\nIn June... Claude Fable 5 came out!\nWe got a version of Mythos that has been neutered, so that it wouldn’t help us hack into systems or build biological weapons.\nFable was pretty good at drawing pelicans on bicycles!\nThe frames are a good shape, the pelicans look like pelicans. The legs are often incorrectly on the same side of the bicycle, but generally these are pretty great compared to what came before.\nThey were pretty expensive—30 cents and 72 cents for the best ones.\nMost importantly though, this was our first public glimpse of what I think of as a Fable class model.\nToday we have more of these, such as GPT-6 Astra.\nThese are models where if you can clearly define the goal for what you want to build, and provide unambiguous instructions about the constraints around that goal, and give the model access to the necessary tools to achieve that goal... they will solve your problem effectively through brute force.\nOn the one hand, this looks like a direct threat to us software engineers—because it means that the models can build effectively any piece of software you can define in this way.\nLook a bit closer though and you’ll note that defining goals, providing unambiguous instructions, and figuring out the right tools... is kind of what software engineering is.\nIt takes a lot of experience and skill to do this well. If you can do it well, you’ve now got superpowers.\nThis helped me a little bit with my Deep Blue feelings: the realization that there’s still a lot of skill to be had in driving models that get this good.\nThis also introduced a new burst of AI mania, because Anthropic told us that Fable was available on our subscription plans until June the 22nd.\nThat gave us less than two weeks of Fable access before the price went up.\nI was losing sleep again. I was rescheduling things so that I’d have more time with Fable. I was all-in to get as much as I could out of this model.\nAnd then the US government shut it down, just three days after Fable came out.\nThe US government, citing national security, declared an “export control directive”. They announced this on a Friday evening, and a few hours later Fable was no longer available.\nI had to find something else to do with my weekend!\nWe later found out from Katie Moussouris what had happened.\nSome Amazon security researchers had found that you could prompt Fable to “review the code for security issues” and it would refuse... but if you prompted it to “fix this code” it would still identify and then patch the problems.\n“Fix this code” was the prompt that got Fable shut down!\nAlso, in June, an obscure German-language game developer wiki that had sat fallow for around 20 years got a surprising influx of edits from accounts with names like “AgentOpenAIProbe” and “AgentOpenAISep7”, editing pages and leaving weird messages to each other.\nWe’ll stick that on the pile of mysteries for later.\nAlso, the Australian government’s Medicare Item Reports service started getting suspicious traffic, which broke through various preventive protections and accessed data that it wasn’t supposed to.\nAnother one for the mystery pile!\nFable returned on the first of July. It was clearly the best model in the world for a glorious eight days... and then OpenAI came out with GPT-5.6 on the 9th of July.\nThis might not have been quite as good as Fable, but it was within spitting distance. It was definitely a Fable class model.\nThis is an important lesson for the industry at large.\nWhen you release the best model in the world, it’s going to get knocked off that pedestal pretty quickly. The competition is so fierce that you won’t get a long time at the top.\nThis means that if you market your model as world ending, to the point that a government shuts you down, it’s really bad for business!\nFable had 30 days as definitely the best model, and for 18 of those days it wasn’t available because it’d been shut down by the government.\nSo maybe step back on the world-ending marketing if you don’t want to lose revenue for 60% of the time that you’re on top!\nHere are the GPT-5.6 pelicans. They’re all pretty good now! The Luna ones are notable because they’re really cheap—the cheapest good looking pelican here is probably the one that costs 4.3 cents.\nSo despite this benchmark being utterly stupid, you can still learn quite a lot about models within the same family by comparing their prices and timing for different reasoning levels.\nAlso in July: some malicious unknown party uploaded a malicious package called mlflow-ui to the Python Package Index. Add that to the pile.\nOn July the 16th, Hugging Face announced a security incident where an autonomous agent system, source unknown, had breached Hugging Face and was poking around in places it shouldn’t.\nA few days later, on July 21st, OpenAI confessed that it was them.\nOpenAI use a training technique called Reinforcement Learning from Verifiable Rewards—it’s the same technique used by everyone else now, and is the reason we have models that are so good at coding, and mathematics, and finding security holes.\nWhile the model is being trained, you run exercises to see how good it is—and the strongest performers get their weights reinforced for the next round. It’s like an evolutionary process that you run.\nOpenAI had been running security exercises in a sandbox, and those agents had found holes in the sandbox itself, broken out, and were attacking Hugging Face to try to find ways to solve otherwise impossible problems.\n(I’ve been collecting more about this on my openai-hugging-face-incident tag.)\nNine days later, Anthropic effectively said “our models can do this as well!”. They had looked through their own training logs and found evidence that their own agents had broken containment during training—and were responsible for the PyPI package we saw earlier, among other things.\nSo now we’ve got both Anthropic and OpenAI with rogue agents running around the internet doing things that they should not be doing.\nIn August, I got one of my best pelicans yet. And it was generated on my laptop!\nThis was Qwen 3.8 27B, running on my laptop. It’s only a 17GB download.\nAdmittedly, this pelican took 21 minutes to generate. That’s because Qwen 3.8 27B defaults to running in “high” reasoning mode—a terrible default which produces great results but takes way too much time thinking about them.\nYou can dial that down and you’ll get a slightly worse pelican a lot faster.\nQwen 3.8 27B was the first time I ran a model on my laptop which felt almost competitive with what was going on on the frontier, at least in terms of Pelican SVGs (which everyone needs, of course).\nThis is an extraordinary model. If you’re going to play with any local model, this is the one that I’d start with. The things that this can do with just a 17 GB file feel impossible.\nI thought I’d have to wait five years and spend ten thousand dollars on hardware to get results even half as good as this one.\nIn August, I also started playing with game development.\nFour years ago, back in August 2022, I tweeted out an experiment where I’d used GPT-3 and the original DALL-E to write a paragraph long description of a computer game and then turn that into concept art.\nMy prompt to GPT-3 back then was:\nWrite a detailed product description of a computer game where a team of raccoons go on heists\nIn August 2026 I decided to drop just the screenshots from that tweet into a coding agent and see what it could do with them.\nHere’s what I got from Claude Fable 5 in Claude Code. It’s pretty good! It’s definitely a game, you’re a raccoon, you run around a backyard gathering treasure and avoiding guards with flashlights.\nIt didn’t feel very “heisty” though. I was thinking a heist would involve a bank or a museum...\nThen I tried the same thing in Codex Desktop using GPT-5.6 Sol Ultra, and got a massively better result. Now you’re a raccoon in a museum, rescuing two of your fellow raccoons (who have been imprisoned in that museum for some reason), then stacking up on top of each other to steal the Golden Sardine. Much more of a heist!\nThese games were fun for about one minute and 15 seconds.\nSomething I’ve realized about game development is that you can vibe-code something that looks like a computer game, and that’s easy.\nBuilding a game that’s fun, has a good gameplay loop, and is challenging and interesting and keeps people coming back for more... that’s still beyond me, and beyond any of the agents I’ve tried.\nThis ties into the Deep Blue thing. Just because we can make something that looks like a game does not mean that we are game developers.\nWe’re into September now. So much has happened this month!\nAn independent group of researchers found a message board where OpenAI agents-in-training had been illicitly communicating with each other... and it was that German language wiki I showed you earlier. The one from June.\nOpenAI had confessed to the Hugging Face thing, but now there’s this other incident which surely they should have known about from reviewing their logs. It was surprising that this took an independent group of researchers to uncover.\nAnd then a week later those same researchers found that the attack on RubyGems back in May was caused by OpenAI’s agents in training as well!\nAt this point I’m wondering how many more incidents like this there are that we haven’t found yet. Clearly this was a big problem for months before anyone figured out what was going on.\nThen just the other day, here’s the Prime Minister of Australia at the United Nations General Assembly warning that OpenAI had hacked the Australian healthcare website that I showed you earlier.\nI think that was part of the same training run as the Wiki stuff, because there were posts on that Wiki mentioning .gov.au\nwebsites and that training appeared to involve researching statistics online to answer questions in an evaluation suite.\nThis story is still coming together, but now it’s an international incident that’s been raised at the UN by a head of state!\nThis does mean we’ve got a new benchmark, probably more useful than my pelicans.\nFelonyBench.com tracks the number of felony cyberattacks from different labs. OpenAI currently lead with 11, Anthropic have 9. Google have three, which they confessed to the Wall Street Journal a couple of weeks ago. They said they had previously chosen not to disclose because the agents had stopped when they realized that they shouldn’t be doing that.\nMeta have one too. So felonies all round for the AI labs.\nHere’s our current state of the art for the pelicans. This is the GPT-6 family, which just came out.\nAstra made a fantastic pelican riding a bicycle. It’s got the legs on both sides. The frame is good.\nIt’s interesting how all of the GPT-6 models pick a similar color scheme to each other.\nGPT-6 Luna for 0.4 cents will draw you a competent-ish pelican riding a bicycle!\nClaude has caught up a little bit. Claude Fable 5.1 gave me an excellent pelican riding a bicycle—the best I’ve seen from a Claude model—but did charge me $3.30 for it.\nOpus 5.5 thought for 128,000 tokens and then gave up! It ran out of tokens before it got to the response.\nGetting back to Deep Blue. Something that’s been puzzling me this year is this: why does my job feel harder?\nI’ve got these agents that can do all of this stuff for me, and yet I’ve never worked so hard, I’ve never been so intellectually engaged with my work.\nPartly this is because I’m being a lot more ambitious with what I take on, but it’s also because all of the easy stuff is handled for me. If it’s easy, the agent will do it. Everything that’s left for me is difficult.\nThis morning I heard this quote from three-time Tour de France champion Greg LeMond:\nIt doesn’t get easier, you just get faster.\nI think that’s exactly what’s happening to us now as software engineers with coding agents.\nOne closing thing. I know you’re desperate for an update on Kākāpō breeding season.\nWe’ve reached a recovery-era high of 325 birds!\n89 new chicks have made it to this point. This is the best breeding year in a very long time.\nI heard that Claude Opus 5.5 can now do pixel art. Claude doesn’t have an image generator, but it’s very good at using JavaScript to draw animated pixels.\nSo I had it make me a Kākāpō dance party. I think this is a good celebration of the most important news of this year.\nMore recent articles\n- We're going to need default hard budget caps on pretty much everything - 3rd October 2026\n- OpenAI DevDay 2026 live blog - 29th September 2026", "summary": "What can you do with these agents to help verify their work?. If you can do it well, you’ve now got superpowers. They’re all pretty good now!. It’s pretty good!.", "categories": ["AIツール・生産性", "業務改善・介護テック"], "is_new": false, "title_ja": "2026 in LLMs (so far)", "summary_ja": "What can you do with these agents to help verify their work?. If you can do it well, you’ve now got superpowers. They’re all pretty good now!. It’s pretty good!."}, {"title": "Claude Opus 5.5, GPT-6 Sol, GPT-6 Luna, and a new price war", "url": "https://simonwillison.net/2026/Sep/22/opus-and-sol-and-luna/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-23 08:46", "description": "Yesterday was Grok 4.7 ( pelicans ) and MiMo v2.6 Flash/Pro ( more pelicans ). Today Anthropic released Claude Opus 5.5 , and around an hour later OpenAI released GPT-6 Sol and GPT-6 Luna . It's going to take a while to get a good read on all of these new models, but here are my impressions so far. GPT-6 Sol and Luna are half the price of their GPT-5.6 equivalents GPT-5.6 Luna was already my favorite model for building applications against, because it combined excellent performance with being re", "content": "Claude Opus 5.5, GPT-6 Sol, GPT-6 Luna, and a new price war\n22nd September 2026\nYesterday was Grok 4.7 (pelicans) and MiMo v2.6 Flash/Pro (more pelicans). Today Anthropic released Claude Opus 5.5, and around an hour later OpenAI released GPT-6 Sol and GPT-6 Luna. It’s going to take a while to get a good read on all of these new models, but here are my impressions so far.\nGPT-6 Sol and Luna are half the price of their GPT-5.6 equivalents\nGPT-5.6 Luna was already my favorite model for building applications against, because it combined excellent performance with being really cheap. Somehow GPT-6 Luna is half the price of that again—and GPT-6 Sol had a similar reduction compared to GPT-5.6 Sol.\nHere’s what the pricing landscape looks like today:\nNote that GPT-5.6 has a scheduled 25% price increase for November, so GPT-6 is half the price of the promotional pricing for those models.\n(With GPT-5.6 Terra priced the same as GPT-6 Sol, any remaining reasons to use Terra just evaporated.)\nIt’s hard to overstate how competitive this pricing is. Grok 4.7 priced itself at $2/$6, less than half the price of GPT-5.6 Sol, but is now equally priced to GPT-6 Sol on input and closer on output.\nAt $0.10/$0.50 GPT-6 Luna is one of the cheapest models OpenAI have ever released, beaten only by the far weaker GPT-4.1 Nano ($0.10/$0.40, April 2025) and GPT-5 Nano ($0.05/$0.40, August 2025).\nI rendered pelicans for GPT-6 Luna and for GPT-6 Sol, then I combined them all together in this comparison grid along with the GPT-5.6 pelicans. I like how you can instantly see that the 5.6 family chose bolder, brighter colors, while the 6 family is a lot more muted. I still think GPT-6 Astra on max produced the best pelican.\nClaude Opus 5.5 got a price cut too\nOpus 5.5 looks like it addresses the biggest complaints people had about Opus in terms of its communication style. Thariq Shihipar:\nOpus 5.5 is the result of your feedback.\nIt communicates clearly, it’s cheaper per token than Opus 5.0 with the intelligence of Fable 5.1 it’s very token efficient and works across every effort level.\nIt’s also meant to be better at Blender. I’m looking forward to putting it through its paces there.\nOpus 4.5, 4.6, 4.7, 4.8, and 5 all shared the same price: $5/million tokens for input and $25/million for output. 5.5 is a 20% reduction—$4/million and $20/million.\nThe price for cache reads fell 60%. That’s significant for longer agentic conversations, where 90%+ of input tokens are processed at cached token prices.\nThe new price for Opus 5.5 is the same as the price for GPT-5.6 Sol, but that was before OpenAI dropped their Sol prices by half.\nGPT-6 Astra and Claude Fable 5.1 are both priced at $10/million input and $50/million output. The price war currently affects the next tier of models below that.\nAnthropic say that Sonnet 5.5 and Haiku 5.5 are coming soon. It’s going to be interesting to see if Haiku can regain its price competitiveness at the lower end, given current Haiku 4.5 is $1/$5 while the latest GPT-6 Luna is one tenth of that price at $0.10/$0.50.\nClaude Opus 5.5 max over-thinks to the point of breaking\nIn a first for my \"Generate an SVG of a pelican riding a bicycle\" test, Claude Opus 5.5 at \"max\" thinking level failed to return a response!\nIt started by calling this “a classic test request”, and then thought really, really hard about what it was doing:\nThis is a classic test request, so I want to plan out a well-composed pelican with its distinctive beak and pouch riding a bicycle with proper wheels, frame, and pedals, set against a simple sky and ground backdrop. [...]\nVerifying the shin length checks out at roughly 95.2, close enough. Now I’m working out the near leg path from hip to knee to ankle, then sketching the foot shape resting on the pedal — outlining the heel, toe tips, and sole contour with a path using lines and curves to sit naturally on the pedal surface around y=478-494. [...]\nI like the fish sticking prominently out of the basket with the pelican eyeing it as a fun detail worth keeping. I’m also confirming the eye placement near the bill base matches typical pelican anatomy, and considering giving it a slightly happier expression. [...]\nThe far leg reads correctly as passing behind the frame, so I’m moving on to check the chainring teeth and confirm layer ordering—the far crank arm should be mostly hidden by the seat tube and chainring. I’m settling on the final SVG’s width and height attributes alongside the viewBox to ensure proper scaling, noting there’s no text so no font-family is needed. [...]\nI was so excited to see this pelican... but then it stopped. Opus 5.5 has a 128,000 maximum output token limit (as do the other Claude models), and it hit that while it was still reasoning about the SVG!\nI tried a second time and got the same result. This makes me suspect that “max” is effectively useless—if it over-thinks to breaking point on a stupid SVG prompt I don’t trust it not to do the same for more interesting work.\n(Those two failures each cost me $2.56 and took nearly 20 minutes.)\nFable 5.1 on “max” didn’t over-think and did give me the best pelican I’ve seen from any Anthropic model.\nHere are the Opus 5.5 pelicans, excluding 5.5 max.\nI also built this comparison grid comparing them with pelicans by Opus 5, Fable 5.1, and Sonnet 5:\nComparing different model vendors by how well they draw a pelican riding a bicycle may not make much sense now (if it ever did), but I’m still finding value in using them for comparisons of the same model families at different reasoning levels.\nI’m now using GPT-6 Sol and Claude Opus 5.5 as my default models in Codex and Claude Code. I’ve upgraded the Datasette Agent demo at agent.datasette.io to use GPT-6 Luna, and it seems to be fast and competent at both SQL queries and building HTML and JavaScript for Datasette Apps.\nMore recent articles\n- We're going to need default hard budget caps on pretty much everything - 3rd October 2026\n- OpenAI DevDay 2026 live blog - 29th September 2026\n- 2026 in LLMs (so far) - 27th September 2026", "summary": "Today Anthropic released Claude Opus 5.5, and around an hour later OpenAI released GPT-6 Sol and GPT-6 Luna. Somehow GPT-6 Luna is half the price of that again—and GPT-6 Sol had a similar reduction compared to GPT-5.6 Sol. I rendered pelicans for GPT-6 Luna and for GPT-6 Sol, then I combined them all together in this comparison grid along with the GPT-5.6 pelicans. The new price for Opus 5.5 is the same as the price for GPT-5.6 Sol, but that was before OpenAI dropped their Sol prices by half.", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "Claude Opus 5.5, GPT-6 Sol, GPT-6 Luna, and a new price war", "summary_ja": "Today Anthropic released Claude Opus 5.5, and around an hour later OpenAI released GPT-6 Sol and GPT-6 Luna. Somehow GPT-6 Luna is half the price of that again—and GPT-6 Sol had a similar reduction compared to GPT-5.6 Sol. I rendered pelicans for GPT-6 Luna and for GPT-6 Sol, then I combined them all together in this comparison grid along with the GPT-5.6 pelicans. The new price for Opus 5.5 is the same as the price for GPT-5.6 Sol, but that was before OpenAI dropped their Sol prices by half."}, {"title": "How To Deal With Regret ( 3 Stoic Strategies to Live Free)", "url": "https://dailystoic.com/how-to-deal-with-regret-3-stoic-strategies-to-live-free/", "source": "Daily Stoic", "lang": "en", "content_type": "lifestyle", "category_hint": "メンタル・哲学", "published": "2023-08-24 01:48", "description": "What Is Regret? “Two elements must therefore be rooted out once for all, – the fear of future suffering, and the recollection of past suffering; since the latter no longer concerns me, and the former concerns me not yet.” – Seneca, from Letters from a Stoic After a long day at work and terrible traffic, […] The post How To Deal With Regret ( 3 Stoic Strategies to Live Free) appeared first on Daily Stoic .", "content": "What Is Regret?\n“Two elements must therefore be rooted out once for all, – the fear of future suffering, and the recollection of past suffering; since the latter no longer concerns me, and the former concerns me not yet.” – Seneca, from Letters from a Stoic\nAfter a long day at work and terrible traffic, you finally make it home. The stress has taken its toll, and you’re exhausted, bored, and frustrated with the day’s events all at once. You walk into your kitchen to find a heaping pile of dishes–something you asked your spouse to take care of this morning! Yet, they’re relaxing in front of the TV as if nothing’s wrong.\nYou feel the anger rising up, and unable to control yourself, you yell at your spouse. You don’t hold back. You’re out to make a point, to prove that what happened is a really big deal.\nYour spouse is frightened and embarrassed. They’re worried–you’ve never yelled at them like this before. They were going to do the dishes later, but you never gave them that opportunity. The day’s been long for them too, yet you didn’t care. They just wanted to have a nice night with you, but now that’s ruined.\nLater that night, you finally start to understand what losing your temper has cost you. You know you shouldn’t have said what you said. You should have been more considerate. You should have acted differently–you regret your choices.\nMaybe for you it wasn’t a pile of dishes that set you off. Maybe it was your kids using markers on the wall. Or your boss dumping that report on you before your vacation. Regardless of the scenario, we’ve all lost it at some point, and we’ve all felt the pang of regret.\nThe Stoics would define regret as the moment when past events consume our present lives. When we dwell over things we have no control over. When we resist our fate. Marcus Aurelius argued that we must be “satisfied with what [we] have, and accept the present–all of it.” Regret is the contrary–when we’re not satisfied with what we have, when we reject what we’ve been given.\nSeneca said “we often suffer more in imagination than in reality.” He was saying that regret is no more than an emotion of our imagination. We believe that had we said something (or held our tongue), had we acted differently, the outcome would have been different.\nMarcus Aurelius carried a similar mindset, and provided a solution to this problem. “External things are not the problem. It is your assessment of them. Which you can erase right now.”\nLet’s take another look at that “fight” you had with your spouse. Your regrets are not about the actual dishes or your spouse–it’s about your perception of expectations. You expected your spouse to have the dishes done when you got home. So you believe it should have been different, and had it been different, you would be better off.\nSo does that mean it’s your spouse’s fault? Maybe for leaving the dishes in the sink. But certainly not for your overreaction. And definitely not for the regret you felt later that night. Regret is an internal problem, to be both diagnosed and treated by ourselves. We must learn to look past these “self-focused emotions” and master our feelings of regret. This post aims to help you understand your emotions, use the past to your advantage, and conquer your biggest regrets.\nWhy Do I Feel Regret?\n“Life is very short and anxious for those who forget the past, neglect the present, and fear the future” – Seneca\nWe’ve all told ourselves, “no regrets.” There are countless memes, inspirational quotes, and videos reminding us online. Poets, singers, painters, and writers have been creating art about it for millenia. We’ve practically been conditioned to live by it.\nBut no matter how many times we read about it, sing along to a song about it, or tell ourselves not to, we all have something we regret. We all have that nagging feeling that comes back to us. That hits us exactly when we thought we forgot about that time, that place, those people. It comes back at the very worst time. It sucks. It hurts.\nThe power of regret is not to be understated. Bestselling author and founder of the American Regret Project Daniel Pink found that 82 percent of Americans experience regret at least occasionally. Pink describes regret as “an indispensable emotion,” yet also claims it can be “a positive instrument for improving your life.”\nIf we truly want to improve our life, we can’t run away from these negative feelings. We can’t hide them. But should we just accept this despair? Should we just come to terms living with regret?\nThis is what the great writer Samuel Johnson must have been wondering near the end of 1775. With 1776 on the horizon, Johnson wrote in his diary:\n“When I look back on resolutions of improvement and amendment which have year after year been made and broken, either by negligence, forgetfulness, vicious idleness, casual interruption, or morbid infirmity; when I find that so much of my life has been stolen unprofitably away, and that I can descry by retrospection scarcely a few single days properly and vigorously employed, why do I yet try to resolve again? I try because reformation is necessary and despair is criminal.”\nJohnson came to terms with his past, but not with his regret. He chose to reflect upon his hardships in order to better himself, to avoid making those same mistakes in the future. He chose to fight regret–not to wallow in it.\nIf there’s one thing we can learn from Johnson, it must be that experiencing regret is inevitable–but our actions and our mindset are not. Thus, the question is not ‘Why do I feel regret?’, but rather ‘How do I deal with it?’ ‘How do I move on?’ ‘How can I make myself better because of this?’ In order to answer these questions, the Stoics practiced the following strategies to help them build their mental toughness and resilience–starting with examining what they controlled.\nFocus On What You Control\n“Every event has two handles, one by which it can be carried, and one by which it can’t. If your brother does you wrong, don’t grab it by his wronging, because this is the handle incapable of lifting it. Instead, use the other—that he is your brother, that you were raised together, and then you will have hold of the handle that carries.” – Epictetus\nOne of the most important practices in Stoic philosophy, which was introduced by Epictetus, is determining what we control and what we don’t. What we have power over and what we don’t. What we can change and what we can’t.\nThere are two ways in which we can look at the past–two handles we can grab, to use Epictetus’ quote. The first handle forces us to perceive the past as an inevitable experience, destined to wrong and hurt us from the beginning. The opposite handle, however, allows us to extract the good parts, and use our experiences to benefit ourselves.\nIn looking at past decisions, we must grab them by the latter handle. We must understand that what happened, happened. We must see that we can’t change the past, no matter how much it hurt us or someone else. So what good does regret do?\nAbsolutely nothing, as Holocaust survivor and author Dr. Edith Eger explained to Ryan Holiday on an episode of The Daily Stoic Podcast. Ryan was discussing a relationship he regretted messing up, and Dr. Eger offered him one gift that would solve the guilt right then. “I give you a sentence,” she said, “One sentence—if I knew then what I know now, I would have done things differently.” That’s the end of that, she said. “Guilt is in the past, and the one thing you cannot change is the past.”\nAs a society we’ve become disillusioned by the idea of what we control. We all believe we have some control over the outcome of whatever we encounter. We all believe that if we keep thinking about what happened, somehow we’ll be able to change what happened.\nYet, we must come to terms with the fact that some things simply can’t be changed. We must understand that some things are in our control and some that aren’t. Say, if you regret getting a haircut, you’re in control. You can style it, cover it, or just wait for it to grow out again–you command your situation. But if you regret cursing out your boss before quitting your job, you’re not in control–you can’t take back your words.\nAs Marcus Aurelius wrote to himself—and by extension, to us:\n“Remind yourself that past and future have no power over you. Only the present—and even that can be minimized. Just mark off its limits. And if your mind tries to claim that it can’t hold out against that…well, then, heap shame upon it.”\nThe past is done. We can’t linger in our insecurities. We can’t ponder over our regrets. We must learn that what happened is out of our control now–we must let go.\n“Letting go is a necessary, if sometimes heart-wrenching gateway to genuine transformation,” is how the always-zen basketball coach Phil Jackson put it. The Stoics called it the “art of acquiescence”—the giving up and the assenting of whatever things are so that they can be what they are to become.\nIn one way, regret is just wishing things went the way we wanted them to. But by letting things become what they must, we are less likely to regret what we’ve done. In accepting that some things are simply out of our control, we are less likely to wish for a different outcome.\nThe past is something we can’t control anymore. We can’t change what we said, what we did, or how we felt.\nWe can, however, control the present. We control how we grow from our experiences. We control how we respond to adversity. We control how we can use our regret to our advantage.\nWe control how we act right now. We must.\nTo learn more on this topic, check out “You Control How You Play”, where Ryan speaks to the Cleveland Browns about the importance of perspective, staying motivated, and knowing what they control.\nLove Your Fate\n“A blazing fire makes flame and brightness out of everything that is thrown into it.” – Marcus Aurelius\nAfter we sort out what we control, we must find how to respond–regardless if we control what’s happening or not. We must determine how we handle ourselves. We must determine how we overcome obstacles. We must determine how to move forward.\nIn the first book of his Discourses, Epictetus envisions himself being executed by Roman guards, his life out of his control. In a display of tranquility and wisdom, he lays out his thoughts:\n“I must die. But must I die bawling? I must be put in chains–but moaning and groaning too? I must be exiled; but is there anything to keep me from going with a smile, calm and self-composed.”\nThough the term was first coined by German philosopher Friedrich Nietzsche, the practice of amor fati–loving your fate–dates back to Epictetus and the Stoics. Often by means of reflection and meditation, the Stoics would use this practice to settle past trauma and help them achieve a greater sense of inner peace. “The Fates guide the person who accepts them,” Cleanthes said, “and hinder the person who resists them.”\nAmor fati is more than just understanding what happens to us. It’s understanding that our perception doesn’t always have to be negative. It’s understanding that accepting the present circumstances will make us better. It’s understanding that we must be grateful for the cloudy weather sometimes–and that there’s always a way through the storm.\nWe all face hardships. We all get stuck in traffic. We all deal with slow WiFi, or bad cell service, right when we need to send that important message. As rational people, we tend to think that these hardships were made specifically for us. That the world is out to get us. That we can’t win.\nBut this couldn’t be farther from the truth. Everybody goes through obstacles. Everybody gets tripped up sometimes. As we talked about in the first section, we can’t control some things in life. And these hardships, no matter how hard we try, will always be out of our control.\nWhen we accept what happens to us, after understanding that certain things— particularly bad things—are outside our control, we are left with this: loving whatever happens to us and facing it with unfailing cheerfulness and strength. As bestselling author Robert Greene (48 Laws of Power, Mastery) put it, we need to, “accept the fact that all events occur for a reason, and that it is within your capacity to see this reason as positive.”\nMarcus Aurelius portrays this concept perfectly in Meditations through the image of an artisans shop:\n“There are thorns on the path, then keep away! Enough said. Why ponder the existence of nuisance? Such thinking would make you a laughing-stock to the true student of Nature, just as a carpenter or cobbler would laugh if you pointed out the sawdust and chips on the floors of their shops. Yet while those shopkeepers have dustbins for disposal, Nature has no need of them.”\nWhy get tripped up by the thorns? Why ponder over the sawdust on your floor? It’s simply part of nature! As long as you have the capability to see them, you have the capability to move past them.\nIn practicing amor fati, we’re also less likely to have regrets in the future. By embracing the challenges that lay ahead of us, we’re less likely to regret the decisions we make to conquer them – regardless of the outcome. We’re able to tackle the future with confidence, conviction, courage, and so much more.\nAmor fati is more than just a mindset–it’s a way of life. Incorporating amor fati into your life will take time, effort, and sacrifices that probably won’t feel comfortable. But we must. We must move past this existential angst. We must move forward, away from our regret, and towards our future.\nLove what’s happened to you. Love who you’ve become, and how much you’ve changed. Love your fate–amor fati.\nCarry this reminder with you every day with our amor fati medallion from the Daily Stoic Store. Carry this in your pocket as a reminder to treat each and every moment–no matter how challenging–as something to be embraced, not avoided.\nLook Ahead\n“We should project our thoughts ahead of us at every turn and have in mind every possible eventuality instead of only the usual course of action.” – Seneca\nBefore Ryan Holiday gets on stage for a big speech, he runs through everything that could go wrong: trouble with the microphone, the clicker not advancing a slide, the audience not reacting as anticipated. He is able to see potential problems before they arise, and come up with solutions before anything actually happens. He is able to prevent himself from being overwhelmed if a problem arises by being prepared.\n“Rehearse them in your mind: exile, torture, war, shipwreck,” Seneca said. “All the terms of our human lot should be before our eyes.”\nThis practice, called premeditatio malorum, is one of the oldest and most common practices in Stoic philosophy. It literally means the “premeditation of evils.” The Stoics used this practice to help them prepare for life’s inevitable hardships, and remain calm and confident in turbulent times.\nThe world isn’t fair. We all know this. We don’t always get what is ours, even if we’ve earned it. We don’t always win, even if we play hard.\nBut we can’t be surprised when we don’t win. If it comes as a constant surprise each and every time something unexpected occurs, you’re not only going to be miserable whenever you attempt something big, you’re going to have a much harder time accepting it and moving on to attempts two, three, and four. You’re going to have a much harder time living in the present instead of lingering in the past. You’re going to have a much harder time trusting your instincts–and fighting regret.\nThere’s perhaps no better personification of premeditatio malorum than the great Booker T. Washington. Washington ran a school with 1,500 students, all while advising politicians and activists and traveling across the country to give speeches. But how? How did he maintain this lifestyle, and with such striking success?\n“When I begin my work in the morning, I expect to have a successful an
