// ── Data ─────────────────────────────────────────────────────────
const ARTICLES = [{"title": "大義についた女性たち〈コラム一草一味〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/issoichimi/45803", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-13 10:00", "description": "学校法人敬心学園 参与 蟻塚昌克 歴史の分岐点では、大きな流れや不条理を前にしてどうすることもできず、時に人生が翻弄ほんろうされることがある。 その多くはこどもたちだ。第２次大戦後の日本には、戦災孤児だけではなく、米軍関係者との間に生まれた混血児と呼ばれるこどもたちがいた。こうした事情は朝鮮戦争の戦禍を経験した隣国にも共通しており、くしくもこの時代に両国で日本人女性がこどもたちの保護に明け暮れている。 父親が朝鮮総督府の役人であった田内千鶴子は、１９３０年に朝鮮半島南西部の木浦市で孤児救済に取り組んでいた伊致浩と結婚。木浦共生園と名付けた苫屋で、こどもたちの世話に寝食を忘れて没頭するようになる。同時期、英国で日本外交官夫人の澤田美喜はロンドンの児童養護施設を訪れて、この仕事こそが生涯の自分の役割と確信を深めるようになる。 終戦を迎えると、田内は混乱と窮乏の中で、さらに多くのこどもの世話に当たる。日本に戻った澤田は、時がたつにつれて、生まれた肌の色が違う乳児が遺棄される事態を見聞。１９４８年に神奈川県大磯町に混血児の乳児院、エリザベスサンダースホームを開く。 ２人の活動は常に困難が付きま", "content": "大義についた女性たち〈コラム一草一味〉\n2026年08月13日 福祉新聞編集部学校法人敬心学園 参与 蟻塚昌克\n歴史の分岐点では、大きな流れや不条理を前にしてどうすることもできず、時に人生が翻弄ほんろうされることがある。\nその多くはこどもたちだ。第２次大戦後の日本には、戦災孤児だけではなく、米軍関係者との間に生まれた混血児と呼ばれるこどもたちがいた。こうした事情は朝鮮戦争の戦禍を経験した隣国にも共通しており、くしくもこの時代に両国で日本人女性がこどもたちの保護に明け暮れている。\n父親が朝鮮総督府の役人であった田内千鶴子は、１９３０年に朝鮮半島南西部の木浦市で孤児救済に取り組んでいた伊致浩と結婚。木浦共生園と名付けた苫屋で、こどもたちの世話に寝食を忘れて没頭するようになる。同時期、英国で日本外交官夫人の澤田美喜はロンドンの児童養護施設を訪れて、この仕事こそが生涯の自分の役割と確信を深めるようになる。\n終戦を迎えると、田内は混乱と窮乏の中で、さらに多くのこどもの世話に当たる。日本に戻った澤田は、時がたつにつれて、生まれた肌の色が違う乳児が遺棄される事態を見聞。１９４８年に神奈川県大磯町に混血児の乳児院、エリザベスサンダースホームを開く。\n２人の活動は常に困難が付きまとい、苦労の連続であった。中でも最大のものは、当時の緊迫した政治情勢だ。朝鮮戦争下で、田内の夫はこどもたちの食料調達に出掛けたまま行方不明に。北朝鮮軍からはスパイの嫌疑をかけられ、韓国軍からは共生園の名称から共産主義のシンパとの疑義を持たれる。澤田は渡米して、占領下の日本で米軍関係者の性暴力や不道徳により何が起きているのか、各地を歩いて訴える。しかし、その活動は、連合国軍総司令部（ＧＨＱ）には占領政策への痛烈な批判であり、澤田と周辺は好ましからざる人物たちとしてＧＨＱに監視される。\nやがて田内は３０００人のこどもを育て上げ、韓国孤児のオモニ（母）と呼ばれる。澤田の児童福祉施設からは、６０年間に１６００人が旅立っていく。\n２人の生き方は、あえて歴史の流れに抗あらがい、人としての道理を尽くしたものとなる。まさに大義につくとは、このことだろう。追悼の８月。社会福祉もまた関係者に振り返りを求めている。", "summary": "第２次大戦後の日本には、戦災孤児だけではなく、米軍関係者との間に生まれた混血児と呼ばれるこどもたちがいた。木浦共生園と名付けた苫屋で、こどもたちの世話に寝食を忘れて没頭するようになる。朝鮮戦争下で、田内の夫はこどもたちの食料調達に出掛けたまま行方不明に。やがて田内は３０００人のこどもを育て上げ、韓国孤児のオモニ（母）と呼ばれる。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": true}, {"title": "By the time a resident falls, we’ve already missed something", "url": "https://www.mcknightsseniorliving.com/home/columns/marketplace-columns/by-the-time-a-resident-falls-weve-already-missed-something/", "source": "McKnight's Senior Living", "lang": "en", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-13 08:00", "description": "We have spent years getting better at responding to falls. It is time to get serious about what we can do to prevent them from happening in the first place.", "content": "When I became a nurse, identifying which residents were at the highest risk for falls meant working through a paper-based scoring methodology that involved multiple factors. You gathered what data you could, trended it as best you could, and when a fall happened, you made your best guess about why it occurred and chose the intervention that seemed most logical.\nMost of the time, you were working based on your best assumption.\nThirty years later, the industry has gotten better at responding to falls. Documentation is more thorough. Root cause analysis is more structured. Care plans get updated faster.\nAnd yet the fundamental orientation has not changed. We still treat the fall as the event, even though it is the ending of a story we should have been reading days earlier.\nNew data from Teton’s analysis of more than 2,000 confirmed falls across care settings in the United States, Denmark, the United Kingdom and Switzerland puts numbers to something many care providers have long observed:\n- A transition at 3 a.m. is 63% more likely to result in a fall than the same movement in the afternoon\n- A resident who has been lying in bed for more than an hour before getting up is 2.4 times more likely to fall than one who has been moving regularly\n- Residents who have fallen in the last three months are five times more likely to fall again within 30 days\nNone of those findings are shocking to experienced care providers, but what is striking is what the data shows about the nights leading up to a fall. Sleep disruption, specifically fragmentation of a resident’s regular sleep pattern, increases fall risk by up to two times. A changing respiration rate during sleep is an indicator of a change from the resident’s baseline, which could warrant a call.\nThose are not signs that appear at the moment of the fall. They appear days before, quietly, in the hours when no one is in the room.\nThis is a visibility problem, not a knowledge problem, and not a commitment problem. A resident whose sleep pattern has started to fragment over four consecutive nights, who is waking more frequently, whose respiration has shifted from their baseline, is telling us something. We have not had a reliable way to hear it.\nThe industry has invested heavily in fall detection, in systems that alert care teams when a fall is occurring or has just occurred. That matters. But detection is not prevention.\nBy the time an alert fires because a resident is on the floor, we already are in response mode. The question worth asking is whether we can move upstream, whether we can build care models that treat changes in sleep, respiration and nighttime movement as clinical signal rather than background noise.\nRethinking what monitoring is for is where that starts. The goal is not to know that a fall happened. The goal is to know, three days before it happens, that this resident’s risk has increased and that someone should take a closer look. Reaching that standard requires a different kind of information than most communities are currently collecting.\nA fall is the single biggest concern in senior living, and rightly so. For many residents, a serious fall is not just an acute safety event. It is a turning point. Mobility declines. Confidence declines. Independence declines. The intervention that matters most is the one that happens before any of that begins.\nThink about what that means at the bedside. If a resident has been deemed safe to get up on their own, no alarm is needed and none is set. But if that resident is at risk, you can have monitoring sensitive enough that the moment they move from lying to sitting, the care team knows. Staff can be in that room before the resident ever tries to stand.\nSo many systems on the market today alert you after someone is already on the floor. That is detection. What I am talking about is getting there before an incident happens, and for a resident, the difference between those two things can be the difference between recovering and never fully recovering.\nWe have spent years getting better at responding to falls. It is time to get serious about what we can do to prevent them from happening in the first place.\nKim Elliott is chief clinical adviser at Teton and former chief nursing officer at Brookdale Senior Living. She is a 2019 McKnight’s Women of Distinction Hall of Honor inductee.\nThe opinions expressed in each McKnight’s Senior Living marketplace column are those of the author and are not necessarily those of McKnight’s Senior Living.\nHave a column idea? See our submission guidelines here.", "summary": "Sleep disruption, specifically fragmentation of a resident’s regular sleep pattern, increases fall risk by up to two times. Those are not signs that appear at the moment of the fall. The industry has invested heavily in fall detection, in systems that alert care teams when a fall is occurring or has just occurred. The goal is not to know that a fall happened.", "categories": ["施設運営・経営", "業務改善・介護テック"], "is_new": true, "title_ja": "住人が倒れる頃にはもう何かを見逃している", "summary_ja": "睡眠の中断、特に居住者の通常の睡眠パターンの断片化は、転倒のリスクを最大 2 倍増加させます。それらは転倒の瞬間に現れる兆候ではありません。業界は、転倒の検出、つまり転倒が発生したとき、または転倒したばかりのときにケアチームに警告するシステムに多額の投資を行ってきました。目標は、転倒が起こったことを知らせないことです。"}, {"title": "From Dining to Marketing, Active Adult Operators Navigate Shifting Trends", "url": "https://seniorhousingnews.com/2026/08/12/from-dining-to-marketing-active-adult-operators-navigate-shifting-trends/", "source": "Senior Housing News", "lang": "en", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-13 06:46", "description": "While the senior living industry is preparing for the baby boomers, active adult operators already are looking even farther down the road. With a resident base that is usually in their low 70s, active adult operators have for years grappled with the needs and desires of the boomers. Some are even thinking about Gen X, […] The post From Dining to Marketing, Active Adult Operators Navigate Shifting Trends appeared first on Senior Housing News .", "content": "While the senior living industry is preparing for the baby boomers, active adult operators already are looking even farther down the road.\nWith a resident base that is usually in their low 70s, active adult operators have for years grappled with the needs and desires of the boomers. Some are even thinking about Gen X, not as so-called adult children but as potential future residents with the oldest Gen X-er now 61 years old.\nActive adult operators must navigate a fine line between multifamily and independent living, which is why they are in 2026 debating the role of the product type in everything from whether to offer food to accommodating older adults still working.\nTo go with, or in some cases go against, these trends, operators have to adjust their activities and lifestyle programming, such as Columbus, Ohio-based Treplus Communities and Charleston, South Carolina-based Greystar.\n“Now that active adult has been around and established … we have a much more in-tune renter,” Nathan Wetmore, senior director of real estate for active adult at Greystar, said. “Five years ago, you would never think our prospects would look at a conventional property, and while it’s still not desirable to them, they’re aware of it.”\nWetmore, Jane Arthur Roslovic, CEO of Treplus Communities and Anthony Polito, director of operations at Vitality Senior Living, all spoke about the top trends in active adult at the recent Senior Housing News TRENDS Conference in Chicago.\nDishing on dining\nMeal or no meal? It’s a question that active adult operators are still openly debating. On one hand, some operators say offering food, especially in a setting with other unit types, can enhance the active adult value proposition. Others who are more critical of the practice think offering a food component only adds to operating costs.\n“What happens when you bring in food services is that, now, all of a sudden, your operating costs have increased, and therefore it impacts the cost for the resident ,” Treplus’ Roslovic said.\nSome of Treplus’ residents still work jobs to make ends meet and don’t desire to pay for additional services they might not even use at the end of the day.\nBrentwood, Tennessee-based Vitality Living takes a different view, although with a different product type. Unlike Treplus, Vitality blends independent living and active adult on the same campus, and the operator can use that scale to extend dining services into active adult. The company currently offers dining services in five of its active adult and independent living communities.\nActive adult residents do desire access to food services, and it is in the interest of active adult operators to help facilitate those wants. For example, operators can make it easier for residents to order GrubHub or DoorDash like some hotels already do.\n“People want convenience, so I think that being able to provide that as an additional amenity, but still offer the autonomy where it’s not locked-in like in independent living,” Polito said.\nGreystar is finding ways to have a happy medium between both practices by offering catering services on site. However, it’s both market- and community- specific, as the operator has a wide variety of offerings with 163 communities across the country and an average resident age of 72. In the end, Wetmore said, it all comes down to cost and what both the operator and resident are ready and willing to pay for.\nBoosting active adult awareness\nWhat is active adult? Many prospects still don’t know, and the product type’s national penetration rate is still relatively low.. That creates more room for education.\nActive adult operators have not been focusing on changing service offerings either, and instead focuses on connecting residents with services outside of the communities themselves.\nWhile there are challenges with incorporating new programming ideas, Greystar’s size acts as a benefit, and employees can share best practices and new ideas with each other to help raise the ride that lifts all of the company’s boats.\n“It’s not about what we’re offering. There’s so much in our world that’s becoming convenient … But making people aware of that, having them come in, speak to our residents and give them options,” Wetmore said.\nTo help highlight these offerings, operators are embracing marketing strategies centered on empathy and the experiences of family caregivers. Greystar posts long- and short-form videos on platforms like Instagram to achieve that goal.\nTreplus is boosting direct resident testimonials to push back against AI usage in marketing materials and showcase authenticity. The company posts on several platforms and in several formats and its residents and prospects are active on platforms such as Instagram and TikTok.\n“It’s almost our version, in this world today, of word of mouth,” Roslovic said. “Authenticity is key with this demographic.”\nLeaders with Vitality Living have also posted short-form marketing content – informed by focus groups — to platforms like Instagram and TikTok to showcase the independent lifestyle and value of its communities.\n“People are much more apt to believe in the video of the event at the community or the resident referral saying, ‘I love living here,’” Polito said. “Just being as authentic and organic as possible, I think that’s the magic sauce.”", "summary": "It’s a question that active adult operators are still openly debating. The company currently offers dining services in five of its active adult and independent living communities. Active adult residents do desire access to food services, and it is in the interest of active adult operators to help facilitate those wants. Boosting active adult awareness\nWhat is active adult?.", "categories": ["施設運営・経営", "業務改善・介護テック"], "is_new": true, "title_ja": "ダイニングからマーケティングまで、現役の社会人オペレーターが移り変わるトレンドをナビゲート", "summary_ja": "これは、現役の成人オペレーターたちが今も公然と議論している問題だ。同社は現在、5 つのアクティブな成人および自立生活コミュニティでダイニング サービスを提供しています。活動的な成人居住者は食事サービスへのアクセスを望んでおり、これらの欲求を促進するのを支援することは活動的な成人事業者の利益となります。アクティブな大人の意識を高める\nアクティブな大人とは？"}, {"title": "Graduate medical education should matter to the nursing home sector", "url": "https://www.mcknights.com/blogs/whats-up-wassdoc/graduate-medical-education-should-matter-to-the-nursing-home-sector/", "source": "McKnight's Long-Term Care News", "lang": "en", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-13 05:07", "description": "The physician workforce with the expertise to effectively manage the highly complex patients in long-term care remains insufficient.", "content": "The Medicare Trust Fund spends more than $21 billion a year subsidizing physician training, yet relatively little of that training adequately prepares physicians to care for medically complex older adults.\nNursing homes are increasingly held financially accountable for physician-driven decisions, while the healthcare system systematically underinvests in training physicians to competently care for older adults.\nPhysicians are ultimately responsible for inappropriately prescribing antipsychotic medications to nursing home residents. Physicians write the orders that unnecessarily send residents to the emergency room or hospital. Facilities are penalized for these decisions. With the engagement of the nursing home industry in value-based care and programs such as I-SNPs, physicians’ decisions will continue to directly impact a nursing facility’s financial success.\nI’ve advocated many times for the nursing home industry to support the education and training of competent medical directors. It would also behoove the industry to devote lobbying efforts to reforming graduate medical education (GME). The existing physician workforce is inadequately prepared to address the needs of medically complex older adults.\nPrior to 1965, physicians got room and board when they did their internship. Many entered general practice immediately afterward because they could not afford additional training. When the Medicare program came about in 1965, the American Medical Association lobbied for the government to subsidize GME. Their logic was that fifty years hence the country would need a physician workforce to care for the upcoming explosion of Medicare beneficiaries.\nImproving training & reimbursement\nUnfortunately, the result of this government subsidy has been the progressive erosion of both primary care and geriatrics. Nowhere is this felt more than in post-acute and long-term care.\nWhile nurse practitioners and physician associates are invaluable members of a team-based approach to care, the physician workforce with the expertise and critical thinking skills necessary to effectively manage the highly complex patient population in post-acute and long-term care remains insufficient.\nThe federal government continues to try to fix this problem with incentive programs, while completely ignoring the fact that they are not addressing the root cause: an inadequately trained and under-supported workforce. I would offer a practical suggestion that could make a substantial difference.\nThe federal government spends more than $21 billion a year to subsidize GME. They could immediately attach meaningful accountability standards to this funding. All GME funding should be contingent on assuring that every physician coming out of government-subsidized training programs is competent in geriatric medicine. This would fundamentally improve physician training in geriatrics and long-term care medicine. Unfortunately, training alone is not the problem. Financial incentives also shape workforce decisions.\nThis is an issue that was made worse in 1992 when the Federal Government gave the keys to physician reimbursement to the AMA. The government delegated an AMA committee called the RVS Update Committee (RUC). This committee has always predominantly been made up of specialists, and 32 years hence, pediatricians, geriatricians and all primary care physicians find themselves among the lowest reimbursed physicians in medicine.\nIn the meantime, the AMA’s revenue from its monopoly on coding and reimbursement is in excess of $100 million per year. The result is a reimbursement structure that undervalues the physicians most needed to care for medically complex older adults.\nMedicare spends more than $1 trillion per year. Competence in geriatric medicine could substantially reduce unnecessary spending, hospitalizations, polypharmacy and avoidable complications throughout the healthcare system. The financial savings to taxpayers could be significant.\nCollaborating to improve care\nFor the past few years, I’ve made the case that physicians practicing in post-acute and long-term care share in the pain that many in the nursing home industry feel. Instead of fighting one another over a few crumbs left by the AMA, pharma and the health insurance industry, we ought to be working together to assure our mutual survival. The vulnerable older adults whom we all care for would benefit from such a collaboration.\nI call on the nursing home industry to sit down with the physicians, nurse practitioners, physician associates and pharmacists who provide the medical care in our nation’s nursing homes.\nLet’s join forces in lobbying Congress to bring accountability to GME funding and pragmatism to how Medicare dollars are spent supporting the healthcare professionals responsible for caring for the medically complex individuals who live in the post-acute and long-term care continuum.\nMichael Wasserman, MD, CMD, is a geriatrician, certified medical director and former nursing home industry and quality improvement executive. The views expressed here are his own.\nThe opinions expressed in McKnight’s Long-Term Care News guest submissions are the author’s and are not necessarily those of McKnight’s Long-Term Care News or its editors.\nHave a column idea? See our submission guidelines here.", "summary": "Nowhere is this felt more than in post-acute and long-term care. This would fundamentally improve physician training in geriatrics and long-term care medicine. Collaborating to improve care\nFor the past few years, I’ve made the case that physicians practicing in post-acute and long-term care share in the pain that many in the nursing home industry feel. I call on the nursing home industry to sit down with the physicians, nurse practitioners, physician associates and pharmacists who provide the medical care in our nation’s nursing homes.", "categories": ["医療・健康", "施設運営・経営"], "is_new": true, "title_ja": "大学院医学教育は老人ホーム部門にとって重要であるべきである", "summary_ja": "急性期後のケアや長期ケアほどこれが感じられる場所はありません。これにより、高齢者医学および長期医療における医師の研修が根本的に改善されるでしょう。ケアの向上に向けて協力する\nここ数年、私は急性期後および長期ケアに携わる医師たちも、老人ホーム業界の多くの人々が感じている痛みを共有していると主張してきました。私は老人ホーム業界に対し、我が国の老人ホームで医療を提供する医師、看護師、医師助手、薬剤師の意見を聞くよう求めます。"}, {"title": "Sagora Senior Living Invests in Memory Care Training to Boost Empathy, Care Coordination", "url": "https://seniorhousingnews.com/2026/08/12/sagora-senior-living-invests-in-memory-care-training-to-boost-empathy-care-coordination/", "source": "Senior Housing News", "lang": "en", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-13 04:58", "description": "Sagora Senior Living is investing in new training for staff within its Pathways memory care program in an effort to better educate staff, families and the public about dementia and cognitive change. The operator launched the “Dementia Live” program last month. It uses immersive experiences in training modules that are built to create empathy and […] The post Sagora Senior Living Invests in Memory Care Training to Boost Empathy, Care Coordination appeared first on Senior Housing News .", "content": "Sagora Senior Living is investing in new training for staff within its Pathways memory care program in an effort to better educate staff, families and the public about dementia and cognitive change.\nThe operator launched the “Dementia Live” program last month. It uses immersive experiences in training modules that are built to create empathy and improve care coordination for older adults living with dementia in memory care communities.\nThe company is training new team members on a weekly basis. The company also is holding training and educational events for families of senior living residents and the general public on topics including business and being a first responder. With these events, the operator aims to extend awareness of dementia and educate people what older adults living with dementia deal with on a daily basis, according to Brenda Abbott-Shultz, Sagora’s vice president of resident services.\nSagora leadership tailored the program to address the growing need for memory care services as the number of older adults living with dementia continues to climb. According to the Alzheimer’s Association, there are an estimated 7.4 million older adults living with Alzheimer’s dementia in the U.S. and that figure could grow to 13.8 million by 2060. Columbia University researchers in 2022 found almost 10% of U.S. adults ages 65 and older have dementia while another 22% have mild cognitive change.\n“We want to not only educate our team members for that impact but also really educate everyone that may or may not be able to afford what we do or isn’t ready just yet for senior living,” Abbott-Shultz said. “We want people to be safe in their homes and want to raise public awareness to create a more dementia-friendly society.”\nTo that end, Abbott-Shultz said Sagora memory care communities can extend these educational sessions to outside groups including banks and grocery stores, creating more awareness of dementia risk and the impact cognitive change can have on a person’s life. Equipping groups like first responders with more insight into the warning signs of dementia could help identify older adults at risk sooner and prevent severe medical incidents in the future, she added.\n“We can’t just be resident-first; we need to be senior-focused for all seniors, so that’s our plan going forward to ensure that early triggers and early warning signs can be recognized,” Abbott-Shultz said. “This gives us an opportunity to educate those who may be on the front lines of figuring out how to de-escalate or redirect to get someone into the right setting.”\nThis training program is the next evolution for Sagora, taking its dementia and memory care expertise and creating a platform for not only staff but the public to have access to trusted information about cognitive change, according to Christal Hoffman, who serves as Sagora’s vice president of corporate operations. With a history of caring for older adults living with dementia, Hoffman said the time was right for spreading supportive information to help the public understand dementia risk and the daily lives of older adults living with cognitive change.\n“Developing empathy is difficult without personal experience. When you share someone’s struggle, you realize they aren’t being stubborn or acting out of spite,” Hoffman said. “It really helps put you at the center of it all and in someone’s shoes about what living with dementia is like.”\nA Dementia Live coach facilitates the training for all memory care communities with aprogram that includes immersive elements like tasks to complete with dexterity limitations along with having things like audio that simulates the disorientation that a person living with dementia can experience.\nThose elements are meant to help build empathy and aid residents struggling in various ways. On a rolling basis, Sagora will also expand the training directly to first responder groups like paramedics, firefighters and police to bring it to them to create a real experience that resonates with those participating in the program, Abbott-Shultz said.\n“The program is designed to be mobile, so we can transport it anywhere for anyone who wants to experience this,” Abbott-Shultz added.\nFeedback from staff on the new training program has been positive, the leaders said, creating emotional moments that will create lasting positive impacts on memory care staff in Sagora communities.\n“The dementia coaches are excited because they see the impact it is making with the emotional piece of it and there are so many ‘aha’ moments that let staff connect past experiences with new things learned in the training,” Hoffman said.\nIn 2024, Sagora required home office staff to become certified dementia practitioners, and the most recent training effort builds off of continued momentum in growing Sagora’s Pathways memory care program, Hoffman said.\n“Every member of our executive team has lived and worked in a community, giving them a firsthand understanding of the daily challenges residents and staff face,” Hoffman said. “We designed this training program by identifying the specific knowledge we wish we had possessed to perform our own roles even more effectively.”\nIn the future, Abbott-Shultz sees memory care evolving to include more technology to help support residents and staff, giving providers better insight into how to improve the overall memory care experience. Hoffman sees opportunities to add elements of memory care training in broader operations across Sagora communities, including lifestyle elements with reminiscence or sensory elements in programming.\n“Dementia Live is the kickstart to really understanding the ‘why’ and education behind it, so that when we roll out new programs and initiatives, we have experts that understand it and I am excited for what is to come,” Hoffman said.", "summary": "Sagora Senior Living is investing in new training for staff within its Pathways memory care program in an effort to better educate staff, families and the public about dementia and cognitive change. It uses immersive experiences in training modules that are built to create empathy and improve care coordination for older adults living with dementia in memory care communities. Sagora leadership tailored the program to address the growing need for memory care services as the number of older adults living with dementia continues to climb. With a history of caring for older adults living with dementia, Hoffman said the time was right for spreading supportive information to help the public understand dementia risk and the daily lives of older adults living with cognitive change.", "categories": ["業務改善・介護テック", "人材育成・HR"], "is_new": true, "title_ja": "Sagora Senior Living は、共感力やケアの調整力を高めるためのメモリーケアトレーニングに投資しています", "summary_ja": "サゴーラ・シニア・リビングは、認知症と認知の変化についてスタッフ、家族、一般の人々をより良く教育するために、Pathways 記憶ケアプログラム内のスタッフ向けの新しいトレーニングに投資しています。これは、記憶ケアコミュニティで認知症とともに暮らす高齢者に対する共感を生み出し、ケアの調整を改善するために構築されたトレーニングモジュールで没入型の体験を使用します。サゴーラのリーダーシップは、認知症を抱えながら暮らす高齢者の数が増加し続ける中、記憶ケアサービスのニーズの高まりに対処するためにプログラムを調整しました。認知症を抱えて暮らす高齢者の介護に携わってきた経験を持つホフマン氏は、認知症のリスクと認知の変化を抱えて暮らす高齢者の日常生活について国民が理解できるよう、支援的な情報を広める時期が来たと述べた。"}, {"title": "介護の仕事を身近に　小学生が特養などで体験〈愛生館・愛知〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/series05/45800", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-12 10:00", "description": "小学生が介護施設の高齢者と交流したり、介護の仕事を学んだりする「介護のお仕事体験」が７月２１、２２日、社会福祉法人愛生館が運営する特別養護老人ホームひまわりなど４施設（愛知県碧南市）で行われた。児童に介護現場に来てもらい、介護を知らない仕事から、身近な仕事に変えるきっかけをつくるのが目的で、今年で４回目。 近隣の小学校２校から両日で５、６年生計２４人が参加し、高齢者と一緒に輪投げ、風船リレー、ジェンガなどを楽しんだ。また、児童は車いす介助や昼食の配膳などを体験し、職員とも関わりながら高齢者の生活を支える介護の仕事の大切さに触れた。介護施設に移動用リフトがあることに驚き、実際に試乗もした。 児童は日ごろ高齢者と触れ合う機会が少なく、初めは緊張気味だったが、ゲームや会話をするうちに、児童から高齢者に声を掛けるなど世代を超えた笑顔の交流が生まれた。 参加した児童からは「一緒にゲームをしてたくさん笑ってくれてうれしかった」「介護の仕事をもっと知りたいと思った」などの感想が聞かれ、高齢者も児童との交流は良い刺激になった。 同法人は「今回の体験で高齢者への理解を深め、介護の仕事が将来の選択肢の一つ", "content": "介護の仕事を身近に 小学生が特養などで体験〈愛生館・愛知〉\n2026年08月12日 福祉新聞編集部小学生が介護施設の高齢者と交流したり、介護の仕事を学んだりする「介護のお仕事体験」が７月２１、２２日、社会福祉法人愛生館が運営する特別養護老人ホームひまわりなど４施設（愛知県碧南市）で行われた。児童に介護現場に来てもらい、介護を知らない仕事から、身近な仕事に変えるきっかけをつくるのが目的で、今年で４回目。\n近隣の小学校２校から両日で５、６年生計２４人が参加し、高齢者と一緒に輪投げ、風船リレー、ジェンガなどを楽しんだ。また、児童は車いす介助や昼食の配膳などを体験し、職員とも関わりながら高齢者の生活を支える介護の仕事の大切さに触れた。介護施設に移動用リフトがあることに驚き、実際に試乗もした。\n児童は日ごろ高齢者と触れ合う機会が少なく、初めは緊張気味だったが、ゲームや会話をするうちに、児童から高齢者に声を掛けるなど世代を超えた笑顔の交流が生まれた。\n参加した児童からは「一緒にゲームをしてたくさん笑ってくれてうれしかった」「介護の仕事をもっと知りたいと思った」などの感想が聞かれ、高齢者も児童との交流は良い刺激になった。\n同法人は「今回の体験で高齢者への理解を深め、介護の仕事が将来の選択肢の一つになってくれたら」としている。", "summary": "介護の仕事を身近に 小学生が特養などで体験〈愛生館・愛知〉\n2026年08月12日 福祉新聞編集部小学生が介護施設の高齢者と交流したり、介護の仕事を学んだりする「介護のお仕事体験」が７月２１、２２日、社会福祉法人愛生館が運営する特別養護老人ホームひまわりなど４施設（愛知県碧南市）で行われた。また、児童は車いす介助や昼食の配膳などを体験し、職員とも関わりながら高齢者の生活を支える介護の仕事の大切さに触れた。参加した児童からは「一緒にゲームをしてたくさん笑ってくれてうれしかった」「介護の仕事をもっと知りたいと思った」などの感想が聞かれ、高齢者も児童との交流は良い刺激になった。同法人は「今回の体験で高齢者への理解を深め、介護の仕事が将来の選択肢の一つになってくれたら」としている。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "【村上久美子】他産業との賃金格差8万円　介護職の「他職種と遜色ない処遇改善」で問われる国の覚悟", "url": "https://www.joint-kaigo.com/articles/48052/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-12 05:00", "description": "7月21日、今年の「骨太の方針（経済財政運営と改革の基本方針2026）」が閣議決定された。【村上久美子】 介護分野で最も注目すべきは、来年度の介護報酬・障害福祉サービス等報酬改定に向けて、「他職種と遜色ない処遇改善の実現 […]", "content": "【村上久美子】他産業との賃金格差8万円 介護職の「他職種と遜色ない処遇改善」で問われる国の覚悟\n7月21日、今年の「骨太の方針（経済財政運営と改革の基本方針2026）」が閣議決定された。【村上久美子】\n介護分野で最も注目すべきは、来年度の介護報酬・障害福祉サービス等報酬改定に向けて、「他職種と遜色ない処遇改善の実現を図る」と明記された点である。\n介護現場にとって、処遇改善が政府方針に盛り込まれたこと自体は歓迎したい。しかし同時に問われるべきは、国がこの言葉の重みを本当に理解しているのか、ということである。\n「他職種と遜色ない」とは、少し賃金を上げればよいという意味ではない。介護職の賃金は、全産業平均と比べてなお大きな開きがある。統計の取り方にもよるが、その差は月額で約8万円に及ぶとされる。\nこれほどの格差を前に、数千円、あるいは1万円程度の改善で「遜色ない」とは到底言えない。介護人材不足の背景には、仕事の専門性、身体的・精神的負担、命と生活を支える責任の重さに、賃金水準が見合っていないという構造的問題がある。\nもちろん、事業所に余力があるわけではない。人件費に加え、食材費、光熱費、燃料費、委託費なども上昇し、経営環境は厳しさを増している。\nしかも介護報酬は公定価格であり、事業所が自ら価格を引き上げてコスト増を転嫁することはできない。\nだからこそ、「骨太の方針」が掲げる公定価格への必要な対応を、次期改定で具体化する必要がある。報酬上の十分な手当てがないまま賃上げだけを求められても、現場は対応できない。したがって、次期改定では、職員の賃上げと事業所の経営安定を一体で考える必要がある。\n◆ 将来を描ける賃金水準を\nさらに重要なのは、賃上げを一時的な補助金や加算の積み増しだけで終わらせないことである。現場が求めているのは、将来の生活設計を描ける安定した賃金水準であり、制度改定に左右される不安定な処遇改善ではない。介護を選べる仕事にするには、賃金が継続的に上がる仕組みが必要である。\n一方で「骨太の方針」は、現役世代の保険料率の上昇を止め、引き下げていく方針も掲げている。\n財源制約があることは理解できる。しかし、それを理由に処遇改善が小幅にとどまれば、「他職種と遜色ない」という文言は、現場に対する空約束になってしまう。必要なのは、現在の賃金格差をどの期間で、どの水準まで縮めるのかを明確に示すことである。\n介護は、人が人を支える仕事である。制度があっても、担い手がいなければサービスは届かない。「他職種と遜色ない処遇改善」と掲げた以上、国にはそれに見合う覚悟と財源措置が求められる。次期改定で問われるのは、現場が実感できる賃上げを本当に実現できるかである。", "summary": "「他職種と遜色ない」とは、少し賃金を上げればよいという意味ではない。もちろん、事業所に余力があるわけではない。財源制約があることは理解できる。介護は、人が人を支える仕事である。", "categories": ["人材育成・HR", "介護保険・制度"], "is_new": false}, {"title": "【居宅介護支援】限界を迎えた特定事業所加算の「重度者要件」。加算Ⅰ・Ⅱは統合か＝田中紘太", "url": "https://www.joint-kaigo.com/articles/48057/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-12 05:00", "description": "厚生労働省の審議会（社会保障審議会・介護給付費分科会）で、来年度の介護報酬改定に向けた協議が進められています。【田中紘太】 居宅介護支援の焦点の1つは、事業所の経営を左右する「特定事業所加算」の見直しです。6月末の審議会 […]", "content": "厚生労働省の審議会（社会保障審議会・介護給付費分科会）で、来年度の介護報酬改定に向けた協議が進められています。【田中紘太】\n居宅介護支援の焦点の1つは、事業所の経営を左右する「特定事業所加算」の見直しです。6月末の審議会では、委員から要件の緩和を促す声が相次ぎました。\n今回は、このテーマで改定の行方を考察します。論点は多岐にわたりますが、ここではあえて2点に絞って私見を述べていきます。\n◆ 不公平を生む「40%ルール」の限界\nまずは、「要介護3以上の利用者が40%以上」という重度者要件について。審議会の意見交換では、複数の委員が見直しを求めたと報じられています。\n私もこの要件は見直すべきだと考えています。何かとデメリットが多く、既に制度として限界を迎えているのではないでしょうか。\n実際、この重度者要件は少なからぬ事業所にとって分厚い壁となっています。2名の主任ケアマネジャーなどの人員要件を満たしていても、割合がネックになって「加算Ⅱ」に留まらざるを得ないケースは珍しくありません。「加算Ⅰ」を取得するために、事業所が軽度者を敬遠するといった歪みを生む要因にもなっています。\nまた、住宅型有料老人ホームなどの集合住宅に重度者が集まりやすく、主にそこをターゲットとする併設型の事業所が有利になるという問題もあります。結果として併設型のビジネスモデルを助長しているほか、地域に根ざして献身的な支援をしている事業所が「加算Ⅰ」を取得できないなど、不公平な構造を生み出しています。\nさらに、特定の利用者を40%の計算から除外できるルールも曖昧です。「地域包括支援センターから支援困難ケースを紹介された場合」などとされていますが、自治体によって定義や判断にバラツキがあり、現場に混乱を招く一因となっています。\nこの重度者要件の見直しをめぐっては、かつて慎重な姿勢をとっていた有力団体が前向きな発言をするようになっているなど、業界の潮目も変わってきていると感じます。来年度の改定で見直される可能性が高い ―― 。私はそう認識しています。\nただ、仮に重度者要件を廃止すると「加算Ⅰ」と「加算Ⅱ」の違いは人員要件のみとなります。多くの事業所が「加算Ⅰ」を取得するようになれば、居宅介護支援の給付費の膨張は避けられません。単純な廃止は財政当局の理解を得にくく、実現することはそう簡単ではないでしょう。\nこのため、特定事業所加算は「加算Ⅰ」と「加算Ⅱ」を統合しつつ、中間の単位数で再編するシナリオが有力ではないでしょうか。我々も含め、既に「加算Ⅰ」を取得している事業所にとっては一定の減収を意味しますが、制度全体をより適切な形に変えるためにはやむを得ません。この統合・再編が最も現実的な落としどころではないかと考えます。\n◆ 負担軽減と利用者保護のジレンマ\n2点目は、「24時間の連絡体制の確保」を求める要件について。こちらは重度者要件と異なり、少し慎重な議論が必要ではないかと考えます。\n審議会では有力団体から、要件の緩和を呼びかける声が上がったと報じられています。夜間のオンコール対応を減らすなどして、ケアマネジャーの負担軽減や職場環境の改善につなげる狙いがあります。\nもちろん、それが重要であることは言うまでもありません。緊急時などに電話を受けても、医療職ではないケアマネジャーにできることは限られるという現実もあります。ですから、私も要件の緩和を否定するつもりはまったくありません。\nただ、独居の方も含めて高齢者の生活を切れ目なく支えるという制度の趣旨は軽視できません。ケアマネジャーが大変なので要件を単に廃止すれば良い ―― 。一部にみられるそうした意見には、少し不安を覚えます。ケアマネジャーの負担軽減と高齢者の安心の両立を重視して、皆で知恵を出し合う丁寧な議論を期待したいところです。\n現場サイドの我々にも、日頃のケアマネジメントやネットワークづくりの質を高めたり、テクノロジーをフル活用して生産性の向上を追求したりするなど、様々な観点からできることがあるのではないでしょうか。", "summary": "私もこの要件は見直すべきだと考えています。実際、この重度者要件は少なからぬ事業所にとって分厚い壁となっています。「加算Ⅰ」を取得するために、事業所が軽度者を敬遠するといった歪みを生む要因にもなっています。ただ、仮に重度者要件を廃止すると「加算Ⅰ」と「加算Ⅱ」の違いは人員要件のみとなります。", "categories": ["施設運営・経営", "介護保険・制度"], "is_new": false}, {"title": "社会保障給付費が３年ぶりに増　高齢化、物価高で年金伸び〈国立社会保障・人口問題研究所〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/fukushiippan/45795", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-11 10:00", "description": "厚生労働省の国立社会保障・人口問題研究所は７月２９日、２０２４年度の社会保障給付費が前年度比２％増の１３８兆３０１９億円だったと発表した。給付費が前年度を上回るのは３年ぶり。高齢化や物価上昇の影響で年金が伸びた。新型コロナウイルスへの対応で給付費が膨らんだ２１年度に次いで過去２番目の高水準だ。 ２４年度の内訳で最も大きかったのは「年金」で、前年度比２・６％増の５７兆８５２８億円だった。介護や子育てなどの「福祉その他」は６・２％増の３５兆６４３６億円。高齢化や介護報酬の引き上げが影響した。 一方、「医療」は１・９％減の４４兆８０５５億円。新型コロナウイルス対策費の減少で２年連続で前年度を下回った。 社会保障給付費は社会保険料や税金を財源として、年金や医療などに充てられた費用の総額。窓口で支払う自己負担は含まない。 福祉新聞Web", "content": "社会保障給付費が３年ぶりに増 高齢化、物価高で年金伸び〈国立社会保障・人口問題研究所〉\n2026年08月11日 福祉新聞編集部厚生労働省の国立社会保障・人口問題研究所は７月２９日、２０２４年度の社会保障給付費が前年度比２％増の１３８兆３０１９億円だったと発表した。給付費が前年度を上回るのは３年ぶり。高齢化や物価上昇の影響で年金が伸びた。新型コロナウイルスへの対応で給付費が膨らんだ２１年度に次いで過去２番目の高水準だ。\n２４年度の内訳で最も大きかったのは「年金」で、前年度比２・６％増の５７兆８５２８億円だった。介護や子育てなどの「福祉その他」は６・２％増の３５兆６４３６億円。高齢化や介護報酬の引き上げが影響した。\n一方、「医療」は１・９％減の４４兆８０５５億円。新型コロナウイルス対策費の減少で２年連続で前年度を下回った。\n社会保障給付費は社会保険料や税金を財源として、年金や医療などに充てられた費用の総額。窓口で支払う自己負担は含まない。", "summary": "社会保障給付費が３年ぶりに増 高齢化、物価高で年金伸び〈国立社会保障・人口問題研究所〉\n2026年08月11日 福祉新聞編集部厚生労働省の国立社会保障・人口問題研究所は７月２９日、２０２４年度の社会保障給付費が前年度比２％増の１３８兆３０１９億円だったと発表した。給付費が前年度を上回るのは３年ぶり。２４年度の内訳で最も大きかったのは「年金」で、前年度比２・６％増の５７兆８５２８億円だった。社会保障給付費は社会保険料や税金を財源として、年金や医療などに充てられた費用の総額。", "categories": ["福祉・社会保障", "介護保険・制度"], "is_new": false}, {"title": "介護現場のエピソードがアニメに！　ほっこりや喜び、推し体験の募集を開始　ヒットメーカーが制作", "url": "https://www.joint-kaigo.com/articles/48039/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-10 11:08", "description": "株式会社Blanketが運営するKAIGO LEADERSは、介護職員の実体験をアニメ化する「#あなたの介護現場のエピソードがアニメになる」キャンペーンを展開する。今月7日から、介護職員によるエピソードの応募受付を開始し […]", "content": "2026年8月10日\n介護現場のエピソードがアニメに！ ほっこりや喜び、推し体験の募集を開始 ヒットメーカーが制作\n株式会社Blanketが運営するKAIGO LEADERSは、介護職員の実体験をアニメ化する「#あなたの介護現場のエピソードがアニメになる」キャンペーンを展開する。今月7日から、介護職員によるエピソードの応募受付を開始した。【Joint編集部】\n介護の仕事には確かなやりがいがあり、心温まる笑いや喜び、感動の瞬間が無数に存在する。ただ、それが業界の外で広く共有・理解されているとは必ずしも言えない。\nこのキャンペーンは、介護現場のリアルで親しみやすい日常をアニメにして発信することで、介護の仕事の価値や魅力を社会全体へ届けることを目指す。\n寄せられたエピソードの一部は、多くの話題作を手掛ける映像制作会社FUNNYMOVIEがコミカルなアニメとして動画化。完成作品は11月11日の「介護の日」に合わせ、特設サイトやSNSなどで公開される。\n募集内容は、介護現場で「ガッツポーズをした」「嬉しかった」「思わず笑ってしまった」といった体験で、応募は9月16日まで受け付ける。発起人の秋本可愛氏は、「全国の介護職のみなさん、あなたが現場で出会った“推しエピソード”をぜひ教えてください」と投稿を呼びかけている。", "summary": "2026年8月10日\n介護現場のエピソードがアニメに！。ほっこりや喜び、推し体験の募集を開始 ヒットメーカーが制作\n株式会社Blanketが運営するKAIGO LEADERSは、介護職員の実体験をアニメ化する「#あなたの介護現場のエピソードがアニメになる」キャンペーンを展開する。今月7日から、介護職員によるエピソードの応募受付を開始した。このキャンペーンは、介護現場のリアルで親しみやすい日常をアニメにして発信することで、介護の仕事の価値や魅力を社会全体へ届けることを目指す。", "categories": ["人材育成・HR", "施設運営・経営"], "is_new": false}, {"title": "東京都が乳児院の体制強化　夜間の複数人配置を支援 - 福祉新聞Web", "url": "https://fukushishimbun.com/series07/45797", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-10 10:00", "description": "東京都内で乳幼児の一時保護委託が増える中、都は今年度、委託先となる乳児院の体制強化支援に乗り出した。日中と比べ職員が手薄になる夜間に複数人の職員配置が組めるよう、職員の増員を支援。呼吸確認や数時間ごとの授乳など、より細やかな対応が必要な０歳児で特に一時保護委託が増えており、夜間の職員配置を充実させ確実な受け入れにつなげたい考えだ。 新規措置上回る 児童虐待の増加を背景に、東京都内で乳幼児の一時保護が年々増えている。都内の１１乳児院で構成する東京都社会福祉協議会・乳児部会のデータによると、０～２歳児の対応が難しい児童相談所が都内乳児院に一時保護を委託するケースは２０２０年度から毎年増え、２２年度には新規措置入所の件数を上回っている。２４年度で一時保護の受け入れ件数は１０年前のおよそ３倍となる３９８件、新規措置入所は２５７件だった。 乳児院で生活するこどもの入所期間は短期化が顕著になっており、２４年度に退所したこどもの約８割が３カ月未満の入所だった。 職員１人で対応 こうした現状により、個々のこどもの特性、健康状態を把握するための労力や関係機関との調整業務は増え、職員が手薄な夜間で特に一時", "content": "東京都が乳児院の体制強化 夜間の複数人配置を支援\n2026年08月10日 福祉新聞編集部東京都内で乳幼児の一時保護委託が増える中、都は今年度、委託先となる乳児院の体制強化支援に乗り出した。日中と比べ職員が手薄になる夜間に複数人の職員配置が組めるよう、職員の増員を支援。呼吸確認や数時間ごとの授乳など、より細やかな対応が必要な０歳児で特に一時保護委託が増えており、夜間の職員配置を充実させ確実な受け入れにつなげたい考えだ。\n新規措置上回る\n児童虐待の増加を背景に、東京都内で乳幼児の一時保護が年々増えている。都内の１１乳児院で構成する東京都社会福祉協議会・乳児部会のデータによると、０～２歳児の対応が難しい児童相談所が都内乳児院に一時保護を委託するケースは２０２０年度から毎年増え、２２年度には新規措置入所の件数を上回っている。２４年度で一時保護の受け入れ件数は１０年前のおよそ３倍となる３９８件、新規措置入所は２５７件だった。\n乳児院で生活するこどもの入所期間は短期化が顕著になっており、２４年度に退所したこどもの約８割が３カ月未満の入所だった。\n職員１人で対応\nこうした現状により、個々のこどもの特性、健康状態を把握するための労力や関係機関との調整業務は増え、職員が手薄な夜間で特に一時保護への対応が厳しくなっている。都によると、施設やこどもの年齢によって異なるが、夜間はこども１０人前後に対し職員１人で対応している施設が多いという。\n乳児部会はかねてより夜間体制の強化を都に求めてきた。都は賛育会病院（墨田区）で内密出産、ベビーバスケットが始まったことなども踏まえ、乳児院の受け入れ体制強化が必要だと判断した。\n児相を設置する特別区と連携し、一時保護の確実な受け入れを条件に６施設に対し、最低一つの生活単位で夜間、常時複数人配置が実現できるよう支援。国の最低基準や加配措置を踏まえ、「常勤４人分」の人件費を補助する。４人は新規採用でも、法人独自で既に雇っている加配職員でもどちらも対象とする。\n安心感、職員の負担減も期待\n愛恵会乳児院（黒田邦夫統括施設長、町田市）では１ユニット当たり４～６人定員でおよそ５０人の乳幼児が暮らす。一時保護の受け入れは、委託依頼があった乳幼児の年齢、健康状態（感染症やアレルギーなど）や、その日の施設の稼働状況などを踏まえ判断し、断るケースも少なくないという。\n夜間は乳児１２人に対し職員２人が対応し、幼児は１２人に対し職員１人を配置するなど計６人が夜勤に当たる。都の補助金は法人独自で加配している職員の人件費に充て、これで浮いた経費を活用して追加の職員採用を行い、夜間をもう１人増やしたい考えだ。幼児ユニット「そらホーム」のリーダー木内郁子さんは「夜間にもう一人増えれば安心感が違うと思う。より手厚い対応ができる」と期待を込める。\n乳児部会の副部会長で、同様に都の支援を受ける聖オディリアホーム乳児院（中野区）の鎌倉道子施設長は「夜勤に当たる職員の負担軽減につながり、介護や子育て中の職員の離職防止も期待できる」と評価。一方、「どの施設でも採用活動が厳しく、一時保護に関連する事務作業も増大している。一時保護が増え続ける中、こうした課題への支援もあると助かる」と話している。", "summary": "日中と比べ職員が手薄になる夜間に複数人の職員配置が組めるよう、職員の増員を支援。都によると、施設やこどもの年齢によって異なるが、夜間はこども１０人前後に対し職員１人で対応している施設が多いという。夜間は乳児１２人に対し職員２人が対応し、幼児は１２人に対し職員１人を配置するなど計６人が夜勤に当たる。一時保護が増え続ける中、こうした課題への支援もあると助かる」と話している。", "categories": ["人材育成・HR", "施設運営・経営"], "is_new": false}, {"title": "障害福祉の生産性向上へ実証研究　厚労省が報酬で評価を検討 - 福祉新聞Web", "url": "https://fukushishimbun.com/series06/45793", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-09 10:00", "description": "厚生労働省は７月２８日、「障害福祉分野における人材確保・生産性向上に関する検討会」を立ち上げた。２０事業所程度で生産性向上に関する実証研究を行い、今年度末をめどにガイドラインを策定する。次期障害報酬改定の議論は別の検討チームで進行中だが、同検討会でも生産性向上の成果を報酬で評価する仕組みを議論する。 来年４月施行の改正障害者総合支援法で、人材確保や生産性向上を通じて質の高いサービスを確保することが国、都道府県の責務とされたことなどを受け、同検討会が発足。座長は吉田俊之埼玉県立大教授、委員は８人で構成する。 厚労省は昨年度、障害当事者目線でケアの充実につながる生産性向上について基本的な考え方を整理し、現場向けテクノロジー導入・活用マニュアルも作成した。野村知司障害保健福祉部長はあいさつで「ケアの質を向上させるため、さらにどのような取り組みが考えられるか議論いただき、現場にフィードバックできれば」と述べた。 同検討会は今後、生産性向上に関する実証研究や障害当事者団体の意見聴取などを行い、共通編とサービス類型別についてガイドラインを策定する。サービス類型別は訪問系、相談支援系▽施設入所系、居", "content": "障害福祉の生産性向上へ実証研究 厚労省が報酬で評価を検討\n2026年08月09日 福祉新聞編集部厚生労働省は７月２８日、「障害福祉分野における人材確保・生産性向上に関する検討会」を立ち上げた。２０事業所程度で生産性向上に関する実証研究を行い、今年度末をめどにガイドラインを策定する。次期障害報酬改定の議論は別の検討チームで進行中だが、同検討会でも生産性向上の成果を報酬で評価する仕組みを議論する。\n来年４月施行の改正障害者総合支援法で、人材確保や生産性向上を通じて質の高いサービスを確保することが国、都道府県の責務とされたことなどを受け、同検討会が発足。座長は吉田俊之埼玉県立大教授、委員は８人で構成する。\n厚労省は昨年度、障害当事者目線でケアの充実につながる生産性向上について基本的な考え方を整理し、現場向けテクノロジー導入・活用マニュアルも作成した。野村知司障害保健福祉部長はあいさつで「ケアの質を向上させるため、さらにどのような取り組みが考えられるか議論いただき、現場にフィードバックできれば」と述べた。\n同検討会は今後、生産性向上に関する実証研究や障害当事者団体の意見聴取などを行い、共通編とサービス類型別についてガイドラインを策定する。サービス類型別は訪問系、相談支援系▽施設入所系、居住支援系▽通所系▽児童系――ごとに記録、請求など各業務における取り組みを整理する。\n同日は委員が意見交換した。生産性向上に対する抵抗感の払拭や、人手に余裕のない小規模事業所への対応、人材確保の側面からの議論などについて言及があった。実証研究は単にテクノロジー活用による業務削減時間を測るだけではなく、ケアの充実につながったかを把握するよう注文もあった。", "summary": "障害福祉の生産性向上へ実証研究 厚労省が報酬で評価を検討\n2026年08月09日 福祉新聞編集部厚生労働省は７月２８日、「障害福祉分野における人材確保・生産性向上に関する検討会」を立ち上げた。２０事業所程度で生産性向上に関する実証研究を行い、今年度末をめどにガイドラインを策定する。次期障害報酬改定の議論は別の検討チームで進行中だが、同検討会でも生産性向上の成果を報酬で評価する仕組みを議論する。同検討会は今後、生産性向上に関する実証研究や障害当事者団体の意見聴取などを行い、共通編とサービス類型別についてガイドラインを策定する。", "categories": ["福祉・社会保障", "AIツール・生産性"], "is_new": false}, {"title": "今年度の社会福祉士国試、来年2月7日に実施　9月3日から受付開始＝厚労省", "url": "https://www.joint-kaigo.com/articles/48034/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-08 13:08", "description": "厚生労働省は7日、今年度の第39回社会福祉士国家試験を来年2月7日（日）に実施すると発表した。【Joint編集部】 受験手続きの受け付け期間は今年9月3日から10月2日まで。社会福祉振興・試験センターの公式サイトによるイ […]", "content": "厚生労働省は7日、今年度の第39回社会福祉士国家試験を来年2月7日（日）に実施すると発表した。【Joint編集部】\n受験手続きの受け付け期間は今年9月3日から10月2日まで。社会福祉振興・試験センターの公式サイトによるインターネット申し込み、または郵送で受け付ける。\n受験手数料は一般が2万4300円。合格発表は来年3月9日（火）午後で、社会福祉振興・試験センターの公式サイトで行われる。\nこのほか、厚労省は今年度の第29回精神保健福祉士国家試験について、来年2月6日（土）、7日（日）に実施することも併せて発表した。", "summary": "厚生労働省は7日、今年度の第39回社会福祉士国家試験を来年2月7日（日）に実施すると発表した。社会福祉振興・試験センターの公式サイトによるインターネット申し込み、または郵送で受け付ける。合格発表は来年3月9日（火）午後で、社会福祉振興・試験センターの公式サイトで行われる。このほか、厚労省は今年度の第29回精神保健福祉士国家試験について、来年2月6日（土）、7日（日）に実施することも併せて発表した。", "categories": ["福祉・社会保障", "介護保険・制度"], "is_new": false}, {"title": "ケアマネの平均年齢、55歳超える　進む高齢化　3人に1人は60歳以上＝介護労働実態調査", "url": "https://www.joint-kaigo.com/articles/48026/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-08 12:35", "description": "事態は変わらず、静かに進行している。介護労働安定センターが7月末に公表した最新の「2025年度介護労働実態調査」では、ケアマネジャーの高齢化が一段と進んでいると報告されている。【Joint編集部】 ケアマネジャーの平均年 […]", "content": "事態は変わらず、静かに進行している。介護労働安定センターが7月末に公表した最新の「2025年度介護労働実態調査」では、ケアマネジャーの高齢化が一段と進んでいると報告されている。【Joint編集部】\nケアマネジャーの平均年齢は、介護に携わる職種の中で最も高い55.1歳。前年度の54.3歳から0.8歳上がった。ホームヘルパーの平均年齢は51.1歳で、ケアマネジャーはこれを上回っている。\nケアマネジャーの年齢構成をみると、60歳以上の割合は35.4%。前年度の31.5%から3.9ポイント上昇し、全体の3人に1人を超えるに至っている。\nこの調査は昨年10月に行われたもの。全国の事業所・施設で働く介護従事者が対象で、2万675人から有効な回答を得ている。\n地域によって深刻さに濃淡があるものの、全国の介護現場では既にケアマネジャーの確保が大きな課題となっている。政府は今年度から介護報酬の「処遇改善加算」を居宅介護支援に導入したが、対応が遅いと首をかしげる関係者も少なくない。\n今後、高齢のケアマネジャーがリタイアしたり担当ケース数を減らしたりする事業所が増える見通し。こうした動きは、介護報酬・運営基準のあり方をめぐる議論にも大きな影響を与えそうだ。", "summary": "介護労働安定センターが7月末に公表した最新の「2025年度介護労働実態調査」では、ケアマネジャーの高齢化が一段と進んでいると報告されている。【Joint編集部】\nケアマネジャーの平均年齢は、介護に携わる職種の中で最も高い55.1歳。ホームヘルパーの平均年齢は51.1歳で、ケアマネジャーはこれを上回っている。ケアマネジャーの年齢構成をみると、60歳以上の割合は35.4%。", "categories": ["福祉・社会保障", "介護保険・制度"], "is_new": false}, {"title": "熊本地震で福祉施設1700カ所超に被害　DWATが活動開始 - 福祉新聞Web", "url": "https://fukushishimbun.com/fukushiippan/45790", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-08 10:00", "description": "熊本地震は４日で発生から１週間が経過した。死者は３８人となり、福祉施設の被害も１７００カ所を超えた。 壁のひび割れや停電、断水などの被害を受けた福祉施設は５日までに１７３６カ所に拡大した。内訳は高齢者施設９３０カ所▽障害者福祉施設３５５カ所▽児童福祉施設４４８カ所▽救護施設３カ所――だった。 福祉支援も始動 被災した宇城市や嘉島町など４市７町では災害ボランティアセンターも設置されている。震度７を観測した宇城市では１日にセンターを開設し、５日までに約２００人のボランティアが避難所支援や物資の受け入れ、被災家屋の片付けなどに当たった。 地震翌日から活動を開始した熊本県ＤＷＡＴ（災害派遣福祉チーム）は、本部を県庁内に設置。八代市、氷川町、宇城市の３カ所に拠点を置き、避難所などを巡回する。また４日までに長野、福岡、長崎県などのＤＷＡＴが熊本入りした。 先遣隊として地震翌日から被災地入りした熊本県ＤＷＡＴの木村准治さんは「他県からの応援の力も借りながら、全避難所を回り、支援が必要な人を把握する作業を本格化させる。今後は在宅避難者や車中泊にも支援対象を広げたい」と話した。 激甚災害に指定 高市早苗", "content": "熊本地震で福祉施設1700カ所超に被害 DWATが活動開始\n2026年08月08日 福祉新聞編集部熊本地震は４日で発生から１週間が経過した。死者は３８人となり、福祉施設の被害も１７００カ所を超えた。\n壁のひび割れや停電、断水などの被害を受けた福祉施設は５日までに１７３６カ所に拡大した。内訳は高齢者施設９３０カ所▽障害者福祉施設３５５カ所▽児童福祉施設４４８カ所▽救護施設３カ所――だった。\n福祉支援も始動\n被災した宇城市や嘉島町など４市７町では災害ボランティアセンターも設置されている。震度７を観測した宇城市では１日にセンターを開設し、５日までに約２００人のボランティアが避難所支援や物資の受け入れ、被災家屋の片付けなどに当たった。\n地震翌日から活動を開始した熊本県ＤＷＡＴ（災害派遣福祉チーム）は、本部を県庁内に設置。八代市、氷川町、宇城市の３カ所に拠点を置き、避難所などを巡回する。また４日までに長野、福岡、長崎県などのＤＷＡＴが熊本入りした。\n先遣隊として地震翌日から被災地入りした熊本県ＤＷＡＴの木村准治さんは「他県からの応援の力も借りながら、全避難所を回り、支援が必要な人を把握する作業を本格化させる。今後は在宅避難者や車中泊にも支援対象を広げたい」と話した。\n激甚災害に指定\n高市早苗首相は３日、熊本地震の被災地を視察し、国が復興に向けた費用を重点的に支援する「激甚災害」に指定すると表明した。４日には予備費から２４２億円を支出することを閣議決定し、復旧を加速させる。\n熊本県氷川町の視察後、高市首相は「政府として、やれることはすべてやる。何ができるかを早急に検討し、先手先手で取り組みたい」と決意を述べた。\n同時に「特定非常災害」にも指定する方針を明らかにした。被災地域では運転免許証などさまざまな有効期間が延長されることになる。", "summary": "熊本地震で福祉施設1700カ所超に被害 DWATが活動開始\n2026年08月08日 福祉新聞編集部熊本地震は４日で発生から１週間が経過した。壁のひび割れや停電、断水などの被害を受けた福祉施設は５日までに１７３６カ所に拡大した。内訳は高齢者施設９３０カ所▽障害者福祉施設３５５カ所▽児童福祉施設４４８カ所▽救護施設３カ所――だった。また４日までに長野、福岡、長崎県などのＤＷＡＴが熊本入りした。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "Now we have a timeline of the OpenAI accidental attack against Hugging Face", "url": "https://simonwillison.net/2026/Aug/7/openai-timeline/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-08-08 08:55", "description": "OpenAI gave a last-minute presentation at the Black Hat security on Wednesday about \"the Hugging Face Incident\" ( previously on this blog). The video was published yesterday. It's short and information dense and well worth watching, in particular because it provides full details of what happened and how things played out inside OpenAI. I've used the video to construct the timeline below. Here's the timeline. My favourite detail is at the end: OpenAI found out that they were responsible for the a", "content": "Now we have a timeline of the OpenAI accidental attack against Hugging Face\n7th August 2026\nOpenAI gave a last-minute presentation at the Black Hat security on Wednesday about “the Hugging Face Incident” (previously on this blog). The video was published yesterday. It’s short and information dense and well worth watching, in particular because it provides full details of what happened and how things played out inside OpenAI. I’ve used the video to construct the timeline below.\nHere’s the timeline. My favourite detail is at the end: OpenAI found out that they were responsible for the attack on Hugging Face when they reached out to ask to have their credentials revoked (after their internal investigation) and learned that they had been revoked already since they were used in that attack!\n- May 7: OpenAI starts a new training run for an experimental, unreleased model. (Did they mean an evaluation run? No, at 10:14 they clarify “we kick off a new reinforcement learning run to train a next generation frontier model”, and they later mention a “reward signal to judge how well they’re doing”, so this really was about training a new model, not evaluating one that was already trained.)\n- May 8: An agent is accidentally given an impossible task involving a Google Drive link despite no internet access). It tries attacking the Artifactory packaging service, fails, but discovers it can write files into Artifactory.\n- A few days later: A different agent gets stuck on a task because a key file was accidentally omitted. It tries to “reach out to another agent” by writing a note into Artifactory asking if anyone has the file.\n- Following days: More agents discover this new informal message board while browsing Artifactory’s file listings, and start reading and writing messages.\n- May 26: Agents successfully execute an SSRF attack on Artifactory for the first time, gaining indirect internet access by having Artifactory fetch external content for them.\n- June 11: OpenAI start training a new “highly persistent” experimental model. It has access to Artifactory and can benefit from the messages left by privous models.\n- June 26: Agents find and exploit a zero-day RCE on Artifactory (via a legacy token-refresh endpoint flaw). They use an administrative token to install a Groovy plugin that lets them execute commands.\n- July 4: The resulting agent activity overloads Artifactory and causes an outage. OpenAI revokes the compromised credentials, deletes the messages, patches the zero-day, and reports the vulnerability to the vendor.\n- July 8: Agents find a new way to communicate via an unauthenticated WebDAV endpoint, using directory names in Artifactory’s remote cache.\n- July 8–19: Attacks on OpenAI’s own infrastructure. The agents found an “external organization credential” in a public archive of leaked Pastebin posts, then validated that credential and shared its location on the messageboard. They then used write access to this “Organization 1” to stage data used in subsequent attacks on OpenAI infrastructure. They compromised Artifactory for a second time with a new zero-day. The agent uploaded a malicious Ruby target to Organization 1’s staging repository, then requested that package through Artifactory in a way that caused it to be treated as Ruby dependency for the repository. Then they exploited a JRuby deserilaization time-of-check/time-of-use bug to get remote code execution against Artifactory.\nI’ll quote the next bit in full because wow:\nThe agents have remote code execution in Artifactory, which is running in a container-as-a-service environment. The agents privilege-escalate locally by exploring their local environment and determining that the Linux kernel version of the machine they are running on had a very recent CVE. They download the exploit for the CVE, customize it to succeed on the machine, and privilege-escalate to root on the local machine using this known Linux kernel privilege escalation CVE — in this case,\npte_physroot\n. Once they have root on a single machine, agents rapidly escalate privileges and move laterally throughout the container-as-a-service infrastructure environment. In particular, agents are using the message board consistently to share credentials, techniques, and progress, and they’re able to effectively leverage their concurrency and parallelism to move quite rapidly. They obtain IAM credentials via IMDS. They exploit Kubernetes service account misconfigurations, in particular over-permissioning of specific service accounts, and they harvest cluster credentials, including Azure Key Vault. Agents eventually obtain cluster admin on the cluster and associated credentials.\nHugging Face told the next bit of the story already. The agents found a Modal-hosted insecure app with a weak API key, then used that to stage an attack against Hugging Face. They chained together a an HDF5 arbitrary-file-read bug (to explore files and steal credentials) and a Jinja template-injection RCE to go from single-pod code execution to cluster admin across multiple Hugging Face clusters in under 13 hours.\n- July 16: Hugging Face disclosed they had detected an attack from autonomus AI agents. OpenAI contacted Hugging Face to ask if they were affected by it!\n- July 19: OpenAI identified the attack against Artifactory and started investigating the internal privilege escalation, and linked that to the cyber-gym escalations. They started revoking affected credentials.\n- July 20: OpenAI reached out to Hugging Face for help to revoke the Hugging Face credentials they found in their investigation. Hugging Face told them they were already revoked... and that’s when OpenAI realized that the Hugging Face breach was the same incident!", "summary": "- July 16: Hugging Face disclosed they had detected an attack from autonomus AI agents. OpenAI contacted Hugging Face to ask if they were affected by it!. - July 20: OpenAI reached out to Hugging Face for help to revoke the Hugging Face credentials they found in their investigation. Hugging Face told them they were already revoked.", "categories": ["業務改善・介護テック", "人材育成・HR"], "is_new": true, "title_ja": "これで、Hugging Face に対する OpenAI の偶発的攻撃のタイムラインができました。", "summary_ja": "- 7 月 16 日: ハグ フェイスは、自律 AI エージェントからの攻撃を検出したことを明らかにしました。 OpenAI は、Hugging Face に連絡して、影響を受けているかどうかを尋ねました。 - 7 月 20 日: OpenAI は、調査で見つかった Hugging Face 認証情報を取り消すための支援を Hugging Face に求めました。ハグ・フェイスは、すでに取り消されたと伝えた。"}, {"title": "法人経営の悩み、中小企業診断士に相談　福井県社協が支援拠点と連携し窓口開設 - 福祉新聞Web", "url": "https://fukushishimbun.com/jinzai/45778", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-07 10:00", "description": "福井県社会福祉協議会はよろず支援拠点と連携して毎月第１、３火曜、社会福祉法人の経営の悩みを受け付け、分析結果を基にアドバイスする「専門経営相談窓口」を開設した。中小企業診断士である同拠点コーディネーターが対応する。事前予約制で利用無料。 県社協では「社会福祉施設経営相談室」を常設するが、理事会やガバナンス、会計、労務管理など自治体の監査に関する事務的な悩みへの対応が中心だ。 一方、県内では人口減少や職員確保難が深刻化する中、社会福祉法人の事業継続は喫緊の課題だ。今後の経営の在り方について方策を検討してもらうきっかけになればと、国が全国に設置する経営相談所「よろず支援拠点」と連携して社会福祉法人の経営相談に特化した窓口を月２回開設することにした。 公定価格制度下でのコスト削減や生産性向上▽中長期計画の策定▽事業の拡張・縮小、事業承継、譲渡（受）の検討▽将来の利用者減少を見据えた法人の統合・合併の検討―などについて、中小企業診断士が無料で相談に応じ、経営分析を基にアドバイスする。 相談する法人は原則、全国社会福祉法人経営者協議会が提供する会員限定の経営分析ツール「経営協ドック」を受診して結", "content": "法人経営の悩み、中小企業診断士に相談 福井県社協が支援拠点と連携し窓口開設\n2026年08月07日 福祉新聞編集部福井県社会福祉協議会はよろず支援拠点と連携して毎月第１、３火曜、社会福祉法人の経営の悩みを受け付け、分析結果を基にアドバイスする「専門経営相談窓口」を開設した。中小企業診断士である同拠点コーディネーターが対応する。事前予約制で利用無料。\n県社協では「社会福祉施設経営相談室」を常設するが、理事会やガバナンス、会計、労務管理など自治体の監査に関する事務的な悩みへの対応が中心だ。\n一方、県内では人口減少や職員確保難が深刻化する中、社会福祉法人の事業継続は喫緊の課題だ。今後の経営の在り方について方策を検討してもらうきっかけになればと、国が全国に設置する経営相談所「よろず支援拠点」と連携して社会福祉法人の経営相談に特化した窓口を月２回開設することにした。\n公定価格制度下でのコスト削減や生産性向上▽中長期計画の策定▽事業の拡張・縮小、事業承継、譲渡（受）の検討▽将来の利用者減少を見据えた法人の統合・合併の検討―などについて、中小企業診断士が無料で相談に応じ、経営分析を基にアドバイスする。\n相談する法人は原則、全国社会福祉法人経営者協議会が提供する会員限定の経営分析ツール「経営協ドック」を受診して結果を持参する必要がある。経営協会員ではない県内法人が相談を希望する場合、全国経営協が協力して一定期間試行的に利用できるようにする。\n県社協の担当者は「相談で寄せられた悩みや課題、これらに対する助言はホームページなどで公開して他の社会福祉法人の参考にしてもらう。今秋には経営に特化したセミナーも開きたい」と話した。\n同窓口への相談は福井県社会福祉センター（福井市）に来所またはオンラインでも可能。毎月第１、３火曜午後１～５時まで。相談希望日の営業日５日前までに電話（０７７６・２４・２３４７）で申し込む。", "summary": "法人経営の悩み、中小企業診断士に相談 福井県社協が支援拠点と連携し窓口開設\n2026年08月07日 福祉新聞編集部福井県社会福祉協議会はよろず支援拠点と連携して毎月第１、３火曜、社会福祉法人の経営の悩みを受け付け、分析結果を基にアドバイスする「専門経営相談窓口」を開設した。今後の経営の在り方について方策を検討してもらうきっかけになればと、国が全国に設置する経営相談所「よろず支援拠点」と連携して社会福祉法人の経営相談に特化した窓口を月２回開設することにした。相談する法人は原則、全国社会福祉法人経営者協議会が提供する会員限定の経営分析ツール「経営協ドック」を受診して結果を持参する必要がある。経営協会員ではない県内法人が相談を希望する場合、全国経営協が協力して一定期間試行的に利用できるようにする。", "categories": ["施設運営・経営", "福祉・社会保障"], "is_new": false}, {"title": "One-shotting a Raccoon Heist game using Claude Fable 5", "url": "https://simonwillison.net/2026/Aug/5/raccoon-heist/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-08-06 04:42", "description": "Back in 2022 I tweeted screenshots of a game concept generated by GPT-3 and some concept \"art\" created using DALL-E. Today, on the fourth anniversary of that tweet, I decided to see if Claude Fable 5 (running in Claude Code for web ) could build the entire game from the content of that tweet. It did a pretty good job of it! You can play the game here . Here's the GitHub repo , and a short video demo: Your browser does not support HTML5 video. How I built this This is the August 5th, 2022 tweet :", "content": "One-shotting a Raccoon Heist game using Claude Fable 5\n5th August 2026\nBack in 2022 I tweeted screenshots of a game concept generated by GPT-3 and some concept “art” created using DALL-E. Today, on the fourth anniversary of that tweet, I decided to see if Claude Fable 5 (running in Claude Code for web) could build the entire game from the content of that tweet. It did a pretty good job of it!\nYou can play the game here. Here’s the GitHub repo, and a short video demo:\nHow I built this\nThis is the August 5th, 2022 tweet:\nMy GPT-3 prompt back then was:\nWrite a detailed product description of a computer game where a team of raccoons go on heists.\nThis was in the text completion days, where you asked GPT-3 to complete the rest of the text. It completed:\nIn “Raccoon Heist”, you and your team of thieving raccoons are tasked with pulling off a series of daring heists. From robbing banks to stealing priceless art, no job is too big or too small for your furry crew. You’ll need to use your wits and your skills to avoid the police and make a clean getaway with the loot. With exciting gameplay and a charming cast of characters, “Raccoon Heist” is the perfect game for anyone looking for a light-hearted caper.\nMy prompt to DALL-E was short:\nScreenshot from a video game where a team of raccoons go on a heist\nToday’s experiment: can I dump those screenshots into Fable 5 with a prompt telling it to write a game, then leave it to its own devices and get a working game at the end?\nSetting Claude Code for web up to use GitHub Pages\nA frustrating thing about Claude Code for web is that it can be hard to test what it’s working on while it’s still working.\nI’ve been using GitHub Pages to work around that limitation, and found it to work really well.\nHere’s my process:\n- Create a new repository for the project at https://github.com/new—this can be public or private, the trick works equally well for both.\n- Start a Claude Code for web session, in the Claude iPhone or Desktop apps or in the browser at https://claude.ai/code\n- Tell Claude what to work on, and encourage it to commit an\nindex.html\npage as quickly as possible. This will create a branch with a name likeclaude/3d-raccoon-heist-game-50n293\n- Navigate to the Settings -> Pages area for the repository (\ngithub.com/simonw/raccoon-heist/settings/pages\nin my case), select “Deploy from a branch”, pick the branch name, and hit Save.\nThat’s all it takes! Within about 30 seconds of each push the latest content will be visible at yourname.github.io/your-repo/\n.\nIf you do this with a private repo, anyone who can guess the name of the repo will be able to view the published content. I don’t worry much about this myself.\nThe Fable 5 prompt\nHere’s the prompt I gave Fable 5 (written in the notes app on my phone—this entire project was conducted on mobile). I accompanied it with the two images from the original tweet.\nBuild this 3D game, for the browser.\nThis repo is configured to serve static files so make sure there is an index.html that loads everything else.\nMake sure it is mobile-friendly (touch controls, works well on small screens).\nYou have an OpenAI API key and access to their image generation model APIs, use that for textures to use with your 3D models. Docs here: https://developers.openai.com/api/docs/guides/image-generation - use gpt-image-2\nWork independently - do not ask me to make any further design decisions. Make sure the game is fun, a little surprising, has good raccoon heist vibes, and is visually pleasing.\nCommit and push as often as possible so I can preview your work - start with an index.html that presents a title screen, then build from there.\nAppend to a notes.md file as you work, including your changes to that as part of every commit.\nI didn’t make any technology choices. I assumed (correctly) that it would probably use Three.js based on previous experiments.\nGiving Claude access to an OpenAI key turns out to work really well for filling in gaps in its capabilities—in this case we needed some way to generate images to use as textures. Fable is very good at prompting image generators!\nI said “Work independently—do not ask me to make any further design decisions” because I wanted to see if it could produce a full, working game without any further input from me.\nI also said “Commit and push as often as possible so I can preview your work”. When you use Claude Code in the Claude iPhone app you give it a GitHub repository and it works in a branch. Telling it to “push as often as possible” means commits start landing in that branch straight away.\nI like asking for notes.md\nas a bit of added flavor—here’s that finished file, and the entry it made when it added the dog:\nNew escalation: from night 3 the yards get a patrolling guard dog — a low-poly brown hound with a spiked red collar and a wagging tail. It wanders between random spots, and within 12 units it catches your scent and tracks you by smell (line of sight is irrelevant — it’s all nose, shown by a 👃 over its head and barking). It gives up if you open a 17-unit gap. Getting caught messages are now source-specific: guard / headlights / hound. Verified wander → track → caught with an automated test.\nReviewing the transcript\nYou can access the Claude Code shared session, and I also used my claude-code-transcripts tool to export my own HTML version which you can find here.\nFable started with an index page, vendored a copy of Three.js, then wrote its own gen_textures.py script (copy here).\nIt generated the textures and spot-checked them to make sure they looked OK. The metal.jpg file it generated for the trash can looks like this, though I don’t think it was applied exactly right in the game itself:\nThen it built out the first basic version of the game, then decided to “smoke-test in the pre-installed Chromium” using Playwright. This meant it could take screenshots of its own work and eyeball them. It did that for both desktop and mobile widths of the page, then noticed that the raccoon was invisible at mobile widths, so it fixed that:The raccoon, dumpster hideout, and both crew raccoons are now perfectly visible on mobile. Committing this critical fix.\nIt decided to generate a title screen, which it did using this gen_title.py script. Here’s the gpt-image-2\nprompt it used for that:\nVideo game key art, low-poly 3D render style, moody nighttime scene: a cute low-poly raccoon wearing a tiny black burglar mask sneaking on its hind legs carrying a glowing gold coin, next to a tipped-over metal trash can, suburban house with warm glowing windows in the background, deep blue night, full moon, fireflies, cinematic rim lighting, charming heist caper mood. No text, no words, no logos.\nAnd the resulting image (which Claude thought was “gorgeous”)—though I note that when it’s shown on desktop it gets cropped to just the top third without the raccoon!\nThen my favorite change: it added the dog:\nexport function makeDog() {\nconst g = new THREE.Group();\nconst BROWN = 0x8a6440, DARK = 0x5e4128;\nconst body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), M(BROWN));\nbody.scale.set(0.9, 0.8, 1.5);\nbody.position.y = 0.55;\nbody.castShadow = true;\ng.add(body);\nconst head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), M(BROWN));\nhead.position.set(0, 0.85, 0.62);\ng.add(head);\nconst snout = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), M(DARK));\nsnout.scale.set(0.9, 0.7, 1.3);\nsnout.position.set(0, 0.76, 0.9);\ng.add(snout);\nconst nose = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), M(BLACK));\nnose.position.set(0, 0.78, 1.08);\ng.add(nose);\nfor (const s of [-1, 1]) {\nconst ear = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), M(DARK));\near.scale.set(0.7, 1.3, 0.5);\near.position.set(0.2 * s, 1.08, 0.55);\ng.add(ear);\nconst eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), M(0x1a1a1a, { emissive: 0x331111 }));\neye.position.set(0.13 * s, 0.92, 0.86);\ng.add(eye);\n}\nconst tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.5, 6), M(DARK));\ntail.position.set(0, 0.8, -0.62);\ntail.rotation.x = 0.8;\ng.add(tail);\n// spiked collar\nconst collar = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 6, 12), M(0xc0392b));\ncollar.position.set(0, 0.78, 0.5);\ncollar.rotation.x = Math.PI / 2.4;\ng.add(collar);\nconst legGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.34, 6);\nconst legs = [];\nfor (const [x, z] of [[-0.22, 0.35], [0.22, 0.35], [-0.22, -0.35], [0.22, -0.35]]) {\nconst leg = new THREE.Mesh(legGeo, M(DARK));\nleg.position.set(x, 0.17, z);\ng.add(leg);\nlegs.push(leg);\n}\nlet phase = Math.random() * 10;\nreturn {\ngroup: g,\nanimate(dt, speed) {\nphase += dt * (3 + speed * 10);\nconst amp = Math.min(0.6, 0.1 + speed * 0.6);\nlegs[0].rotation.x = Math.sin(phase) * amp;\nlegs[3].rotation.x = Math.sin(phase) * amp;\nlegs[1].rotation.x = -Math.sin(phase) * amp;\nlegs[2].rotation.x = -Math.sin(phase) * amp;\ntail.rotation.z = Math.sin(phase * 1.5) * 0.4;\nbody.position.y = 0.55 + Math.abs(Math.sin(phase)) * 0.04 * (0.3 + speed);\n},\n};\n}\nAnd did a round of testing on it using Playwright, including another screenshot.\n// walk near the dog\nawait page.evaluate(() => { const d = window.__rh.dog; window.__rh.teleport(d.x + 6, d.z); });\nawait page.waitForTimeout(2000);\ninfo = await page.evaluate(() => JSON.stringify({ dog: window.__rh.dog, state: window.__rh.state, player: window.__rh.debug().player }));\nconsole.log('after approach:', info);\nawait page.waitForTimeout(3000);\ninfo = await page.evaluate(() => JSON.stringify({ dog: window.__rh.dog, state: window.__rh.state }));\nconsole.log('after chase:', info);\nawait page.screenshot({ path: __dirname + '/shot-dog.png' });\nIt made a few more tweaks, then declared itself done:\nRaccoon Heist is built, tested, and pushed — 7 commits on\nclaude/3d-raccoon-heist-game-50n293\n, all verified with automated Playwright playthroughs on desktop, portrait-phone, and landscape-phone viewports.The game: You’re a masked raccoon sneaking out of your crew’s dumpster hideout into a moonlit cul-de-sac. Grab coins, gems, rings, donuts, and fish (they visibly stack on your back and slow you down), then waddle home and bank them before dawn. Each night raises the goal and the heat: night 1 has one flashlight-sweeping guard, night 2 has two, night 3 adds a scent-tracking hound that ignores line-of-sight entirely. A police cruiser sweeps the street with headlights, homeowners randomly peek out of windows, a seagull periodically dive-bombs your unclaimed loot, pizza slices trigger a 6-second speed FRENZY, and a rare golden TV is worth 120 points if you can haul its weight home. Win ranks: TRASH PANDA ⭐ → CAT BURGLAR ⭐⭐ → MASTER OF DISGUISE ⭐⭐⭐, with your best run saved to localStorage.\nHow it’s built: Vendored Three.js (no CDN), procedural low-poly characters, and a procedural WebAudio soundtrack (sneaky walking-bass jazz plus all sound effects — zero audio files). All seven ground/wall textures and the title-screen hero art were generated with gpt-image-2 and committed as static assets, so the deployed game makes no API calls. Mobile gets a dynamic touch joystick (appears wherever you touch) plus a DASH button; desktop uses WASD/arrows and Space.\nTesting caught two real bugs worth mentioning: the canvas rendered at 2× size on any real phone (a\ncssText\nassignment was wiping Three.js’s inline sizing — desktop DPR-1 tests masked it completely), and the win screen’s star-rating div inherited the title screen’s full-screen.stars\nCSS and silently swallowed every tap on the “next night” button. Both are fixed and regression-tested, along with pickup, banking, chase/caught, dawn, night progression, and lose/retry flows.\nnotes.md\nhas the full build log. The game is live on the branch — just serve the repo root and openindex.html\n.\nIs the game any good?\nIt’s an impressive starting point, but it’s not a good game.\nYou move your raccoon around a yard collecting items—donuts, fish, gold coins, jewels—while avoiding guards with flashlights and, in later levels, a dog. You have a limited carrying capacity, and once that’s full you need to drop stuff off at the dumpster. If you pick up a pizza slice you get a temporary speed boost.\nThere are no team mechanics at all—there are two other static raccoons next to the dumpster but they’re purely decoration.\nIt gets slightly more challenging as the levels progress—the dog introduced in level 3 is the most interesting new mechanic—but it’s very, very easy to beat. It’s also pretty boring—each night has a fixed duration and you can collect all of the items and then have nothing else to do while waiting for the dawn.\nI was impressed by the implementation. It’s fully 3D, there are trash cans, the flashlight illumination cones are fun, and it has a reasonably coherent visual style. It works on mobile. The music (“a procedural WebAudio soundtrack (sneaky walking-bass jazz plus all sound effects — zero audio files)” according to Claude) is simple but feels about right.\nAs a finished game project, it’s mediocre. As a starting point from a single prompt I think it’s very impressive.\nI’ve vibe coded up quite a few games now. They’ve all been deeply disappointing from a gameplay perspective—it turns out designing games that are fun remains a uniquely human trait, and one which requires significantly more skill and experience than either Claude or I can bring to bear.\nThat said, I thoroughly recommend tinkering with game development projects as a way to explore the capabilities of agents. It’s a fun, low-risk way to try out new things. If you stick at it long enough you might even produce something that’s worth playing!\nUpdate 7th August 2026: I posed the same prompt to OpenAI Codex Desktop running GPT-5.6 Sol Ultra and got a significantly better result—GPT-5.6 Sol picked up on the importance of the squad of raccoons going on a heist, and built a game where you must rescue your two crewmates in a museum and then stack on top of them to steal the Golden Sardine.", "summary": "You can play the game here. Build this 3D game, for the browser. Then my favorite change: it added the dog:\nexport function makeDog() {\nconst g = new THREE.Group();\nconst BROWN = 0x8a6440, DARK = 0x5e4128;\nconst body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), M(BROWN));\nbody.scale.set(0.9, 0.8, 1.5);\nbody.position.y = 0.55;\nbody.castShadow = true;\ng.add(body);\nconst head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), M(BROWN));\nhead.position.set(0, 0.85, 0.62);\ng.add(head);\nconst snout = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), M(DARK));\nsnout.scale.set(0.9, 0.7, 1.3);\nsnout.position.set(0, 0.76, 0.9);\ng.add(snout);\nconst nose = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), M(BLACK));\nnose.position.set(0, 0.78, 1.08);\ng.add(nose);\nfor (const s of [-1, 1]) {\nconst ear = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), M(DARK));\near.scale.set(0.7, 1.3, 0.5);\near.position.set(0.2 * s, 1.08, 0.55);\ng.add(ear);\nconst eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), M(0x1a1a1a, { emissive: 0x331111 }));\neye.position.set(0.13 * s, 0.92, 0.86);\ng.add(eye);\n}\nconst tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.5, 6), M(DARK));\ntail.position.set(0, 0.8, -0.62);\ntail.rotation.x = 0.8;\ng.add(tail);\n// spiked collar\nconst collar = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 6, 12), M(0xc0392b));\ncollar.position.set(0, 0.78, 0.5);\ncollar.rotation.x = Math.PI / 2.4;\ng.add(collar);\nconst legGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.34, 6);\nconst legs = [];\nfor (const [x, z] of [[-0.22, 0.35], [0.22, 0.35], [-0.22, -0.35], [0.22, -0.35]]) {\nconst leg = new THREE.Mesh(legGeo, M(DARK));\nleg.position.set(x, 0.17, z);\ng.add(leg);\nlegs.push(leg);\n}\nlet phase = Math.random() * 10;\nreturn {\ngroup: g,\nanimate(dt, speed) {\nphase += dt * (3 + speed * 10);\nconst amp = Math.min(0.6, 0.1 + speed * 0.6);\nlegs[0].rotation.x = Math.sin(phase) * amp;\nlegs[3].rotation.x = Math.sin(phase) * amp;\nlegs[1].rotation.x = -Math.sin(phase) * amp;\nlegs[2].rotation.x = -Math.sin(phase) * amp;\ntail.rotation.z = Math.sin(phase * 1.5) * 0.4;\nbody.position.y = 0.55 + Math.abs(Math.sin(phase)) * 0.04 * (0.3 + speed);\n},\n};\n}\nAnd did a round of testing on it using Playwright, including another screenshot. Is the game any good?.", "categories": ["AIツール・生産性", "組織・心理"], "is_new": true, "title_ja": "Claude Fable 5 を使用したワンショットの Raccoon Heist ゲーム", "summary_ja": "ここでゲームをプレイできます。ブラウザ用にこの 3D ゲームを構築します。それから私のお気に入りの変更は、犬を追加したことです。\nエクスポート関数 makeDog() {\nconst g = 新しい THREE.Group();\nconst BROWN = 0x8a6440、DARK = 0x5e4128;\nconst body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), M(BROWN));\nbody.scale.set(0.9, 0.8, 1.5);\nbody.position.y = 0.55;\nbody.castShadow = true;\ng.add(本体);\nconst head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), M(BROWN));\nhead.position.set(0, 0.85, 0.62);\ng.add(ヘッド);\nconst snout = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), M(DARK));\nsnout.scale.set(0.9, 0.7, 1.3);\nsnout.position.set(0, 0.76, 0.9);\ng.add(鼻);\nconst names = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), M(BLACK));\n鼻の位置セット(0, 0.78, 1.08);\ng.add(鼻);\nfor (const s of [-1, 1]) {\nconst Ear = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), M(DARK));\nEar.scale.set(0.7, 1.3, 0.5);\nEar.position.set(0.2 * s, 1.08, 0.55);\ng.add(ear);\nconst eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), M(0x1a1a1a, { emissive: 0x331111 }));\neye.position.set(0.13 * s, 0.92, 0.86);\ng.add(目);\n}\nconst tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.09, 0.5, 6), M(DARK));\ntail.position.set(0, 0.8, -0.62);\n尾回転x = 0.8;\ng.add(テール);\n// スパイク付きの首輪\nconst Collar = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 6, 12), M(0xc0392b));\ncolor.position.set(0, 0.78, 0.5);\ncolor.rotation.x = Math.PI / 2.4;\ng.add(首輪);\nconst LegGeo = new THREE.CylinderGeometry(0.07, 0.09, 0.34, 6);\nconst 脚 =
