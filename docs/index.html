us beep with Claude\n9th November 2026\nOur house has a box room, full of boxes that we still haven’t unpacked from our last move. A couple of weeks ago something in that room started intermittently beeping. The beeps were far enough apart that standing in the room and trying to determine the source of the noise was frustrating, and I really didn’t want to dig through every one of those boxes. So I had Claude Code build Beep Locator, a software system for triangulating the source of a mysterious beep using multiple devices scattered around the room.\nHere’s what Beep Locator looks like after it has been running for a while:\nYou run Python web server to show the primary UI, and then use the QR code or URL to connect as many devices as you can spare to act as listeners—I was using two iPads, a phone, a MacBook Pro and a Surface Ultra.\nThe devices then play noises to each other to help estimate their locations. This didn’t work particularly well, so I added a “Rough mode” where you can drag their icons around in the space to provide rough locations which are then adjusted based on those sounds.\nOnce that’s set up, the devices all listen for the beep!\nI added a clapping mode too so I could test it by clapping my hands in different locations around the room—displayed as diamonds on the map. This helped me gain confidence that it was capable of locating a sound.\nBeeps show up on the map as an X, plus a line in the “Sounds located” log. You can replay these sounds (from each device in turn) to confirm they are the mysterious beep you are looking for, then click “This is the mystery beep” to mark them as such.\nOnce you’ve confirmed the mysterious beep frequency the system will listen out for it, measure the interval between beeps, and use the triangulated locations to lock down the most likely location on the map.\nThe system worked as intended. It gave me the position of the beep to within about 40cm, then I dug through that specific pile of boxes and found an ancient carbon monoxide detector that desperately wanted its batteries replaced.\nHow it works\nWhen I started working through this problem with Claude it quickly dug up BeepBeep: A High-Accuracy Acoustic-Based System for Ranging and Localization Using COTS Devices, a 2007 paper by Chunyi Peng, Guobin Shen, Yongguang Zhang, Yanlin Li, and Kun Tan. Here’s that paper’s abstract:\nWe present the design, implementation, and evaluation of BeepBeep, a high-accuracy acoustic-based ranging system. It operates in a spontaneous, ad-hoc, and device-to-device context without leveraging any pre-planned infrastructure. It is a pure software-based solution and uses only the most basic set of commodity hardware – a speaker, a microphone, and some form of device-to-device communication – so that it is readily applicable to many low-cost sensor platforms and to most commercial-off-the-shelf mobile devices like cell phones and PDAs. It achieves high accuracy through a combination of three techniques: two-way sensing, self-recording, and sample counting.\nThat sounded exactly like what we needed to build!\nBeep Locator runs a Python web application server that does most of the work. The listening devices then connect to that server via WebSockets and present a UI which requests browser microphone access. The listeners mainly work by recording a 60 second buffer of recent audio. They also run a simple beep detection algorithm (see detector.js), which uses Fast Fourier Transform and a high-pass filter to identify potential beeps. It sends these events to the main server.\nWhen a beep is reported, the server has a device play a short chirp (the device with the lowest round-trip time to the server), then asks every listener upload a clip from about 0.6s before the beep to 0.8s after that chirp. This chirp allows the clips to be aligned with each other, a crucial step in locating the beep.\nHow I built it\nI started this project using Claude Code Cloud via my iPhone, with Opus 5.5 running in Extra thinking effort mode. Here’s that shared starter session, which began with this prompt against a newly created empty GitHub repository:\nWrite out a problem.md file describing the problem we want to solve\nThere is a device beeping in a room and I cannot find it\nI want to set up several devices - laptops, phones, iPads - around the room all listening at the same time and have them help triangulate where the beep comes from\nThere needs to be a Python web app which coordinates it all - one device shows a web page for the app, other devices join a URL which turns them into listeners - all via browser WebAudio and WebSockets back to the Python server app\nIdeally I wouldn't need to manually input the relative locations of the devices - it would be amazing if they could play sounds to each other in order to locate each other in 2D space - is that even possible though?\nThat got me this problem.md file. As part of writing that up Claude found and read the BeepBeep paper, which is described in that file.\nThe research looked good, so I told it:\nOk try and build it, add a mechanism so you can send new code to the listeners which they will then run automatically - that way I can set everything up in the room and then leave you alone to continue hacking and experiment while I do something else\nThat got me to this point—most of the system was built, but nothing had actually tried running it yet.\nI cloned the new repository to my laptop and fired up Claude Code... and then Fable 5.2 was released, and this project seemed like an excellent opportunity to put that through its paces.\nI had Claude Code on my laptop start the server running, then made sure it could both see what was happening and make live changes to the software as it ran.\nThis was already baked into the software: Opus 5.5 had built an installModule() method on the listeners that could be triggered over the WebSocket connection, meaning the admin server could execute arbitrary new code on any of its clients.\nOn some devices, web pages that listen on the microphone request user permission any time the page reloads. The hot-swap module mechanism meant that we could deploy new code without having to manually interact with each of the listening devices in turn.\nFrom that point on my involvement was mainly to sit by the laptop chatting with Fable 5.2 about what was going on, and occasionally requesting new features. Here are some of the feature prompts I ran:\nI think we need to make it so I can drag things around on the map in “rough mode”, where my job is just to put them roughly where they are, then switch out of rough mode and it attempts to get them accurate\nThis gave me the ability to drag listeners around the map.\nwhat’s a good way for me to test this I wonder? Can we have it listen for claps, then I could clap and it could identify the location of the clap? [...]\nClaps should use a different symbol on the map than beeps\nThat added the thing where any time I clapped it would show on the map as a different symbol from the beeps.\neach symbol on the map should include a HH:MM:SS timestamp\nThat made it easier to spot which symbol likely reflected which real-world sound.\nThe log should show beeps and claps with their timestamps AND have a little play button which, when clicked, replays the recorded noise from each of the listeners in sequence (with clear text on screen showing which listener recorded which snippet) while temporarily turning off microphone recording while that replay plays\nNow I could replay sounds, making it much easier to identify which recorded clip was the mysterious beep I was looking for.\nThere should be a button next to a recording for “This is the mystery beep” - then I can hit replay to see and then confirm it was the mystery beep if that’s the one I am looking for\nThen the system can categorize noises in the future to see if they are likely that same mysterious beep and use that information to build a more accurate idea of where it is\nAt this point I was getting close—I had a solid idea of where the beep was coming from, but wouldn’t it be neat if I could reposition the listeners around that point to get an even finer location?\nI want a feature for this, I don’t want to have to restart each listening device etc, I want to be able to click a “Reposition the devices” button which lets me switch into repositioning, then I click “Repositioned” and it puts me into Rough mode and asks me to roughly locate them, then I do that and click, then it starts up again. The previous session can be read-only viewed through the app.\nAnd since I had one spare device, I then said:\nadd a feature where the map includes a spot that is a suggestion for a location that it would be useful to add a listener at - based on data collected so far\nGiving Claude Code ears\nI think the most interesting part of this project is that I demonstrated it’s possible to give Claude Code ears.\nClaude doesn’t have native audio input (yet), but it can run JavaScript and Python code that can analyze audio captured by a microphone.\nI told it to run a web server with WebSocket connections to multiple listening devices, then had it both run a WebAudio microphone on those devices and hook them up so they could be sent fresh JavaScript code to execute via that WebSocket.\nThen I could pretty much leave Claude alone, hacking away at the problem, querying the audio logs, and reconfiguring its ears to help it solve the problem.\nI’m reminded of a similar hack I heard about at GitHub Universe a few weeks ago, where Martin Woodward told me he had been debugging the GitHub Universe Badge computers by plugging them into a computer via USB-C and then pointing a webcam at their screen, so his coding agent could tell if updates were working correctly or not.\nFiguring out ways to let coding agents perceive the world around them is a whole lot of fun.\nMore recent articles\n- Hide your slop PR descriptions behind <details><summary> - 9th November 2026\n- Qwen 3.8 27B on my laptop can interpret model weights, too - 3rd November 2026\n- The U.S. Census Bureau and “Super Intelligence” - 2nd November 2026\n- The October inflection point for vibe game development - 28th October 2026", "summary": "So I had Claude Code build Beep Locator, a software system for triangulating the source of a mysterious beep using multiple devices scattered around the room. The devices then play noises to each other to help estimate their locations. Once that’s set up, the devices all listen for the beep!. Can we have it listen for claps, then I could clap and it could identify the location of the clap?.", "categories": ["AIツール・生産性", "業務改善・介護テック"], "is_new": false, "title_ja": "Locating the source of a mysterious beep with Claude", "summary_ja": "So I had Claude Code build Beep Locator, a software system for triangulating the source of a mysterious beep using multiple devices scattered around the room. The devices then play noises to each other to help estimate their locations. Once that’s set up, the devices all listen for the beep!. Can we have it listen for claps, then I could clap and it could identify the location of the clap?."}, {"title": "Hide your slop PR descriptions behind <details><summary>", "url": "https://simonwillison.net/2026/Nov/9/details-summary/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-11-09 13:25", "description": "Most of the changes I make to my projects these days come in the form of PRs opened for me by Claude Code or Codex. The PR is my unit of work - I use them to bundle commits together, iterating on them until a feature is complete, document decisions and then merge the finished result. Today's coding agents are great at writing PR descriptions. They're too good at describing the work The problem is that they are too good. An agent-written PR description is accurate and comprehensive. It describes ", "content": "Hide your slop PR descriptions behind <details><summary>\n9th November 2026\nMost of the changes I make to my projects these days come in the form of PRs opened for me by Claude Code or Codex. The PR is my unit of work—I use them to bundle commits together, iterating on them until a feature is complete, document decisions and then merge the finished result. Today’s coding agents are great at writing PR descriptions.\nThey’re too good at describing the work\nThe problem is that they are too good. An agent-written PR description is accurate and comprehensive. It describes the problem, the detailed solution, and the steps taken to verify it. That’s a lot of information to absorb.\nIt’s not necessarily slop, but it reads like slop!\nIt’s very easy to spot an AI-written PR, and as with other forms of AI writing my instant reaction is best summarized as “I’m not reading all of that”. It doesn’t matter how accurate or useful the information is, I’m instantly put off by the thought that it will take me longer to read than it took the driving author to write... even when that driving author is me!\nI want human editorial judgement. I want someone to have thought just long enough about the PR to give me a human-approved introduction that helps me understand, at a high level, what the PR is for and whether it deserves more of my attention.\nI think I’ve found a low-effort way to do this that feels right.\nHide most of it in a details/summary\nThe HTML <details><summary>\nelements render as a collapsed heading (the summary) that can be expanded to view the larger piece of text. The code looks like this:\n<details>\n<summary>Claude Opus 5.5</summary>\n<h2>The hook</h2>\nPlugins implement <code>register_agent_reference_types(datasette)</code>...\n</details>\nWhen rendered, it looks like this:\nCrucially, <details><summary>\nis supported in GitHub Markdown. You can drop those tags directly into an issue comment or PR description and GitHub will hide the details and display just the summary plus an expansion arrow.\nI’ve started using this for my AI-generated pull requests.\nThe opening paragraph of my PRs will be carefully selected to act as a high-level explanation of what’s going on—the shortest text a human can read that will help get them up to speed.\nI’ll sometimes throw in a screenshot as well, since images are often the best way to quickly illustrate a new feature.\nThe full agent-written essay then follows in a <details><summary>\n. I use the model name and often the effort level as that summary, to make it abundantly clear what is going on—“Claude Opus 5.5 Medium” for example.\nMy PRs don’t feel nearly as sloppy now! The information is all still there, but a reader can glance at it and get the top, human-curated information without their eyes glazing over at multiple paragraphs of agent-written details.\nI don’t always write the introduction myself—sometimes the agent has given me what I need already, hidden away in the avalanche of other text. My promise to the reader is that the short opener will represent my human judgement as to what is definitely worth their time.\nHere are some recent examples where I’ve used this pattern, including the opener I used:\n-\ndatasette PR #3052: Redesign row page as a vertical list of fields—\"The row page showed its single row as a one-row table. For wide tables, like a 46-column GitHub\nrepos\ntable, that scrolled far off to the right and left most of the page blank.\" (then a screenshot) - datasette PR #3043: Pagination bar showing which rows are on the current page—“Table pages that span more than one page now make it obvious where you are, and offer navigation at the top of the page as well as the bottom.” (plus screenshot)\n-\ndatasette PR #3042: Load edit-tools.js on demand via a small loader—\"\nedit-tools.js\n(~220KB) was loaded on every table, row and database page, even for users who couldn’t edit anything. Now only load it for users who can edit when they first interact with an edit feature (including mouse over an edit link).\" -\ndatasette-agent PR #51: register_agent_reference_types plugin hook—\"Lets plugins add their own kinds of item to the\n#\ntagging in the chat composer using a newregister_agent_reference_types(datasette)\nplugin hook.\"—pictured above. -\nllm PR #1838: Add llm openai endpoint add/list/remove/path commands—\"Adds commands for managing the records in\nextra-openai-models.yaml\n, so OpenAI-compatible endpoints can be saved from the command line instead of by hand-editing YAML.\"—then copied--help\noutput.\nThe mnemonic\nI used to have trouble remembering the order of the tags—is it <details><summary>\nor <summary><details>\n?\nHere are two tricks that helped me.\nFirst, and most obviously, the <summary>\nis clearly the bit where you summarize the details. That’s the tag for your line of text that can be clicked to expand—the <details>\nelement must then wrap everything else.\nAn even better trick is to always refer to these two tags as “details-summary”.\n“details-summary” is two syllables followed by three syllables. That rolls off the tongue more smoothly than the three-two punch of “summary-details”.\nSay “details-summary” out loud just a few times and you’ll never forget the order of the tags again.\n(I still wish GitHub would add a button to their Markdown editor for this—partly to save me painstakingly typing it on my mobile keyboard, and partly to help spread the word to more GitHub users that this feature exists.)\nMore recent articles\n- Locating the source of a mysterious beep with Claude - 9th November 2026\n- Qwen 3.8 27B on my laptop can interpret model weights, too - 3rd November 2026\n- The U.S. Census Bureau and “Super Intelligence” - 2nd November 2026\n- The October inflection point for vibe game development - 28th October 2026", "summary": "</details>\nWhen rendered, it looks like this:\nCrucially, <details><summary>\nis supported in GitHub Markdown. The full agent-written essay then follows in a <details><summary>\n. The mnemonic\nI used to have trouble remembering the order of the tags—is it <details><summary>\nor <summary><details>\n?. “details-summary” is two syllables followed by three syllables.", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "Hide your slop PR descriptions behind <details><summary>", "summary_ja": "</details>\nWhen rendered, it looks like this:\nCrucially, <details><summary>\nis supported in GitHub Markdown. The full agent-written essay then follows in a <details><summary>\n. The mnemonic\nI used to have trouble remembering the order of the tags—is it <details><summary>\nor <summary><details>\n?. “details-summary” is two syllables followed by three syllables."}, {"title": "次期報酬案で強度行動障害の集中的支援加算を増額〈厚労省〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/series06/46185", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-11-09 10:00", "description": "厚生労働省は１０月３０日、２０２７年度障害福祉報酬改定を議論する検討チームに、強度行動障害のある人の支援に関する具体策を示した。状態の悪化した強度行動障害のある人を受け入れ、広域的支援人材による専門的支援を評価する「集中的支援加算」の報酬水準を引き上げ、専門性の高い支援が継続的に提供できるようにする。 強度行動障害は自閉症などの障害特性により自傷他害の著しい状態のこと。現場では職員を含めて支援体制が整わないことなどから受け入れが進んでいないが、強度行動障害のある人が希望したサービスを利用できるよう受け入れ基盤を充実させることが課題になっている。 広域的支援人材は高度な専門性を持ち、地域の事業所を指導、助言する人材。同加算の報酬は広域的支援人材の対価として十分ではなく、算定率も低いことなどから、厚労省は報酬水準を引き上げることを提案した。併せて、訪問支援と遠隔支援別の単価を設定することも検討する。 施設入所支援とグループホームが対象の「重度障害者支援加算」は、個別支援開始から１８０日以内の上乗せ分（初期加算）を、支援経過に応じた段階的な報酬設定にする。障害程度区分が低くても支援の負担が大", "content": "次期報酬案で強度行動障害の集中的支援加算を増額〈厚労省〉\n2026年11月09日 福祉新聞編集部厚生労働省は１０月３０日、２０２７年度障害福祉報酬改定を議論する検討チームに、強度行動障害のある人の支援に関する具体策を示した。状態の悪化した強度行動障害のある人を受け入れ、広域的支援人材による専門的支援を評価する「集中的支援加算」の報酬水準を引き上げ、専門性の高い支援が継続的に提供できるようにする。\n強度行動障害は自閉症などの障害特性により自傷他害の著しい状態のこと。現場では職員を含めて支援体制が整わないことなどから受け入れが進んでいないが、強度行動障害のある人が希望したサービスを利用できるよう受け入れ基盤を充実させることが課題になっている。\n広域的支援人材は高度な専門性を持ち、地域の事業所を指導、助言する人材。同加算の報酬は広域的支援人材の対価として十分ではなく、算定率も低いことなどから、厚労省は報酬水準を引き上げることを提案した。併せて、訪問支援と遠隔支援別の単価を設定することも検討する。\n施設入所支援とグループホームが対象の「重度障害者支援加算」は、個別支援開始から１８０日以内の上乗せ分（初期加算）を、支援経過に応じた段階的な報酬設定にする。 \nとはいえ、地域の期待は目に見えず、時代とともに変化し、その姿は地域ごとに異なる。「地域の実情に応じた支援」を実践することは決して容易ではない。地域に期待され続ける福祉とは何か。それがなかなか悩ましい。", "summary": "福祉だけを見ていては、地域の課題は解決できない。福祉の持続可能性とは、財政だけを意味するものではない。制度は福祉を支える基盤であり、地域の期待は福祉を育てる力でもある。地域に期待され続ける福祉とは何か。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "〈福祉施設職員退職手当共済〉支給要件「加入１年以上」から引き上げ - 福祉新聞Web", "url": "https://fukushishimbun.com/jinzai/46180", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-11-07 10:00", "description": "社会福祉施設職員等退職手当共済制度の在り方に関する検討会が２日に開かれ、厚生労働省は退職手当の支給対象となる加入期間を現行の１年以上から引き上げる方針を示した。具体的な年数は民間企業の状況などを踏まえて検討する。 退職手当制度は福祉施設などを経営する社会福祉法人が対象で、法人全体の約８割が加入している。個人負担はなく、法人が納付する掛け金で同じ年度に必要な退職手当を賄う賦課方式で運営されている。ただ、近年の処遇改善などにより給付が増え、掛け金の引き上げを抑える支払準備金の急速な減少が課題となっている。 会合で厚労省は、将来にわたって安定的に退職手当を支給できる制度とするため、給付と負担の双方を見直す必要があると説明。退職手当の支給対象者については、現行制度の加入１年以上から引き上げる方針を示した。 民間企業の状況も踏まえ、より長く働く人を評価する。すでに加入している職員には不利益がないよう経過措置も設ける。 現行制度では、退職前６カ月の本俸平均額を基に退職手当を算定する。これにより役職の辞任や職務の変更などで給与が減額される場合、一度退職するケースが少なくない。そのため厚労省は減額前の", "content": "〈福祉施設職員退職手当共済〉支給要件「加入１年以上」から引き上げ\n2026年11月07日 福祉新聞編集部社会福祉施設職員等退職手当共済制度の在り方に関する検討会が２日に開かれ、厚生労働省は退職手当の支給対象となる加入期間を現行の１年以上から引き上げる方針を示した。具体的な年数は民間企業の状況などを踏まえて検討する。\n退職手当制度は福祉施設などを経営する社会福祉法人が対象で、法人全体の約８割が加入している。個人負担はなく、法人が納付する掛け金で同じ年度に必要な退職手当を賄う賦課方式で運営されている。ただ、近年の処遇改善などにより給付が増え、掛け金の引き上げを抑える支払準備金の急速な減少が課題となっている。\n会合で厚労省は、将来にわたって安定的に退職手当を支給できる制度とするため、給付と負担の双方を見直す必要があると説明。退職手当の支給対象者については、現行制度の加入１年以上から引き上げる方針を示した。\n民間企業の状況も踏まえ、より長く働く人を評価する。すでに加入している職員には不利益がないよう経過措置も設ける。\n現行制度では、退職前６カ月の本俸平均額を基に退職手当を算定する。これにより役職の辞任や職務の変更などで給与が減額される場合、一度退職するケースが少なくない。そのため厚労省は減額前の給与を算定に用いることができるよう変更する考えも示した。\n同時に近年の賃金上昇を踏まえ、退職手当の計算基礎となる月額給与の上限３６万円についても引き上げる。\n一方、制度の安定運営に向け、法人が負担する掛け金の引き上げは避けられない見通し。ただ、厚労省は法人経営の予見可能性を高め、掛け金の引き上げ幅を平準化する方針を示した。\n掛け金を設定する際に収支の均衡を図る期間を現行のおおむね５年から、退職者の増加が見込まれる４０年ごろを見据えた期間に延長する。長期的な収支を見通すことで、掛け金の急激な引き上げを抑える狙いがある。\nさらに支払準備金が不足する場合には、必要に応じて福祉医療機構による借り入れも活用する考えを示した。\n検討会は今後２回ほど開いて、最終的な取りまとめを行う。", "summary": "〈福祉施設職員退職手当共済〉支給要件「加入１年以上」から引き上げ\n2026年11月07日 福祉新聞編集部社会福祉施設職員等退職手当共済制度の在り方に関する検討会が２日に開かれ、厚生労働省は退職手当の支給対象となる加入期間を現行の１年以上から引き上げる方針を示した。退職手当制度は福祉施設などを経営する社会福祉法人が対象で、法人全体の約８割が加入している。退職手当の支給対象者については、現行制度の加入１年以上から引き上げる方針を示した。現行制度では、退職前６カ月の本俸平均額を基に退職手当を算定する。", "categories": ["施設運営・経営", "福祉・社会保障"], "is_new": false}, {"title": "Qwen 3.8 27B on my laptop can interpret model weights, too", "url": "https://simonwillison.net/2026/Nov/3/qwen-can-interpret-model-weights/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-11-04 01:29", "description": "Yesterday's hot paper was Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights by Rikiya Takehi, Jayden Teoh, Alex Zhang, and Omar Khattab. The paper (OK, the authors classify is as a \"blog post\", but it's paper-shaped) found that frontier models, in particular GPT-6 Astra, can both interpret and modify the raw weights of a machine learning model - literally a text description of the model containing a bunch of floating point numbers. I've been playing with o", "content": "Qwen 3.8 27B on my laptop can interpret model weights, too\n3rd November 2026\nYesterday’s hot paper was Sparks of Weight-Space Programming: LLMs can natively read & write neural network weights by Rikiya Takehi, Jayden Teoh, Alex Zhang, and Omar Khattab. The paper (OK, the authors classify is as a “blog post”, but it’s paper-shaped) found that frontier models, in particular GPT-6 Astra, can both interpret and modify the raw weights of a machine learning model—literally a text description of the model containing a bunch of floating point numbers. I’ve been playing with one of the examples from the paper and I’m delighted to share that Qwen 3.8 27B running on my laptop can do this as well!\nWeight-Space Programming\nHere’s the highlight from their abstract, describing impressive capabilities for GPT-6 Astra and coining the term Weight-Space Programming for when LLMs analyze and modify model weights:\nJust by looking at the raw weights, GPT-6 Astra can tell what a network was trained to do. And without any environment feedback, it has no trouble writing, from scratch, small game-playing networks that outplay networks trained with PPO for 100 million steps.\nLikewise, asked to make Qwen3.5-0.8B better at math without gradients, Astra identifies an issue in its weights causing reasoning loops that Qwen’s own model card warns about, and fixes this by natively editing 0.016% of the weights. With the same sampling settings, this weight correction raises MATH-500 from 7.9% to 48.1% and generalizes out of the box to instruction following, raising IFEval by 3x.\nAll of this is possible without allowing Astra to write training loops. It uses its reasoning to figure out what each part of a neural network computes, or should compute, and changes the weights accordingly. We call this Weight-Space Programming.\nThe paper combines two topics that I think deserve to be treated separately. The first is what models can do with raw weights without running tools or executing code. The second explores how well models, once armed with code, can run operations to update and improve other models.\nspaCy author Matthew Honnibal called the paper misleading for conflating the two, and Sean Goedecke deconstructed the Qwen3.5-0.8B update example as taking the same steps that a human ML researcher would use.\nI’m going to focus on the no-tools question, which I think is the more interesting of the two.\nThe paper presents the first question as Can LLMs understand model behaviors from weights? They trained four neural networks to play simplified 10x10 grid versions of four classic computer games—Breakout, Pong, Pac-Man, and Freeway (I had to look that one up, it’s an Atari 2600 game from 1981). Then they fed those weights (as floating point numbers) to an LLM along with the following question:\nThe weights below belong to one policy network that was trained with reinforcement learning to play a game on this grid. Which game was it trained on? Work from the weights. You have no tools: no code execution, no calculator, nothing to run. This is a single response.\nThe GitHub repository that accompanies the paper is RikiyaT/lm_understand-logs. The exp1_which_game folder contains the prompts they used, with weights for the four games:\nI checked and, aside from the weights, each prompt is identical to the others.\nTrying it out with Qwen 3.8 27B and other models\nThe prompts on GitHub are self-contained. My LLM tool has a -f/--fragment\noption which can be passed the URL to a text file to use as a prompt, which means I can run any of the above like this:\nllm -f https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/refs/heads/main/exp1_which_game/runs/breakout/prompt.txt \\\n-m openrouter/moonshotai/kimi-k3.1-pro\nThis example requires the llm-openrouter plugin installed, and runs the Breakout prompt against Kimi K3.1 Pro via OpenRouter. Here’s what I got back from Kimi K3.1 Pro, which successfully guessed Breakout after 9m 41s and 19,493 reasoning tokens.\nBut how about Qwen 3.8 27B? That’s still my favorite model to run on my own laptop—it’s just 17GB (I use this version) and somehow feels close to the leading proprietary models of 2025.\nI fired up LM Studio, ensured Qwen 3.8 27B was loaded with a long context window (the default 8192 context failed with errors), installed the llm-lmstudio plugin and ran this command:\nLMSTUDIO_TIMEOUT=900 \\\nllm -f https://raw.githubusercontent.com/RikiyaT/lm_understand-logs/refs/heads/main/exp1_which_game/runs/pacman/prompt.txt \\\n-m lmstudio/qwen/qwen3.8-27b\n(I had to bump the timeout up using an environment variable, see this issue.)\nAfter 46m 12s and 43,506 reasoning tokens, Qwen on my laptop returned a response that ended like this (here’s the reasoning trace):\nGame: A simplified Pac-Man-style gridworld: an agent moves through a fixed 8x8 maze with central and corner wall blocks, moving objects/ghosts, and reward targets/pellets.\nDescription: The agent navigates a fixed maze-like 8x8 board, using current agent/moving-object/previous-frame cues to move through corridors, collect reward-target cells, and avoid moving objects or hazards.\nConfidence: 72%\nThis is impressive. I tried it on two of the other games as well. It identified Pong (reasoning) in 1h 4m 54s:\nPong — specifically a Pong-like paddle/ball game where the agent controls a vertical paddle on the right side and must move up/down to intercept or return a moving ball/reward object.\nDescription:\nThe agent moves a right-side paddle vertically to hit or catch a moving ball-like reward target moving across the 8×8 field, while a left-side moving object/opponent and wall borders define the play; reward is obtained by successfully intercepting/returning/scoring the ball, and missing or failing to hit it is penalized.\nConfidence:\n75%\nAnd Breakout (reasoning) in 52m 25s:\nGame: Breakout, or an Arkanoid-like paddle/ball/brick game.\nDescription: The agent is a paddle on the bottom row and moves left/right to keep a ball in play; the ball moves around the upper grid, and bricks/reward targets in the top rows give reward when hit, while missing the ball/hitting the bottom wall ends the episode or gives penalty.\nConfidence: 88%\nQwen failed at the Freeway prompt, which didn’t surprise me considering that game is more obscure than the other three. Here’s that transcript—Qwen thought it was “A simplified Pac-Man-like grid game: agent moves 4-directionally”.\nThe reasoning traces are fun to skim, and almost incomprehensible. Here’s a sample:\nWhat about agent channel0? We see some large channel0 rows near row8 col7/8 and maybe bottom? Let’s list channel0 large: line436 input435 (row8 col7 ch0) -2.107,1.169,0.513...; line441 input440 (row8 col8 ch0) -0.376,0.010,1.564,3.855...; line445 input444 (row8 col8 ch4) 0.142,0.491...; line382? input381 ch0? Wait line382 input381: 381//5=76 (row7 col6), ch1? 381%5=1? 76 * 5=380, ch1. So not. Channel0 large maybe at row8 col7/8 only. Also top row? line44 input43 ch3, line49 ch3. Channel0 large maybe not many. Agent position could be near bottom-right? If the agent is typically at bottom-right?\nThat said though, I expect a sufficiently experienced human being armed with a notepad and a pencil could get there with enough effort.\nIt’s a cool paper, but some of the wider commentary I’ve seen around it does not feel justified. I’m not ready to declare that the age of source code is over and our future involves incomprehensible machines editing their own model weights in incomprehensible ways.\nMore recent articles\n- Locating the source of a mysterious beep with Claude - 9th November 2026\n- Hide your slop PR descriptions behind <details><summary> - 9th November 2026\n- The U.S. Census Bureau and “Super Intelligence” - 2nd November 2026\n- The October inflection point for vibe game development - 28th October 2026", "summary": "Which game was it trained on?. Work from the weights. Confidence:\n75%\nAnd Breakout (reasoning) in 52m 25s:\nGame: Breakout, or an Arkanoid-like paddle/ball/brick game. If the agent is typically at bottom-right?.", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "Qwen 3.8 27B on my laptop can interpret model weights, too", "summary_ja": "Which game was it trained on?. Work from the weights. Confidence:\n75%\nAnd Breakout (reasoning) in 52m 25s:\nGame: Breakout, or an Arkanoid-like paddle/ball/brick game. If the agent is typically at bottom-right?."}, {"title": "The U.S. Census Bureau and “Super Intelligence”", "url": "https://simonwillison.net/2026/Nov/2/census-bureau-super-intelligence/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-11-02 22:31", "description": "I was reminded today of AI Adoption Rate Trending Down for Large Companies , a chart produced by Apollo Global Management in September 2025, which appeared to show a slowdown in U.S. corporate AI adoption based on numbers collected by the U.S. Census Bureau. At the time I used that chart to demonstrate GPT-5 data analysis , and then to experiment with Claude's new Code Interpreter . I decided to try running those numbers again to see what had changed over the past year, and in doing so learned t", "content": "The U.S. Census Bureau and “Super Intelligence”\n2nd November 2026\nI was reminded today of AI Adoption Rate Trending Down for Large Companies, a chart produced by Apollo Global Management in September 2025, which appeared to show a slowdown in U.S. corporate AI adoption based on numbers collected by the U.S. Census Bureau. At the time I used that chart to demonstrate GPT-5 data analysis, and then to experiment with Claude’s new Code Interpreter. I decided to try running those numbers again to see what had changed over the past year, and in doing so learned that the Bureau has fallen foul of Executive Order 14434, aka the asinine Super Intelligence one.\nFirst, the updated chart\nEvery two weeks the U.S. Census Bureau runs a survey called the Business Trends and Outlook Survey (aka BTOS). Each time it goes to 200,000 businesses out of 1.2 million total—the surveyed group (a “panel”) cycles such that an individual business only completes the survey every twelve weeks.\nThe latest data is published on alternating Thursdays at 10am.\nI used the most recent numbers (published October 22, 2026) to create a new version (GPT-6 Astra Extra High transcript) of the AI adoption chart, updated to reflect both the last twelve months and a change that was made to the survey question sent out by the Bureau:\nHere’s a link to the larger image.\nFor comparison, here’s that AI adoption chart from last year (my GPT-5 version):\nIn September 2025 the largest (250+ employees) companies answered “yes” around 12% of the time to the question about whether they used AI in “producing goods or services”.\nUnder the new “any business function” wording, by February 2026, those same large companies answered “yes” around 30% of the time, and by October 2026 that had increased to around 40%.\nThe data in the above chart comes from the “Employment size class” XLSX file, available from here. Here’s a copy of the file I used.\nYou can view the survey document that is sent out to businesses—here’s my snapshot copy of that 346KB PDF.\nThe changing language of the questions\nAs the chart demonstrates, the question asked by the Bureau changed in a material way on November 17th, 2025. Prior to that date, the question they asked was this (emphasis mine):\nIn the last two weeks, did this business use Artificial Intelligence (AI) in producing goods or services? (Examples of AI: machine learning, natural language processing, virtual agents, voice recognition, etc.)\nOn December 3rd, 2025, the Bureau announced a significant change to that question. Here’s the replacement:\nIn the last two weeks, did this business use Artificial Intelligence (AI) in any of its business functions? (Examples of AI: machine learning, natural language processing, virtual agents, voice recognition, etc.)\nNo more “producing goods or services”—now it’s “in any of its business functions”! This means that the answers to the question before and after November 17th are not directly comparable.\nFrom October 19, 2026, they ask about Super Intelligence\nWhen I went looking for the updated question language in the latest XLSX file, I couldn’t find it. I found this instead:\nIn the last two weeks, did this business use Super Intelligence or SI (formerly referred to as Artificial Intelligence or AI) in any of its business functions? (Examples of SI use include: SI-powered data analysis; generative SI for marketing, product design, or coding; virtual SI agents for customer service; SI-powered forecasting or pricing; SI-driven computer vision for quality control, etc.)\nThe BTOS about page explains what happened:\nBeginning with the October 19, 2026 collection, instrument wording was updated due to Executive Order 14434.\nThe current numbers reflect the old Artificial Intelligence survey wording—the first survey results reflecting the Super Intelligence wording are due for publication on Thursday.\nIs this going to affect the survey?\nThe obvious open question here is whether this wording change is going to affect the survey results.\nThe businesses answering this survey will have last seen that question twelve weeks ago, when it was still called AI. Hopefully the new language isn’t going to confuse them, especially since the survey helpfully spells out “formerly referred to as Artificial Intelligence or AI”.\nI can’t help but laugh at the absurdity of “SI-powered data analysis; generative SI for marketing, product design, or coding; virtual SI agents for customer service” though.\nMore recent articles\n- Locating the source of a mysterious beep with Claude - 9th November 2026\n- Hide your slop PR descriptions behind <details><summary> - 9th November 2026\n- Qwen 3.8 27B on my laptop can interpret model weights, too - 3rd November 2026\n- The October inflection point for vibe game development - 28th October 2026", "summary": "Census Bureau runs a survey called the Business Trends and Outlook Survey (aka BTOS). Here’s the replacement:\nIn the last two weeks, did this business use Artificial Intelligence (AI) in any of its business functions?. I found this instead:\nIn the last two weeks, did this business use Super Intelligence or SI (formerly referred to as Artificial Intelligence or AI) in any of its business functions?. Is this going to affect the survey?.", "categories": ["業務改善・介護テック", "施設運営・経営"], "is_new": false, "title_ja": "The U.S. Census Bureau and “Super Intelligence”", "summary_ja": "Census Bureau runs a survey called the Business Trends and Outlook Survey (aka BTOS). Here’s the replacement:\nIn the last two weeks, did this business use Artificial Intelligence (AI) in any of its business functions?. I found this instead:\nIn the last two weeks, did this business use Super Intelligence or SI (formerly referred to as Artificial Intelligence or AI) in any of its business functions?. Is this going to affect the survey?."}, {"title": "How To Deal With Regret ( 3 Stoic Strategies to Live Free)", "url": "https://dailystoic.com/how-to-deal-with-regret-3-stoic-strategies-to-live-free/", "source": "Daily Stoic", "lang": "en", "content_type": "lifestyle", "category_hint": "メンタル・哲学", "published": "2023-08-24 01:48", "description": "What Is Regret? “Two elements must therefore be rooted out once for all, – the fear of future suffering, and the recollection of past suffering; since the latter no longer concerns me, and the former concerns me not yet.” – Seneca, from Letters from a Stoic After a long day at work and terrible traffic, […] The post How To Deal With Regret ( 3 Stoic Strategies to Live Free) appeared first on Daily Stoic .", "content": "What Is Regret?\n“Two elements must therefore be rooted out once for all, – the fear of future suffering, and the recollection of past suffering; since the latter no longer concerns me, and the former concerns me not yet.” – Seneca, from Letters from a Stoic\nAfter a long day at work and terrible traffic, you finally make it home. The stress has taken its toll, and you’re exhausted, bored, and frustrated with the day’s events all at once. You walk into your kitchen to find a heaping pile of dishes–something you asked your spouse to take care of this morning! Yet, they’re relaxing in front of the TV as if nothing’s wrong.\nYou feel the anger rising up, and unable to control yourself, you yell at your spouse. You don’t hold back. You’re out to make a point, to prove that what happened is a really big deal.\nYour spouse is frightened and embarrassed. They’re worried–you’ve never yelled at them like this before. They were going to do the dishes later, but you never gave them that opportunity. The day’s been long for them too, yet you didn’t care. They just wanted to have a nice night with you, but now that’s ruined.\nLater that night, you finally start to understand what losing your temper has cost you. You know you shouldn’t have said what you said. You should have been more considerate. You should have acted differently–you regret your choices.\nMaybe for you it wasn’t a pile of dishes that set you off. Maybe it was your kids using markers on the wall. Or your boss dumping that report on you before your vacation. Regardless of the scenario, we’ve all lost it at some point, and we’ve all felt the pang of regret.\nThe Stoics would define regret as the moment when past events consume our present lives. When we dwell over things we have no control over. When we resist our fate. Marcus Aurelius argued that we must be “satisfied with what [we] have, and accept the present–all of it.” Regret is the contrary–when we’re not satisfied with what we have, when we reject what we’ve been given.\nSeneca said “we often suffer more in imagination than in reality.” He was saying that regret is no more than an emotion of our imagination. We believe that had we said something (or held our tongue), had we acted differently, the outcome would have been different.\nMarcus Aurelius carried a similar mindset, and provided a solution to this problem. “External things are not the problem. It is your assessment of them. Which you can erase right now.”\nLet’s take another look at that “fight” you had with your spouse. Your regrets are not about the actual dishes or your spouse–it’s about your perception of expectations. You expected your spouse to have the dishes done when you got home. So you believe it should have been different, and had it been different, you would be better off.\nSo does that mean it’s your spouse’s fault? Maybe for leaving the dishes in the sink. But certainly not for your overreaction. And definitely not for the regret you felt later that night. Regret is an internal problem, to be both diagnosed and treated by ourselves. We must learn to look past these “self-focused emotions” and master our feelings of regret. This post aims to help you understand your emotions, use the past to your advantage, and conquer your biggest regrets.\nWhy Do I Feel Regret?\n“Life is very short and anxious for those who forget the past, neglect the present, and fear the future” – Seneca\nWe’ve all told ourselves, “no regrets.” There are countless memes, inspirational quotes, and videos reminding us online. Poets, singers, painters, and writers have been creating art about it for millenia. We’ve practically been conditioned to live by it.\nBut no matter how many times we read about it, sing along to a song about it, or tell ourselves not to, we all have something we regret. We all have that nagging feeling that comes back to us. That hits us exactly when we thought we forgot about that time, that place, those people. It comes back at the very worst time. It sucks. It hurts.\nThe power of regret is not to be understated. Bestselling author and founder of the American Regret Project Daniel Pink found that 82 percent of Americans experience regret at least occasionally. Pink describes regret as “an indispensable emotion,” yet also claims it can be “a positive instrument for improving your life.”\nIf we truly want to improve our life, we can’t run away from these negative feelings. We can’t hide them. But should we just accept this despair? Should we just come to terms living with regret?\nThis is what the great writer Samuel Johnson must have been wondering near the end of 1775. With 1776 on the horizon, Johnson wrote in his diary:\n“When I look back on resolutions of improvement and amendment which have year after year been made and broken, either by negligence, forgetfulness, vicious idleness, casual interruption, or morbid infirmity; when I find that so much of my life has been stolen unprofitably away, and that I can descry by retrospection scarcely a few single days properly and vigorously employed, why do I yet try to resolve again? I try because reformation is necessary and despair is criminal.”\nJohnson came to terms with his past, but not with his regret. He chose to reflect upon his hardships in order to better himself, to avoid making those same mistakes in the future. He chose to fight regret–not to wallow in it.\nIf there’s one thing we can learn from Johnson, it must be that experiencing regret is inevitable–but our actions and our mindset are not. Thus, the question is not ‘Why do I feel regret?’, but rather ‘How do I deal with it?’ ‘How do I move on?’ ‘How can I make myself better because of this?’ In order to answer these questions, the Stoics practiced the following strategies to help them build their mental toughness and resilience–starting with examining what they controlled.\nFocus On What You Control\n“Every event has two handles, one by which it can be carried, and one by which it can’t. If your brother does you wrong, don’t grab it by his wronging, because this is the handle incapable of lifting it. Instead, use the other—that he is your brother, that you were raised together, and then you will have hold of the handle that carries.” – Epictetus\nOne of the most important practices in Stoic philosophy, which was introduced by Epictetus, is determining what we control and what we don’t. What we have power over and what we don’t. What we can change and what we can’t.\nThere are two ways in which we can look at the past–two handles we can grab, to use Epictetus’ quote. The first handle forces us to perceive the past as an inevitable experience, destined to wrong and hurt us from the beginning. The opposite handle, however, allows us to extract the good parts, and use our experiences to benefit ourselves.\nIn looking at past decisions, we must grab them by the latter handle. We must understand that what happened, happened. We must see that we can’t change the past, no matter how much it hurt us or someone else. So what good does regret do?\nAbsolutely nothing, as Holocaust survivor and author Dr. Edith Eger explained to Ryan Holiday on an episode of The Daily Stoic Podcast. Ryan was discussing a relationship he regretted messing up, and Dr. Eger offered him one gift that would solve the guilt right then. “I give you a sentence,” she said, “One sentence—if I knew then what I know now, I would have done things differently.” That’s the end of that, she said. “Guilt is in the past, and the one thing you cannot change is the past.”\nAs a society we’ve become disillusioned by the idea of what we control. We all believe we have some control over the outcome of whatever we encounter. We all believe that if we keep thinking about what happened, somehow we’ll be able to change what happened.\nYet, we must come to terms with the fact that some things simply can’t be changed. We must understand that some things are in our control and some that aren’t. Say, if you regret getting a haircut, you’re in control. You can style it, cover it, or just wait for it to grow out again–you command your situation. But if you regret cursing out your boss before quitting your job, you’re not in control–you can’t take back your words.\nAs Marcus Aurelius wrote to himself—and by extension, to us:\n“Remind yourself that past and future have no power over you. Only the present—and even that can be minimized. Just mark off its limits. And if your mind tries to claim that it can’t hold out against that…well, then, heap shame upon it.”\nThe past is done. We can’t linger in our insecurities. We can’t ponder over our regrets. We must learn that what happened is out of our control now–we must let go.\n“Letting go is a necessary, if sometimes heart-wrenching gateway to genuine transformation,” is how the always-zen basketball coach Phil Jackson put it. The Stoics called it the “art of acquiescence”—the giving up and the assenting of whatever things are so that they can be what they are to become.\nIn one way, regret is just wishing things went the way we wanted them to. But by letting things become what they must, we are less likely to regret what we’ve done. In accepting that some things are simply out of our control, we are less likely to wish for a different outcome.\nThe past is something we can’t control anymore. We can’t change what we said, what we did, or how we felt.\nWe can, however, control the present. We control how we grow from our experiences. We control how we respond to adversity. We control how we can use our regret to our advantage.\nWe control how we act right now. We must.\nTo learn more on this topic, check out “You Control How You Play”, where Ryan speaks to the Cleveland Browns about the importance of perspective, staying motivated, and knowing what they control.\nLove Your Fate\n“A blazing fire makes flame and brightness out of everything that is thrown into it.” – Marcus Aurelius\nAfter we sort out what we control, we must find how to respond–regardless if we control what’s happening or not. We must determine how we handle ourselves. We must determine how we overcome obstacles. We must determine how to move forward.\nIn the first book of his Discourses, Epictetus envisions himself being executed by Roman guards, his life out of his control. In a display of tranquility and wisdom, he lays out his thoughts:\n“I must die. But must I die bawling? I must be put in chains–but moaning and groaning too? I must be exiled; but is there anything to keep me from going with a smile, calm and self-composed.”\nThough the term was first coined by German philosopher Friedrich Nietzsche, the practice of amor fati–loving your fate–dates back to Epictetus and the Stoics. Often by means of reflection and meditation, the Stoics would use this practice to settle past trauma and help them achieve a greater sense of inner peace. “The Fates guide the person who accepts them,” Cleanthes said, “and hinder the person who resists them.”\nAmor fati is more than just understanding what happens to us. It’s understanding that our perception doesn’t always have to be negative. It’s understanding that accepting the present circumstances will make us better. It’s understanding that we must be grateful for the cloudy weather sometimes–and that there’s always a way through the storm.\nWe all face hardships. We all get stuck in traffic. We all deal with slow WiFi, or bad cell service, right when we need to send that important message. As rational people, we tend to think that these hardships were made specifically for us. That the world is out to get us. That we can’t win.\nBut this couldn’t be farther from the truth. Everybody goes through obstacles. Everybody gets tripped up sometimes. As we talked about in the first section, we can’t control some things in life. And these hardships, no matter how hard we try, will always be out of our control.\nWhen we accept what happens to us, after understanding that certain things— particularly bad things—are outside our control, we are left with this: loving whatever happens to us and facing it with unfailing cheerfulness and strength. As bestselling author Robert Greene (48 Laws of Power, Mastery) put it, we need to, “accept the fact that all events occur for a reason, and that it is within your capacity to see this reason as positive.”\nMarcus Aurelius portrays this concept perfectly in Meditations through the image of an artisans shop:\n“There are thorns on the path, then keep away! Enough said. Why ponder the existence of nuisance? Such thinking would make you a laughing-stock to the true student of Nature, just as a carpenter or cobbler would laugh if you pointed out the sawdust and chips on the floors of their shops. Yet while those shopkeepers have dustbins for disposal, Nature has no need of them.”\nWhy get tripped up by the thorns? Why ponder over the sawdust on your floor? It’s simply part of nature! As long as you have the capability to see them, you have the capability to move past them.\nIn practicing amor fati, we’re also less likely to have regrets in the future. By embracing the challenges that lay ahead of us, we’re less likely to regret the decisions we make to conquer them – regardless of the outcome. We’re able to tackle the future with confidence, conviction, courage, and so much more.\nAmor fati is more than just a mindset–it’s a way of life. Incorporating amor fati into your life will take time, effort, and sacrifices that probably won’t feel comfortable. But we must. We must move past this existential angst. We must move forward, away from our regret, and towards our future.\nLove what’s happened to you. Love who you’ve become, and how much you’ve changed. Love your fate–amor fati.\nCarry this reminder with you every day with our amor fati medallion from the Daily Stoic Store. Carry this in your pocket as a reminder to treat each and every moment–no matter how challenging–as something to be embraced, not avoided.\nLook Ahead\n“We should project our thoughts ahead of us at every turn and have in mind every possible eventuality instead of only the usual course of action.” – Seneca\nBefore Ryan Holiday gets on stage for a big speech, he runs through everything that could go wrong: trouble with the microphone, the clicker not advancing a slide, the audience not reacting as anticipated. He is able to see potential problems before they arise, and come up with solutions before anything actually happens. He is able to prevent himself from being overwhelmed if a problem arises by being prepared.\n“Rehearse them in your mind: exile, torture, war, shipwreck,” Seneca said. “All the terms of our human lot should be before our eyes.”\nThis practice, called premeditatio malorum, is one of the oldest and most common practices in Stoic philosophy. It literally means the “premeditation of evils.” The Stoics used this practice to help them prepare for life’s inevitable hardships, and remain calm and confident in turbulent times.\nThe world isn’t fair. We all know this. We don’t always get what is ours, even if we’ve earned it. We don’t always win, even if we play hard.\nBut we can’t be surprised when we don’t win. If it comes as a constant surprise each and every time something unexpected occurs, you’re not only going to be miserable whenever you attempt something big, you’re going to have a much harder time accepting it and moving on to attempts two, three, and four. You’re going to have a much harder time living in the present instead of lingering in the past. You’re going to have a much harder time trusting your instincts–and fighting regret.\nThere’s perhaps no better personification of premeditatio malorum than the great Booker T. Washington. Washington ran a school with 1,500 students, all while advising politicians and activists and traveling across the country to give speeches. But how? How did he maintain this lifestyle, and with such striking success?\n“When I begin my work in the morning, I expect to have a successful and pleasant day of it, but at the same time I prepare myself to hear that one of our school buildings is on fire, or has burned, or that some disagreeable accident had occurred, or that someone has abused me in a public address or a printed article, for something that I have done or omitted to do, or or something that he had heard that I had said—probably something I had never thought of saying.”\nHe envisioned the worst possible things that could happen to him throughout his day. Not only envisioned, but he expected them to happen. In doing this, Washington was more prepared for the hardships of the day. A canceled train couldn’t be as bad as his school burning down. Being late to dinner couldn’t be as bad as someone verbally abusing him in public.\nIn preparing himself for challenges, Washington was simultaneously preparing himself for regret. Since he saw his fears right in front of him, and anticipated them happening, he was less scared of the outcomes of his choices–and he was less likely to regret them.\nIn the same manner, Epictetus used this to help him foresee all of the dangers that came with a seemingly easy decision–bathing:\n“If you are going to bathe, represent to yourself the incidents usual in the bath—some persons pouring out, others pushing in, others scolding, others pilfering…. For thus, if any impediment arises in bathing, you will be able to say, “It was not only to bathe that I desired, but to keep my will in harmony with nature; and I shall not keep it thus if I am out of humor at things that happen.”\nPracticing premeditatio malorum allows us to be more prepared for life’s inevitable setbacks. Though it may be hard to admit, everything will not go our way. We might not get that job that we want. We might not win that game. But we will be ready for any obstacles that cross our path.\nWe’ll know that we made the right decision – and we won’t regret our choices.\nIf you want to hear Ryan talk more about this topic, check out The Stoic Secret Of Facing Failure To Achieve Success: Premeditatio Malorum on the Daily Stoic YouTube Channel.\n10 Best Stoic Quotes on Regret\n“Then remind yourself that past and future have no power over you. Only the present – and even that can be minimized.” – Marcus Aurelius, from Meditations\n“He is a wise man who does not grieve for the things which he has not, but rejoices for those which he has.” – Epictetus, from Fragments\n“External things are not the problem. It is your assessment of them. Which you can erase right now.” – Marcus Aurelius, from Meditations\n“Give yourself a gift, the present moment.” – Marcus Aurelius, from Meditations\n“The man who has anticipated the coming of troubles takes away their power when they arrive.”- Seneca, from Consolation to Marcia\n“To shrug it all off and wipe it clean—every annoyance and distraction—and reach utter stillness. Child’s play.” — Marcus Aurelius, from Meditations\n“Two elements must therefore be rooted out once for all, – the fear of future suffering, and the recollection of past suffering; since the latter no longer concerns me, and the former concerns me not yet.” – Seneca, from Letters from a Stoic\n“When we are no longer able to change a situation, we are challenged to change ourselves.” – Viktor Frankl\n“There is only one way to happiness and that is to cease worrying about things which are beyond the power of our will.” – Epictetus, from Discourses\n“Do not spoil what you have by desiring what you have not; remember that what you now have was once among the only things you hoped for.” – Epicurus\nAdditional Resources\nPodcasts:\nHolocaust Survivor Dr. Edith Eger on the Gift of Forgiveness\nKate Courtney, Karen Duffy, Meg Mason, and Susan Cain on Using Stoicism to Endure Life’s Obstacles\nYou can subscribe to the Daily Stoic Podcast here, and our podcast YouTube channel here.\nDaily Stoic Meditations:\n“We Almost Always Regret This”\n“The Question To Ask When You Mess Up”\nTo sign up for one free email per day inspired by Stoic philosophy, click here.\nRyan Holiday’s RSS newsletter:\n24 Things I Wish I Had Done Sooner (or my biggest regrets), from ryanholiday.net\n40 Ways To Live A Full Life (And Leave Nothing On The Table) By Age 30, from ryanholiday.net\nTo receive more of Ryan’s “insider” emails, subscribe here. Twice each month, Ryan writes a longer-than-normal essay on various topics, including wealth, philosophy, parenting, and living the good life. Join over 170,000 subscribers today!\nDaily Stoic Store:\nPremeditatio Malorum Medallion\nTo find other Stoic reminders, jewelry, books, courses and more, you can visit the Daily Stoic store here.", "summary": "You know you shouldn’t have said what you said. You should have acted differently–you regret your choices. Say, if you regret getting a haircut, you’re in control. Love what’s happened to you.", "categories": ["メンタル・哲学", "業務改善・介護テック"], "is_new": false, "title_ja": "How To Deal With Regret ( 3 Stoic Strategies to Live Free)", "summary_ja": "You know you shouldn’t have said what you said. You should have acted differently–you regret your choices. Say, if you regret getting a haircut, you’re in control. Love what’s happened to you."}, {"title": "What Does It Mean To Be Wealthy?", "url": "https://dailystoic.com/what-does-it-mean-to-be-wealthy/", "source": "Daily Stoic", "lang": "en", "content_type": "lifestyle", "category_hint": "メンタル・哲学", "published": "2023-08-01 02:13", "description": "“These individuals have riches just as we say that we ‘have a fever,’ when really the fever has us.” — Seneca We all know those people who have lots of money, and yet, they are miserable. On the flip side, we all know people who live happy and fulfilled lives despite not having lots of money. […] The post What Does It Mean To Be Wealthy? appeared first on Daily Stoic .", "content": "“These individuals have riches just as we say that we ‘have a fever,’ when really the fever has us.” — Seneca\nWe all know those people who have lots of money, and yet, they are miserable. On the flip side, we all know people who live happy and fulfilled lives despite not having lots of money.\nMoney, the Stoics said, is not an indicator of wealth.\nThe slave turned teacher Epictetus liked to tell his students of a man who had been offered a lucrative job by the emperor Augustus. “I told him not to touch it,” Epictetus told his students.\nBut, the man told Epictetus, I will make a lot of money.\nYes, Epictetus said, “for little in return.”\nBut, the man said, a lot of people will learn my name.\n“Ok,” Epictetus said, “are you planning to be there every time someone utters your name?”\nBut, the man said, my name will outlive me.\n“So will a rock you carve your name into,” Epictetus said.\nBut, the man said, I will get to wear a gold crown.\n“And they will put a crown made of roses on you for your funeral,” Epictetus said. “You will look even more elegant in that.”\nThe man saw the sum of money, but he didn’t see that a sum of money is a poor indication of value. As Epictetus liked to ask his students,\n“What decides whether a sum of money is good? The money is not going to tell you.”\nIt’s not going to tell you about all you have to give up in exchange for that money. It’s not going to tell you that you might be happier in a job that offers less money. It’s not going to tell you about all the losses that come with the gain.\nWe will. We created this guide—rooted in the experiences and writings of the Stoics—to give you a time-tested playbook to help you learn how to be truly rich, how to get out from under the thumb of money, how to be happy with enough, how to thrive, succeed, and live a good, happy life. This post is going to cover the high level ideas. If you really want to get serious about living what the Stoics called the good life, we suggest checking out our course The Wealthy Stoic: A Daily Stoic Guide To Being Rich, Free, and Happy, a 9-week course designed to equip you with the tools, mindsets, and habits of the wealthiest Stoics in history.\nThis is a long post. It should be saved and revisited. It can be read straight through or if you prefer, feel free to jump around…\nHOW DID THE STOICS VIEW WEALTH?\nMoney Doesn’t Make You Rich\nLook at any millionaire, Seneca tells Lucilius in one of his letters, they are some of the poorest people in Rome. Money has made them obsess over public opinion. Money has control of their schedules and their decisions. Money has put them in the center of a circle of sycophants and grifters. Money has escalated their tastes and expectations beyond quenching.\n“These individuals,” Seneca writes, “have riches just as we say that we ‘have a fever,’ when really the fever has us.” It’s a sad sight, he says.\nWhat’s sadder is that the look-at-any-millionaire experiment still works today—a lot of rich people in this world live very poor lives. They’re rarely not thinking about money. About how to acquire more and of it, about what they can trade of their life in exchange for it, about who they know who has more of it than they do. These poor souls know they have a lot of money, but what they don’t understand is that, really, money has a lot of them.\n“Money never made a man rich,” Seneca adds, “Do you ask the reason for this? He who possesses more begins to be able to possess still more.” This is a universal human battle. It doesn’t really matter the number in your bank account, it is hard to turn off the brain’s desire for more. Until you can turn it off, until you have a sense for what is enough, you are poorer than the poorest people in Rome.\n“[H]e who has enough,” Seneca writes, “has attained that which never fell to the rich man’s lot—a stopping-point.”\nTo learn more on this topic, check out Ryan’s interview with Morgan Housel on the Daily Stoic podcast.\nTHREE STOIC PRACTICES THAT CAN LEAD TO A WEALTHIER LIFESTYLE\nDefine What Wealth Means To You\n“It never ceases to amaze me: we all love ourselves more than other people, but care more about their opinion than our own.” — Marcus Aurelius\nIf Ramit Sethi didn’t beat us to it, we might have named the Daily Stoic Wealth Course, “The Rich Life.”\nRamit is the bestselling author of I Will Teach You To Be Rich and host of the I Will Teach You To Be Rich podcast (one of Ryan’s favorite podcasts), and of the Netflix series How to Get Rich. His work focuses on how to help people live what he calls “The Rich Life.”\nThe title is a bit misleading because he doesn’t use “rich” solely in a monetary wealth way. It’s more an all-encompassing philosophy about living a good life. Ramit talks and writes about entrepreneurship, spending, investing, social skills, fitness, psychology, productivity, and on and on—all these interconnected components that go into living well.\nKey to Ramit’s work is the idea that the definition of The Rich Life varies from person to person. When we interviewed him a while back, he gave this example:\nI have a friend who always has fresh flowers throughout her tiny New York apartment. They look amazing. When I asked her how she keeps up and maintains all these fresh flowers, despite her busy full-time job, she told me that she spends the equivalent of a cable bill every month to surround herself with beautiful, artisanal flowers that are delivered to her house every week. Every week…on “just” flowers!\nThis is the idea of living a Rich Life: If you love how flowers look and make you feel in your home, you don’t “save” buying flowers only for special occasions. You make sure you have them around you all the time.\nRamit, on the other hand, doesn’t really care about flowers. So his Rich Life looks different. His definition of a rich life, he says, is never having to step into a Home Depot.\nThe point is, everyone’s different. Therefore, everyone’s definition of wealth is different. We live in a world that constantly bombards us with messages about what a rich life is supposed to look like. We see pictures of lavish vacations, designer clothing, expensive cars, and luxurious homes. We are told that having more money, more possessions, and more status is the key to happiness and fulfillment.\nBut the truth is the Rich Life means something different for everyone. What makes one person feel rich may not do the same for another.\nThis is why it’s essential to figure out your definition of the Rich Life.\nWatch Ryan Holiday discuss some of the key Stoic concepts of wealth in The Stoics Guide To Becoming Wealthy on the Daily Stoic YouTube channel.\nKnow What Enough Is\n“If you don’t regard what you have as enough, you will never be happy even if you rule the entire world.” – Seneca\nSeneca said this is what it means to be poor: wanting more than you have.\nConsider, Seneca says, the person who has or wants the nicest stuff—the furniture with gold trim, the silverware made by ancient artists, a team of butlers, jewelry from every part of the globe. “Though he should pile up all of these,” Seneca writes, “never will they satisfy his insatiable mind…This is not a thirst, but a sickness. And it is not merely money or food that leads to this result; the same nature is to be found in every desire that derives, not from need, but from vice: all that you pile up to satisfy it will not terminate but advance desire.”\nThat’s the irony of material riches. It’s a series of moving goal posts. You think having X will be sufficient only to find that 2x is better and that 3x is preferable still.\n“Prosperity is a restless thing: it troubles itself,” Seneca says elsewhere. Or rather, it propels itself.\nSee if you can find one millionaire who isn’t trying to become a billionaire. See if you can find one billionaire who doesn’t check the Forbes list every year and glare jealously at the names above them.\nThat’s what getting rich does to us. It rarely gives us a sense of “enough.” Instead, it gives us a sense of how much more there could be.\nNeedless to say this is a path to bankruptcy, mentally and emotionally if not financially. It’s a hedonic treadmill that eventually breaks down…or breaks the person frantically running atop it.\nThe Stoics would try to caution us from ever getting on, or to get off while we still can.\nThere is a story Ryan Holiday writes about in Stillness is the Key. Kurt Vonnegut and Joseph Heller, the authors of Slaughterhouse Five and Catch-22, respectively, were once at a fancy party in New York. As they stood in the home of some billionaire, Vonnegut needled his friend.\n“Joe,” he said, “how does it feel that our host only yesterday may have made more money than your novel has earned in its entire history?”\n“I’ve got something he can never have,” Heller replied.\n“And what on earth could that be?” Vonnegut asked.\n“The knowledge that I’ve got enough.”\nKnowing what is enough. Living in a place of fullness rather than of craving. That, the Stoics would say, is a wealthy person. That is someone whose life is one of abundance.\nPractice Poverty\n“Set aside a certain number of days, during which you shall be content with the scantiest and cheapest fare, with coarse and rough dress, saying to yourself the while: ‘Is this the condition that I feared?’” — Seneca\nWhen Benjamin Franklin was 18 years old, he asked his father for a loan to start a printing business. His father refused to help, so Franklin saved and eventually founded The Pennsylvania Gazette.\nThe business chugged along for a while, but eventually ran into financial troubles, at which point Franklin received a lucrative offer from a customer who wanted to publish a piece in the Gazette.\nFranklin, whose first son had just been born, would have greatly benefited from the money. But the customer’s piece, as Franklin described it, was not only completely misaligned with his principles, it was “scurrilous and defamatory.”\nFranklin lost sleep deciding what to do. It seemed irresponsible to say no. He had a family to take care of. He was afraid that if the business failed he would be poor, they would be poor. Franklin was terrified of poverty. With all that at stake, with all those emotions roiling inside him, why not bite the bullet and just publish the piece?\nTo figure out if he should accept the money, Franklin tried something new by doing something with ancient roots. He channeled his inner Seneca and decided to live like a poor person, to test whether poverty was really the burden he feared it to be. For a few days, he restricted his diet to just bread and water and for a few nights, he wrapped himself in a coat and slept on the floor.\n“From this regimen,” he said, “I feel no inconvenience whatever. Finding I can live in this manner, I have formed a determination never to prostitute my press to the purposes of corruption and abuse of this kind for the sake of gaining a more comfortable subsistence.”\nIsn’t that why many of us do the things we do, take the jobs we take, make the sacrifices we make?\nIt’s why Seneca stood beside Nero for so long. It’s why people continue to work on Wall Street despite being miserable. It’s why people become lawyers despite having no interest in the law. It’s why people take jobs in the incoming administration despite not voting for the president.\nFor the sake of gaining (or holding onto) a more comfortable subsistence, we take jobs we don’t like, we put up with people we don’t like, and we do things we know aren’t right.\nThat is not a rich life. That is not the life of a Wealthy Stoic.\nWhen we interviewed Tim Ferriss, he told us that once a month, he does a three-day fast “to simply expose myself to the rather, often unfamiliar, sensation of real hunger.” Then he mentioned his friend, a wealthy CEO, who schedules a week every quarter where he sleeps on the floor in his living room, limits his spending to $15 for the week, and survives on instant coffee and instant oatmeal. With the reminder that he can thrive on very little, his decision making improves—he doesn’t do things out of fear. “At the end of such an experiment,” Tim said, “people will very often be in a better mental state, feel more content than they did beforehand. It’s very freeing.”\nBut do not misunderstand, Tim is not saying these people no longer care about anything or that they no longer have grand ambitions. To the contrary, many of the people he’s talking about who have run this poverty experiment are elite performers at the top of their industry or sport or craft who only got better, stronger, happier, richer as a result.\nFor The Wealthy Stoic, as Seneca wrote, “Freedom is the prize we are working for.” The freedom to decide what you do most days. The freedom to do what you think is right. The freedom to spend time with who you want to spend time with. The freedom to pursue the things you are interested in. The freedom to leave a job that makes you miserable.\nThe freedom that comes, Seneca wrote, after you “learn how far poverty is from being a burden.”\nWHAT ARE SOME OF THE BEST STOIC QUOTES ON WEALTH?\n“It is not the man who has too little, but the man who craves more, that is poor.” – Seneca\n“Any man, who does not think that what he has is more than ample, is an unhappy man, even if he is the master of the whole world. ” – Seneca\n“At last, then, away with all these treacherous goods! They look better for those who hope for them than to those who have attained them.” -Seneca\n“Anything at all: the applause of the crowd, high office, wealth, or self-indulgence. All of them might seem to be compatible with it—for a while. But suddenly they control us and sweep us away.” – Marcus Aurelius,\n“Wealth consists not in having great possessions, but in having few wants.” – Epictetus\nWHERE CAN I LEARN MORE ABOUT STOICISM AND WEALTH?\nIf you enjoyed these principles and want to incorporate them more into your life, check out….\nThere Is Nothing Special About MoneyWho Owns Who?\nThe Psychology of Money by Morgan Housel\nI Will Teach You To Be Rich by Ramit Sethi\nIf you want to take a deeper dive into Stoicism’s foundational concepts and daily practices how to be truly rich, how to get out from under the thumb of money, how to be happy with enough, how to thrive, succeed, and live a good, happy life, check out The Wealthy Stoic: A Daily Stoic Guide To Being Rich, Free, and Happy!\nIt’s a 9-week course designed to equip you with the tools, mindsets, and habits of the wealthiest Stoics in history.\nThis is not a get-rich-quick kind of a thing.\nThis is not a hustle culture-esque course.\nIt’s the exact opposite. It’s about what Stoicism’s foundational concepts and daily practices were designed to teach us: how to be truly rich, how to get out from under the thumb of money, how to be happy with enough, how to thrive, succeed, and live a good, happy life.\nIf that is the kind of life you want, the Stoics can show you the way.\n“And if you can’t stop prizing a lot of other things? Then you’ll never be free—free, independent, imperturbable. Because you’ll always be envious and jealous, afraid that people might come and take it all away from you.” — Marcus Aurelius", "summary": "The money is not going to tell you.”\nIt’s not going to tell you about all you have to give up in exchange for that money. You make sure you have them around you all the time. That is not a rich life. If that is the kind of life you want, the Stoics can show you the way.", "categories": ["業務改善・介護テック", "メンタル・哲学"], "is_new": false, "title_ja": "What Does It Mean To Be Wealthy?", "summary_ja": "The money is not going to tell you.”\nIt’s not going to tell you about all you have to give up in exchange for that money. You make sure you have them around you all the time. That is not a rich life. If that is the kind of life you want, the Stoics can show you the way."}, {"title": "Perseverance: 7 Stoic Lessons on How To Keep Going", "url": "https://dailystoic.com/perseverance/", "source": "Daily Stoic", "lang": "en", "content_type": "lifestyle", "category_hint": "メンタル・哲学", "published": "2023-05-10 03:50", "description": "“To be like the rock that the waves keep crashing over. It stands unmoved and the raging of the sea falls still around it.” — Marcus Aurelius The question of why and how we are supposed to live has been contemplated for centuries. Absurdist Albert Camus wrote that life is like the Sisyphean task of […] The post Perseverance: 7 Stoic Lessons on How To Keep Going appeared first on Daily Stoic .", "content": "“To be like the rock that the waves keep crashing over. It stands unmoved and the raging of the sea falls still around it.” — Marcus Aurelius\nThe question of why and how we are supposed to live has been contemplated for centuries. Absurdist Albert Camus wrote that life is like the Sisyphean task of pushing a boulder up a mountain for all of eternity. Existence itself, in other words, is persevering. Camus writes, “One must imagine Sisyphus happy.” So, how do we persevere well? How do we persevere happily?\nThankfully, we can look to the Stoics. The Stoics not only wrote about how to persevere, they used Stoicism to persevere in the face of plagues, exiles, imprisonment, and wars.\nThis post is just a small sample of the kind of lessons, ideas, and stories we write about in our daily email newsletter. Every morning, we send a short (~500 word) email inspired by Marcus Aurelius, Seneca, Epictetus, and more. Each email will help you cultivate strength, insight, and wisdom to live your best life.\nJoin over 600,000 people who start their day off with the philosophy that has guided some of history’s greatest men and women.\nDrawing on the timeless wisdom of the Stoics, we created this guide to give you a time-tested playbook to help you persevere. This is a long post. It should be saved and revisited. It can be read straight through or if you prefer, feel free to click the links below to navigate to a specific section\nWhat Does It Mean To Persevere?\n7 Stoic lessons on how to keep going\n10 Best Stoic Quotes on Perseverance\nThe Best Books About Perseverance\nWhat does it mean to persevere?\n“Ask, ‘Why is this so unbearable? Why can’t I endure it?’ You’ll be embarrassed to answer.” — Marcus Aurelius\nJames Stockdale was held captive in Hanoi, North Vietnam. He was sent to a war camp that was famous for its brutal treatment of prisoners.\nWhat got him through more than 7 years of imprisonment?\nStoicism.\nStoicism not only helped Stockdale get through his imprisonment, but it helped him refrain from betraying himself and his country. He was able to internally uphold his moral code. He accepted the fact that he could not control his external circumstances. Instead, he mastered his internal dialogue and feelings.\nThat is persevering. It’s not simply “getting through it.” It’s getting through it while still maintaining your morality and humanity. Stoicism does not breed apathy, but strength.\nHow do we persevere?\n7 Stoic Lessons on How to Keep Going\nAccept your fate\n“Do not seek for things to happen the way you want them to; rather, wish that what happens happen the way it happens: th
