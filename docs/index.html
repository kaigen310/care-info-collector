"url": "https://www.joint-kaigo.com/articles/48212/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-24 18:15", "description": "介護現場で外国人材を受け入れている事業所・施設の割合が18.6%となり、前年度から2.8ポイント上昇したことが、介護労働安定センターが公表した最新の「介護労働実態調査」で明らかになった。【Joint編集部】 深刻な人手不 […]", "content": "2026年8月24日\n外国人材の受け入れ、介護事業所に慎重傾向 「受け入れようと思わない」が増加＝介護労働実態調査\n介護現場で外国人材を受け入れている事業所・施設の割合が18.6%となり、前年度から2.8ポイント上昇したことが、介護労働安定センターが公表した最新の「介護労働実態調査」で明らかになった。【Joint編集部】\n深刻な人手不足を背景に、足元で外国人材の採用が広がっている。ただし、今後の受け入れについては慎重な姿勢をとる事業所・施設が増えていることも分かった。\n今後の受け入れ方針を尋ねたところ、既に受け入れ実績のある事業所・施設で「積極的に拡大したい」が26.4%（前年度32.3%）へ減少。まだ受け入れていない事業所・施設でも、「今後も受け入れようとは思わない」が61.9%（前年度59.2%）へ増加していた。\n受け入れる際の課題（複数回答）では、「意思疎通の難しさ」が49.1%で最多。「住宅・寮などの確保が困難」や「サポート役の負担の大きさ」、「受け入れコストの高さ」などの回答も少なくなかった。\nこの調査は昨年10月に実施されたもの。全国の事業所・施設1万8000ヵ所が対象で、8955ヵ所から有効な回答を得ている。", "summary": "2026年8月24日\n外国人材の受け入れ、介護事業所に慎重傾向 「受け入れようと思わない」が増加＝介護労働実態調査\n介護現場で外国人材を受け入れている事業所・施設の割合が18.6%となり、前年度から2.8ポイント上昇したことが、介護労働安定センターが公表した最新の「介護労働実態調査」で明らかになった。ただし、今後の受け入れについては慎重な姿勢をとる事業所・施設が増えていることも分かった。今後の受け入れ方針を尋ねたところ、既に受け入れ実績のある事業所・施設で「積極的に拡大したい」が26.4%（前年度32.3%）へ減少。まだ受け入れていない事業所・施設でも、「今後も受け入れようとは思わない」が61.9%（前年度59.2%）へ増加していた。", "categories": ["人材育成・HR", "施設運営・経営"], "is_new": false}, {"title": "ケアマネ協会が全国大会　柴口会長「変化を恐れず未来を切り拓く」　1100人超が参加", "url": "https://www.joint-kaigo.com/articles/48189/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-08-24 11:54", "description": "日本介護支援専門員協会の今年の全国大会が、8月22日から23日の2日間にわたり岡山県岡山市で開催された。【Joint編集部】 20回目となった今大会のテーマは、「つながる力、広がる未来〜仲間と共に紡ぐ物語〜」。オンライン […]", "content": "日本介護支援専門員協会の今年の全国大会が、8月22日から23日の2日間にわたり岡山県岡山市で開催された。【Joint編集部】\n20回目となった今大会のテーマは、「つながる力、広がる未来〜仲間と共に紡ぐ物語〜」。オンラインもあわせて、全国からケアマネジャーら1100人超が参加した。\n協会の柴口里則会長は開会式の挨拶で、「介護保険制度の施行から四半世紀が経過し、介護支援専門員へ向かう変化の波は年々大きくなっている。私たちはその変化を恐れることなく、常に地域へ飛び込み、専門職としてのプライドを持って成長を続けている」と強調した。\nそのうえで、「今大会は、全国の仲間が知恵と力を持ち寄って結集する場だ。1人で抱え込まず、孤立せず、新しい仲間を増やしながら、地域との連携の輪をさらに広げていきたい。私たちが一丸となり、持続可能な介護の未来を力強く切り拓いていきたい」と語りかけた。\nまた、来賓として挨拶した厚生労働省老健局の野村晋認知症施策・地域介護推進課長は、今後の制度改正・報酬改定にも言及。ケアマネジャーの人材確保、処遇改善、専門性を安心して発揮できる環境の整備などに注力するとして、「協会の皆様とも意見を交換しながら、厚生労働省としてしっかりと検討を重ねて取り組んでいきたい」と述べた。\n今大会では、「持続可能な介護」「地域社会との連携」など4つのテーマで分科会が開催されたほか、落語家の柳家花緑氏による特別講演や専門家による記念講演、協会の実践報告なども行われた。参加者はそれぞれコミュニケーションを取りながら、最新の知見・ノウハウなどを共有。より質の高いケアマネジメントの実践に向けて議論を深めた。", "summary": "日本介護支援専門員協会の今年の全国大会が、8月22日から23日の2日間にわたり岡山県岡山市で開催された。【Joint編集部】\n20回目となった今大会のテーマは、「つながる力、広がる未来〜仲間と共に紡ぐ物語〜」。ケアマネジャーの人材確保、処遇改善、専門性を安心して発揮できる環境の整備などに注力するとして、「協会の皆様とも意見を交換しながら、厚生労働省としてしっかりと検討を重ねて取り組んでいきたい」と述べた。今大会では、「持続可能な介護」「地域社会との連携」など4つのテーマで分科会が開催されたほか、落語家の柳家花緑氏による特別講演や専門家による記念講演、協会の実践報告なども行われた。", "categories": ["福祉・社会保障", "介護保険・制度"], "is_new": false}, {"title": "〈論説〉元厚労次官の辻哲夫さん逝去　サムライの誇りと信念 - 福祉新聞Web", "url": "https://fukushishimbun.com/miyatake/45855", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-24 10:00", "description": "辻哲夫元厚生労働省事務次官が７月３０日亡くなった。家族葬がひっそり営まれ、訃報だけが届いた。 病名は十二指腸がん、７９歳。この長生きの時代に、早すぎる「サヨナラ」だ。 長身、端正、頭脳明晰、品行方正～、欠点のないのが欠点で、厚生行政への情熱もすごかった。相手が誰でも、場所はどこでも、語り始めると止まらない「辻説法」は有名だった。紹介した人たちはそろって「サムライみたい」と評した。 いわゆる「キャリア」組は、まず国家公務員の総合職試験（旧・上級甲種）に臨む。応募２万人規模、合格者には成績順の「席次」がつく。辻さんは１桁。 「父も兄も医師、違う生き方をしようと（東大）法学部に進んだ。厚生省を選んだのは、医療に関係したい意識があったのかな」 １９７１年の入省、駆け出し時代から「エース」と評され、医療、年金、福祉の重要ポストを総なめにしながら上り詰めた。しかし、退官後の生き方がさらに見事であった。 「天下りは絶対しない」と何度か言った。関係団体への再就職には目もくれず２００７年、小さな私大の教壇に立った。天下国家を論じる人には不似合いに思えた。やがて友人らの勧めで東大が設けた高齢社会総合研究機", "content": "〈論説〉元厚労次官の辻哲夫さん逝去 サムライの誇りと信念\n2026年08月24日 福祉新聞編集部辻哲夫元厚生労働省事務次官が７月３０日亡くなった。家族葬がひっそり営まれ、訃報だけが届いた。\n病名は十二指腸がん、７９歳。この長生きの時代に、早すぎる「サヨナラ」だ。\n長身、端正、頭脳明晰、品行方正～、欠点のないのが欠点で、厚生行政への情熱もすごかった。相手が誰でも、場所はどこでも、語り始めると止まらない「辻説法」は有名だった。紹介した人たちはそろって「サムライみたい」と評した。\nいわゆる「キャリア」組は、まず国家公務員の総合職試験（旧・上級甲種）に臨む。応募２万人規模、合格者には成績順の「席次」がつく。辻さんは１桁。\n「父も兄も医師、違う生き方をしようと（東大）法学部に進んだ。厚生省を選んだのは、医療に関係したい意識があったのかな」\n１９７１年の入省、駆け出し時代から「エース」と評され、医療、年金、福祉の重要ポストを総なめにしながら上り詰めた。しかし、退官後の生き方がさらに見事であった。\n「天下りは絶対しない」と何度か言った。関係団体への再就職には目もくれず２００７年、小さな私大の教壇に立った。天下国家を論じる人には不似合いに思えた。やがて友人らの勧めで東大が設けた高齢社会総合研究機構の教授に転じた。\n早速千葉県柏市の豊四季台団地（約１万人）を軸にする「柏プロジェクト」を始めた。市と東大と都市再生機構（ＵＲ）が一体で「住み続けられるまちづくり」に取り組む。辻さんらは「在宅医療」と「いきがい就労」を担った。\n医師、看護師、介護職らに呼び掛け、話し合い、研修会と懇親を重ねた。かかりつけ医の訪問診療と緊急時の往診、訪問看護・介護との連携で自宅や福祉施設で安心して暮らせるネットワークを整えていく。\nその過度の病院頼みから在宅医療への転換こそ、官僚時代から辻さんの悲願だった。高齢者の居場所と役割の確保もライフワーク。保育所や福祉施設や野菜作りの手伝い、利用者の送迎と〝就労の場〟を広げていく。まさに「地域包括ケアシステム」の先駆けだ。\n２年前、医学部向けの分厚い「在宅医療・治し支える医療の概念と実践」を有志で執筆した。その初の在宅医療テキストを紹介すると、ずいぶん喜んでくれた。\n次に会った時は、また大量の資料を手渡された。\n「フレイル予防」。心身の活力が低下する要介護の手前から予防を始める。しっかり食べる・よく動く・人と交わる社会参加が３本柱だ。食事やゲームや運動を楽しみながら取り組む。\n報告書から、高知県仁淀町、岐阜県安八町、神奈川県三浦市など各地で、フレイル予防に励む群像と、その意義を〝辻説法〟する姿がダブって見える。\n時代を切り開く信念を持ち続けた生涯だった。\nみやたけ・ごう 毎日新聞論説副委員長から埼玉県立大、目白大大学院の教授などを経て現職", "summary": "「天下りは絶対しない」と何度か言った。辻さんらは「在宅医療」と「いきがい就労」を担った。その過度の病院頼みから在宅医療への転換こそ、官僚時代から辻さんの悲願だった。時代を切り開く信念を持ち続けた生涯だった。", "categories": ["医療・健康", "福祉・社会保障"], "is_new": false}, {"title": "〈熊本地震〉緊急対応から”出口支援”へシフト　17県のDWAT25チームが対応 - 福祉新聞Web", "url": "https://fukushishimbun.com/bosai/45852", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-08-23 10:00", "description": "熊本地震は２０日で発生から２３日が経過した。高齢者や障害者らを支援する災害派遣福祉チーム（ＤＷＡＴ）は発災翌日から活動を開始。被害の大きかった３地域に拠点を置き、１７県の２５チームが対応に当たっている。今後は日常生活への移行を見据え、避難所からの「出口支援」へ軸足を移しつつある。 活動は翌日から 発災翌日の２９日早朝、社会福祉法人職員らで構成する熊本県ＤＷＡＴは被災自治体に立ち寄った上で、避難所などで情報収集に当たった。同時に授乳室の設置など避難所のアセスメントも実施。連絡が取れない福祉施設を訪問したり、車中や自宅で避難する人に声を掛けたりした。 一方、同日午後１時には、全国災害福祉支援センターの職員１人が熊本県庁に到着し、ＤＷＡＴ本部の立ち上げに向けた支援に入った。センターは全国社会福祉協議会が２０２５年１０月に設置。各都道府県ＤＷＡＴとの調整など被災県ＤＷＡＴ本部を支える役割を担う。「被害がつかめない中、県に要請して１部屋を確保するところからスタートした」（同センター）という。 県外ＤＷＡＴも続々 県によると、発災翌日の午前９時半時点で、県内には４６５カ所の避難所が開設されており、", "content": "〈熊本地震〉緊急対応から”出口支援”へシフト 17県のDWAT25チームが対応\n2026年08月23日 福祉新聞編集部熊本地震は２０日で発生から２３日が経過した。高齢者や障害者らを支援する災害派遣福祉チーム（ＤＷＡＴ）は発災翌日から活動を開始。被害の大きかった３地域に拠点を置き、１７県の２５チームが対応に当たっている。今後は日常生活への移行を見据え、避難所からの「出口支援」へ軸足を移しつつある。\n活動は翌日から\n発災翌日の２９日早朝、社会福祉法人職員らで構成する熊本県ＤＷＡＴは被災自治体に立ち寄った上で、避難所などで情報収集に当たった。同時に授乳室の設置など避難所のアセスメントも実施。連絡が取れない福祉施設を訪問したり、車中や自宅で避難する人に声を掛けたりした。\n一方、同日午後１時には、全国災害福祉支援センターの職員１人が熊本県庁に到着し、ＤＷＡＴ本部の立ち上げに向けた支援に入った。センターは全国社会福祉協議会が２０２５年１０月に設置。各都道府県ＤＷＡＴとの調整など被災県ＤＷＡＴ本部を支える役割を担う。「被害がつかめない中、県に要請して１部屋を確保するところからスタートした」（同センター）という。\n県外ＤＷＡＴも続々\n県によると、発災翌日の午前９時半時点で、県内には４６５カ所の避難所が開設されており、約９９００人が身を寄せていた。\n３０日には県庁内にＤＷＡＴ本部が設置され、３１日から熊本に近い九州、中国、四国各県のＤＷＡＴ派遣に向けて調整。８月３日に福岡などの九州ブロック、７日に香川など中国・四国ブロックのＤＷＡＴが続々と熊本入りした。\n９日には被害が大きかった八代、氷川、宇城にある避難所でのアセスメントを終え、１７日までに１７県の２５チームが３拠点を中心に活動する体制を構築。いずれも熊本県ＤＷＡＴがリーダーを務め、各県ＤＷＡＴは担当拠点を固定することでスムーズな引き継ぎができるようにしている。\n顔の見える関係\n政府は防災体制を強化するため、２０２５年に災害対策基本法などを改正。避難所だけでなく、自宅などで避難生活を送る人も含めた福祉支援の充実を打ち出した。新たなガイドラインは発災から７２時間以内に支援の調整を始めるよう規定しているが、今回は発災翌日から支援が始まった。\nまた、センターが発足したことで、情報集約や県外ＤＷＡＴとの調整も円滑に進んでいる。専門部署として災害派遣医療チーム（ＤＭＡＴ）など他団体と顔の見える関係を築いたことも大きいという。\n生活再建へ軸足\n５日からはＤＷＡＴとは別に、人手不足に陥った県内の福祉施設がセンターに直接職員派遣を要請する仕組みも始まった。１７日までに１４施設から依頼があり、マッチングを進めている。\n個別支援に重点\n発災から２０日が経過し、避難所は段階的に統合されており、１６日時点で８０カ所を切った。ＤＷＡＴは現在、個別支援に重点を置き、要配慮者への対応や移送調整、罹災りさい証明手続きの後押しなどをする。また、自治体や社協とも協働して在宅避難者への支援に、より力を入れる予定だ。\n今後は発災直後の緊急対応から、避難者が地域での生活に戻るための出口支援へ軸足が移る。同センターは「地域移行した際に支援が途切れないよう、事前に地域の関係機関と連携するなど、生活再建を見据えた支援が求められている」と話している。", "summary": "高齢者や障害者らを支援する災害派遣福祉チーム（ＤＷＡＴ）は発災翌日から活動を開始。活動は翌日から\n発災翌日の２９日早朝、社会福祉法人職員らで構成する熊本県ＤＷＡＴは被災自治体に立ち寄った上で、避難所などで情報収集に当たった。各都道府県ＤＷＡＴとの調整など被災県ＤＷＡＴ本部を支える役割を担う。３０日には県庁内にＤＷＡＴ本部が設置され、３１日から熊本に近い九州、中国、四国各県のＤＷＡＴ派遣に向けて調整。", "categories": ["福祉・社会保障", "人材育成・HR"], "is_new": false}];
const CAT_META  = {"介護保険・制度": {"color": "#2563EB", "icon": "📋"}, "医療・健康": {"color": "#DC2626", "icon": "🏥"}, "福祉・社会保障": {"color": "#059669", "icon": "🤝"}, "施設運営・経営": {"color": "#D97706", "icon": "🏢"}, "人材育成・HR": {"color": "#7C3AED", "icon": "👥"}, "業務改善・介護テック": {"color": "#0891B2", "icon": "💡"}, "組織・心理": {"color": "#EA580C", "icon": "🧠"}, "海外エイジテック": {"color": "#0D9488", "icon": "🔬"}, "AIツール・生産性": {"color": "#6D28D9", "icon": "⚡"}, "メンタル・哲学": {"color": "#BE185D", "icon": "🌿"}};
const DEFAULT_CLR = '#6b7280';

// ── State ────────────────────────────────────────────────────────
let state = { period:'all', cat:'all', lang:'all', sort:'date', search:'', newOnly:false };

// ── Utils ────────────────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseDate(s) {
  if (!s) return new Date(0);
  return new Date(s.replace(' ','T') + (s.length===10?'T00:00:00+09:00':'+09:00'));
}

function ageBucket(d) {
  const h = (Date.now() - parseDate(d)) / 3.6e6;
  if (h < 48) return 'new';
  if (h < 168) return 'week';
  return 'old';
}

function ageBadgeHtml(dateStr) {
  const d = parseDate(dateStr);
  const h = (Date.now() - d) / 3.6e6;
  let label, cls;
  if (h < 24)       { label='今日';            cls='age-new';  }
  else if (h < 48)  { label='昨日';            cls='age-new';  }
  else if (h < 168) { label=Math.floor(h/24)+'日前'; cls='age-week'; }
  else              { label=d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'}); cls='age-old'; }
  return `<span class="age-badge ${cls}">${label}</span>`;
}

function catBadgesHtml(cats) {
  return (cats||[]).map(c => {
    const m = CAT_META[c] || {color:DEFAULT_CLR,icon:'📰'};
    const clr = m.color;
    return `<span class="cat-badge" style="background:${clr}18;color:${clr};border:1px solid ${clr}35">` +
           `${m.icon} ${esc(c)}</span>`;
  }).join('');
}

// ── Card builder ─────────────────────────────────────────────────
function buildCard(a) {
  const displaySummary = (a.lang==='en' && a.summary_ja) ? a.summary_ja : (a.summary||'');
  const displayTitle   = (a.lang==='en' && a.title_ja)   ? a.title_ja   : (a.title||'');
  const isEn = a.lang === 'en';

  const langBadge  = isEn
    ? '<span class="lang-badge lang-en">EN</span>'
    : '<span class="lang-badge lang-ja">JP</span>';
  const transBadge = isEn ? '<span class="trans-badge">🌐 翻訳</span>' : '';
  const newBadge   = a.is_new ? '<span class="is-new-badge">NEW</span>' : '';

  const summaryBlock = displaySummary.trim().length > 30
    ? `<p class="card-summary">${esc(displaySummary)}</p>`
    : `<p class="card-summary-empty">要約を取得できませんでした</p>`;

  const publishedDate = (a.published||'').slice(0,10);

  return `<article class="article-card"
  data-cats="${esc(JSON.stringify(a.categories||[]))}"
  data-lang="${a.lang||'ja'}"
  data-date="${a.published||''}"
  data-isnew="${a.is_new ? '1' : '0'}"
  data-source="${esc(a.source||'')}"
  data-search="${esc(((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase())}">

  <div class="card-band">
    <div class="card-cats">${catBadgesHtml(a.categories)}</div>
    <div class="card-meta">
      ${newBadge}
      ${ageBadgeHtml(a.published)}
      ${transBadge}
      ${langBadge}
    </div>
  </div>

  <div class="card-body">
    ${summaryBlock}
  </div>

  <div class="card-footer">
    <div class="card-footer-left">
      <div class="card-source">
        <span>${esc(a.source)}</span>
        <span class="card-source-dot">·</span>
        <span>${publishedDate}</span>
      </div>
      <a class="card-title" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        ${esc(displayTitle)}
      </a>
    </div>
    <a class="read-btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="記事を読む">
      記事を読む
      <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </a>
  </div>
</article>`;
}

// ── Filter ───────────────────────────────────────────────────────
function filterArticles() {
  const now = Date.now();
  return ARTICLES.filter(a => {
    if (state.newOnly && !a.is_new) return false;
    if (state.period !== 'all') {
      const h = (now - parseDate(a.published)) / 3.6e6;
      if (state.period==='today' && h>48)  return false;
      if (state.period==='week'  && h>168) return false;
      if (state.period==='month' && h>720) return false;
    }
    if (state.cat  !== 'all' && !(a.categories||[]).includes(state.cat)) return false;
    if (state.lang !== 'all' && a.lang !== state.lang) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = ((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (state.sort==='date') return parseDate(b.published)-parseDate(a.published);
    const ca=(a.categories||[''])[0]||'', cb=(b.categories||[''])[0]||'';
    return ca!==cb ? ca.localeCompare(cb,'ja') : parseDate(b.published)-parseDate(a.published);
  });
}

// ── Section header ───────────────────────────────────────────────
function sectionHeader(catName, count) {
  const m = CAT_META[catName] || {color:DEFAULT_CLR, icon:'📰'};
  return `<div class="section-header">
    <span class="section-icon">${m.icon}</span>
    <span class="section-name" style="color:${m.color}">${esc(catName)}</span>
    <span class="section-count">${count}件</span>
  </div>`;
}

// ── Render ───────────────────────────────────────────────────────
function render() {
  const filtered = filterArticles();
  const container = document.getElementById('articlesContainer');
  const empty = document.getElementById('emptyState');
  document.getElementById('visibleCount').textContent = filtered.length;

  if (!filtered.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    renderSidebar(filtered);
    return;
  }
  empty.style.display = 'none';

  if (state.sort==='cat' && state.cat==='all') {
    const groups = {};
    const ORDER = Object.keys(CAT_META);
    filtered.forEach(a => {
      const c = (a.categories||[])[0] || '未分類';
      (groups[c]=groups[c]||[]).push(a);
    });
    let html='';
    ORDER.forEach(c => {
      if (groups[c]?.length) html += sectionHeader(c,groups[c].length)+groups[c].map(buildCard).join('');
    });
    if (groups['未分類']?.length) html += sectionHeader('未分類',groups['未分類'].length)+groups['未分類'].map(buildCard).join('');
    container.innerHTML = html;
  } else {
    container.innerHTML = filtered.map(buildCard).join('');
  }

  renderSidebar(filtered);
}

// ── Sidebar render ───────────────────────────────────────────────
function renderSidebar(filtered) {
  const catCounts={}, srcCounts={};
  filtered.forEach(a => {
    (a.categories||[]).forEach(c=>{ catCounts[c]=(catCounts[c]||0)+1; });
    srcCounts[a.source]=(srcCounts[a.source]||0)+1;
  });

  // Categories
  const sidebarCats = document.getElementById('sidebarCats');
  let html = `<button class="sidebar-item ${state.cat==='all'?'active':''}" data-scat="all">
    <span class="sidebar-item-label">すべて</span>
    <span class="sidebar-count">${filtered.length}</span>
  </button>`;
  Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).forEach(([cat,cnt]) => {
    const m = CAT_META[cat]||{icon:'📰'};
    html += `<button class="sidebar-item ${state.cat===cat?'active':''}" data-scat="${esc(cat)}">
      <span class="sidebar-item-label">${m.icon} ${esc(cat)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarCats.innerHTML = html;

  // Sources
  const sidebarSrc = document.getElementById('sidebarSources');
  let srcHtml='';
  Object.entries(srcCounts).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([src,cnt]) => {
    srcHtml += `<button class="sidebar-item" data-ssrc="${esc(src)}">
      <span class="sidebar-item-label" style="font-size:.8rem">${esc(src)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarSrc.innerHTML = srcHtml;

  // Sidebar category click
  sidebarCats.querySelectorAll('[data-scat]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.scat;
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      const chip = document.querySelector(`.cat-chip[data-cat="${CSS.escape(btn.dataset.scat)}"]`);
      if (chip) chip.classList.add('active'); else {
        const allChip = document.querySelector('.cat-chip[data-cat="all"]');
        if (allChip) allChip.classList.add('active');
      }
      render();
    });
  });
}

// ── Init ─────────────────────────────────────────────────────────
function init() {
  // Stats
  const newCnt = ARTICLES.filter(a=>a.is_new).length;
  document.getElementById('statTotal').textContent = ARTICLES.length;
  document.getElementById('statJa').textContent    = ARTICLES.filter(a=>a.lang==='ja').length;
  document.getElementById('statEn').textContent    = ARTICLES.filter(a=>a.lang==='en').length;
  document.getElementById('statNew').textContent   = newCnt;

  // Build category chips
  const wrap = document.getElementById('catChips');
  Object.entries(CAT_META).forEach(([name, m]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.dataset.cat = name;
    btn.textContent = m.icon + ' ' + name;
    wrap.appendChild(btn);
  });

  // Period tabs
  document.querySelectorAll('.period-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.period = btn.dataset.period;
      render();
    });
  });

  // Category chips
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.cat-chip');
    if (!btn) return;
    document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    render();
  });

  // New-only toggle
  const newToggle = document.getElementById('newToggle');
  newToggle.addEventListener('click', () => {
    state.newOnly = !state.newOnly;
    newToggle.classList.toggle('active', state.newOnly);
    newToggle.setAttribute('aria-pressed', String(state.newOnly));
    render();
  });

  // Controls
  document.getElementById('langFilter').addEventListener('change', e=>{ state.lang=e.target.value; render(); });
  document.getElementById('sortBy').addEventListener('change',     e=>{ state.sort=e.target.value; render(); });
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value.trim(); render(); });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
