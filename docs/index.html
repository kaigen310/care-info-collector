st because you could?\nI couldn’t resist throwing in this one as well.\nSimon: What’s one of your favorite absurd things that you’ve built with Claude, just because you could build it?\nThariq: I’m working on a 2D Street Fighter fighting game with me as a character — and my friends as well. It uses Claude Code to prompt Gemini — and honestly the Seedance model is pretty good — to make video animations. It works great; it’s so good at prompting, and it can verify the frames to check whether an animation was good.\nSimon: Is this Street Fighter 2-level 2D sprites you’re generating?\nThariq: Yeah, exactly — 2D sprites. The animation looks amazing. And it can also figure out hitboxes — it can be like, “Oh, your fist is here, I’ll draw the JSON hitbox.” It’s incredible.\nCat: Mine is much more simple. I’m a big rock climber and a lot of my friends climb, so we have this little app we built with Claude Code where we log all the projects we’re working on. We also go outdoors together a lot, so we have Claude do all this research with workflows. Workflows is amazing — we brand it as a coding tool, but it’s amazing for doing deep research for travel. I also plan our team offsites, and it’s good at finding venues that can fit all of us. I use workflows to research all the climbing destinations we might want to go to, and what has direct flights from where all of us are located. It goes to Mountain Project and finds all the climbs at our grade level. It finds the Airbnb. And I don’t like hiking, so I care a lot about it having a very short approach — very short walking distance from where the car parks to where the rock actually is — and it filters for this. With existing apps I have to manually click through Mountain Project, but with this I just put in all of our preferences and it’s a custom app for us.\nSimon: So you’re basically vibe coding Jira for mountain climbing.\nCat: Exactly.\nAudience: Any plans for eval-building tools and agent observability?\nWe had a few minutes at the end for questions from the audience.\nAudience: Do you have any near-term plans to build more eval tools for us to build eval datasets, and more observability tools to monitor the performance of agents and workflows?\nCat: We’ve considered building eval tools, but I think the limiting factor actually tends to be that it takes a long time for customers to build really high-quality evals. So I think the tooling is less of the constraint, and more the skill set of how you build a great eval. That’s an area where we’re excited to both invest internally and hopefully share some best practices externally.\nAudience: How is memory designed today — and would you move from files to a data store?\nAudience (Sai): I’m interested in the memory and the multiplayer. How is memory being designed today? I assume it’s around files. And second, have you thought about an orthogonal direction where you would actually need a data store for these memories, instead of files, to scale it better?\nThariq: Right now for Claude Tag the memory is channel-specific. Every Claude in that channel has a shared memory, and the instances have a session — but the session can contribute back to main memory. We do a lot of memory research, and it can be kind of unintuitive what the right way to do memory is. We’re always running memory experiments. How it works right now in Claude Tag is a markdown file per channel.", "summary": "Do you have an example of a feature which surprised you?. I’ll have Claude Tag do it. How do you think about that?. Be as ambitious as you can.", "categories": ["AIツール・生産性", "業務改善・介護テック"], "is_new": false, "title_ja": "Claude Code チームの Cat と Thariq との炉端チャット", "summary_ja": "驚いた機能の例はありますか?クロード・タグにやってもらいます。それについてどう思いますか?できるだけ野心的になりましょう。"}, {"title": "The new GPT-5.6 family: Luna, Terra, Sol", "url": "https://simonwillison.net/2026/Jul/9/gpt-5-6/#atom-entries", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-07-10 04:46", "description": "OpenAI's latest flagship model hit general availability this morning , and comes in three sizes: Luna, Terra, and Sol (from smallest to largest). The new models are priced per 1M input/output tokens as Luna $1/$6, Terra $2.50/$15, Sol $5/$30. For comparison, the Claude Opus series are $5/$25 and the Claude Fable 5 is $10/$50, but price-per-million tokens doesn't tell us much now that the number of reasoning tokens can differ so much between models for the same task. All three models have a Febru", "content": "The new GPT-5.6 family: Luna, Terra, Sol\n9th July 2026\nOpenAI’s latest flagship model hit general availability this morning, and comes in three sizes: Luna, Terra, and Sol (from smallest to largest).\nThe new models are priced per 1M input/output tokens as Luna $1/$6, Terra $2.50/$15, Sol $5/$30. For comparison, the Claude Opus series are $5/$25 and the Claude Fable 5 is $10/$50, but price-per-million tokens doesn’t tell us much now that the number of reasoning tokens can differ so much between models for the same task.\nAll three models have a February 16th 2026 knowledge cutoff, a million token context window, and 128,000 maximum output tokens.\nOpenAI’s biggest benchmark claim concerns long-running agentic performance, with one benchmark showing all three models outperforming Claude Fable 5:\nWe trained GPT-5.6 to get more useful work from every token. On Agents’ Last Exam, an evaluation of long-running professional workflows across 55 fields, GPT-5.6 Sol sets a new high of 53.6, eclipsing Claude Fable 5 (adaptive reasoning) by 13.1 points. Even at medium reasoning, it beats Fable 5 by 11.4 points at roughly one-quarter the estimated cost. That efficiency extends to smaller models, which are essential to making intelligence more abundant and affordable: GPT-5.6 Terra and GPT-5.6 Luna outperform Fable 5 at around one-sixteenth the cost.\nAmusingly, one self-reported benchmark that Fable 5 crushed the GPT-5.6 family on was SWE-Bench Pro, where Fable 5 got 80% compared to GPT-5.6 Sol getting 64.6%. This may help explain why OpenAI chose to publish this article yesterday specifically calling out SWE-Bench Pro for problems they found while auditing that benchmark:\nIn light of these results, we estimate that ~30% of SWE-bench Pro tasks are broken, and advise that model developers carefully examine results\nI’ve had some early access to GPT-5.6 Sol—it’s definitely very competent, though so far it hasn’t struck me as better than Fable at the kind of complex coding tasks I’ve been using with Anthropic’s model.\nAs usual, the model guidance for using GPT-5.6 has the most interesting details. There are a bunch of new API features that I need to explore (and probably add support for in LLM), including:\n- Programmatic Tool Calling allows the models to “compose and run JavaScript that orchestrates tool calls”—which sounds to me like it could help bridge the gap between MCPs and full terminal sessions that can compose CLI utilities in useful ways. Also reminiscent of the dynamic filtering mechanism Anthropic added to their web search tool, which allows code execution against web results as part of a single model turn.\n- Multi-agent lets the model “spin up subagents for parallel, focused work”—the sub-agent pattern now baked into the core API.\n- Prompt cache breakpoints brings the Claude model of prompt caching to OpenAI, letting you be explicit about where the cache breakpoints are rather than relying on the API to detect them automatically. Personally I much prefer automatic detection (still supported by OpenAI), but presumably there are optimization cost savings to be had here if you put the work in.\n- You can now set detail: original on image requests to avoid resizing the image at all before it is processed.\nHere’s a full page with 18 different pelicans—for reasoning efforts none, low, medium, high, xhigh, and max across the three different models. It also lists their token and calculated costs—the least expensive was gpt-5.6-luna at effort none for 0.71 cents, the most expensive was gpt-5.6-sol at max reasoning level for 48.55 cents.\nIn further pelican news, if you jump to 17:50 in their livestream from this morning you’ll see OpenAI’s own demo of 3D pelicans riding a tricycle, a bicycle, a pony, and another pelican!", "summary": "The new GPT-5.6 family: Luna, Terra, Sol\n9th July 2026\nOpenAI’s latest flagship model hit general availability this morning, and comes in three sizes: Luna, Terra, and Sol (from smallest to largest). The new models are priced per 1M input/output tokens as Luna $1/$6, Terra $2.50/$15, Sol $5/$30. That efficiency extends to smaller models, which are essential to making intelligence more abundant and affordable: GPT-5.6 Terra and GPT-5.6 Luna outperform Fable 5 at around one-sixteenth the cost. Amusingly, one self-reported benchmark that Fable 5 crushed the GPT-5.6 family on was SWE-Bench Pro, where Fable 5 got 80% compared to GPT-5.6 Sol getting 64.6%.", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "新しい GPT-5.6 ファミリー: Luna、Terra、Sol", "summary_ja": "新しい GPT-5.6 ファミリー: Luna、Terra、Sol\n2026 年 7 月 9 日\nOpenAI の最新のフラッグシップ モデルは今朝一般発売され、Luna、Terra、Sol (最小から最大) の 3 つのサイズがあります。新しいモデルの価格は、100 万入出力トークンあたり、Luna $1/$6、Terra $2.50/$15、Sol $5/$30 です。その効率は、インテリジェンスをより豊富で手頃な価格にするために不可欠な小型モデルにも及びます。GPT-5.6 Terra と GPT-5.6 Luna は、約 16 分の 1 のコストで Fable 5 を上回ります。面白いことに、Fable 5 が GPT-5.6 ファミリを粉砕したと自己報告したベンチマークの 1 つは SWE-Bench Pro で、GPT-5.6 Sol が 64.6% を獲得したのに対し、Fable 5 は 80% を獲得しました。"}, {"title": "sqlite-utils 4.0, now with database schema migrations", "url": "https://simonwillison.net/2026/Jul/7/sqlite-utils-4/#atom-entries", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-07-08 04:32", "description": "This morning I released sqlite-utils 4.0 , the 124th release of that project and the first major version bump since 3.0 in November 2020. In addition to some small but significant breaking changes (described in this upgrade guide ), this version introduces three major features: database migrations , nested transactions (via a new db.atomic() method), and support for compound foreign keys . Database schema migrations using sqlite-utils Schema migrations define a sequence of changes to be made to ", "content": "sqlite-utils 4.0, now with database schema migrations\n7th July 2026\nThis morning I released sqlite-utils 4.0, the 124th release of that project and the first major version bump since 3.0 in November 2020. In addition to some small but significant breaking changes (described in this upgrade guide), this version introduces three major features: database migrations, nested transactions (via a new db.atomic()\nmethod), and support for compound foreign keys.\nDatabase schema migrations using sqlite-utils\nSchema migrations define a sequence of changes to be made to a SQLite database, plus a mechanism for tracking which migrations have been applied and applying any that are found to be pending.\nMigrations are defined in Python files using the sqlite-utils Python library, which includes a powerful table.transform()\nmethod providing enhanced alter table capabilities that are not supported by SQLite’s ALTER TABLE\nstatement.\n(table.transform()\nimplements the pattern recommended by the SQLite documentation—create a new temporary table with the new schema, copy across the data, then drop the old table and rename the temporary one in its place.)\nHere’s an example migration file which creates a table called creatures\n, adds an additional column to it in a second step, then changes the types of two of the columns in a third:\nfrom sqlite_utils import Migrations migrations = Migrations(\"creatures\") @migrations() def create_table(db): db[\"creatures\"].create( {\"id\": int, \"name\": str, \"species\": str}, pk=\"id\", ) @migrations() def add_weight(db): db[\"creatures\"].add_column(\"weight\", float) @migrations() def change_column_types(db): db[\"creatures\"].transform(types={\"species\": int, \"weight\": str})\nSave that as migrations.py\nand run it against a fresh database like this:\nuvx sqlite-utils migrate data.db migrations.py\nThen if you check the schema of that database:\nuvx sqlite-utils schema data.db\nYou’ll see this SQL:\nCREATE TABLE \"_sqlite_migrations\" (\n\"id\" INTEGER PRIMARY KEY,\n\"migration_set\" TEXT,\n\"name\" TEXT,\n\"applied_at\" TEXT\n);\nCREATE UNIQUE INDEX \"idx__sqlite_migrations_migration_set_name\"\nON \"_sqlite_migrations\" (\"migration_set\", \"name\");\nCREATE TABLE \"creatures\" (\n\"id\" INTEGER PRIMARY KEY,\n\"name\" TEXT,\n\"species\" INTEGER,\n\"weight\" TEXT\n);\nThe _sqlite_migrations\ntable is used to keep track of which migration functions have been run. The creatures\ntable above is the schema after all three migrations have been applied.\nTo see a list of migrations, both pending and applied, run this:\nuvx sqlite-utils migrate data.db migrations.py --list\nOutput:\nMigrations for: creatures\nApplied:\ncreate_table - 2026-07-07 17:58:41.360051+00:00\nadd_weight - 2026-07-07 17:58:41.360608+00:00\nchange_column_types - 2026-07-07 18:01:15.802000+00:00\nPending:\n(none)\nIf you don’t specify a migrations file, the sqlite-utils migrate data.db\ncommand will scan the current directory and its subdirectories for files called migrations.py\nand apply any Migrations()\ninstances it finds in them.\nYou can also execute migrations from Python code using the migrations.apply(db)\nmethod, which is useful for building tools that manage their own database schemas over multiple versions. My own LLM tool has been using a version of this pattern for several years now, as shown in llm/embeddings_migrations.py.\nPrior art\nMy favorite implementation of this pattern remains Django’s Migrations, developed by Andrew Godwin based on his earlier project South. Fun fact: Andrew, Russ Keith-Magee, and I presented our competing approaches to schema migrations for Django on the Schema Evolution panel at the very first DjangoCon back in 2008! My attempt was called dmigrations, developed with a team at Global Radio in London.\nDjango’s migrations can be automatically generated from model definitions and include the ability to roll back to a previous version. The sqlite-utils\napproach is deliberately simpler: unlike Django, sqlite-utils\nencourages programmatic table creation rather than a model definition ORM, so there isn’t anything we can use to automatically generate migrations.\nI decided to skip rollback, since in my experience it’s a feature that is rarely used. With a SQLite project, an easy way to achieve rollback is to create a copy of your database file before you apply the migrations!\nMigrating from sqlite-migrate\nThe design of sqlite-utils\nmigrations is three years old now—I had originally released it as a separate package called sqlite-migrate, which never quite graduated beyond a beta release.\nI’ve used that package in enough places now that I’m confident in the design, so I’ve decided to promote it to a feature of sqlite-utils\nto make it available by default to all of the other tools in the growing sqlite-utils/Datasette/LLM ecosystem.\nI made one last release of sqlite-migrate\n, which switches it to depend on sqlite-utils>=4\nand replaces the __init__.py\nfile with the following:\nfrom sqlite_utils import Migrations __all__ = [\"Migrations\"]\nAny existing project that depends on sqlite-migrate\nshould continue to work without alterations.\nEverything else in sqlite-utils 4.0\nHere are the release notes for this version, with some inline annotations:\nThe 4.0 release includes some minor backwards-incompatible fixes (hence the major version number bump) and introduces three major new features:\n- Database migrations, providing a structured mechanism for evolving a project’s schema over time. (#752)\nI think of migrations as the signature new feature, hence this blog post.\n- Nested transaction support via\ndb.atomic()\n, plus numerous improvements to how transactions work across the library. (#755)\nsqlite-utils\nhas long had a confused relationship with database transactions, partly because when I started designing the library back in 2018 I didn’t yet have a great feel for how those worked in SQLite itself.\nAdding migrations to the core library made me determined to finally crack this nut, since transactions make migration systems a whole lot safer and easier to reason about.\nI ended up building this around a db.atomic()\ncontext manager which looks like this:\nwith db.atomic(): db.table(\"dogs\").insert({\"id\": 1, \"name\": \"Cleo\"}, pk=\"id\") db.table(\"dogs\").insert({\"id\": 2, \"name\": \"Pancakes\"})\nSQLite supports Savepoints, and as a result db.atomic()\ncan be nested to carry out transactions inside of transactions. It’s pretty neat!\n- Support for compound foreign keys, including creation, transformation and introspection through table.foreign_keys. (#594)\nThis came about when I asked a coding agent to review all open issues and PRs for things that should be included in a 4.0 release since they would represent breaking changes if I added them later, and it correctly identified that compound foreign keys were exactly that kind of feature.\nI started with a breaking change to the table.foreign_keys introspection method, and then decided to see if Claude Fable 5 could handle the more fiddly job of integrating compound foreign key creation into the library. The API design it helped create felt exactly right to me—consistent with how the rest of the library worked already.\nOther notable changes include:\n- Upserts now use SQLite’s\nINSERT ... ON CONFLICT ... DO UPDATE SET\nsyntax, detect existing table primary keys automatically and reject records that are missing required primary key values. (#652)\nThis was the change that first pushed me to consider a breaking-change 4.0 version bump. I built this to help support sqlite-chronicle, which uses triggers to keep track of rows in a table that have been inserted, updated or deleted.\ndb.query()\nnow executes immediately and rejects statements that do not return rows; usedb.execute()\nfor writes and DDL.\nProbably the most disruptive breaking change—I’ve had to update a few places in my own code to switch from db.query()\nto db.execute()\nas a result.\n- CSV and TSV imports now detect column types by default, while inserts into existing tables preserve those tables’ column types. (#679)\nThe sqlite-utils insert data.db creatures creatures.csv --detect-types\nflag was a later addition to allow column types (text, integer, real) to be automatically detected based on the data in a CSV. It should be the default, and releasing a 4.0 means I can make it so.\ntable.extract()\nandextracts=\nno longer create lookup table records for all-null\nvalues. (#186)\nThe oldest issue addressed by this release—the underlying bug was opened (by me) in October 2020.\nSee Upgrading from 3.x to 4.0 for details on backwards-incompatible changes.\nThe detailed release notes for the features and fixes shipped during the 4.0 pre-release cycle are available in 4.0a0, 4.0a1, 4.0rc1, 4.0rc2, 4.0rc3 and 4.0rc4.\nThe upgrade guide was entirely written by Claude Fable 5, Claude Opus 4.8 and GPT-5.5. The same is true of the release notes.\nThis is the kind of documentation I’ve slowly become comfortable outsourcing to the robots. It doesn’t need to convince people of anything, or express any opinions—its job is to be as accurate and detailed as possible. I’ve reviewed the release notes closely and can confirm they are accurate and comprehensive.\nClaude Fable 5 helped a lot\nI released the first alpha of sqlite-utils 4.0 over a year ago. I’ve been dragging my heels on the stable release because of the amount of work it would take to track down and clean up the many other minor design flaws that a major version number allowed me to take on.\nAssistance from Claude Fable 5 (and to a lesser extent Opus 4.8 and GPT-5.5) gave me just the boost I needed to overcome inertia and make the most of the time I could afford to spend on this library.\nFable has really good taste in API design, and is relentlessly proactive if you give it a more open goal. My most successful prompt was a review task that I issued against what I thought was the last release candidate:\nreview the changes on main since the last tagged 3.x release - I am about to ship them as sqlite-utils 4.0, a stable version that promises no backwards-incompatible fixes for a very long time.\nreview the changelog and upgrade guide, and write yourself scratch scripts to try out all of the new features in v4 - save those scripts but don't commit them\nI tried this with GPT-5.5 xhigh in Codex Desktop and Fable 5 in Claude Code.\nGPT-5.5 wrote 5 Python scripts and didn’t turn up anything particularly interesting—its final report is here.\nFable 5 wrote 12 scripts, identified 4 release blockers and 10 additional issues in its report, and built a neat combined repro script, which, when run, output the following:\n=== 1. Failed db.execute() write leaves an implicit transaction open ===\nin_transaction after failed write: True\nBUG: table 'other' silently lost when connection closed\n=== 2. Leading ';' bypasses the query() first-token scanner ===\nBUG: raised OperationalError: no such savepoint: sqlite_utils_query\nBUG: row persisted despite rollback (count=1)\n=== 3. Rejected write PRAGMA via query() still takes effect ===\nBUG: user_version=5 after 'rejected' statement (docs say no effect)\n=== 4. Implicit compound FK resolves pk columns in table order, not PK order ===\nBUG: other_columns reported as ('b', 'a'), should be ('a', 'b')\nBUG: transform of valid data raised IntegrityError: FOREIGN KEY constraint failed\n=== 5. ForeignKey (now a dataclass) is no longer hashable ===\nBUG: cannot use 'sqlite_utils.db.ForeignKey' as a set element (unhashable type: 'ForeignKey')\n=== 6. Mixed ForeignKey objects and tuples in foreign_keys= rejected ===\nBUG: foreign_keys= should be a list of tuples\n=== 7. insert --csv into an EXISTING table transforms its column types ===\nBUG: existing zip '01234' is now 1234 (column type: int)\n=== 8. insert(pk=, alter=True) regression: InvalidColumns before alter runs ===\nBUG: InvalidColumns: Invalid primary key column ['id'] for table t with columns ['a']\n=== 9. migrate --stop-before an already-applied migration applies everything ===\nBUG: m2 was applied despite --stop-before m1 (m1 already applied)\n=== 10. ensure_autocommit_on() silently commits an open transaction ===\nBUG: row survived rollback (count=1) - transaction was committed\nI found myself agreeing with almost all of them. Here’s the PR with 16 commits where we worked through them in turn.\nThere’s no doubt in my mind that sqlite-utils 4.0 is a significantly higher-quality release than if I had built it without the assistance of the latest frontier models.", "summary": "sqlite-utils 4.0, now with database schema migrations\n7th July 2026\nThis morning I released sqlite-utils 4.0, the 124th release of that project and the first major version bump since 3.0 in November 2020. Database schema migrations using sqlite-utils\nSchema migrations define a sequence of changes to be made to a SQLite database, plus a mechanism for tracking which migrations have been applied and applying any that are found to be pending. The creatures\ntable above is the schema after all three migrations have been applied. I made one last release of sqlite-migrate\n, which switches it to depend on sqlite-utils>=4\nand replaces the __init__.py\nfile with the following:\nfrom sqlite_utils import Migrations __all__ = [\"Migrations\"]\nAny existing project that depends on sqlite-migrate\nshould continue to work without alterations.", "categories": ["福祉・社会保障", "業務改善・介護テック"], "is_new": false, "title_ja": "sqlite-utils 4.0、データベース スキーマの移行が追加されました", "summary_ja": "sqlite-utils 4.0、データベース スキーマの移行が追加されました\n2026 年 7 月 7 日\n今朝、私はそのプロジェクトの 124 番目のリリースである sqlite-utils 4.0 をリリースしました。2020 年 11 月の 3.0 以来のメジャー バージョンアップです。 sqlite-utils を使用したデータベース スキーマの移行\nスキーマの移行では、SQLite データベースに加えられる一連の変更に加えて、どの移行が適用されたかを追跡し、保留中であることが判明した移行を適用するためのメカニズムが定義されます。生き物たち\n上の表は、3 つの移行すべてが適用された後のスキーマです。 sqlite-migrate の最後のリリースを作成しました\n、sqlite-utils>=4に依存するように切り替えます。\n__init__.py を置き換えます\n次のファイルを作成します。\nfrom sqlite_utils import 移行 __all__ = [\"移行\"]\nsqlite-merge に依存する既存のプロジェクト\n変更せずに動作し続ける必要があります。"}];
const CAT_META  = {"介護保険・制度": {"color": "#2563EB", "icon": "📋"}, "医療・健康": {"color": "#DC2626", "icon": "🏥"}, "福祉・社会保障": {"color": "#059669", "icon": "🤝"}, "施設運営・経営": {"color": "#D97706", "icon": "🏢"}, "人材育成・HR": {"color": "#7C3AED", "icon": "👥"}, "業務改善・介護テック": {"color": "#0891B2", "icon": "💡"}, "組織・心理": {"color": "#EA580C", "icon": "🧠"}, "海外エイジテック": {"color": "#0D9488", "icon": "🔬"}, "AIツール・生産性": {"color": "#6D28D9", "icon": "⚡"}, "メンタル・哲学": {"color": "#BE185D", "icon": "🌿"}};
const DEFAULT_CLR = '#6b7280';

// ── State ────────────────────────────────────────────────────────
let state = { period:'all', cat:'all', lang:'all', sort:'date', search:'', newOnly:false };

// ── Utils ────────────────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseDate(s) {
  if (!s) return new Date(0);
  return new Date(s.replace(' ','T') + (s.length===10?'T00:00:00+09:00':'+09:00'));
}

function ageBucket(d) {
  const h = (Date.now() - parseDate(d)) / 3.6e6;
  if (h < 48) return 'new';
  if (h < 168) return 'week';
  return 'old';
}

function ageBadgeHtml(dateStr) {
  const d = parseDate(dateStr);
  const h = (Date.now() - d) / 3.6e6;
  let label, cls;
  if (h < 24)       { label='今日';            cls='age-new';  }
  else if (h < 48)  { label='昨日';            cls='age-new';  }
  else if (h < 168) { label=Math.floor(h/24)+'日前'; cls='age-week'; }
  else              { label=d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'}); cls='age-old'; }
  return `<span class="age-badge ${cls}">${label}</span>`;
}

function catBadgesHtml(cats) {
  return (cats||[]).map(c => {
    const m = CAT_META[c] || {color:DEFAULT_CLR,icon:'📰'};
    const clr = m.color;
    return `<span class="cat-badge" style="background:${clr}18;color:${clr};border:1px solid ${clr}35">` +
           `${m.icon} ${esc(c)}</span>`;
  }).join('');
}

// ── Card builder ─────────────────────────────────────────────────
function buildCard(a) {
  const displaySummary = (a.lang==='en' && a.summary_ja) ? a.summary_ja : (a.summary||'');
  const displayTitle   = (a.lang==='en' && a.title_ja)   ? a.title_ja   : (a.title||'');
  const isEn = a.lang === 'en';

  const langBadge  = isEn
    ? '<span class="lang-badge lang-en">EN</span>'
    : '<span class="lang-badge lang-ja">JP</span>';
  const transBadge = isEn ? '<span class="trans-badge">🌐 翻訳</span>' : '';
  const newBadge   = a.is_new ? '<span class="is-new-badge">NEW</span>' : '';

  const summaryBlock = displaySummary.trim().length > 30
    ? `<p class="card-summary">${esc(displaySummary)}</p>`
    : `<p class="card-summary-empty">要約を取得できませんでした</p>`;

  const publishedDate = (a.published||'').slice(0,10);

  return `<article class="article-card"
  data-cats="${esc(JSON.stringify(a.categories||[]))}"
  data-lang="${a.lang||'ja'}"
  data-date="${a.published||''}"
  data-isnew="${a.is_new ? '1' : '0'}"
  data-source="${esc(a.source||'')}"
  data-search="${esc(((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase())}">

  <div class="card-band">
    <div class="card-cats">${catBadgesHtml(a.categories)}</div>
    <div class="card-meta">
      ${newBadge}
      ${ageBadgeHtml(a.published)}
      ${transBadge}
      ${langBadge}
    </div>
  </div>

  <div class="card-body">
    ${summaryBlock}
  </div>

  <div class="card-footer">
    <div class="card-footer-left">
      <div class="card-source">
        <span>${esc(a.source)}</span>
        <span class="card-source-dot">·</span>
        <span>${publishedDate}</span>
      </div>
      <a class="card-title" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        ${esc(displayTitle)}
      </a>
    </div>
    <a class="read-btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="記事を読む">
      記事を読む
      <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </a>
  </div>
</article>`;
}

// ── Filter ───────────────────────────────────────────────────────
function filterArticles() {
  const now = Date.now();
  return ARTICLES.filter(a => {
    if (state.newOnly && !a.is_new) return false;
    if (state.period !== 'all') {
      const h = (now - parseDate(a.published)) / 3.6e6;
      if (state.period==='today' && h>48)  return false;
      if (state.period==='week'  && h>168) return false;
      if (state.period==='month' && h>720) return false;
    }
    if (state.cat  !== 'all' && !(a.categories||[]).includes(state.cat)) return false;
    if (state.lang !== 'all' && a.lang !== state.lang) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = ((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (state.sort==='date') return parseDate(b.published)-parseDate(a.published);
    const ca=(a.categories||[''])[0]||'', cb=(b.categories||[''])[0]||'';
    return ca!==cb ? ca.localeCompare(cb,'ja') : parseDate(b.published)-parseDate(a.published);
  });
}

// ── Section header ───────────────────────────────────────────────
function sectionHeader(catName, count) {
  const m = CAT_META[catName] || {color:DEFAULT_CLR, icon:'📰'};
  return `<div class="section-header">
    <span class="section-icon">${m.icon}</span>
    <span class="section-name" style="color:${m.color}">${esc(catName)}</span>
    <span class="section-count">${count}件</span>
  </div>`;
}

// ── Render ───────────────────────────────────────────────────────
function render() {
  const filtered = filterArticles();
  const container = document.getElementById('articlesContainer');
  const empty = document.getElementById('emptyState');
  document.getElementById('visibleCount').textContent = filtered.length;

  if (!filtered.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    renderSidebar(filtered);
    return;
  }
  empty.style.display = 'none';

  if (state.sort==='cat' && state.cat==='all') {
    const groups = {};
    const ORDER = Object.keys(CAT_META);
    filtered.forEach(a => {
      const c = (a.categories||[])[0] || '未分類';
      (groups[c]=groups[c]||[]).push(a);
    });
    let html='';
    ORDER.forEach(c => {
      if (groups[c]?.length) html += sectionHeader(c,groups[c].length)+groups[c].map(buildCard).join('');
    });
    if (groups['未分類']?.length) html += sectionHeader('未分類',groups['未分類'].length)+groups['未分類'].map(buildCard).join('');
    container.innerHTML = html;
  } else {
    container.innerHTML = filtered.map(buildCard).join('');
  }

  renderSidebar(filtered);
}

// ── Sidebar render ───────────────────────────────────────────────
function renderSidebar(filtered) {
  const catCounts={}, srcCounts={};
  filtered.forEach(a => {
    (a.categories||[]).forEach(c=>{ catCounts[c]=(catCounts[c]||0)+1; });
    srcCounts[a.source]=(srcCounts[a.source]||0)+1;
  });

  // Categories
  const sidebarCats = document.getElementById('sidebarCats');
  let html = `<button class="sidebar-item ${state.cat==='all'?'active':''}" data-scat="all">
    <span class="sidebar-item-label">すべて</span>
    <span class="sidebar-count">${filtered.length}</span>
  </button>`;
  Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).forEach(([cat,cnt]) => {
    const m = CAT_META[cat]||{icon:'📰'};
    html += `<button class="sidebar-item ${state.cat===cat?'active':''}" data-scat="${esc(cat)}">
      <span class="sidebar-item-label">${m.icon} ${esc(cat)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarCats.innerHTML = html;

  // Sources
  const sidebarSrc = document.getElementById('sidebarSources');
  let srcHtml='';
  Object.entries(srcCounts).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([src,cnt]) => {
    srcHtml += `<button class="sidebar-item" data-ssrc="${esc(src)}">
      <span class="sidebar-item-label" style="font-size:.8rem">${esc(src)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarSrc.innerHTML = srcHtml;

  // Sidebar category click
  sidebarCats.querySelectorAll('[data-scat]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.scat;
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      const chip = document.querySelector(`.cat-chip[data-cat="${CSS.escape(btn.dataset.scat)}"]`);
      if (chip) chip.classList.add('active'); else {
        const allChip = document.querySelector('.cat-chip[data-cat="all"]');
        if (allChip) allChip.classList.add('active');
      }
      render();
    });
  });
}

// ── Init ─────────────────────────────────────────────────────────
function init() {
  // Stats
  const newCnt = ARTICLES.filter(a=>a.is_new).length;
  document.getElementById('statTotal').textContent = ARTICLES.length;
  document.getElementById('statJa').textContent    = ARTICLES.filter(a=>a.lang==='ja').length;
  document.getElementById('statEn').textContent    = ARTICLES.filter(a=>a.lang==='en').length;
  document.getElementById('statNew').textContent   = newCnt;

  // Build category chips
  const wrap = document.getElementById('catChips');
  Object.entries(CAT_META).forEach(([name, m]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.dataset.cat = name;
    btn.textContent = m.icon + ' ' + name;
    wrap.appendChild(btn);
  });

  // Period tabs
  document.querySelectorAll('.period-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.period = btn.dataset.period;
      render();
    });
  });

  // Category chips
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.cat-chip');
    if (!btn) return;
    document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    render();
  });

  // New-only toggle
  const newToggle = document.getElementById('newToggle');
  newToggle.addEventListener('click', () => {
    state.newOnly = !state.newOnly;
    newToggle.classList.toggle('active', state.newOnly);
    newToggle.setAttribute('aria-pressed', String(state.newOnly));
    render();
  });

  // Controls
  document.getElementById('langFilter').addEventListener('change', e=>{ state.lang=e.target.value; render(); });
  document.getElementById('sortBy').addEventListener('change',     e=>{ state.sort=e.target.value; render(); });
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value.trim(); render(); });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
