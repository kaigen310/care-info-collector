年2月から適用 厚労省通知\n厚生労働省は26日、通信機能を備えた福祉用具の給付対象を拡大する通知を発出した。【Joint編集部】\n一定の条件を満たす製品を新たに給付対象に加え、来年2月1日から適用する。介護保険最新情報Vol.1549で現場の関係者に広く周知した。\n新たに給付対象となるのは、バッテリーの状態、異常・故障、使用状況などを、居宅外の利用者や家族、必要に応じて福祉用具専門相談員などへ通知する機能を備えた製品だ。\n該当する種目は、電動など一部の車いす、車いす用の電動補助装置、特殊寝台、認知症老人徘徊感知機器。徘徊感知機器については、機器の位置情報を居宅内外の家族らへ通知する機能も給付対象となる（携行型の専用受信端末で受信する機器に限る）。\n一方、通信費や受信端末、通信環境の整備費などは対象外。利用者の状態変化や体調不良などを伝える通信機能が本体と区分できない場合は、製品全体が対象外となる。\n福祉用具のIoT化を踏まえた見直しだ。利用者の安全・安心の確保、機器の適切な維持管理などにつなげる狙いがある。", "summary": "2026年10月28日\n福祉用具の給付対象を拡大 通信機能付きの車いす・介護ベッドなど 来年2月から適用 厚労省通知\n厚生労働省は26日、通信機能を備えた福祉用具の給付対象を拡大する通知を発出した。新たに給付対象となるのは、バッテリーの状態、異常・故障、使用状況などを、居宅外の利用者や家族、必要に応じて福祉用具専門相談員などへ通知する機能を備えた製品だ。徘徊感知機器については、機器の位置情報を居宅内外の家族らへ通知する機能も給付対象となる（携行型の専用受信端末で受信する機器に限る）。一方、通信費や受信端末、通信環境の整備費などは対象外。", "categories": ["介護保険・制度", "福祉・社会保障"], "is_new": false}, {"title": "高齢者とAIの対話をケアに生かす　NTTデータが「ボイスタ！」を刷新　本人の思いや変化を可視化　介護現場を支援", "url": "https://www.joint-kaigo.com/articles/49875/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-10-27 18:13", "description": "NTTデータは26日、高齢者向けコミュニケーションサービス「ボイスタ！」の新モデルの提供を開始した。【Joint編集部】 AI機能やサービス基盤などを刷新・高度化した。生成AIとの日々の対話を通じて本人への理解を深め、介 […]", "content": "高齢者とAIの対話をケアに生かす NTTデータが「ボイスタ！」を刷新 本人の思いや変化を可視化 介護現場を支援\nNTTデータは26日、高齢者向けコミュニケーションサービス「ボイスタ！」の新モデルの提供を開始した。【Joint編集部】\nAI機能やサービス基盤などを刷新・高度化した。生成AIとの日々の対話を通じて本人への理解を深め、介護現場でひとりひとりに合った質の高いケアを提供できるよう支援する。\n生成AIとの対話機能は、高齢者が理解しやすいようにゆっくりと話しかけ、相手の言葉に耳を傾けながら話題を広げる設計。ひとりひとりのプロフィールや興味・関心、過去の対話内容などを踏まえて応答し、何げないやりとりから本人の思いや生活習慣、日々の変化などを継続的に捉えていく。\nこうした情報を新たな「ケア支援AI」で分析し、「ボイスタ！ケア支援AIレポート（仮称）」として整理・可視化する。介護現場の職員は、これを日々の声かけやケアプランの検討、職員間の情報共有などに幅広く活用できる。\n日々忙しい介護現場には、個別のケアに充てられる人員・時間にどうしても限りがある。NTTデータはこれを踏まえ、普段のコミュニケーションだけでは把握しきれない本人の一面を汲み取り、その人に合ったケアの実践につなげられるように支援する。その有用性などを確かめる取り組みを、ニチイケアパレスや学研ココファンといった介護サービス大手とともに進めてきた経緯がある。\n今後は、在宅介護支援ツール「ケアエール」にも「ケア支援AI」を展開するなど活用領域を広げ、2028年度末までに10万人規模への提供を目指す。介護、医療、生活支援といった様々なサービス・機器との連携、機能拡張などを進め、ケアから暮らしまでを支えるプラットフォームへと発展させたい考えだ。\n※ NTTデータは次の留意点を示している。\n【抜粋】利用者との対話内容等の情報は、本人への説明・同意取得および必要な範囲での利用を前提として、適切な安全管理措置を講じ、情報の閲覧範囲を設定可能とするなど、プライバシーに配慮して取り扱います。AIによる分析には外部のAIサービスを活用しますが、対話内容等の情報はAIの学習には利用されません。分析結果は、本人理解やケアの検討に活用する参考情報であり、医療上の診断や介護上の判断を代替するものではありません。", "summary": "高齢者とAIの対話をケアに生かす NTTデータが「ボイスタ！。」を刷新 本人の思いや変化を可視化 介護現場を支援\nNTTデータは26日、高齢者向けコミュニケーションサービス「ボイスタ！。生成AIとの日々の対話を通じて本人への理解を深め、介護現場でひとりひとりに合った質の高いケアを提供できるよう支援する。こうした情報を新たな「ケア支援AI」で分析し、「ボイスタ！。", "categories": ["福祉・社会保障", "業務改善・介護テック"], "is_new": false}, {"title": "看護職員の賃上げ、他産業に「遠く及ばない」　看護協会調査　賃金に8割弱が不満", "url": "https://www.joint-kaigo.com/articles/49888/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-10-27 17:45", "description": "日本看護協会は27日に記者会見を開き、「看護職員の賃上げに関する緊急調査」の結果を公表した。【Joint編集部】 病院と訪問看護事業所の賃上げの実施状況が、他産業に「遠く及ばない状況」だと問題を提起した。 調査結果による […]", "content": "日本看護協会は27日に記者会見を開き、「看護職員の賃上げに関する緊急調査」の結果を公表した。【Joint編集部】\n病院と訪問看護事業所の賃上げの実施状況が、他産業に「遠く及ばない状況」だと問題を提起した。\n調査結果によると、今年度に看護職員の賃上げを実施した病院は68.7％、訪問看護事業所は73.2％。賃上げ率は両者とも1％以上2％未満が最多で、5％以上はそれぞれ13.0％、18.4％にとどまった。\n民間企業を対象とした別の調査では、賃上げ率5％以上が大企業・中小企業とも4割を超えている。\n看護職員の賃金への満足度をみると、病院、訪問看護事業所、介護事業所・施設のいずれの職場でも、賃金に「不満」「やや不満」の合計が8割弱。不満が強い人ほど、現在の勤務先で働き続ける意向、看護職員を続ける意向が低い傾向がみられた。\n※ この調査は今年9月に実施され、看護職員3万8736人、病院3908施設、訪問看護1925事業所から回答を得た。\n日本看護協会の秋山智弥会長は記者会見で、看護職員の他産業への流出を「大きな損失」と懸念。新たな担い手の確保にもつなげるため、来年度予算や介護報酬改定、診療報酬の期中改定などを通じて、他産業に見劣りしない賃上げの実現を国に求める方針を示した。", "summary": "日本看護協会は27日に記者会見を開き、「看護職員の賃上げに関する緊急調査」の結果を公表した。調査結果によると、今年度に看護職員の賃上げを実施した病院は68.7％、訪問看護事業所は73.2％。看護職員の賃金への満足度をみると、病院、訪問看護事業所、介護事業所・施設のいずれの職場でも、賃金に「不満」「やや不満」の合計が8割弱。※ この調査は今年9月に実施され、看護職員3万8736人、病院3908施設、訪問看護1925事業所から回答を得た。", "categories": ["医療・健康", "人材育成・HR"], "is_new": false}, {"title": "Service expansion: From underused space to stronger care models", "url": "https://www.mcknightsseniorliving.com/home/columns/guest-columns/service-expansion-from-underused-space-to-stronger-care-models/", "source": "McKnight's Senior Living", "lang": "en", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-10-26 08:01", "description": "When looking at expanding services, often the best opportunity is not a ground-up project, but a fresh assessment of assets already in place. The difficult part is determining which possibilities merit investment. Doing so calls for a careful review of market conditions, resident requirements, organizational capacity and the campus’ physical realities.", "content": "Across senior living and post-acute care, expanding services has moved from an occasional planning topic to a central strategic priority. With expectations changing, resident healthcare needs increasing and competition growing sharper, providers are looking closely at how much more their existing campuses can support.\nOften, the best opportunity is not a ground-up project, but a fresh assessment of assets already in place. Spaces that sit underused, floor plans that no longer fit and older service approaches may be adapted to support additional care offerings, improved resident experiences and stronger performance over time.\nThe difficult part is determining which possibilities merit investment. Doing so calls for a careful review of market conditions, resident requirements, organizational capacity and the campus’ physical realities.\nStart with market demand\nEvery service expansion decision should start with a clear picture of what the surrounding market is demanding. A market demand study can identify important shifts in population trends, referral activity, competing services and resident expectations that remain unmet or poorly defined.\nThat study can help answer very practical questions. Is memory care demand increasing? Are consumers looking for more affordable options than skilled nursing? Is interest growing in short-term rehabilitation, enhanced assisted living or hospitality-driven amenities?\nFormal analysis often is strengthened by internal signals, including wait lists, recurring family questions or referral patterns that suggest consistent and / or unmet demand. When providers base expansion choices on measurable need instead of assumptions, they lower risk and increase the likelihood that the business strategy will perform as intended.\nLook past the wait list\nResident need is not the same thing as market demand, and the difference is important. A campus may have a reputation for one type of care, whereas the people living there increasingly need another type as they age in place and remain on campus longer.\nCampuses originally centered on independent living may see an increasing need for assisted living, memory support, or more adaptable post-acute services. Some providers also are finding that reducing traditional skilled care beds and converting selected areas to lower-needs residential models can better accommodate family preferences and residents’ goals for independence.\nRepositioning of this kind also can produce settings that feel more residential and less institutional. Reviewing resident profiles, family input, care transitions, discharge patterns and unresolved requests can show whether the existing service mix still aligns with those being served.\nEvaluate operational readiness\nEven when the market opportunity is evident, an expansion will work only if the organization is prepared to sustain it operationally. Introducing a new care or service line takes more than refreshing finishes or renovating part of a building.\nIt may require different staffing approaches, revised clinical workflows, regulatory compliance, additional training, technology upgrades and updated programming. Leaders should consider whether they can attract and keep the right team, and whether current systems can handle the added complexity.\nNot every gap in the market deserves a response. Sometimes a limited enhancement — such as a bistro, wellness feature or short-term stay option — can add value without placing too much strain on staffing and / or operations.\nAssess the building’s potential\nThe built environment directly influences whether a service expansion is feasible. Existing facilities should be reviewed for code compliance, life safety, circulation, lighting, privacy and their ability to support the planned level of care.\nPhysical feasibility involves more than meeting minimum requirements. It also means shaping environments that promote dignity, safety, staff effectiveness and quality of life while still feeling like home rather than an institution.\nOne strong example is the renovation of Magnolia Gardens at Skaalen Retirement Services, a specialized memory care community-based residential facility located on the Skaalen Retirement Services campus in Stoughton, WI. There, an outdated skilled care setting became a 16-unit community-based residential facility. Double-occupancy rooms were changed into private rooms with full baths. Lighting and access control were enhanced, and walls were opened to draw more daylight into interior areas.\nThe project also added centralized staff areas, a full cooking and serving kitchen, a bathing spa, laundry space and cabinetry designed for multiple uses. To reach the intended vision, careful analysis of code-related changes and how to complete them was essential to securing approval for a new license. The result demonstrates how understanding licensing requirements can lead to well-considered solutions that fit existing conditions and reposition a building for a more relevant care model.\nExisting conditions can restrict what is possible when spaces are repurposed, so identifying those limits early in planning helps prevent problems later.\nCreate the strategy across disciplines\nThe strongest expansion efforts seldom are driven by a single department. They are shaped through collaboration among leadership, nursing, facilities, operations and frontline staff members who know how residents experience the campus each day.\nOn the Magnolia Gardens project, team members from several departments offered insights that helped the design address staff frustrations, unmet workflow needs and obstacles to serving residents well. That input is not simply helpful; it is a practical way to reduce risk, improve implementation, support a healthier business model and, ultimately, strengthen the bottom line.\nWhen organizations involve stakeholders early, they are better positioned to uncover hidden barriers, avoid expensive redesigns and develop solutions that function in daily practice, not just on paper. That involvement often separates an appealing concept from a strategy that actually can be executed. Considered, deliberate planning can benefit both owners and residents. Early planning remains one of the clearest predictors of future success.\nConverting capacity into capability\nService expansion should be more than a reaction to vacant space, competitive pressure or the urge to keep pace with the market. The most resilient strategies take shape when leaders consider market demand, resident need, operational readiness and physical feasibility as connected parts of the same decision. When those elements work together, a campus can turn unused capacity into purposeful capability, evolving in ways that are strategic, financially sustainable and aligned with mission.\nJon Rynish is a senior project architect with Hoffman Planning, Design & Construction and a Leadership in Energy and Environmental Design (LEED)-accredited professional. A graduate of the University of Wisconsin-Milwaukee with a Bachelor of Science in architectural studies, he has more than 15 years of experience in the design profession. Rynish has collaborated on numerous senior living community projects for a variety of clients, specifically those for religious congregations, county providers and nonprofit providers. Email him at [email protected].\nMike Edwin is a senior consultant – senior living and religious markets with Hoffman. His unique consulting skill set features a background in community and facility assessments, market research data collection and analysis, and strategic planning and board education, among other talents. Edwin’s educational background includes a Bachelor of Science in economics and management from Minnesota State University in Mankato and an MBA from Edgewood College in Madison. Email him at [email protected].\nJulie Heiberger is the senior living market leader and a senior project architect for Hoffman. With more than 30 years of experience, her expertise centers on designing sustainable senior living communities that address the latest care models and industry trends. Heiberger is a member of the American Institute of Architects, the National Council of Architectural Review Boards and the Board of Directors of SAGE (the Society for the Advancement of Gerontological Environments). Email her at [email protected].\nThe opinions expressed in each McKnight’s Senior Living guest column are those of the author and are not necessarily those of McKnight’s Senior Living.\nHave a column idea? See our submission guidelines here.", "summary": "Is memory care demand increasing?. Mike Edwin is a senior consultant – senior living and religious markets with Hoffman. Julie Heiberger is the senior living market leader and a senior project architect for Hoffman. Email her at [email protected].", "categories": ["施設運営・経営", "医療・健康"], "is_new": true, "title_ja": "Service expansion: From underused space to stronger care models", "summary_ja": "Is memory care demand increasing?. Mike Edwin is a senior consultant – senior living and religious markets with Hoffman. Julie Heiberger is the senior living market leader and a senior project architect for Hoffman. Email her at [email protected]."}, {"title": "The data-related changes needed for senior living to attract capital, consumer trust", "url": "https://www.mcknightsseniorliving.com/home/columns/editors-columns/the-data-related-changes-needed-for-senior-living-to-attract-capital-consumer-trust/", "source": "McKnight's Senior Living", "lang": "en", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-10-26 08:00", "description": "One theme stemming from a recent discussion at the NIC Fall Conference was clear: Data will be critical to the future success of senior living, and meeting data standardization, collection and quality needs will require active participation from operators and industry-related associations and organizations.", "content": "As the senior living sector faces unprecedented interest from consumers and investors, the industry is turning to corollary sectors, including lodging and hospitality, to learn from them.\nAt the recently concluded 2026 NIC Fall Conference in Chicago, a panel of prominent executives explored some of those lessons during a session entitled “The Lodging Sector Evolution & Playbook: Possible or Practical for Senior Housing?” One theme stemming from the discussion was clear: data will be critical to the future success of senior living, and meeting data standardization, collection and quality needs will require active participation from operators and industry-related associations and organizations.\nIn the lodging industry, the widespread adoption of standardized data revolutionized capital formation and strategic decision-making, said John Arabia, founder and CEO of Taylor Vance and the lead independent director at pure-play seniors housing real estate investment trust Janus Living. He pointed to how the evolution of Smith Travel Research created transparency that lenders and investors could trust.\nAnd years ago, he said, despite the hotel industry having many differing types of properties, companies decided to come together to develop a uniform system of accounts. “Even though we all have very disparate businesses, being able to look at basically one set of financial statements and knowing it’s all the same” is helpful, Arabia said.\nDave Johnson, co-founder and managing partner of privately held real estate investment firm Horizon Capital and former Sonida Senior Living board chairman, emphasized how daily access to performance metrics has transformed lodging industry operations compared with decades past. Among other business, Horizon forms partnerships, raising capital for national hospitality opportunities.\n“In the late 1980s and early 1990s, we didn’t have the Smith Travel, and we would literally have our night auditors call around to all the hotels in our comp set and ask them if they sold out tonight or not. That was our data,” he said. “Now, we are able to make such great decisions. We no longer look at market share on a monthly basis. We know if we kicked ass or got our ass kicked every single day, because of the access to data.”\nCollaboration, participation needed\nTo achieve this level of transparency, however, individual companies cannot work in silos, the panelists said. Industry associations and trade organizations, they added, must lead the charge in establishing common definitions and standardized data structures across the board.\nRichard Hutchinson, CEO of Discovery Senior Living, emphasized the collaborative effort required across the sector, noting his role as chairman of the American Seniors Housing Association Executive Committee.\n“I think all of the trade organizations, everybody, needs to come together to create this kind of commonality of the data,” he said, urging senior living companies to participate in the effort and in the submission of data. “It’s bigger than you,” Hutchinson told attendees. “It’s to the collective benefit of the industry, which includes you.”\nSunrise Senior Living CEO Jack Callison echoed this sentiment, stressing that today’s investors and consumers demand comparability and trust.\n“The more consequential a decision, the less acceptable it is for us to ask someone to buy or invest” without them having access to data to inform the decision, he said. “We need data, we need transparency, we need common definitions across the board, for consumers and for investors.”\nReferencing the recently announced $1 billion deal through which investment and advisory firm BDT & MSD Partners will acquire Sunrise from the Public Sector Pension Investment Board, he said: “We just went through this process, and we’re thrilled that we landed a partnership with BDT & MSD, but I’ve got to tell you, there is so much capital flooding in this space outside of the sector, and they’re incredibly frustrated by the lack of data and transparency. We got the same questions over and over and over again. They benchmark against other sectors.”\nIt was difficult to provide answers due to a lack of comparability, Callison said, echoing Hutchinson’s call for participation.\n“We’ve been on this journey together for some years. Everybody in the audience, we need you to participate,” Callison said. “Data transparency will unlock capital, unlock consumer trust. We have to go on this journey together.”\nLois A. Bowers is the editor of McKnight’s Senior Living, the winner of a 2025 Jesse H. Neal Award in the Best Range of Work by a Media Brand category. Read some of her other columns here. Follow her on X (formerly Twitter) at Lois_Bowers.", "summary": "That was our data,” he said. “I think all of the trade organizations, everybody, needs to come together to create this kind of commonality of the data,” he said, urging senior living companies to participate in the effort and in the submission of data. Everybody in the audience, we need you to participate,” Callison said. “Data transparency will unlock capital, unlock consumer trust.", "categories": ["医療・健康", "業務改善・介護テック"], "is_new": true, "title_ja": "The data-related changes needed for senior living to attract capital, consumer trust", "summary_ja": "That was our data,” he said. “I think all of the trade organizations, everybody, needs to come together to create this kind of commonality of the data,” he said, urging senior living companies to participate in the effort and in the submission of data. Everybody in the audience, we need you to participate,” Callison said. “Data transparency will unlock capital, unlock consumer trust."}, {"title": "Claude Haiku 5.5", "url": "https://simonwillison.net/2026/Oct/7/claude-haiku-5-5/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-10-08 05:56", "description": "As previously promised , here's Anthropic's new fast, low cost model: Introducing Claude Haiku 5.5 . The previous Haiku, 4.5, was very much showing its age. It came out almost a year ago , and was priced at $1/million input and $5/million output - relatively expensive even back then, and a full 10x the price of OpenAI's GPT-6 Luna , released last month. The new Haiku exactly matches the price of GPT-6 Luna - $0.10/$0.50 - up to 100,000 tokens. Beyond 100,000 tokens the price increases 5x to $0.5", "content": "Claude Haiku 5.5\n7th October 2026\nAs previously promised, here’s Anthropic’s new fast, low cost model: Introducing Claude Haiku 5.5.\nThe previous Haiku, 4.5, was very much showing its age. It came out almost a year ago, and was priced at $1/million input and $5/million output—relatively expensive even back then, and a full 10x the price of OpenAI’s GPT-6 Luna, released last month.\nThe new Haiku exactly matches the price of GPT-6 Luna—$0.10/$0.50—up to 100,000 tokens. Beyond 100,000 tokens the price increases 5x to $0.50/$2.50. Luna itself has a price increase at 272,000 tokens but only to $0.20/$0.75.\nHaiku 5.5 also uses a new, less generous tokenizer. My Claude Token Counter tool shows that the same long prompt uses around 1.25x as many tokens with Haiku 5.5 compared to Haiku 4.5, so there’s a hidden price increase there.\nIf your workloads fit in 100,000 tokens, Haiku is the same price as Luna and reports higher benchmark scores. Above 100,000 tokens, Luna looks like a much better deal.\nThe most recent release of llm-anthropic finally fixed it so I don’t need to ship a new version of that plugin for every new model. I tested the new model like this:\nllm install -U llm-anthropic\nllm anthropic refresh\nllm -m claude-haiku-5.5 \"Generate an SVG of a pelican riding a bicycle\" -o thinking_effort low\nPelicans\nHere are pelicans for low, medium, high, xhigh, and max. The new Haiku doesn’t let you disable reasoning, and defaults to medium\n. I got a good bicycle frame for everything beyond low\n. The low effort pelican cost 0.0936 cents and took 7 seconds.\nThis max\neffort pelican (with a reasoning trace that starts “This is the classic pelican-on-bicycle SVG test...”) took 5 minutes 9 seconds to generate, but still only cost me 3.3826 cents:\n(Since the reasoning trace exhibits awareness of the benchmark, here’s Generate an SVG of an armadillo in fishnet tights jaywalking on Mars (on xhigh), and the same prompt against some other recent models. Background on that.)\nFor comparison, here’s the pelican I got a year ago from Haiku 4.5 (for 0.7583 cents—Haiku 4.5 did not support reasoning levels). It sucked at drawing pelicans:\nAnd a generous API credit scheme for subscribers\nIn addition to Haiku 5.5, Anthropic announced today that they are halving the price of cache reads for Sonnet 5.5. They’ve also added API credits to subscription plans:\nSecond, this week, we’ll roll out a new monthly API credit to all Max and Team subscribers for use on the Claude Platform. Max 5x users will get $100 in credits per month, Max 20x users will get $200, and Team subscribers will receive up to $500, pooled across their users.\nClaiming this is pleasantly easy: navigate to Settings -> Billing and select the API organization that should benefit from the credits every month:\nThe API credits exactly match the cost of the subscription itself. This is really generous—it makes it much easier for subscribers to use the API. Anthropic also let you disable auto-reload for the API, with the consequence that “API requests will stop when your balance runs out”—exactly what you want if you’re planning to burn through those API credits without risk of a nasty billing surprise.\nNote that the monthly credits do not roll over—use them or lose them.\nOpenAI still allow you to use your Codex subscription for personal API use, which works out as a better deal for heavy API users. This new credit scheme goes at least some way to overcoming that difference.\nMore recent articles\n- The October inflection point for vibe game development - 28th October 2026\n- Battle Drones - a vibe coded RTS with audio-based multiplayer - 20th October 2026\n- Hello Python 3.15, goodbye 3.10, and now I can use 3.11 - 12th October 2026\n- A new feature for my blog, built using my voice - 9th October 2026", "summary": "Claude Haiku 5.5\n7th October 2026\nAs previously promised, here’s Anthropic’s new fast, low cost model: Introducing Claude Haiku 5.5. The new Haiku exactly matches the price of GPT-6 Luna—$0.10/$0.50—up to 100,000 tokens. Haiku 5.5 also uses a new, less generous tokenizer. The new Haiku doesn’t let you disable reasoning, and defaults to medium\n.", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "Claude Haiku 5.5", "summary_ja": "Claude Haiku 5.5\n7th October 2026\nAs previously promised, here’s Anthropic’s new fast, low cost model: Introducing Claude Haiku 5.5. The new Haiku exactly matches the price of GPT-6 Luna—$0.10/$0.50—up to 100,000 tokens. Haiku 5.5 also uses a new, less generous tokenizer. The new Haiku doesn’t let you disable reasoning, and defaults to medium\n."}];
const CAT_META  = {"介護保険・制度": {"color": "#2563EB", "icon": "📋"}, "医療・健康": {"color": "#DC2626", "icon": "🏥"}, "福祉・社会保障": {"color": "#059669", "icon": "🤝"}, "施設運営・経営": {"color": "#D97706", "icon": "🏢"}, "人材育成・HR": {"color": "#7C3AED", "icon": "👥"}, "業務改善・介護テック": {"color": "#0891B2", "icon": "💡"}, "組織・心理": {"color": "#EA580C", "icon": "🧠"}, "海外エイジテック": {"color": "#0D9488", "icon": "🔬"}, "AIツール・生産性": {"color": "#6D28D9", "icon": "⚡"}, "メンタル・哲学": {"color": "#BE185D", "icon": "🌿"}};
const DEFAULT_CLR = '#6b7280';

// ── State ────────────────────────────────────────────────────────
let state = { period:'all', cat:'all', lang:'all', sort:'date', search:'', newOnly:false };

// ── Utils ────────────────────────────────────────────────────────
const esc = s => String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseDate(s) {
  if (!s) return new Date(0);
  return new Date(s.replace(' ','T') + (s.length===10?'T00:00:00+09:00':'+09:00'));
}

function ageBucket(d) {
  const h = (Date.now() - parseDate(d)) / 3.6e6;
  if (h < 48) return 'new';
  if (h < 168) return 'week';
  return 'old';
}

function ageBadgeHtml(dateStr) {
  const d = parseDate(dateStr);
  const h = (Date.now() - d) / 3.6e6;
  let label, cls;
  if (h < 24)       { label='今日';            cls='age-new';  }
  else if (h < 48)  { label='昨日';            cls='age-new';  }
  else if (h < 168) { label=Math.floor(h/24)+'日前'; cls='age-week'; }
  else              { label=d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'}); cls='age-old'; }
  return `<span class="age-badge ${cls}">${label}</span>`;
}

function catBadgesHtml(cats) {
  return (cats||[]).map(c => {
    const m = CAT_META[c] || {color:DEFAULT_CLR,icon:'📰'};
    const clr = m.color;
    return `<span class="cat-badge" style="background:${clr}18;color:${clr};border:1px solid ${clr}35">` +
           `${m.icon} ${esc(c)}</span>`;
  }).join('');
}

// ── Card builder ─────────────────────────────────────────────────
function buildCard(a) {
  const displaySummary = (a.lang==='en' && a.summary_ja) ? a.summary_ja : (a.summary||'');
  const displayTitle   = (a.lang==='en' && a.title_ja)   ? a.title_ja   : (a.title||'');
  const isEn = a.lang === 'en';

  const langBadge  = isEn
    ? '<span class="lang-badge lang-en">EN</span>'
    : '<span class="lang-badge lang-ja">JP</span>';
  const transBadge = isEn ? '<span class="trans-badge">🌐 翻訳</span>' : '';
  const newBadge   = a.is_new ? '<span class="is-new-badge">NEW</span>' : '';

  const summaryBlock = displaySummary.trim().length > 30
    ? `<p class="card-summary">${esc(displaySummary)}</p>`
    : `<p class="card-summary-empty">要約を取得できませんでした</p>`;

  const publishedDate = (a.published||'').slice(0,10);

  return `<article class="article-card"
  data-cats="${esc(JSON.stringify(a.categories||[]))}"
  data-lang="${a.lang||'ja'}"
  data-date="${a.published||''}"
  data-isnew="${a.is_new ? '1' : '0'}"
  data-source="${esc(a.source||'')}"
  data-search="${esc(((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase())}">

  <div class="card-band">
    <div class="card-cats">${catBadgesHtml(a.categories)}</div>
    <div class="card-meta">
      ${newBadge}
      ${ageBadgeHtml(a.published)}
      ${transBadge}
      ${langBadge}
    </div>
  </div>

  <div class="card-body">
    ${summaryBlock}
  </div>

  <div class="card-footer">
    <div class="card-footer-left">
      <div class="card-source">
        <span>${esc(a.source)}</span>
        <span class="card-source-dot">·</span>
        <span>${publishedDate}</span>
      </div>
      <a class="card-title" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
        ${esc(displayTitle)}
      </a>
    </div>
    <a class="read-btn" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" aria-label="記事を読む">
      記事を読む
      <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </a>
  </div>
</article>`;
}

// ── Filter ───────────────────────────────────────────────────────
function filterArticles() {
  const now = Date.now();
  return ARTICLES.filter(a => {
    if (state.newOnly && !a.is_new) return false;
    if (state.period !== 'all') {
      const h = (now - parseDate(a.published)) / 3.6e6;
      if (state.period==='today' && h>48)  return false;
      if (state.period==='week'  && h>168) return false;
      if (state.period==='month' && h>720) return false;
    }
    if (state.cat  !== 'all' && !(a.categories||[]).includes(state.cat)) return false;
    if (state.lang !== 'all' && a.lang !== state.lang) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      const hay = ((a.title_ja||a.title)+' '+(a.summary_ja||a.summary||'')+' '+a.source).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (state.sort==='date') return parseDate(b.published)-parseDate(a.published);
    const ca=(a.categories||[''])[0]||'', cb=(b.categories||[''])[0]||'';
    return ca!==cb ? ca.localeCompare(cb,'ja') : parseDate(b.published)-parseDate(a.published);
  });
}

// ── Section header ───────────────────────────────────────────────
function sectionHeader(catName, count) {
  const m = CAT_META[catName] || {color:DEFAULT_CLR, icon:'📰'};
  return `<div class="section-header">
    <span class="section-icon">${m.icon}</span>
    <span class="section-name" style="color:${m.color}">${esc(catName)}</span>
    <span class="section-count">${count}件</span>
  </div>`;
}

// ── Render ───────────────────────────────────────────────────────
function render() {
  const filtered = filterArticles();
  const container = document.getElementById('articlesContainer');
  const empty = document.getElementById('emptyState');
  document.getElementById('visibleCount').textContent = filtered.length;

  if (!filtered.length) {
    container.innerHTML = '';
    empty.style.display = 'block';
    renderSidebar(filtered);
    return;
  }
  empty.style.display = 'none';

  if (state.sort==='cat' && state.cat==='all') {
    const groups = {};
    const ORDER = Object.keys(CAT_META);
    filtered.forEach(a => {
      const c = (a.categories||[])[0] || '未分類';
      (groups[c]=groups[c]||[]).push(a);
    });
    let html='';
    ORDER.forEach(c => {
      if (groups[c]?.length) html += sectionHeader(c,groups[c].length)+groups[c].map(buildCard).join('');
    });
    if (groups['未分類']?.length) html += sectionHeader('未分類',groups['未分類'].length)+groups['未分類'].map(buildCard).join('');
    container.innerHTML = html;
  } else {
    container.innerHTML = filtered.map(buildCard).join('');
  }

  renderSidebar(filtered);
}

// ── Sidebar render ───────────────────────────────────────────────
function renderSidebar(filtered) {
  const catCounts={}, srcCounts={};
  filtered.forEach(a => {
    (a.categories||[]).forEach(c=>{ catCounts[c]=(catCounts[c]||0)+1; });
    srcCounts[a.source]=(srcCounts[a.source]||0)+1;
  });

  // Categories
  const sidebarCats = document.getElementById('sidebarCats');
  let html = `<button class="sidebar-item ${state.cat==='all'?'active':''}" data-scat="all">
    <span class="sidebar-item-label">すべて</span>
    <span class="sidebar-count">${filtered.length}</span>
  </button>`;
  Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).forEach(([cat,cnt]) => {
    const m = CAT_META[cat]||{icon:'📰'};
    html += `<button class="sidebar-item ${state.cat===cat?'active':''}" data-scat="${esc(cat)}">
      <span class="sidebar-item-label">${m.icon} ${esc(cat)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarCats.innerHTML = html;

  // Sources
  const sidebarSrc = document.getElementById('sidebarSources');
  let srcHtml='';
  Object.entries(srcCounts).sort((a,b)=>b[1]-a[1]).slice(0,10).forEach(([src,cnt]) => {
    srcHtml += `<button class="sidebar-item" data-ssrc="${esc(src)}">
      <span class="sidebar-item-label" style="font-size:.8rem">${esc(src)}</span>
      <span class="sidebar-count">${cnt}</span>
    </button>`;
  });
  sidebarSrc.innerHTML = srcHtml;

  // Sidebar category click
  sidebarCats.querySelectorAll('[data-scat]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.scat;
      document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('active'));
      const chip = document.querySelector(`.cat-chip[data-cat="${CSS.escape(btn.dataset.scat)}"]`);
      if (chip) chip.classList.add('active'); else {
        const allChip = document.querySelector('.cat-chip[data-cat="all"]');
        if (allChip) allChip.classList.add('active');
      }
      render();
    });
  });
}

// ── Init ─────────────────────────────────────────────────────────
function init() {
  // Stats
  const newCnt = ARTICLES.filter(a=>a.is_new).length;
  document.getElementById('statTotal').textContent = ARTICLES.length;
  document.getElementById('statJa').textContent    = ARTICLES.filter(a=>a.lang==='ja').length;
  document.getElementById('statEn').textContent    = ARTICLES.filter(a=>a.lang==='en').length;
  document.getElementById('statNew').textContent   = newCnt;

  // Build category chips
  const wrap = document.getElementById('catChips');
  Object.entries(CAT_META).forEach(([name, m]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.dataset.cat = name;
    btn.textContent = m.icon + ' ' + name;
    wrap.appendChild(btn);
  });

  // Period tabs
  document.querySelectorAll('.period-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.period = btn.dataset.period;
      render();
    });
  });

  // Category chips
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.cat-chip');
    if (!btn) return;
    document.querySelectorAll('.cat-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    render();
  });

  // New-only toggle
  const newToggle = document.getElementById('newToggle');
  newToggle.addEventListener('click', () => {
    state.newOnly = !state.newOnly;
    newToggle.classList.toggle('active', state.newOnly);
    newToggle.setAttribute('aria-pressed', String(state.newOnly));
    render();
  });

  // Controls
  document.getElementById('langFilter').addEventListener('change', e=>{ state.lang=e.target.value; render(); });
  document.getElementById('sortBy').addEventListener('change',     e=>{ state.sort=e.target.value; render(); });
  document.getElementById('searchInput').addEventListener('input', e=>{ state.search=e.target.value.trim(); render(); });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
