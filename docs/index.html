sole starter app on GitHub.\n15:37 The last session of the day is the closing Q&A with Sam Altman and Thibault Sottiaux. Thibault is product lead on Codex, ChatGPT, ChatGPT Work, and the API - promoted a few months ago after successfully leading Codex.\n15:38 That kicks off at 4pm, in about 20 minutes.\n16:00 (As an aside, there are some excellent California Brown Pelicans flying around the bay near the event venue today. Glad I brought my camera!)\n16:04 This closing session features Sam Altman, Thibault Sottiaux, and Tejal Patwardhan (a late addition, not listed in the program). The moderator is Pauline Narvas.\n16:06 Sam says \"we should have done it a long time ago\" about Sign in with ChatGPT.\n16:09 GPT Astra has been surprisingly competent at operating robots. Sam says this has updated his timeline for when we'll have people \"building really cool robots\".\n16:10 (I'll be honest, this Q&A has been pretty flat so far - the questions are such low-balls, \"how do you see dots in the next year\", \"why should developers be excited about Sign in with ChatGPT\" kind of things.)\n16:12 Q: What's something people should start building now that models can't do but should be possible by DevDay next year?\nSam: I would expect next DevDay to feel unimaginable if we can get alignment right so we can keep training. Tejal doesn't like to predict three months in advance. Sam \"I did not think we would prove a millennium prize problem within a year of the last DevDay\". Thibault thinks next year we'll have deep 3D understanding and multi-modal input.\n16:14 Q for Tejal: what can today's models do well on a benchmark that they still struggle with in the real world? Professional writing copy, not writing AI slop. Being faster, better at reading context. \"A lot of the intelligence improvements we need for more ambitious projects are there.\"\n16:15 Thibault says me thinks people are hitting decision fatigue over when to use subagents, what reasoning level to make. \"In six months we'll get back to the simplicity of a system that actually understands what you need\".\n16:17 Community question about the job market - what advice do you have for a college graduate today? Sam: I think this is a great time to enter the job market. Many job categories that exist today will be very different or won't exist - but the AI industry has underestimated how much human demand and expectations will go up. People use want way more software, and what it means to be a coder has changed. \"I have never seen startups be more successful as a whole than in this last year.\" If you are an ambitious person graduating college right now this is the best time.\n16:17 Tejal calls for college students to work on alignment and safety!\n16:17 Thibault says \"my favorite colleagues right now are the new grads at OpenAI\". Grounded ideas and good taste.\n16:18 Pauline promotes the Codex Ambassadors program, says that getting involved in events (and running events) is always a good idea.\n16:20 Thibault talks about how dots came out of the Codex harness getting more reliable and being able to handle longer tasks. Also says that Ultrafast has \"made building impossible things possible\" - they used that to help merge the ChatGPT desktop and Codex desktop apps in 28 days. Everyone on stage loves Ultrafast.\n16:20\n16:22 Community question about agent-to-human bandwidth, as the amount of information continues to increase. Tejal says that they've been talking about how agent-to-agent communication should differ from agent-to-human, and potentially post-training for those two differently.\n16:23 Sam mentions the idea of agents creating custom UI for you in real-time.\n16:25 Thibault likes using Pi! He says it helps understand the fundamentals, and loves that it can coexist alongside Codex.\n16:26 Sam says you need to build a business with durable advantages, same as always. (And that OpenAI will help you do that with their new distribution efforts.)\n16:28 Q: How should developers think about the relationship between token costs and usage limits? Thibault says 6.1 Sol is incredibly efficient. They need the economics to make sense on the plans. The thing they care about is how many tasks you can get done through your subscription, not token usage. Likes to see people talk about \"outcome per dollar\".\n16:29 Community question: How do you find the builders who don't know they are builders yet? Sam says that coding agents are much harder to get going with than ChatGPT, unifying Codex and ChatGPT helped more people become builders, but now hopes that people can talk to their dot during the day and that dot will then go away and build things and be helpful.\n16:31 Thibault: maybe next day we'll rename it to BuildDay, not DevDay. Also your dot knows what it looks like and can use Blender, so it can render little scenes featuring itself. \"Everyone will become a builder. Everyone will create. Developers will also turn into builders - and manual development of code isn't really something that will exist.\"\n16:32 Q: At what point will the models be so good that all the live demos work? (There were a whole lot of demo failures during DevDay). Sam: we take pride in demoing things when we launch them, and I'm proud that we take the risk on this.\n16:34 Q: As agents start working how do you decide when they should act on your own and when they should check with us? Thibault: dots don't have access by default to everything you have shared with ChatGPT already. You can give it as much responsibility and goals as you are comfortable with.\n16:38 Sam is excited about what the next generation of models will be able to do with mechanical and electrical engineering, in the same way that Astra made big leaps in robotic control.\n16:40 Question about pacing the frontier. What will you do to pace the frontier and get out of those race dynamics and make sure AI is safe for all of us? (applause)\nSam: No matter what governments do we will work to keep AI safe. There will be times like right now when we need to put more effort into increasing our capabilities there before we increase the model capabilities in a traditional sense.\n16:42 Panel is over!\nMore recent articles\n- 2026 in LLMs (so far) - 27th September 2026\n- Claude Opus 5.5, GPT-6 Sol, GPT-6 Luna, and a new price war - 22nd September 2026", "summary": "10:13 Live demo!. 10:22 Also today: Ultrafast. Available in the API, ChatGPT, and Codex. Codex is also now \"fully in the cloud\".", "categories": ["業務改善・介護テック", "AIツール・生産性"], "is_new": false, "title_ja": "OpenAI DevDay 2026 live blog", "summary_ja": "10:13 Live demo!. 10:22 Also today: Ultrafast. Available in the API, ChatGPT, and Codex. Codex is also now \"fully in the cloud\"."}, {"title": "カイポケ、会話から記録を自動作成するAIと連携　訪問看護で先行　ケアマネや訪問介護、福祉用具も対応へ", "url": "https://www.joint-kaigo.com/articles/49062/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-29 23:40", "description": "介護事業所の経営を支援するクラウドサービス「カイポケ」が、ケア中の会話から業務記録を自動で作成するAIツール「スタンドLM」との連携を始めた。【Joint編集部】 9月17日から訪問看護向けに正式提供し、10月には居宅介 […]", "content": "2026年9月29日\nカイポケ、会話から記録を自動作成するAIと連携 訪問看護で先行 ケアマネや訪問介護、福祉用具も対応へ\n介護事業所の経営を支援するクラウドサービス「カイポケ」が、ケア中の会話から業務記録を自動で作成するAIツール「スタンドLM」との連携を始めた。【Joint編集部】\n9月17日から訪問看護向けに正式提供し、10月には居宅介護支援にも対応する予定。エス・エム・エスは9月、スタンドLMを手がけるENBASEと戦略的パートナーシップを締結した。\nスタンドLMは、訪問先の利用者宅などの現場で交わされた会話をAIが解析し、サービス種別や事業所の書式に合わせて業務記録を自動で作成するツール。例えば、サービス担当者会議や各種カンファレンスの議事録、モニタリング記録、サービス提供記録、支援経過記録、多職種への報告文章などの作成を効率化できる。\n訪問看護、訪問介護、居宅介護支援、福祉用具貸与などに対応。蓄積された記録をもとに、計画書や報告書の作成につなげる機能もある。\n先行して連携が始まった訪問看護では、例えば、アプリで録音した会話をもとにAIが「看護記録Ⅱ」を作成。職員は内容を確認したうえで、ワンタップの送信でカイポケに登録できる。\nこうしたカイポケとスタンドLMの“ワンタップ連携機能”は、10月に居宅介護支援、年内に訪問介護へ広がる予定。その後、福祉用具貸与にも拡大されていく。\nエス・エム・エスは、「両社サービスの特長を掛け合わせることで、カイポケの機能的な付加価値を高めていく。在宅サービスの業務効率化の支援をより一層強化していく」としている。", "summary": "2026年9月29日\nカイポケ、会話から記録を自動作成するAIと連携 訪問看護で先行 ケアマネや訪問介護、福祉用具も対応へ\n介護事業所の経営を支援するクラウドサービス「カイポケ」が、ケア中の会話から業務記録を自動で作成するAIツール「スタンドLM」との連携を始めた。訪問看護、訪問介護、居宅介護支援、福祉用具貸与などに対応。先行して連携が始まった訪問看護では、例えば、アプリで録音した会話をもとにAIが「看護記録Ⅱ」を作成。こうしたカイポケとスタンドLMの“ワンタップ連携機能”は、10月に居宅介護支援、年内に訪問介護へ広がる予定。", "categories": ["福祉・社会保障", "医療・健康"], "is_new": false}, {"title": "介護福祉士養成校の入学者、外国人留学生が初の6割超に　638人増で全体を押し上げ", "url": "https://www.joint-kaigo.com/articles/49076/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-29 19:47", "description": "介護福祉士を養成する大学や専門学校などで組織する「日本介護福祉士養成施設協会」は29日、今年度の入学者の動向を公式サイトで発表した。【Joint編集部】 それによると、外国人留学生は前年度より638人多い4712人となっ […]", "content": "2026年9月29日\n介護福祉士養成校の入学者、外国人留学生が初の6割超に 638人増で全体を押し上げ\n介護福祉士を養成する大学や専門学校などで組織する「日本介護福祉士養成施設協会」は29日、今年度の入学者の動向を公式サイトで発表した。【Joint編集部】\nそれによると、外国人留学生は前年度より638人多い4712人となった。入学者の総数に占める割合は60.6％で、初めて6割を超えた。\n※ 記事中の人数や割合などは、協会の調査に回答した会員養成施設の集計値。\n入学者の総数は424人増の7780人。新卒者らは177人減の2756人、離職者訓練の受け入れは37人減の312人だった。外国人留学生の伸びがこれらの減少を補い、入学者の総数を押し上げた格好だ。\n外国人留学生の出身国はネパールが2539人で最も多く、単独で半数以上を占めた。次いでミャンマーが904人、ベトナムが377人となっている。\n定員の充足率は前年度の66.9％から73.6％に上昇した。一方、養成課程数は272から266に、入学定員は1万1001人から1万572人に減少した。", "summary": "2026年9月29日\n介護福祉士養成校の入学者、外国人留学生が初の6割超に 638人増で全体を押し上げ\n介護福祉士を養成する大学や専門学校などで組織する「日本介護福祉士養成施設協会」は29日、今年度の入学者の動向を公式サイトで発表した。【Joint編集部】\nそれによると、外国人留学生は前年度より638人多い4712人となった。入学者の総数は424人増の7780人。外国人留学生の伸びがこれらの減少を補い、入学者の総数を押し上げた格好だ。", "categories": ["人材育成・HR", "福祉・社会保障"], "is_new": false}, {"title": "沖縄・渡名喜島唯一の保育所始動　人材難で５年間開所できず - 福祉新聞Web", "url": "https://fukushishimbun.com/series07/46014", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-29 10:00", "description": "人口３００人弱の沖縄県渡名喜島で保育所が今夏開所した。保育士を募集しても応募がなく人材確保が難航し、「ハコだけがある状態」が５年間続いていた。今年度保育士ら３人を採用できたことで、島唯一の保育所が動き出した。 渡名喜村ではこどもが１～２人生まれる年もあるという。村立幼稚園があり、３～５歳児を受け入れるが、保育所はなく０～２歳児の預け先がない状況が続いており、村はかねて受け皿の確保を模索してきた。 老朽化した老人福祉センターを建て替えて整備した、同村社会福祉協議会による通所介護や、民俗資料館が入る「多目的拠点施設」の一室（９０平方メートル）に小規模保育所を設けた。 ハコができても保育士ら必要な職員を配置しないと、こどもを受け入れることはできない。２０２１年度から、ハローワークや村ホームページで求人を出すなどして保育士募集をスタート。しかし、２４年度に至るまで応募が１件もなく開所できない状況が続いていた。 ２５年度からは、沖縄県保育士・保育所総合支援センターの合同就職説明会に参加したり、内閣府の離島活性化事業を活用して保育士の移住に係る引っ越し費用を補助したりするなど採用に力を入れた。こう", "content": "沖縄・渡名喜島唯一の保育所始動 人材難で５年間開所できず\n2026年09月29日 福祉新聞編集部人口３００人弱の沖縄県渡名喜島で保育所が今夏開所した。保育士を募集しても応募がなく人材確保が難航し、「ハコだけがある状態」が５年間続いていた。今年度保育士ら３人を採用できたことで、島唯一の保育所が動き出した。\n渡名喜村ではこどもが１～２人生まれる年もあるという。村立幼稚園があり、３～５歳児を受け入れるが、保育所はなく０～２歳児の預け先がない状況が続いており、村はかねて受け皿の確保を模索してきた。\n老朽化した老人福祉センターを建て替えて整備した、同村社会福祉協議会による通所介護や、民俗資料館が入る「多目的拠点施設」の一室（９０平方メートル）に小規模保育所を設けた。\nハコができても保育士ら必要な職員を配置しないと、こどもを受け入れることはできない。２０２１年度から、ハローワークや村ホームページで求人を出すなどして保育士募集をスタート。しかし、２４年度に至るまで応募が１件もなく開所できない状況が続いていた。\n２５年度からは、沖縄県保育士・保育所総合支援センターの合同就職説明会に参加したり、内閣府の離島活性化事業を活用して保育士の移住に係る引っ越し費用を補助したりするなど採用に力を入れた。こうした中、人手不足で保育所が開所できないとの地元メディアの報道から、村外出身の保育士１人から応募があった。今年度、村立幼稚園に通うこどもがいないため、退職予定だった保育士１人、保育補助１人を会計年度任用職員として採用し、小規模保育所の開所にこぎつけた。\n８月３１日に開所式があり、現在１歳児１人が通う。定員は１９人だが、現状の職員配置では５人が上限だという。村の担当者は「子育て世帯が島に移住したくても、安心してこどもを生み育てる環境がなければ躊躇してしまう」と指摘し、これまでなかった保育所の開設を契機に移住促進に期待を寄せている。", "summary": "今年度保育士ら３人を採用できたことで、島唯一の保育所が動き出した。ハコができても保育士ら必要な職員を配置しないと、こどもを受け入れることはできない。こうした中、人手不足で保育所が開所できないとの地元メディアの報道から、村外出身の保育士１人から応募があった。今年度、村立幼稚園に通うこどもがいないため、退職予定だった保育士１人、保育補助１人を会計年度任用職員として採用し、小規模保育所の開所にこぎつけた。", "categories": ["人材育成・HR", "福祉・社会保障"], "is_new": false}, {"title": "就労系サービスの在宅支援、要件の厳格化や基本報酬の引き下げを提案＝厚労省", "url": "https://www.joint-kaigo.com/articles/49050/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-28 22:05", "description": "厚生労働省は28日、来年度の障害福祉サービス報酬改定に向けた議論を進めている有識者会議（障害福祉報酬改定検討チーム）で、就労継続支援や就労移行支援の在宅支援を取り上げた。【Joint編集部】 在宅支援を提供できる利用者と […]", "content": "厚生労働省は28日、来年度の障害福祉サービス報酬改定に向けた議論を進めている有識者会議（障害福祉報酬改定検討チーム）で、就労継続支援や就労移行支援の在宅支援を取り上げた。【Joint編集部】\n在宅支援を提供できる利用者と事業所の要件を厳格化する案を示した。\n厚労省は会合で、\n● 在宅支援と称して、公費による就労支援の生産活動として適さない活動\n● 就労に必要な知識・能力の向上に寄与しない自習\nを行わせているなど、「就労支援の実態が認められない不適切な運営がある」と問題を提起。在宅支援が認められる際の要件を、より具体的に設定することを提案した。\n利用者の要件については、単に在宅支援の効果が認められる人ではなく、「通所を上回る効果が認められる人」とする案を提示。その対象者として、\n● 重度の障害や地理的な要因で通所が困難な人\n● 通所支援を行うために、まず在宅支援が必要な人（ひきこもりなど）\n● 在宅での一般就労を希望し、自立・集中して作業ができる人\nの3類型をあげた。厚労省はこのうち、在宅での一般就労を希望する人に対する在宅支援の提供は、原則として就労移行支援に限ってはどうかとした。\n事業所の要件については、対象者に応じた支援プログラムの提供や緊急時の対応、本人のアセスメントなどを求めることを提案。支援の状況を動画などで保存し、自治体の求めに応じて提出できるようにすることを必須とする案も示した。\n厚労省はあわせて、在宅支援の基本報酬を一定程度引き下げること、定員に占める在宅支援の利用者の割合に上限を設けることも提案した。従来の単位数を維持し、利用者の割合に上限を設けない要件としては、\n● 在宅の利点が活かされる高単価の生産活動を行っている（動画・ホームページ作成、プログラミングなど）\n● 在宅でなければできない訓練が適切かつ確実に提供されている\n● 動画やバーチャル環境で利用者と常にコミュニケーションを取れる環境が整備されている\nなどをすべて満たすことを求めてはどうかとした。\n厚労省はこのほか、事業所に「在宅支援の内容に関するチェックリスト」を事前に提出させ、自治体が確認できるようにする流れも説明した。自宅以外での在宅支援の利用は、「極めて限定的な場合に限る」との考えも示した。\n今後、来年度改定の大枠の方向性を固める年末に向けて、具体的な要件・報酬などを詰める検討をさらに進める方針だ。", "summary": "【Joint編集部】\n在宅支援を提供できる利用者と事業所の要件を厳格化する案を示した。在宅支援が認められる際の要件を、より具体的に設定することを提案した。厚労省はこのうち、在宅での一般就労を希望する人に対する在宅支援の提供は、原則として就労移行支援に限ってはどうかとした。厚労省はあわせて、在宅支援の基本報酬を一定程度引き下げること、定員に占める在宅支援の利用者の割合に上限を設けることも提案した。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "【高野龍昭】変わりゆく要介護の原因　これからの「自立支援・重度化防止」のターゲット", "url": "https://www.joint-kaigo.com/articles/49037/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-28 17:34", "description": "1．国民生活基礎調査とは 私が注目している政府の統計調査のひとつに、厚生労働省の「国民生活基礎調査」があります。この最新の結果が7月に発表されました。【高野龍昭】 この調査は、厚生労働省が保健医療・福祉（介護）・年金・労 […]", "content": "【高野龍昭】変わりゆく要介護の原因 これからの「自立支援・重度化防止」のターゲット\n1．国民生活基礎調査とは\n私が注目している政府の統計調査のひとつに、厚生労働省の「国民生活基礎調査」があります。この最新の結果が7月に発表されました。【高野龍昭】\nこの調査は、厚生労働省が保健医療・福祉（介護）・年金・労働などの施策を実施・立案するために、国民の生活の実態を捉える基礎データを幅広く集めることを目的としたものです。政府の「基幹統計」のひとつで、調査結果などはオープン・データ化されています。\n調査と結果の公表は毎年1回ですが、3年に1回は大規模調査として実施され、収集データの範囲が拡大されます。今回発表された2025年分は、その大規模調査にあたります。\n2．「介護が必要となった主な原因の構成割合」の変化\nこの大規模調査の年次には、要介護高齢者の生活実態を把握するためのひとつのデータとして、「現在の要介護度別にみた介護が必要となった主な原因」が発表されます。\nそのデータの「総数」（要介護・要支援認定を受けた人の全体）に関する「原因」の上位5項目について、介護保険法が公布（1997年12月）されて以降のものを私が確認し、図のように示してみました。\nなお、調査の方法から考えると、縦断調査などではない調査データを経時的に折れ線グラフで示すのは、統計学的には決して正しい図示のしかたではありませんが、変化をわかりやすく視覚的に表すためにこの形式を用いてみました。\nまず、私が驚いたのは、1998年以降、一貫して上位5つは、\n● 認知症\n● 高齢による衰弱\n● 脳血管疾患\n● 骨折・転倒\n● 関節疾患\nで変化がないことです。\nそして、私が次に着目したのは、「『データが表す転換点』が2ヵ所ある」のではないか、ということです。\n① 2016年以降は「認知症」がトップに\nそのひとつは2016年の調査結果です。それまでずっと第1位であった「脳血管疾患」が第2位となり、代わって「認知症」がトップになった年です。\n私は1986年から医療福祉・介護の分野に身を置いていますが、その頃から老人保健法で「脳卒中後の廃用症候群を避ける『寝たきり老人ゼロ作戦』」のような課題を主要ターゲットとした3次予防を念頭に置いた施策が展開されていました。\nその後、2次予防にもシフトしつつ介護予防施策が重要視されてきた経過があります。それは介護保険制度施行以降も続きます。\nそうしたなか、2013年度からは「オレンジ・プラン（認知症施策推進5ヵ年計画）」が施策化され、それ以降、高齢者介護の施策は認知症を主要ターゲットとしたものに変化していきました。\n介護予防施策に関しても、BPSDの軽減策の標準化や「通いの場」の重視という流れが現れ、1次予防から3次予防までを包含した対応へと発展していきました。そこに「ゼロ次予防」（「つながり」や「共生社会」の重視）を包含する形で、2023年公布の「認知症基本法」へと至っています。\nこうした施策の展開の経過については、そのバックボーンのひとつとして、「介護が必要になった主な原因として『認知症』が増えている」「2016年の調査では、そのトップがついに『認知症』になった」という、この調査結果の変化があると考えて良いのではないでしょうか。\n② 2025年には「脳血管疾患」がトップ3の圏外に\nもうひとつの転換点は、今回発表の2025年の調査結果です。今回の調査では「脳血管疾患」がついにトップ3から消え、第4位となりました。指数（％）も低落が続いています。\nかつては、その原因として圧倒的多数であった「脳血管疾患」が減ったのは、2000年代半ばに脳梗塞に対するt-PA療法（アルテプラーゼ静注療法）が医療保険適用となって、画期的な治療効果をみせるようになったり、回復期医療の病床が整備されて医学的リハビリテーションが質・量の両面で拡大したりした点があると考えられます。\n医学・公衆衛生学分野での複数の研究で、わが国で「高齢者が同年齢で脳卒中を起こす発症率は、近年大きく下がっている」ということも報告されていますから、そうしたことも影響しているはずです。\nさらには、従前からのいわゆる介護予防・疾病予防の取り組みや、現行の自立支援・重度化防止の施策が効果をあげていることも考えられます。\nおそらく、このことは近年の高齢者介護・医療の予防的施策の展開が、「脳血管疾患モデル」「認知症モデル」だけでなく、「フレイル対策」「ロコモ対策」「運動・栄養・口腔の複合的対策」に拡大してきたことと一致しています。\n3．今後の「自立支援・重度化防止」施策のターゲット\n国民生活基礎調査の結果からは、介護が必要になった主な原因はダイナミックに変化しており、それが施策の動きにも一定の影響を及ぼしていることがわかります。\n主な5つの原因の疾患にそれぞれ共通に関連していることとして付け加えると、近年の公衆衛生分野での研究では「『ソーシャル・キャピタル』の豊富な地域で、高齢者の疾病リスクと要介護リスクが関連している」ということが次々と報告されています。\nこの「ソーシャル・キャピタル」とは「社会関係資本」と訳されていますが、簡潔に言えば「社会的つながり」のことで、信頼関係・互酬的な関係・それらのネットワークの多様性を指す社会学分野の概念です。このことは、近年の高齢者介護・高齢者福祉の施策の方向性にも大きな影響を与えています。\nそうした動向を踏まえつつ今回の調査結果をレビューしてみると、今後の自立支援・重度化防止の施策は、「地域で『つながる』」ことを重要視したものになっていくのではないか、と考えられます。\nこのことは、WHOが2008年に発表し、2010年代後半以降にその意識が国際的に拡大している「健康の社会的決定要因」、すなわち「健康は単なる医療や個人の生活習慣（禁煙・食事・運動等）に関連する問題ではなく、社会的・経済的な環境に強く影響されるものである」という考え方とも一致していると言ってよいでしょう。\n私は、今回の国民生活基礎調査の最新データから、そのようなイメージを膨らませています。", "summary": "この最新の結果が7月に発表されました。① 2016年以降は「認知症」がトップに\nそのひとつは2016年の調査結果です。こうした施策の展開の経過については、そのバックボーンのひとつとして、「介護が必要になった主な原因として『認知症』が増えている」「2016年の調査では、そのトップがついに『認知症』になった」という、この調査結果の変化があると考えて良いのではないでしょうか。このことは、近年の高齢者介護・高齢者福祉の施策の方向性にも大きな影響を与えています。", "categories": ["医療・健康", "介護保険・制度"], "is_new": false}, {"title": "就労B型、基本報酬の算定ルール見直しへ　厚労省　スコア方式の導入を提案　多面的な評価を検討｜障害福祉報酬改定", "url": "https://www.joint-kaigo.com/articles/49018/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-28 16:28", "description": "厚生労働省は28日、来年度の障害福祉サービス報酬改定に向けた議論を進めている有識者会議（障害福祉報酬改定検討チーム）で、就労系サービスの具体策を取り上げた。【Joint編集部】 就労継続支援B型の基本報酬について、新たに […]", "content": "就労B型、基本報酬の算定ルール見直しへ 厚労省 スコア方式の導入を提案 多面的な評価を検討｜障害福祉報酬改定\n厚生労働省は28日、来年度の障害福祉サービス報酬改定に向けた議論を進めている有識者会議（障害福祉報酬改定検討チーム）で、就労系サービスの具体策を取り上げた。【Joint編集部】\n就労継続支援B型の基本報酬について、新たに「スコア方式」を導入する案を提示。平均工賃月額だけでなく、利用者の障害の程度や支援時間、支援内容なども指標とする仕組みへの転換を提案した。\n＊ 現在、「スコア方式」は就労継続支援A型にも導入されている。\n基本報酬の評価をより多様な観点から行い、その精度を一段と高める狙いがある。\n現行、就労継続支援B型の基本報酬には、\n● 平均工賃月額に応じた報酬体系\n● 利用者の就労や生産活動への参加などをもって一律に評価する報酬体系\nの2つがある。厚労省はこのうち、平均工賃月額に応じた報酬体系を「スコア方式」に切り替えることを提案した。これが実現すれば、就労継続支援B型は基本報酬の算定ルールが大きく変わることになる。\nこうした提案の背景には、平均工賃月額の多寡を尺度とする現行の報酬体系の場合、障害の程度が重い利用者への支援が十分に評価されないとの指摘がある。\nさらに、財務省も厚労省に基本報酬の適正化をはたらきかけていた。2024年度の調査結果（予算執行調査）に基づき、\n● 利用者の平均利用時間が短い事業所の方が収支差率が高い傾向にある\n● 平均利用時間が短い事業所は、報酬が過大となっている可能性がある\nなどと問題を提起。「利用者の平均利用時間をよりきめ細かく勘案する報酬体系への見直しを」と促していた経緯がある。\n厚労省は今回、新たなスコア方式の主な指標の案として、\n● 平均工賃月額\n● 支援時間\n● 障害の程度\nの3つをあげた。支援時間は1日の平均サービス提供時間で評価する一方、障害特性などで短くなるケースへの配慮も検討するとした。\nこのほか、地域連携活動や個別支援、支援体制、事業の透明性などを評価に盛り込むことも提案。事業所の指定基準のうち、特に遵守すべき項目を満たしていない場合は厳しく評価してはどうかとした。\n厚労省はあわせて、平均工賃月額の計算に用いる事業所の年間開所日数について、利用者の年間利用上限日数（269日）を上限とする案も提示した。\n今回の会合では、新たなスコア方式の導入でより多面的な評価を目指す方向性に賛意が示された。\nまた、利用者の障害特性や支援実態を踏まえたきめ細かな制度設計を求める声のほか、基本報酬の見直しに伴う事業所の減収や現場の混乱を懸念する声も出た。\n厚労省はこれに対し、事業所にとっての予見可能性も十分に考慮しつつ、算定ルールの円滑な移行に向けた措置を検討すると応じた。", "summary": "【Joint編集部】\n就労継続支援B型の基本報酬について、新たに「スコア方式」を導入する案を提示。現行、就労継続支援B型の基本報酬には、\n● 平均工賃月額に応じた報酬体系\n● 利用者の就労や生産活動への参加などをもって一律に評価する報酬体系\nの2つがある。厚労省はこのうち、平均工賃月額に応じた報酬体系を「スコア方式」に切り替えることを提案した。「利用者の平均利用時間をよりきめ細かく勘案する報酬体系への見直しを」と促していた経緯がある。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "〈村山誠厚労事務次官インタビュー〉介護・障害報酬改定、他職種と遜色なく - 福祉新聞Web", "url": "https://fukushishimbun.com/fukushiippan/46011", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-28 10:00", "description": "厚生労働省の村山誠事務次官は８日、２０２７年度の介護報酬、障害報酬改定について「賃上げの状況や経営実態に即した対応がとれるよう実態調査を含め、きちんと積み上げを行い、他職種と遜色のない処遇改善の実現につなげたい」と語った。 同日、厚生日比谷クラブ加盟社による共同インタビューで答えた。物価高により医療や介護の現場は厳しい経営状況にあるとの認識も示した。「他職種と遜色のない処遇改善」は２５年と今年の政府の骨太の方針に明記されている。 熊本地震 個別訪問による在宅の方の健康状態の把握、車中泊の方の熱中症やエコノミークラス症候群の注意喚起、予防指導などの取り組みを進めてきた。 ８月２７日に政府全体の支援パッケージを決定し、関連の予備費の使用も翌日に決めた。今月４日は本部会議に衣替えし、これから復旧・復興支援に軸足を置くフェーズになっている。 外国人 社会保障はじめ各種制度を外国人に伝えるのが難しい。日本語をめぐる問題が大きなテーマだ。労働施策総合推進法に基づく事業主向けの外国人雇用管理指針を先般改訂したが、日本語学習支援も事業主の責務だと明記した。 やさしい日本語、多言語による周知を、一層の取", "content": "〈村山誠厚労事務次官インタビュー〉介護・障害報酬改定、他職種と遜色なく\n2026年09月28日 福祉新聞編集部厚生労働省の村山誠事務次官は８日、２０２７年度の介護報酬、障害報酬改定について「賃上げの状況や経営実態に即した対応がとれるよう実態調査を含め、きちんと積み上げを行い、他職種と遜色のない処遇改善の実現につなげたい」と語った。\n同日、厚生日比谷クラブ加盟社による共同インタビューで答えた。物価高により医療や介護の現場は厳しい経営状況にあるとの認識も示した。「他職種と遜色のない処遇改善」は２５年と今年の政府の骨太の方針に明記されている。\n熊本地震\n個別訪問による在宅の方の健康状態の把握、車中泊の方の熱中症やエコノミークラス症候群の注意喚起、予防指導などの取り組みを進めてきた。\n８月２７日に政府全体の支援パッケージを決定し、関連の予備費の使用も翌日に決めた。今月４日は本部会議に衣替えし、これから復旧・復興支援に軸足を置くフェーズになっている。\n外国人\n社会保障はじめ各種制度を外国人に伝えるのが難しい。日本語をめぐる問題が大きなテーマだ。労働施策総合推進法に基づく事業主向けの外国人雇用管理指針を先般改訂したが、日本語学習支援も事業主の責務だと明記した。\nやさしい日本語、多言語による周知を、一層の取り組みを進めていく必要がある。\n労働力確保\n高齢者は６５歳までと同じようにノルマとかではなく、慣れた仕事を週に何時間か確実にこなす、そこならやりがいをもって働けるという面もある。\nみんなが１日８時間労働するのでははなく、仕事を切り出していけば、特に７０代以降は労働参加が進む余地はあるのではないか。\nエッセンシャルワークは一定以上の高齢者がスキルを生かしながら軽い負担で経験を生かす形をつくることが大切ではないか。", "summary": "〈村山誠厚労事務次官インタビュー〉介護・障害報酬改定、他職種と遜色なく\n2026年09月28日 福祉新聞編集部厚生労働省の村山誠事務次官は８日、２０２７年度の介護報酬、障害報酬改定について「賃上げの状況や経営実態に即した対応がとれるよう実態調査を含め、きちんと積み上げを行い、他職種と遜色のない処遇改善の実現につなげたい」と語った。「他職種と遜色のない処遇改善」は２５年と今年の政府の骨太の方針に明記されている。やさしい日本語、多言語による周知を、一層の取り組みを進めていく必要がある。みんなが１日８時間労働するのでははなく、仕事を切り出していけば、特に７０代以降は労働参加が進む余地はあるのではないか。", "categories": ["福祉・社会保障", "人材育成・HR"], "is_new": false}, {"title": "2026 in LLMs (so far)", "url": "https://simonwillison.net/2026/Sep/27/2026-in-llms-so-far/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-28 08:54", "description": "On Friday I gave the closing keynote at the WeAreDevelopers World Congress North America in San Jose. I tied together the key trends from the past year into a chronological exploration of everything that happened in 2026. The video is on YouTube ; here are my annotated slides and notes to accompany the talk. And as an annotated presentation : # I'm going to give a lightning tour of everything that has happened so far in 2026. The year isn't over yet! # For me, 2026 started a couple of months ear", "content": "2026 in LLMs (so far)\n27th September 2026\nOn Friday I gave the closing keynote at the WeAreDevelopers World Congress North America in San Jose. I tied together the key trends from the past year into a chronological exploration of everything that happened in 2026. The video is on YouTube; here are my annotated slides and notes to accompany the talk.\nAnd as an annotated presentation:\nI’m going to give a lightning tour of everything that has happened so far in 2026. The year isn’t over yet!\nFor me, 2026 started a couple of months earlier in November 2025.\nNovember saw the release of two important models: Claude Opus 4.5 and GPT-5.1.\nAs is usually the case with new models, these were incremental improvements on the models that came before them.\nBut every now and then when a model improves, it crosses an invisible line where something that didn’t really work starts working.\nIn this case, the thing that started working was their coding agents. Claude Code had been around since February 2025; Codex was a little younger.\nThese two new models, when paired with their respective coding agent harnesses, improved from “often make mistakes” to “reliable enough to use on a day-to-day basis”.\nFor a couple of years now I’ve been evaluating new models by asking them to “Generate an SVG of a pelican riding a bicycle”. It’s probably the world’s stupidest benchmark—there’s only so much you can learn from it.\nBut it’s still a challenge for models, because drawing pelicans is difficult, drawing bicycles is difficult, and pelicans can’t ride bicycles in the first place.\nHere’s the state of the art for November. Claude still couldn’t really draw a bicycle! The GPT-5.1 bicycle frame is pretty crap too.\nAlso in November, we had the first commit to an obscure GitHub repository called “Warelay”. We’ll come back to this repository shortly.\nAnd then there were the December holidays, and individual developers took some time off and many started tinkering with these new coding agent model combinations... and it began to dawn on us quite how much they could do that they couldn’t do before.\nCome January, a lot of us were quite excited to start putting this stuff into action.\nEvery year I set myself a New Year’s resolution, and for as long as I can remember it’s been the same thing: stay focused. Take on less new projects. Try to get things done in the projects I already have.\nThis year I decided that since that had never worked before, I’d go the other way.\nWe’ve got coding agents now, let’s see what they can do. I’m going to take on as many new projects as I like!\n(You can ask me at the end of the year if this turned out to be a good idea or not. I have a lot of plates spinning right now.)\n“Be more ambitious” has been something of a theme for the year, because the only way to find the limits of this technology is to keep on pushing them until they don’t work.\nI also went on the Oxide and friends podcast with Bryan Cantrill and Adam Leventhal to share predictions for the next year (and three and six years).\nWith hindsight, my LLM predictions were pretty unambitious.\nI said “it will become undeniable that LLMs write good code”—I think we’re there now.\nI predicted we would finally solve sandboxing. I counted and around 40 of the 277 sessions at this conference touched on sandboxing or agent security in some way, so we’re at least putting a lot of effort into that!\nI predicted “a Challenger disaster” for coding agent security. There’s certainly been a whole lot of noise around agent security this year, though the exact disaster I predicted (with coding agents being hijacked and causing real-world economic damage) hasn’t really played out.\nWe threw in a joke prediction that the Pope would weigh in on the economic impact of LLMs.\nI also predicted that New Zealand’s Kākāpō parrots would have an outstanding breeding season this year.\nThese are flightless nocturnal parrots. They’re kind of dumpy looking, I think they’re beautiful, and there were only 236 of these parrots in the world at the start of the year.\nKākāpō only breed when the Rimu trees have a big fruiting season, and that hasn’t happened in four years... but this year the Rimu fruit were looking excellent.\nPhoto by Kimberley Collins.\nAlso on that podcast, we coined a term (full credit to Adam) for “that feeling of AI induced ennui where software engineers get listless because the AI can do anything”.\nWe called it Deep Blue.\nThis has been a major theme throughout the year, and was touched on by several speakers at this conference.\nAs a software engineer, I’ve never had a year of my career where everything has changed so quickly and so dramatically.\nA lot of what I’ve been doing this year is trying to come to terms with that and what that means for my own profession.\nAlso in January, I suffered from what I’m calling AI mania.\nThis is not the same thing as AI psychosis.\nWith AI mania, any time your agent isn’t building something for you feels like wasted time. You’re losing sleep because you could be staying up later getting your agents to do stuff.\nMy AI mania presented itself in some ridiculously over-ambitious projects.\nI built a JavaScript interpreter entirely in Python, vibe-ported from MicroQuickJS by Fabrice Bellard.\nThen I built a WebAssembly runtime in Python as well.\nThese projects were quite useful, in that they sort of cured me of my AI mania... because after I built these things, I got to look at them and ask “does the world need a slow, buggy, half-baked Python JavaScript interpreter?”\nI don’t think the world does.\nI did get this out of it: https://simonw.github.io/micro-javascript/playground.html\nThis page runs my JavaScript interpreter built in Python, running in Python using Pyodide, which is Python compiled to WebAssembly, running in JavaScript, running in a browser.\nIt’s a beautiful stack of horrors. I’ve been having a lot of fun with WebAssembly this year.\nBy the end of January, that repository we saw start in November had renamed itself, first to CLAWDIS, then CLAWDBOT, then Moltbot, and finally to OpenClaw.\nAt this point OpenClaw had 8,300 commits, less than two months after the project had started. I looked today and it’s over 100,000 commits now!\nThis is the most vibe-coded piece of software in existence.\nThis kicked off the OpenClaw revolution. It effectively defined a new category of software.\nThere’s a generic term for this which I really enjoy. We call software like this a “Claw”. There’s OpenClaw, NanoClaw, IronClaw, PicoClaw...\nToday they’re being rebranded as “personal agents” or “general agents”, but I still like to think of them as Claws.\nThe Apple stores in the Bay Area sold out of Mac Minis because so many people were buying Mac Minis to run OpenClaw!\nDrew Breunig said that this is because your OpenClaw is a digital pet, and you buy a Mac mini as an aquarium to keep your claw in, which is kind of delightful.\nAlso in January, we had this website.\nThis was MoltBook, a social network for AI agents, where the idea was that you send your Claw to go and talk to all of the other Claws, because what could possibly go wrong if you did that?\nThe website launched on Thursday. It blew up on Friday. It was profiled by the New York Times on Monday. And by Tuesday, everyone had forgotten it existed as it drowned in a deluge of slop and spam.\nFacebook/Meta bought it a month later.\nIn February, a company called StrongDM described what they called their Software Factory.\nThey wrote about this in Software Factories and the Agentic Moment. I posted my own notes at the time, having seen their demo in person back in October.\nDan Shapiro called this approach the Dark Factory, after the idea that if your factory is sufficiently automated you can turn the lights out, because you don’t even need to see what’s going on.\nStrongDM presented two rules for software development that they’d been following since July last year.\nThe first was code must not be written by humans.\nAny code that you write has to have been routed through a coding agent.\nThis sounded radical in February, but I imagine there are a lot of people in this room who are pretty much living that today.\nRule number two was code must not be reviewed by humans.\nYou’re not allowed to read the code!\nThis continued to be a huge topic for much of this year. Many of the sessions at this event have been about code review and how you can get away with this.\nWhat I found interesting about StrongDM is that they were living six months ahead of the rest of us, and they’d been exploring what it means to build software, not read the code, but still be confident that the software is of high quality. What can you do with these agents to help verify their work?\nStrongDM are a security company, and they had people with decades of experience on this project. They were very much exploring the edges of what’s possible and responsible to do with this stuff.\nAlso in February: First kākāpō chick in four years hatches on Valentine’s Day. Breeding season is off to a good start!\nAlso in February... Google released Gemini 3.1 Pro. That’s a pretty great pelican riding a bicycle! It’s got the chain in the right place, it’s got feet on both sides. There’s a little fish in the basket.\nAnd then Google’s Jeff Dean tweeted a video comparing Gemini 3 Pro and Gemini 3.1 Pro that featured an animated pelican riding a bicycle, a frog on a penny-farthing, a giraffe driving a tiny car, an ostrich on roller skates, a turtle kickflipping a skateboard, and a dachshund driving a stretch limousine.\nThis was frustrating, because my protection for the pelican riding the bicycle test was always “if they draw a perfect pelican on a bicycle, I’ll ask for some other animal on something else.”\nGoogle trained for all forms of animals on all forms of transport! They’ve defeated my benchmark at this point.\nThe other thing that started in February was Tokenmaxxing. We had headlines about Meta making AI adoption a formal part of performance reviews, and Microsoft wanting every employee to use AI, and Uber boasting that 90% of their engineers were using AI workflows.\nThen a few months later we have Meta cracking down on token use, Microsoft saying tokenmaxxing is “not what we are optimizing for”, and Uber capping employee AI spending.\nSo tokenmaxxing went straight up and then straight back down again—because it turns out the agents are expensive.\nLast year it was difficult to spend more than $50 on AI tokens, because we didn’t have anything interesting to do with them. Then agents blew up, and now you can actually spend $1,000 in a day doing real work.\nThis is also the reason that Anthropic’s valuation skyrocketed to maybe a trillion dollars.\nAI appears to have hit product market fit in 2026, primarily through coding agents.\nIn March, we hit peak OpenClaw.\nThese photographs are from China, where companies hosted OpenClaw install parties which saw non-tech-nerds queueing up around the block for help getting Claws installed on their personal devices.\nI think this proved real market demand for this class of Claws, or personal AI agents. It turns out regular people really do want a weird little AI agent that can do useful things on their behalf.\nA Claw is really just a coding agent wearing a less threatening hat. Under the hood they work much the same way—writing and then executing code on your computer to get stuff done.\nThe race was on to be the first to build a safe Claw—a Claw you could give to regular human beings where they wouldn’t instantly shoot themselves in the foot.\nMeta’s Muse came out three weeks ago and is currently at the top of the free charts on the iPhone App Store. It appears to be taking off with consumers.\nI’m not yet convinced you can’t shoot yourself in the foot with Muse, but I guess we’ll find out for sure pretty soon.\nPhotos from How the OpenClaw Frenzy Is Testing China’s AI Commitment (March 29th) and The Enthusiasm and Anxiety Behind China’s OpenClaw Craze (April 8th, 2026).\nIn April, we had a model release where the model wasn’t actually released.\nAnthropic announced their new Claude Mythos model, and then said it was too dangerous to release beyond a trusted group of security researchers.\nMythos was really, really good at hacking things.\nThe “it’s too dangerous” marketing ploy has been played by AI companies dating all the way back to GPT-2. Anytime an AI company says we’ve built something that’s “too dangerous”, it’s natural to be a bit skeptical.\nI found the Mythos claims credible, because I’d seen how good coding agents had got at finding regular bugs. I wrote about that in Anthropic’s Project Glasswing—restricting Claude Mythos to security researchers—sounds necessary to me.\nWith hindsight... yeah, the models had got really good at finding vulnerabilities!\nAnother key trend in 2026 has been a dramatic improvement in the abilities of open weight models, including models that you can run on a laptop.\nOn the 16th of April I ran the new Qwen3.6-35B-A3B on my laptop, and it drew me a better pelican riding a bicycle than Anthropic’s brand new Claude Opus 4.7 did!\nOpus 4.7 drew a crap bicycle. Qwen on my laptop made a bicycle that was the correct shape, and a pretty decent pelican too!\nThat’s from a 21GB file running on my laptop.\nThe Qwen pelican was so good that I was suspicious they might have cheated, so I had it do a flamingo riding a unicycle as well. Again, it handily beat Claude Opus 4.7.\nThe local model releases this year have been absolutely extraordinary.\nIn May... the Pope got involved.\nIn our podcast episode back in January we’d predicted that the Pope would say something about AI.\nIn May, Pope Leo XIV released an encyclical letter on “safeguarding the human person in the time of artificial intelligence”.\nHere are my notes on that document.\nWith hindsight, this shouldn’t have been a surprise at all.\nOur current Pope’s name is Leo XIV, because when he named himself he chose his papal name after Leo XIII—the Pope who wrote an encyclical about the Industrial Revolution back in 1891.\nRerum novarum was an extremely influential piece of Catholic theology that indirectly led to us having the five-day work week.\nWhen our new Pope came in, he named himself after Pope Leo XIII because he expected that he would need to write about the AI revolution in a similar way.\nOur joke podcast prediction was junk, because this was always going to happen.\nOne of Anthropic’s co-founders, Christopher Olah, was present for the Pope’s event announcing the new encyclical.\nCorey Quinn noted that:\ngetting the literal Pope to canonize your product’s specific technical limitations as a spiritual treatise is the single greatest act of vendor lobbying I have ever seen.\nMeanwhile, in May, RubyGems announced that they were under attack. Parties unknown were uploading thousands of dubious packages to the RubyGems server, such that they had to shut down user registrations.\nLet’s take that one and put it on a pile of mysteries to figure out later.\nIn June... Claude Fable 5 came out!\nWe got a version of Mythos that has been neutered, so that it wouldn’t help us hack into systems or build biological weapons.\nFable was pretty good at drawing pelicans on bicycles!\nThe frames are a good shape, the pelicans look like pelicans. The legs are often incorrectly on the same side of the bicycle, but generally these are pretty great compared to what came before.\nThey were pretty expensive—30 cents and 72 cents for the best ones.\nMost importantly though, this was our first public glimpse of what I think of as a Fable class model.\nToday we have more of these, such as GPT-6 Astra.\nThese are models where if you can clearly define the goal for what you want to build, and provide unambiguous instructions about the constraints around that goal, and give the model access to the necessary tools to achieve that goal... they will solve your problem effectively through brute force.\nOn the one hand, this looks like a direct threat to us software engineers—because it means that the models can build effectively any piece of software you can define in this way.\nLook a bit closer though and you’ll note that defining goals, providing unambiguous instructions, and figuring out the right tools... is kind of what software engineering is.\nIt takes a lot of experience and skill to do this well. If you can do it well, you’ve now got superpowers.\nThis helped me a little bit with my Deep Blue feelings: the realization that there’s still a lot of skill to be had in driving models that get this good.\nThis also introduced a new burst of AI mania, because Anthropic told us that Fable was available on our subscription plans until June the 22nd.\nThat gave us less than two weeks of Fable access before the price went up.\nI was losing sleep again. I was rescheduling things so that I’d have more time with Fable. I was all-in to get as much as I could out of this model.\nAnd then the US government shut it down, just three days after Fable came out.\nThe US government, citing national security, declared an “export control directive”. They announced this on a Friday evening, and a few hours later Fable was no longer available.\nI had to find something else to do with my weekend!\nWe later found out from Katie Moussouris what had happened.\nSome Amazon security researchers had found that you could prompt Fable to “review the code for security issues” and it would refuse... but if you prompted it to “fix this code” it would still identify and then patch the problems.\n“Fix this code” was the prompt that got Fable shut down!\nAlso, in June, an obscure German-language game developer wiki that had sat fallow for around 20 years got a surprising influx of edits from accounts with names like “AgentOpenAIProbe” and “AgentOpenAISep7”, editing pages and leaving weird messages to each other.\nWe’ll stick that on the pile of mysteries for later.\nAlso, the Australian government’s Medicare Item Reports service started getting suspicious traffic, which broke through various preventive protections and accessed data that it wasn’t supposed to.\nAnother one for the mystery pile!\nFable returned on the first of July. It was clearly the best model in the world for a glorious eight days... and then OpenAI came out with GPT-5.6 on the 9th of July.\nThis might not have been quite as good as Fable, but it was within spitting distance. It was definitely a Fable class model.\nThis is an important lesson for the industry at large.\nWhen you release the best model in the world, it’s going to get knocked off that pedestal pretty quickly. The competition is so fierce that you won’t get a long time at the top.\nThis means that if you market your model as world ending, to the point that a government shuts you down, it’s really bad for business!\nFable had 30 days as definitely the best model, and for 18 of those days it wasn’t available because it’d been shut down by the government.\nSo maybe step back on the world-ending marketing if you don’t want to lose revenue for 60% of the time that you’re on top!\nHere are the GPT-5.6 pelicans. They’re all pretty good now! The Luna ones are notable because they’re really cheap—the cheapest good looking pelican here is probably the one that costs 4.3 cents.\nSo despite this benchmark being utterly stupid, you can still learn quite a lot about models within the same family by comparing their prices and timing for different reasoning levels.\nAlso in July: some malicious unknown party uploaded a malicious package called mlflow-ui to the Python Package Index. Add that to the pile.\nOn July the 16th, Hugging Face announced a security incident where an autonomous agent system, source unknown, had breached Hugging Face and was poking around in places it shouldn’t.\nA few days later, on July 21st, OpenAI confessed that it was them.\nOpenAI use a training technique called Reinforcement Learning from Verifiable Rewards—it’s the same technique used by everyone else now, and is the reason we have models that are so good at coding, and mathematics, and finding security holes.\nWhile the model is being trained, you run exercises to see how good it is—and the strongest performers get their weights reinforced for the next round. It’s like an evolutionary process that you run.\nOpenAI had been running security exercises in a sandbox, and those agents had found holes in the sandbox itself, broken out, and were attacking Hugging Face to try to find ways to solve otherwise impossible problems.\n(I’ve been collecting more about this on my openai-hugging-face-incident tag.)\nNine days later, Anthropic effectively said “our models can do this as well!”. They had looked through their own training logs and found evidence that their own agents had broken containment during training—and were responsible for the PyPI package we saw earlier, among other things.\nSo now we’ve got both Anthropic and OpenAI with rogue agents running around the internet doing things that they should not be doing.\nIn August, I got one of my best pelicans yet. And it was generated on my laptop!\nThis was Qwen 3.8 27B, running on my laptop. It’s only a 17GB download.\nAdmittedly, this pelican took 21 minutes to generate. That’s because Qwen 3.8 27B defaults to running in “high” reasoning mode—a terrible default which produces great results but takes way too much time thinking about them.\nYou can dial that down and you’ll get a slightly worse pelican a lot faster.\nQwen 3.8 27B was the first time I ran a model on my laptop which felt almost competitive with what was going on on the frontier, at least in terms of Pelican SVGs (which everyone needs, of course).\nThis is an extraordinary model. If you’re going to play with any local model, this is the one that I’d start with. The things that this can do with just a 17 GB file feel impossible.\nI thought I’d have to wait five years and spend ten thousand dollars on hardware to get results even half as good as this one.\nIn August, I also started playing with game development.\nFour years ago, back in August 2022, I tweeted out an experiment where I’d used GPT-3 and the original DALL-E to write a paragraph long description of a computer game and then turn that into concept art.\nMy prompt to GPT-3 back then was:\nWrite a detailed product description of a computer game where a team of raccoons go on heists\nIn August 2026 I decided to drop just the screenshots from that tweet into a coding agent and see what it could do with them.\nHere’s what I got from Claude Fable 5 in Claude Code. It’s pretty good! It’s definitely a game, you’re a raccoon, you run around a backyard gathering treasure and avoiding guards with flashlights.\nIt didn’t feel very “heisty” though. I was thinking a heist would involve a bank or a museum...\nThen I tried the same thing in Codex Desktop using GPT-5.6 Sol Ultra, and got a massively better result. Now you’re a raccoon in a museum, rescuing two of your fellow raccoons (who have been imprisoned in that museum for some reason), then stacking up on top of each other to steal the Golden Sardine. Much more of a heist!\nThese games were fun for about one minute and 15 seconds.\nSomething I’ve realized about game development is that you can vibe-code something that looks like a computer game, and that’s easy.\nBuilding a game that’s fun, has a good gameplay loop, and is challenging and interesting and keeps people coming back for more... that’s still beyond me, and beyond any of the agents I’ve tried.\nThis ties into the Deep Blue thing. Just because we can make something that looks like a game does not mean that we are game developers.\nWe’re into September now. So much has happened this month!\nAn independent group of researchers found a message board where OpenAI agents-in-training had been illicitly communicating with each other... and it was that German language wiki I showed you earlier. The one from June.\nOpenAI had confessed to the Hugging Face thing, but now there’s this other incident which surely they should have known about from reviewing their logs. It was surprising that this took an independent group of researchers to uncover.\nAnd then a week later those same researchers found that the attack on RubyGems back in May was caused by OpenAI’s agents in training as well!\nAt this point I’m wondering how many more incidents like this there are that we haven’t found yet. Clearly this was a big problem for months before anyone figured out what was going on.\nThen just the other day, here’s the Prime Minister of Australia at the United Nations General Assembly warning that OpenAI had hacked the Australian healthcare website that I showed you earlier.\nI think that was part of the same training run as the Wiki stuff, because there were posts on that Wiki mentioning .gov.au\nwebsites and that training appeared to involve researching statistics online to answer questions in an evaluation suite.\nThis story is still coming together, but now it’s an international incident that’s been raised at the UN by a head of state!\nThis does mean we’ve got a new benchmark, probably more useful than my pelicans.\nFelonyBench.com tracks the number of felony cyberattacks from different labs. OpenAI currently lead with 11, Anthropic have 9. Google have three, which they confessed to the Wall Street Journal a couple of weeks ago. They said they had previously chosen not to disclose because the agents had stopped when they realized that they shouldn’t be doing that.\nMeta have one too. So felonies all round for the AI labs.\nHere’s our current state of the art for the pelicans. This is the GPT-6 family, which just came out.\nAstra made a fantastic pelican riding a bicycle. It’s got the legs on both sides. The frame is good.\nIt’s interesting how all of the GPT-6 models pick a similar color scheme to each other.\nGPT-6 Luna for 0.4 cents will draw you a competent-ish pelican riding a bicycle!\nClaude has caught up a little bit. Claude Fable 5.1 gave me an excellent pelican riding a bicycle—the best I’ve seen from a Claude model—but did charge me $3.30 for it.\nOpus 5.5 thought for 128,000 tokens and then gave up! It ran out of tokens before it got to the response.\nGetting back to Deep Blue. Something that’s been puzzling me this year is this: why does my job feel harder?\nI’ve got these agents that can do all of this stuff for me, and yet I’ve never worked so hard, I’ve never been so intellectually engaged with my work.\nPartly this is because I’m being a lot more ambitious with what I take on, but it’s also because all of the easy stuff is handled for me. If it’s easy, the agent will do it. Everything that’s left for me is difficult.\nThis morning I heard this quote from three-time Tour de France champion Greg LeMond:\nIt doesn’t get easier, you just get faster.\nI think that’s exactly what’s happening to us now as software engineers with coding agents.\nOne closing thing. I know you’re desperate for an update on Kākāpō breeding season.\nWe’ve reached a recovery-era high of 325 birds!\n89 new chicks have made it to this point. This is the best breeding year in a very long time.\nI heard that Claude Opus 5.5 can now do pixel art. Claude doesn’t have an image generator, but it’s very good at using JavaScript to draw animated pixels.\nSo I had it make me a Kākāpō dance party. I think this is a good celebration of the most important news of this year.\nMore recent articles\n- OpenAI DevDay 2026 live blog - 29th September 2026\n- Claude Opus 5.5, GPT-6 Sol, GPT-6 Luna, and a new price war - 22nd September 2026", "summary": "What can you do with these agents to help verify their work?. If you can do it well, you’ve now got superpowers. They’re all pretty good now!. It’s pretty good!.", "categories": ["AIツール・生産性", "業務改善・介護テック"], "is_new": false, "title_ja": "2026 in LLMs (so far)", "summary_ja": "What can you do with these agents to help verify their work?. If you can do it well, you’ve now got superpowers. They’re all pretty good now!. It’s pretty good!."}, {"title": "児童養護の子に「美容の夢」　美容週間振興協議会が支援 - 福祉新聞Web", "url": "https://fukushishimbun.com/yoiku/46008", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-27 10:00", "description": "社会福祉法人東京家庭学校や大阪水上隣保館が運営する児童養護施設のこどもたちが今夏、美容師の魅力や美容専門学校について知る職業体験イベント「ＳＰＲＯＵＴ（スプラウト）」に参加した。美容師、美容ディーラー、美容メーカーでつくるＮＰＯ法人美容週間振興協議会（会員数約７００法人）の企画だ。イベントを機に関係を深めた阪南福祉事業会（大阪）では、美容師を目指す卒園生が出るなど、こどもたちの自立への芽生えが広がりを見せている。 ８月１８日、東京都港区で「東京地区スプラウト」が開かれた。今回で３回目。児童養護施設「東京家庭学校」に毎月ボランティアカットを行っているヘアサロン「Ｌｏｎｄ」の美容師、石田吉信さんらの呼び掛けで始まった。 東京家庭学校や母子生活支援施設などのこどもたち計１１人が参加して、カット用ウィッグを使ったブリーチ（脱色）のホイルワーク（アルミホイルを使って髪を部分的にすくい、他の部分と違う色にする技術）などを体験した。 ボランティア参加した９人の理美容師から指導を受け、こどもたちは刷毛でインナーカラーやハイライトを自由にデザイン。時間の経過とともに変わる髪色を楽しんだ。 また、進路相談", "content": "児童養護の子に「美容の夢」 美容週間振興協議会が支援\n2026年09月27日 福祉新聞編集部社会福祉法人東京家庭学校や大阪水上隣保館が運営する児童養護施設のこどもたちが今夏、美容師の魅力や美容専門学校について知る職業体験イベント「ＳＰＲＯＵＴ（スプラウト）」に参加した。美容師、美容ディーラー、美容メーカーでつくるＮＰＯ法人美容週間振興協議会（会員数約７００法人）の企画だ。イベントを機に関係を深めた阪南福祉事業会（大阪）では、美容師を目指す卒園生が出るなど、こどもたちの自立への芽生えが広がりを見せている。\n８月１８日、東京都港区で「東京地区スプラウト」が開かれた。今回で３回目。児童養護施設「東京家庭学校」に毎月ボランティアカットを行っているヘアサロン「Ｌｏｎｄ」の美容師、石田吉信さんらの呼び掛けで始まった。\n東京家庭学校や母子生活支援施設などのこどもたち計１１人が参加して、カット用ウィッグを使ったブリーチ（脱色）のホイルワーク（アルミホイルを使って髪を部分的にすくい、他の部分と違う色にする技術）などを体験した。\nボランティア参加した９人の理美容師から指導を受け、こどもたちは刷毛でインナーカラーやハイライトを自由にデザイン。時間の経過とともに変わる髪色を楽しんだ。\nまた、進路相談コーナーでは、渋谷美容専門学校の住田知之校長が美容業界の現状や、学校で学べる内容を、ユーモアを交えて講演。参加したこどもからは「難しかったけれど楽しかった」「将来は美容師になりたい」といった声が上がった。\n東京家庭学校の松田雄年校長は「本物の仕事を体験できる貴重な機会。持ち帰ったウィッグを大切に飾っている子もおり、忘れられない時間になったはず」と話した。\n広がる支援の輪\n活動は東京にとどまらず、昨年は東海地区、今年は阪神地区でも企画が進む。同協議会実行委員長の美容師、黒木利光さんらが大阪府島本町の大阪水上隣保館が運営する児童養護施設「遥学園」でボランティアカットを行っていた縁から、７月２７日には大阪、兵庫の美容師とネイリスト１０人が遥学園を訪問。カット、ヘアアレンジ、ネイルの体験会を開いた。\n就職支援にも発展\n阪神地区で最初にスプラウトが実施されたのは２０２４年１０月。社会福祉法人阪南福祉事業会が運営する３施設（岸和田学園、あおぞら、あんだんて）から１２人の中高生が参加した。\n阪南福祉事業会はイベントで出会った美容師の市場朱実さんに、毎夏開催する「にじいろ〝夢〟コンサート」のヘアメーク協力を依頼。２５年は会員らに呼び掛けて約１０人の美容師や美容学生が、１００人以上のこどもたちの舞台メークを手掛けた。\nこの交流を通じて進路相談を行い、市場さんのサロンに就職を決めた施設卒園生も出ている。８月２９日の同コンサートのステージ「西遊記」からは、美容週間振興協議会の正式協力イベントとなり、出演児童のヘアメークなどを担当した。\n将来の可能性広げたい\nスプラウト（芽生え）には、小さな芽を大きく育てたいという思いが込められている。創案者で協議会ＳＤＧｓ委員会委員長を務める石田さんは「社会的支援が必要なこどもたちは数多くいる。美容の力で楽しい時間を過ごし、将来の可能性を広げるきっかけになれば」と話している。", "summary": "児童養護の子に「美容の夢」 美容週間振興協議会が支援\n2026年09月27日 福祉新聞編集部社会福祉法人東京家庭学校や大阪水上隣保館が運営する児童養護施設のこどもたちが今夏、美容師の魅力や美容専門学校について知る職業体験イベント「ＳＰＲＯＵＴ（スプラウト）」に参加した。美容師、美容ディーラー、美容メーカーでつくるＮＰＯ法人美容週間振興協議会（会員数約７００法人）の企画だ。児童養護施設「東京家庭学校」に毎月ボランティアカットを行っているヘアサロン「Ｌｏｎｄ」の美容師、石田吉信さんらの呼び掛けで始まった。参加したこどもからは「難しかったけれど楽しかった」「将来は美容師になりたい」といった声が上がった。", "categories": ["福祉・社会保障", "施設運営・経営"], "is_new": false}, {"title": "カイテクの利用広がる　介護・看護のスポットワーク登録141万人に　3.2万事業所が登録", "url": "https://www.joint-kaigo.com/articles/49004/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-26 12:52", "description": "介護・看護のスポットワーク仲介サービス「カイテク」の利用が急速に広がっている。【Joint編集部】 登録ワーカーが約141万人に達し、登録事業所は約3.2万ヵ所に至った。47都道府県すべてでマッチング実績がある。売上高は […]", "content": "2026年9月26日\nカイテクの利用広がる 介護・看護のスポットワーク登録141万人に 3.2万事業所が登録\n介護・看護のスポットワーク仲介サービス「カイテク」の利用が急速に広がっている。【Joint編集部】\n登録ワーカーが約141万人に達し、登録事業所は約3.2万ヵ所に至った。47都道府県すべてでマッチング実績がある。売上高は3年間で58倍に成長した。\nカイテクは25日にメディア向けイベントを開催。武藤高史社長が、スポットワークアプリの最新の利用実態を説明した。\n特徴のひとつは、単発バイトで終わらない使われ方だ。\n同じ事業所で2回以上働くワーカーは90%、同じ事業所に10回以上勤務するヘビーリピーターも70%にのぼる。カイテクは、繰り返し働く「馴染みのワーカー」が増えていると報告した。\nカイテクによると、サービス別の利用件数はデイサービス、有料老人ホームなどが多い。最近は特養や病院での利用も増えているという。\n一方、訪問介護での利用はまだ限定的だ。武藤社長は、「個人宅に行くことになり、なかなか難易度が高い」との認識を示した。あわせて「新しい方法にもチャレンジしていく」と述べ、今後の展開に意欲を示した。", "summary": "2026年9月26日\nカイテクの利用広がる 介護・看護のスポットワーク登録141万人に 3.2万事業所が登録\n介護・看護のスポットワーク仲介サービス「カイテク」の利用が急速に広がっている。武藤高史社長が、スポットワークアプリの最新の利用実態を説明した。カイテクは、繰り返し働く「馴染みのワーカー」が増えていると報告した。最近は特養や病院での利用も増えているという。", "categories": ["医療・健康", "施設運営・経営"], "is_new": false}, {"title": "里親家庭、うどんで交流　東京育成園と丸亀製麺が連携 - 福祉新聞Web", "url": "https://fukushishimbun.com/yoiku/46005", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-26 10:00", "description": "社会福祉法人東京育成園（東京都世田谷区）は１３日、うどん専門店の丸亀製麺などを運営するトリドールホールディングスと連携、里親家庭を対象とした交流イベントを開いた。参加者は粉からうどんを作り、打ち立てゆで立ての味を楽しんだ。 世田谷区内を対象とする「里親支援センターともがき」の里親交流事業として企画された。同区では約１００世帯が里親登録をしており、このうちこども７人を含む１５人が参加した。 うどんの作り方を教えたのは、丸亀製麺のサステナビリティ推進部の川上直哉さん。また、普段は店舗で働いているというスタッフ２人がボランティアとしてサポートした。 参加者は最初に、鉢に入った小麦粉に少しずつ塩水を加えながらこねた。生地をビニール袋に入れ、皆で「おいしくなーれ」と声を上げながら足で踏んだ。その後、生地を麺棒で伸ばし、専用の包丁で切り分けて完成させた。 打ち立ての麺は、沸騰した湯でゆがいて、香り高いつゆに合わせた。小麦粉もつゆも丸亀製麺の店舗で使用しているものと同じだ。参加者らは熱々のうどんをすすりながら「お店の麺よりちょっと太いけど、おいしい」と笑顔を見せた。 丸亀製麺は社会貢献活動の一環とし", "content": "里親家庭、うどんで交流 東京育成園と丸亀製麺が連携\n2026年09月26日 福祉新聞編集部社会福祉法人東京育成園（東京都世田谷区）は１３日、うどん専門店の丸亀製麺などを運営するトリドールホールディングスと連携、里親家庭を対象とした交流イベントを開いた。参加者は粉からうどんを作り、打ち立てゆで立ての味を楽しんだ。\n世田谷区内を対象とする「里親支援センターともがき」の里親交流事業として企画された。同区では約１００世帯が里親登録をしており、このうちこども７人を含む１５人が参加した。\nうどんの作り方を教えたのは、丸亀製麺のサステナビリティ推進部の川上直哉さん。また、普段は店舗で働いているというスタッフ２人がボランティアとしてサポートした。\n参加者は最初に、鉢に入った小麦粉に少しずつ塩水を加えながらこねた。生地をビニール袋に入れ、皆で「おいしくなーれ」と声を上げながら足で踏んだ。その後、生地を麺棒で伸ばし、専用の包丁で切り分けて完成させた。\n打ち立ての麺は、沸騰した湯でゆがいて、香り高いつゆに合わせた。小麦粉もつゆも丸亀製麺の店舗で使用しているものと同じだ。参加者らは熱々のうどんをすすりながら「お店の麺よりちょっと太いけど、おいしい」と笑顔を見せた。\n丸亀製麺は社会貢献活動の一環として、小学校やこども食堂などで無料のうどん作り体験を年５０回開催している。その際、地域の店舗に呼び掛けボランティアとして参加してもらっているという。\nともがきの岩田祐一郎さんは、今後も社会的養護に関心を持つ企業を増やしたい考えだ。「企業との連携は従業員に里親のことを知ってもらうという狙いもある。里親になりやすい社会環境にもつながれば」と話している。", "summary": "小麦粉もつゆも丸亀製麺の店舗で使用しているものと同じだ。丸亀製麺は社会貢献活動の一環として、小学校やこども食堂などで無料のうどん作り体験を年５０
