using word-level markers: [-removed-] and {+added+}. The diff is followed by the full text of the previous prompt and of the new prompt; use them to check whether something that looks added in the diff already existed before.\nPick out only the most interesting changes: new rules or behaviors, rules that were dropped or loosened, anything surprising, and anything that reveals a new policy or product direction. Skip routine changes that every new prompt makes: updated model names and IDs, the knowledge cutoff date, product lists, settings lists, typo fixes, and rewordings that do not change meaning.\n[...]\nThe system is operated by a GitHub Actions workflow, which runs once a day or can be triggered manually.\nClaude Fable 5.1 built the entire system, and wrote every line of automation code and almost all of the documentation.\nI exported the transcript from building the system using my claude-code-transcripts tool and published it here, if you want a blow-by-blow account of how it all came together.\nMore recent articles\n- OpenAI's rogue agents were caught communicating via public wikis - 4th September 2026\n- Claude Fable 5.1 made me a really nice animated pelican - 1st September 2026", "summary": "Claude’s new system prompt really doesn’t want to reproduce song lyrics\n2nd September 2026\nAnthropic publish the system prompts for their Claude consumer applications (Claude.ai and the Claude mobile apps—sadly not for Claude Cowork or Claude Code). This is the first time a Claude system prompt has included URLs that were not hosted on claude.com\nor anthropic.com\nor claude.ai\n—I know because I ran a script against every other system prompt on record. Here are those history pages for claude-fable.md, claude-opus.md, claude-sonnet.md, claude-haiku.md. It starts like this:\nYou are summarizing one commit in a git repository that tracks the system prompts Anthropic publishes for Claude on claude.ai.", "categories": ["AIツール・生産性", "業務改善・介護テック"], "is_new": false, "title_ja": "Claude's new system prompt really doesn't want to reproduce song lyrics", "summary_ja": "Claude’s new system prompt really doesn’t want to reproduce song lyrics\n2nd September 2026\nAnthropic publish the system prompts for their Claude consumer applications (Claude.ai and the Claude mobile apps—sadly not for Claude Cowork or Claude Code). This is the first time a Claude system prompt has included URLs that were not hosted on claude.com\nor anthropic.com\nor claude.ai\n—I know because I ran a script against every other system prompt on record. Here are those history pages for claude-fable.md, claude-opus.md, claude-sonnet.md, claude-haiku.md. It starts like this:\nYou are summarizing one commit in a git repository that tracks the system prompts Anthropic publishes for Claude on claude.ai."}, {"title": "カスハラで介護サービス拒否、ルール明確化が俎上に　厚労省が報酬改定へ論点提示　審議会では慎重論も", "url": "https://www.joint-kaigo.com/articles/48478/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-02 17:27", "description": "厚生労働省は来年度の介護報酬改定に向けて、介護従事者を利用者・家族のカスタマーハラスメントから守る施策の強化を検討する。【Joint編集部】 焦点の一つが、カスハラを理由としたサービス提供の拒否のあり方だ。 例えば訪問介 […]", "content": "2026年9月2日\nカスハラで介護サービス拒否、ルール明確化が俎上に 厚労省が報酬改定へ論点提示 審議会では慎重論も\n厚生労働省は来年度の介護報酬改定に向けて、介護従事者を利用者・家族のカスタマーハラスメントから守る施策の強化を検討する。【Joint編集部】\n焦点の一つが、カスハラを理由としたサービス提供の拒否のあり方だ。\n例えば訪問介護や居宅介護支援。現行の運営基準では、事業所は「正当な理由」なくサービスの提供を拒んではならないと規定されている。この「正当な理由」の解釈が必ずしも明確でないことが、事業所や保険者が判断を迷う要因の一つになっている。\n厚労省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）で、こうした運営基準の見直しの是非を論点として提示。利用者に必要なサービスを継続的に提供することの重要性も考慮しつつ、カスハラに直面した事業所が、状況に応じてより柔軟に対応できる方策を俎上に載せる考えを示した。\n在宅サービスなどの現場で、介護従事者がカスハラを受けるケースが増えていることが背景にある。\n会合の中では、現場の関係者らで構成する委員の意見が分かれた。\n「職員の命と安全を守るため、サービス提供を拒否できる『正当な理由』を国として分かりやすく明確に示すべき」「組織的に毅然とした対応がとれるよう、制度によって現場を守る必要がある」\nルールの明確化や厳格な措置を求める声が上がった一方で、「認知症の周辺症状による言動を、安易にカスハラと同列に扱うべきではない」「サービスの提供を拒否された利用者はどこへいけばいいのか」「代替サービスの確保を含め、拒否後にどうするかを明確にしてほしい」など、より慎重な対応を呼びかける委員もいた。\n今後、厚労省はこうした意見も踏まえてさらに議論を深め、年内にも施策の方向性を固める方針だ。", "summary": "2026年9月2日\nカスハラで介護サービス拒否、ルール明確化が俎上に 厚労省が報酬改定へ論点提示 審議会では慎重論も\n厚生労働省は来年度の介護報酬改定に向けて、介護従事者を利用者・家族のカスタマーハラスメントから守る施策の強化を検討する。【Joint編集部】\n焦点の一つが、カスハラを理由としたサービス提供の拒否のあり方だ。現行の運営基準では、事業所は「正当な理由」なくサービスの提供を拒んではならないと規定されている。在宅サービスなどの現場で、介護従事者がカスハラを受けるケースが増えていることが背景にある。", "categories": ["介護保険・制度", "施設運営・経営"], "is_new": false}, {"title": "事前復興としての福祉〈コラム一草一味〉 - 福祉新聞Web", "url": "https://fukushishimbun.com/issoichimi/45891", "source": "福祉新聞", "lang": "ja", "content_type": "care", "category_hint": "福祉・社会保障", "published": "2026-09-02 10:00", "description": "社会福祉法人佛子園 理事長 雄谷良成 今回の熊本地震に接し、能登半島地震から２年８カ月を迎えた今だからこそ、改めて実感することがある。当然ながら、災害は時間とともにフェーズが移り変わる。 発災直後の救急救命期は、１人でも多くの命を救うことが最優先となる。ＤＭＡＴ（災害派遣医療チーム）やＤＷＡＴ（災害派遣福祉チーム）をはじめとする専門チームが、専門性を発揮することは欠かせない。こうした体制は着実に整えられてきている感がある。災害救助法で福祉的支援が救助に位置付けられた意義も、まさにここにある。 一方、災害は応急対応で終わるものではない。能登では今、仮設住宅の統廃合が始まり、そこでようやく築かれた人間関係が再び分かれようとしている。元の集落でも、住宅の倒壊や転出によって人が抜け、日常を支えてきた近所付き合いや地域活動そのものが難しくなっている。住まいだけではなく、関係性そのものが失われていく。仮設に残る人の中には、自力での生活再建が難しい人も少なくない。再度の引っ越し、生活環境の変化、人間関係の再構築は大きなストレスとなり、孤立や心身の衰え、さらには災害関連死にもつながっていく。 東日本大", "content": "事前復興としての福祉〈コラム一草一味〉\n2026年09月02日 福祉新聞編集部社会福祉法人佛子園 理事長 雄谷良成\n今回の熊本地震に接し、能登半島地震から２年８カ月を迎えた今だからこそ、改めて実感することがある。当然ながら、災害は時間とともにフェーズが移り変わる。\n発災直後の救急救命期は、１人でも多くの命を救うことが最優先となる。ＤＭＡＴ（災害派遣医療チーム）やＤＷＡＴ（災害派遣福祉チーム）をはじめとする専門チームが、専門性を発揮することは欠かせない。こうした体制は着実に整えられてきている感がある。災害救助法で福祉的支援が救助に位置付けられた意義も、まさにここにある。\n一方、災害は応急対応で終わるものではない。能登では今、仮設住宅の統廃合が始まり、そこでようやく築かれた人間関係が再び分かれようとしている。元の集落でも、住宅の倒壊や転出によって人が抜け、日常を支えてきた近所付き合いや地域活動そのものが難しくなっている。住まいだけではなく、関係性そのものが失われていく。仮設に残る人の中には、自力での生活再建が難しい人も少なくない。再度の引っ越し、生活環境の変化、人間関係の再構築は大きなストレスとなり、孤立や心身の衰え、さらには災害関連死にもつながっていく。\n東日本大震災では仮設住宅の撤去まで８年を要した。熊本も時間の経過とともに、いずれ同じような課題に向き合うことになるだろう。\nその時に求められるのは、人を孤立させず、人と人とのつながりを支え、地域の復興力を育てていく福祉の専門性である。社会福祉法改正で「福祉の中に防災」が位置付けられた意味もそこにある。福祉は応急支援だけでなく、復旧、復興、そして平時の地域づくりまで切れ目なく伴走することが期待されている。\n事前復興とは、道路や堤防などの整備だけを指すものではない。平時から地域のつながりを育み、災害が起きても人を孤立させず、復興を通して地域をよりしなやかで持続可能なものへ育てていくことではないか。その役割は、住民と日常を重ねてきた地域の福祉関係者だからこそ果たせるものがあるように思う。", "summary": "一方、災害は応急対応で終わるものではない。住まいだけではなく、関係性そのものが失われていく。その時に求められるのは、人を孤立させず、人と人とのつながりを支え、地域の復興力を育てていく福祉の専門性である。社会福祉法改正で「福祉の中に防災」が位置付けられた意味もそこにある。", "categories": ["福祉・社会保障", "医療・健康"], "is_new": false}, {"title": "Claude Fable 5.1 made me a really nice animated pelican", "url": "https://simonwillison.net/2026/Sep/1/claude-fable-5-1/", "source": "Simon Willison's LLM Notes", "lang": "en", "content_type": "tech", "category_hint": "AIツール・生産性", "published": "2026-09-02 08:57", "description": "Today is Claude Fable (and Mythos) 5.1 day . Anthropic say that Fable 5.1 \"sets a new standard for coding, knowledge work, and long-running problem-solving tasks\". Their announcement spends a notable amount of time on scientific research, boasting of a 52.6% score on the brand new Terminal-Bench-Science 0.1 benchmark (first announced on August 27th ), up from 24.7% for Fable 5, 29.0% for Opus 5 and 22.4% for GPT-5.6 Sol. Other benchmarks show slightly improved scores, but none as impressive as t", "content": "Claude Fable 5.1 made me a really nice animated pelican\n1st September 2026\nToday is Claude Fable (and Mythos) 5.1 day. Anthropic say that Fable 5.1 “sets a new standard for coding, knowledge work, and long-running problem-solving tasks”. Their announcement spends a notable amount of time on scientific research, boasting of a 52.6% score on the brand new Terminal-Bench-Science 0.1 benchmark (first announced on August 27th), up from 24.7% for Fable 5, 29.0% for Opus 5 and 22.4% for GPT-5.6 Sol. Other benchmarks show slightly improved scores, but none as impressive as the Science one.\nBut how well can it pelican?\nBack in July I wrote about how I was losing faith in the pelican benchmark—its connection to how good the models were at other tasks didn’t seem to hold as strongly as it did back in 2025. The most interesting insights I get from it now are comparisons within model families, and particularly comparisons for the same prompt at different reasoning effort levels.\nFable 5.1 has five reasoning levels: low, medium, high, xhigh, max—and no option to turn off reasoning entirely.\nI fixed an issue in llm-anthropic which caused reasoning traces not to be correctly recorded, then ran some prompts.\nHere’s the full set of pelicans for all of the reasoning levels, each with the full reasoning transcript. I’ll replicate them here:\nLow and medium, both without reasoning?\nNext, a bit of a mystery. This is what I got for effort low\n:\nThe transcript doesn’t show any summarized reasoning tokens, and the output token count is 1,998. With Claude that output token count includes reasoning tokens. It took 23.8 seconds and cost 10.017 cents.\nI bumped that up to medium\nand got this:\nWeirdly, that one also shows no reasoning text and used 1,977 output tokens—21 tokens less than low\n. It took 23 seconds and cost 9.912 cents.\nSo for this particular prompt (“Generate an SVG of a pelican riding a bicycle”) Fable 5.1 appeared to skip reasoning entirely at both low\nand medium\nsettings.\nHigh\nHere’s high\n—29.6 seconds, 2,612 output tokens, 13.087 cents:\nThis one did do a bit of reasoning, summary here:\nI’m planning the SVG layout for a pelican riding a bicycle, with a sky and ground background, a bicycle with two spoked wheels, frame, seat and handlebars, and a white-bodied pelican with a long neck and orange beak positioned on top.\nReally not much difference from low\nand medium\n, though.\nExtra High\nAt xhigh\nthings got radically different. 36,767 output tokens, 7 minutes 51 seconds, $1.83!\nThe reasoning trace is pretty lengthy, and includes details like this:\nAdding the eye, wings stretching down to the handlebar grip, orange legs reaching to the pedals, and a small tail feather, while keeping the pelican intentionally oversized compared to the bike for comic effect. [...]\nI’ll accept the slight thickness as charming rather than overengineering it.\nMax\nSetting effort to max\ngave me the best pelican I’ve seen from any of Anthropic’s models. 65,927 output tokens, 13 minutes and 54 seconds, $3.30:\nThere’s a lot to like about this. The background is tasteful, the legs are clearly on either side of the frame, the feet are on the pedals, the wing is on the handlebars, the pelican has a cute blue hat and there’s a basket with a fish.\nIt’s still not showing nearly the same level of flair as Gemini 3.7 Flash, but I didn’t ask for flair—I asked for an SVG, and that’s what I got.\nSome highlights from that reasoning trace:\nAdding pedal shapes near both feet, with the far foot on the second leg partially visible behind the frame. I’m considering whether to add a small scarf or cap for extra character, but leaning toward keeping it simple to avoid clutter.\nNow I’m debating a bicycle helmet on the head versus the pelican’s signature crest—the beak and pouch already read clearly as “pelican,” so a helmet could reinforce the bicycle theme without losing identity, though it might compete with the crest for visual space.\nI realize the beak at (484,84) would overlap with the dome helmet, so I need to shrink the helmet so it only covers the top of the head, adjusting its arc endpoints to sit higher and narrower so the beak can attach cleanly at the front without collision. [...]\nI’m adding a darker tip region to represent the primary feathers, then reconsidering the trailing edge to include scalloped feather curves instead of one smooth line for a more natural look. [...]\nNow I’m checking the vent line placements on the helmet, making sure they sit far enough inside the helmet’s edge given the stroke width and rounded caps, and confirming each vent stays within the helmet’s circular boundary. [...]\nI decide skipping a handlebar bell and tire highlights since they’re unnecessary additions. Now I’m reconsidering the front fork’s curve — the current control point pulls the shape backward when it should bow forward for a proper rake, so I need to shift the control point rightward to fix the fork’s lean.\nOK, let’s animate it\nOn Hacker News, swalsh commented on that Max pelican:\nNow that it’s a solved benchmark, can we get the animated version?\nI didn’t want to spend another $3 so I took the Max pelican and piped it into the default thinking level of High:\nllm logs -cx | llm -m claude-fable-5.1 -s 'animate this'\n6,121 input, 26,201 output = $1.37. The result looked like this, exported here as video since some people have trouble viewing animated SVGs:\nThe wheels in the video are rotating in the wrong direction, but I think that’s an artifact of the conversion to MP4—they seem to be going in the correct direction in the original SVG.\nMore recent articles\n- OpenAI's rogue agents were caught communicating via public wikis - 4th September 2026\n- Claude's new system prompt really doesn't want to reproduce song lyrics - 2nd September 2026", "summary": "But how well can it pelican?. Fable 5.1 has five reasoning levels: low, medium, high, xhigh, max—and no option to turn off reasoning entirely. With Claude that output token count includes reasoning tokens. 36,767 output tokens, 7 minutes 51 seconds, $1.83!.", "categories": ["AIツール・生産性", "業務改善・介護テック"], "is_new": false, "title_ja": "Claude Fable 5.1 made me a really nice animated pelican", "summary_ja": "But how well can it pelican?. Fable 5.1 has five reasoning levels: low, medium, high, xhigh, max—and no option to turn off reasoning entirely. With Claude that output token count includes reasoning tokens. 36,767 output tokens, 7 minutes 51 seconds, $1.83!."}, {"title": "居宅介護支援の処遇改善加算、初月の算定率は76.0%　訪問看護は7割弱＝厚労省", "url": "https://www.joint-kaigo.com/articles/48394/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-01 16:26", "description": "厚生労働省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）に、今年度の介護報酬改定で拡充した処遇改善加算の最新の取得状況を報告した。【Joint編集部】 今年度から新しく対象に加えられた居宅介護支援の算定率は […]", "content": "厚生労働省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）に、今年度の介護報酬改定で拡充した処遇改善加算の最新の取得状況を報告した。【Joint編集部】\n今年度から新しく対象に加えられた居宅介護支援の算定率は、今年6月時点で76.0%だった。\nこのほか、同じく処遇改善加 護保険施設は相対的に高い。一方、訪問介護は34.3%、通所介護は35.3%、地域密着型通所介護は19.6%、認知症グループホームは26.4%にとどまるなど、在宅サービスや小規模なサービスが十分に算定できていない実態が浮き彫りになった。\n※ 処遇改善加算のサービスごとの算定率、最新のデータはこちらから\n介護従事者の確保、さらなる処遇改善のあり方がテーマとなった今回の審議会では、現場の関係者らで構成する委員から、来年度の介護報酬改定でさらに大幅な賃上げを実現するよう訴える声が相次いだ。\nこのほか、物価や他産業の動向に合わせて賃上げを機動的に行える仕組みの整備、複雑化した算定要件の簡素化などを求める意見も出た。", "summary": "2026年9月1日\n介護職の処遇改善加算、最上位の算定率は4割弱にとどまる サービス間で大きな格差＝厚労省\n厚生労働省は8月末に開催した審議会（社会保障審議会・介護給付費分科会）に、今年度の介護報酬改定で拡充した処遇改善加算の最新の取得状況を報告した。【Joint編集部】\n介護職員の賃上げに向けて新設した最上位の「加算Ⅰロ」について、今年6月の算定率は対象となるサービス全体で39.3%だった。サービスごとの算定率は格差が大きい。一方、訪問介護は34.3%、通所介護は35.3%、地域密着型通所介護は19.6%、認知症グループホームは26.4%にとどまるなど、在宅サービスや小規模なサービスが十分に算定できていない実態が浮き彫りになった。", "categories": ["介護保険・制度", "施設運営・経営"], "is_new": false}, {"title": "働きやすい職場づくりの総理大臣表彰に居宅介護支援　高市首相、生産性向上の「評価を検討」", "url": "https://www.joint-kaigo.com/articles/48369/", "source": "JOINT 介護ニュース", "lang": "ja", "content_type": "care", "category_hint": "施設運営・経営", "published": "2026-09-01 11:54", "description": "政府は8月31日、「介護職員の働きやすい職場環境づくり」の今年度の表彰式を首相官邸で開催した。【Joint編集部】 介護現場の生産性向上、職員の処遇改善や負担軽減、サービスの質の向上などに優れた事業所を称え、その一層の推 […]", "content": "2026年9月1日\n働きやすい職場づくりの総理大臣表彰に居宅介護支援 高市首相、生産性向上の「評価を検討」\n政府は8月31日、「介護職員の働きやすい職場環境づくり」の今年度の表彰式を首相官邸で開催した。【Joint編集部】\n介護現場の生産性向上、職員の処遇改善や負担軽減、サービスの質の向上などに優れた事業所を称え、その一層の推進につなげる取り組みだ。\n今年度は、最高賞の内閣総理大臣表彰に、茨城県の居宅介護支援「おはなリハケアマネステーション」が選ばれた。この事業所は、音声入力システムの全面導入やRPA（PC作業の自動化）の運用など、デスクワークを効率化する先進的な取り組みが高く評価された。\nまた、今年度の厚生労働大臣表彰優良賞は以下の5事業所が受賞した。\n● みと東部特別養護老人ホーム（茨城県／特養）\n● 特別養護老人ホーム極楽苑（愛知県／特養）\n● 介護老人保健施設わさだケアセンター（大分県／老健）\n● ささづ苑デイサービスセンター（富山県／通所介護）\n● もてなし日和ゆのえん（群馬県／通所介護）\n高市早苗首相は表彰式で、「これからも皆様のご活躍に多くの国民がお頼りすることになる。引き続き、厚生労働大臣と力を合わせて支援していく」と挨拶した。\nあわせて、来年度の介護報酬改定に向けて、介護テクノロジーなどの実証、導入、伴走を支援していくと説明。「（生産性向上の）取り組みの適切な評価と介護従事者の処遇改善、これをあわせて検討していく」と明言した。", "summary": "2026年9月1日\n働きやすい職場づくりの総理大臣表彰に居宅介護支援 高市首相、生産性向上の「評価を検討」\n政府は8月31日、「介護職員の働きやすい職場環境づくり」の今年度の表彰式を首相官邸で開催した。また、今年度の厚生労働大臣表彰優良賞は以下の5事業所が受賞した。あわせて、来年度の介護報酬改定に向けて、介護テクノロジーなどの実証、導入、伴走を支援していくと説明。「（生産性向上の）取り組みの適切な評価と介護従事者の処遇改善、これをあわせて検討していく」と明言した。", "categories": [
